<style>
  /* alone in the toolbar the device select would stretch across it */
  #tool-model .toolbar .dev-ctl {max-width: 260px;}
  /* ★a shape slider the 含时演化 bar is no longer reading.  Muted, not
     disabled: the 1.5-D bar reads the same control, so switching it off
     would take that bar's input away with it. */
  #model-shared.shape-idle .ctl[data-shape] {opacity: .5;}
  #model-shared.shape-idle .ctl[data-shape] .val::after {
    content: " ·"; opacity: .6;
  }
  #model-shape-note {margin-top: 6px;}
  /* ★the 含时演化 bar carries FOUR control panels — time and channels,
     starting profiles, sources, closure and coupling — where every other bar
     carries one or two.  Stacked in the shared 320 px column they would push
     the figures a screen and a half down; in the shared two-column grid the
     third block wraps into the narrow column and the six figures come out
     320 px wide.  So this bar, and only this bar, gets a second control
     column.  It collapses with the same breakpoint as the shared rule. */
  [data-bar="evolve"] .funcbar-body {
    grid-template-columns: minmax(0, 658px) minmax(0, 1fr);
  }
  /* ★TWO grid children, at every width.  The bar body's shared rule is a
     two-column grid, so a third child WRAPS — into the narrow column, where
     the six figures and the readings table came out 320 px wide and their
     content spilled.  The controls are therefore one child that splits
     itself, and the outputs are the other. */
  [data-bar="evolve"] .evolve-controls {
    display: grid; grid-template-columns: 320px 320px; gap: 18px;
    align-items: start;
  }
  [data-bar="evolve"] .evolve-controls > .panel:nth-child(-n+2) { margin-top: 0; }
  /* the cross-section beside its readings: a picture that is not isometric
     misreads elongation, so it gets a box of its own rather than a slot in
     the two-column figure grid */
  [data-bar="evolve"] .evolve-geom {
    display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
    gap: 16px; align-items: start;
  }
  [data-bar="evolve"] canvas.xsec { width: 100%; height: 340px; }
  @media (max-width: 980px) {
    [data-bar="evolve"] .evolve-geom { grid-template-columns: 1fr; }
  }
  @media (max-width: 1280px) {
    [data-bar="evolve"] .funcbar-body { grid-template-columns: 320px minmax(0, 1fr); }
    [data-bar="evolve"] .evolve-controls { grid-template-columns: 320px; }
  }
  @media (max-width: 980px) {
    [data-bar="evolve"] .funcbar-body { grid-template-columns: 1fr; }
    [data-bar="evolve"] .evolve-controls { grid-template-columns: 1fr; }
  }
</style>

<!-- 功能栏 evolve.  The strip above it — fold, title, what it is waiting
     for, what it last did — is injected by `scenario.js`. -->
<section data-bar="evolve">
<div class="funcbar-body">

<div class="evolve-controls">
    <div data-part="model" class="panel">
      <h2 data-i18n="e.time">时间与通道</h2>
      <!-- ★★THE WAY IN.  This bar carries close to forty controls, and a
           reader opening it had no starting point but the shipped defaults
           — which is how a published benchmark became something only its
           author could reproduce.  A case is a SESSION DOCUMENT under
           `app/cases/`, applied through the same `FySession.apply` an
           imported file goes through, so what the menu offers and what a
           reader can save are the same thing. -->
      <div class="ctl"><label for="model-evolve-case" data-i18n="case">算例</label>
        <select id="model-evolve-case">
          <option value="" data-i18n="case.pick"></option>
        </select></div>
      <p class="note case-note" id="model-evolve-case-note" hidden></p>
      <div class="ctl"><label for="model-evolve-geometry" data-i18n="e.geom">几何来源</label>
        <select id="model-evolve-geometry">
          <option value="miller" data-i18n="e.geom.miller"></option>
          <option value="device" data-i18n="e.geom.device"></option>
          <option value="gfile" data-i18n="e.geom.gfile"></option>
        </select></div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-ch-heat" checked> <span data-i18n="e.ch.heat">热道 T<sub>e</sub>/T<sub>i</sub></span></label>
        <label><input type="checkbox" id="model-evolve-ch-density"> <span data-i18n="e.ch.density">粒子道 n<sub>e</sub></span></label>
        <label><input type="checkbox" id="model-evolve-ch-current"> <span data-i18n="e.ch.current">电流道 ψ</span></label>
        <!-- ★★the toroidal-momentum channel.  Not a fourth channel of
             `core_march` — the kernel keeps it as its own entry
             (`solve_momentum`), so it is switched on beside the other three
             and advanced beside them on the same dt.  Without omega there
             is no E x B shear and the turbulent closure is missing its most
             important suppression mechanism, which is the whole reason it
             is here. -->
        <label><input type="checkbox" id="model-evolve-ch-momentum"> <span data-i18n="e.ch.momentum">动量道 ω<sub>φ</sub></span></label>
      </div>
      <p class="note" data-i18n="e.ch.note"></p>
      <div id="model-evolve-mom" hidden>
        <div class="ctl"><label><span data-i18n="e.torque">力矩 T<sub>φ</sub> [N·m]</span> <span class="val" id="model-evolve-v-torque"></span></label>
          <input type="range" id="model-evolve-torque" min="0" max="10" step="0.1" value="1"></div>
        <div class="ctl"><label><span data-i18n="e.prandtl">动量普朗特数 χ<sub>φ</sub>/χ<sub>i</sub></span> <span class="val" id="model-evolve-v-prandtl"></span></label>
          <input type="range" id="model-evolve-prandtl" min="0.1" max="3" step="0.05" value="1"></div>
        <p class="note" data-i18n="e.mom_note"></p>
      </div>
      <div class="ctl"><label><span data-i18n="e.dt">时间步 dt [s]</span> <span class="val" id="model-evolve-v-dt"></span></label>
        <input type="range" id="model-evolve-dt" min="0.0005" max="0.2" step="0.0005" value="0.002"></div>
      <div class="ctl"><label><span data-i18n="e.nsteps">步数</span> <span class="val" id="model-evolve-v-nsteps"></span></label>
        <input type="range" id="model-evolve-nsteps" min="5" max="400" step="5" value="60"></div>
      <div class="ctl"><label><span data-i18n="e.dttarget">自适应目标变化（0 = 关）</span> <span class="val" id="model-evolve-v-dttarget"></span></label>
        <input type="range" id="model-evolve-dttarget" min="0" max="0.2" step="0.005" value="0.02"></div>
      <div class="ctl"><label><span data-i18n="e.nlev">磁面 / 网格点数</span> <span class="val" id="model-evolve-v-nlev"></span></label>
        <input type="range" id="model-evolve-nlev" min="11" max="61" step="2" value="31"></div>
      <div class="ctl"><label><span data-i18n="e.edgepsin">梯子外边界 ψ<sub>N</sub></span> <span class="val" id="model-evolve-v-edgepsin"></span></label>
        <input type="range" id="model-evolve-edgepsin" min="0.90" max="0.99" step="0.005" value="0.95"></div>
      <p class="note" data-i18n="e.edgepsin_note"></p>
      <!-- ★★THE BUDGET THE FREE-BOUNDARY SOLVE GETS, and it is a control
           because the answer to "was that enough" is not knowable in
           advance: the solver's droop trim resets its reference and keeps
           going every time it meets the tolerance, so a solve that is
           trimming runs to the cap carrying a residual rather than
           stopping.  The TOLERANCE is not a control — what "converged"
           means is fixed — and the row beside the cross-section says
           which of the two happened. -->
      <div id="model-evolve-freebox" hidden>
        <div class="ctl"><label><span data-i18n="e.freeiter">自由边界迭代上限</span> <span class="val" id="model-evolve-v-freeiter"></span></label>
          <input type="range" id="model-evolve-freeiter" min="20" max="10000" step="20" value="600"></div>
        <p class="note" data-i18n="e.freeiter_note"></p>
      </div>
      <p class="note" data-i18n="e.time_note"></p>
    </div>

    <!-- ★★THE ACTUATORS IN TIME.  Everything else on this bar is a
         flat-top: the powers and the loop voltage were constants for the
         whole march, so what it could model was one SEGMENT of a discharge
         and never a discharge.  The shape is the kernel's own trapezoid
         over the four phase times, and its flat-top value is 1 — it
         multiplies the sliders rather than replacing them, so switching it
         off reproduces exactly the run you had. -->
    <div data-part="model" class="panel">
      <h2 data-i18n="e.wave">波形（放电分段）</h2>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-wave"> <span data-i18n="e.wave.on">按波形推进（关 = 全程恒定）</span></label>
      </div>
      <div class="ctl"><label><span data-i18n="e.wave.ramp">升段结束 t<sub>1</sub> [s]</span> <span class="val" id="model-evolve-v-waveramp"></span></label>
        <input type="range" id="model-evolve-waveramp" min="0" max="20" step="0.05" value="0.2"></div>
      <div class="ctl"><label><span data-i18n="e.wave.flat">平顶结束 t<sub>2</sub> [s]</span> <span class="val" id="model-evolve-v-waveflat"></span></label>
        <input type="range" id="model-evolve-waveflat" min="0" max="60" step="0.05" value="1.5"></div>
      <div class="ctl"><label><span data-i18n="e.wave.end">放电结束 t<sub>3</sub> [s]</span> <span class="val" id="model-evolve-v-waveend"></span></label>
        <input type="range" id="model-evolve-waveend" min="0" max="80" step="0.05" value="2.0"></div>
      <div class="ctl"><label><span data-i18n="e.wave.start">t = 0 的份额</span> <span class="val" id="model-evolve-v-wavestart"></span></label>
        <input type="range" id="model-evolve-wavestart" min="0" max="1" step="0.05" value="0.1"></div>
      <div class="ctl"><label><span data-i18n="e.wave.end2">t = t<sub>3</sub> 的份额</span> <span class="val" id="model-evolve-v-waveend2"></span></label>
        <input type="range" id="model-evolve-waveend2" min="0" max="1" step="0.05" value="0.1"></div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-wavepower" checked> <span data-i18n="e.wave.power">加热跟随</span></label>
        <label><input type="checkbox" id="model-evolve-wavevloop"> <span data-i18n="e.wave.vloop">环电压跟随（＝电流促动器）</span></label>
        <label><input type="checkbox" id="model-evolve-wavefuel"> <span data-i18n="e.wave.fuel">加料跟随</span></label>
      </div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-resume"> <span data-i18n="e.wave.resume">从上一次的终态续跑</span></label>
      </div>
      <p class="note" id="model-evolve-resume-note"></p>
      <p class="note" data-i18n="e.wave_note"></p>
    </div>

    <div data-part="model" class="panel">
      <h2 data-i18n="e.profiles">起始剖面与边界</h2>
      <div class="ctl"><label><span data-i18n="e.te0">T<sub>e</sub>(0) [keV]</span> <span class="val" id="model-evolve-v-te0"></span></label>
        <input type="range" id="model-evolve-te0" min="0.2" max="30" step="0.1" value="3.0"></div>
      <div class="ctl"><label><span data-i18n="e.ti0">T<sub>i</sub>(0) [keV]</span> <span class="val" id="model-evolve-v-ti0"></span></label>
        <input type="range" id="model-evolve-ti0" min="0.2" max="30" step="0.1" value="2.5"></div>
      <div class="ctl"><label><span data-i18n="e.peakt">温度峰化指数</span> <span class="val" id="model-evolve-v-peakt"></span></label>
        <input type="range" id="model-evolve-peakt" min="0.5" max="3" step="0.1" value="1.5"></div>
      <div class="ctl"><label><span data-i18n="e.peakn">密度峰化指数</span> <span class="val" id="model-evolve-v-peakn"></span></label>
        <input type="range" id="model-evolve-peakn" min="0.1" max="4" step="0.1" value="0.5"></div>
      <div class="ctl">
        <label><input type="checkbox" id="model-evolve-pedestal"> <span data-i18n="e.pedestal">台基模型（EPED1-NN 解出边界温度）</span></label></div>
      <p class="note" id="model-evolve-pedestal-note" hidden></p>
      <div class="ctl"><label><span data-i18n="e.edgete">边界 T<sub>e</sub>(a) [keV]</span> <span class="val" id="model-evolve-v-edgete"></span></label>
        <input type="range" id="model-evolve-edgete" min="0.02" max="8" step="0.02" value="0.3"></div>
      <div class="ctl"><label><span data-i18n="e.edgeti">边界 T<sub>i</sub>(a) [keV]</span> <span class="val" id="model-evolve-v-edgeti"></span></label>
        <input type="range" id="model-evolve-edgeti" min="0.02" max="8" step="0.02" value="0.3"></div>
      <div class="ctl"><label><span data-i18n="e.edgene">边界 n<sub>e</sub>(a) [10<sup>19</sup> m<sup>-3</sup>]</span> <span class="val" id="model-evolve-v-edgene"></span></label>
        <input type="range" id="model-evolve-edgene" min="0.1" max="40" step="0.1" value="0.5"></div>
      <div class="ctl"><label><span data-i18n="e.vloop">环电压 V<sub>loop</sub> [V]（电流道边界）</span> <span class="val" id="model-evolve-v-vloop"></span></label>
        <input type="range" id="model-evolve-vloop" min="-1" max="5" step="0.05" value="0"></div>
      <p class="note" data-i18n="e.prof_note"></p>
    </div>

    <div data-part="model" class="panel">
      <h2 data-i18n="e.sources">加热与源</h2>
      <div class="ctl"><label><span data-i18n="e.pe">电子加热 P<sub>e</sub> [MW]</span> <span class="val" id="model-evolve-v-pe"></span></label>
        <input type="range" id="model-evolve-pe" min="0" max="60" step="0.5" value="4"></div>
      <div class="ctl"><label><span data-i18n="e.pi">离子加热 P<sub>i</sub> [MW]</span> <span class="val" id="model-evolve-v-pi"></span></label>
        <input type="range" id="model-evolve-pi" min="0" max="60" step="0.5" value="4"></div>
      <div class="ctl"><label><span data-i18n="e.dep">沉积中心 / 宽度 ρ</span> <span class="val" id="model-evolve-v-dep"></span></label>
        <input type="range" id="model-evolve-dep" min="0" max="0.9" step="0.02" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.depw">沉积宽度 ρ</span> <span class="val" id="model-evolve-v-depw"></span></label>
        <input type="range" id="model-evolve-depw" min="0.05" max="0.8" step="0.05" value="0.30"></div>
      <!-- ★★THE BEAM, instead of the Gaussian above (T-M2).  What the two
           sliders above draw is a SHAPE: a density scan moves the plasma
           and not the place the beam stops, which is exactly backwards.
           With this on, the deposition is `kernel.beam_deposit` — the
           footprint's rays, the Janev stopping cross-section, the
           attenuation and the shell binning — and P_e/P_i, the deposition
           shape and I_CD stop being controls because they become results.
           It needs a psi_N map on the (R, Z) grid, so it exists on the
           solved-equilibrium and g-file tiers and NOT on Miller. -->
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-beam"> <span data-i18n="e.beam">NBI 沉积（取代规定高斯）</span></label>
      </div>
      <div id="model-evolve-beambox" hidden>
        <div class="ctl"><label><span data-i18n="e.beam.power">束功率 P<sub>NBI</sub> [MW]</span> <span class="val" id="model-evolve-v-beampower"></span></label>
          <input type="range" id="model-evolve-beampower" min="0.5" max="40" step="0.5" value="4"></div>
        <div class="ctl"><label><span data-i18n="e.beam.energy">全能量 E [keV]</span> <span class="val" id="model-evolve-v-beamenergy"></span></label>
          <input type="range" id="model-evolve-beamenergy" min="20" max="200" step="5" value="60"></div>
        <div class="ctl"><label><span data-i18n="e.beam.rtan">切向半径 R<sub>tan</sub> [m]</span> <span class="val" id="model-evolve-v-beamrtan"></span></label>
          <input type="range" id="model-evolve-beamrtan" min="0.2" max="3" step="0.01" value="1.26"></div>
        <div class="ctl"><label><span data-i18n="e.beam.z">束高度 z [m]</span> <span class="val" id="model-evolve-v-beamz"></span></label>
          <input type="range" id="model-evolve-beamz" min="-0.6" max="0.6" step="0.02" value="0"></div>
        <div class="ctl"><label><span data-i18n="e.beam.width">束半宽 [m]</span> <span class="val" id="model-evolve-v-beamwidth"></span></label>
          <input type="range" id="model-evolve-beamwidth" min="0.02" max="0.3" step="0.01" value="0.10"></div>
        <div class="ctl"><label for="model-evolve-beamdir" data-i18n="e.beam.dir">注入方向</label>
          <select id="model-evolve-beamdir">
            <option value="1" data-i18n="e.beam.dir.co"></option>
            <option value="-1" data-i18n="e.beam.dir.counter"></option>
          </select></div>
        <div class="ctl"><label for="model-evolve-beamstop" data-i18n="e.beam.stop">阻止截面模型</label>
          <select id="model-evolve-beamstop">
            <option value="janev" data-i18n="e.beam.stop.janev"></option>
            <option value="metis" data-i18n="e.beam.stop.metis"></option>
          </select></div>
        <!-- ★EAST's positive-ion sources record full / half / third
             fractions and they change the stopping depth materially, so
             the split is the reader's rather than a hidden single energy.
             The three are normalised to sum to one. -->
        <div class="ctl"><label><span data-i18n="e.beam.f1">全能份额</span> <span class="val" id="model-evolve-v-beamf1"></span></label>
          <input type="range" id="model-evolve-beamf1" min="0" max="1" step="0.05" value="1"></div>
        <div class="ctl"><label><span data-i18n="e.beam.f2">半能份额</span> <span class="val" id="model-evolve-v-beamf2"></span></label>
          <input type="range" id="model-evolve-beamf2" min="0" max="1" step="0.05" value="0"></div>
        <div class="ctl"><label><span data-i18n="e.beam.f3">三分之一能份额</span> <span class="val" id="model-evolve-v-beamf3"></span></label>
          <input type="range" id="model-evolve-beamf3" min="0" max="1" step="0.05" value="0"></div>
        <div class="ctl"><label><span data-i18n="e.beam.shells">沉积壳层数</span> <span class="val" id="model-evolve-v-beamshells"></span></label>
          <input type="range" id="model-evolve-beamshells" min="8" max="48" step="4" value="24"></div>
        <div class="ctl checks">
          <label><input type="checkbox" id="model-evolve-beamorbit" checked> <span data-i18n="e.beam.orbit">首轨损失（仅逆流注入）</span></label>
        </div>
        <p class="note" data-i18n="e.beam_note"></p>
      </div>
      <p class="note" id="model-evolve-beam-off" hidden></p>
      <!-- ★★THE WAVE, beside the beam and not inside it (T-M10).  NBI and
           LH deposit in different places by different physics — a beam
           stops where it is ionised, a wave damps where its parallel phase
           velocity meets the electron tail — so they are two switches, two
           records and two driven currents, never one "auxiliary heating".
           Like the beam it needs a psi_N map on the (R, Z) grid, and one
           thing more: |F(psi)| per surface, because accessibility goes as
           |B| ~ F/R.  Miller carries neither, so it is disabled there. -->
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-lh"> <span data-i18n="e.lh">LH 沉积与电流驱动（低杂波）</span></label>
      </div>
      <div id="model-evolve-lhbox" hidden>
        <!-- ★★THE LAUNCHERS ARE THE MACHINE'S, NOT THE MARKUP'S (T-M15).
             Every number in the two groups below — the antenna's NAME, the
             nameplate maximum that bounds the power slider, and the launched
             n_∥ band the two n_∥ sliders start at — is written here by the
             controller out of `FYLITE_MACHINE.lhAntennas`, i.e. out of the
             device document's `lh_antennas.antenna`.  They carry no `value`
             for that reason: a literal here would be a machine description
             living in markup, which is what this batch removed, and one that
             stayed behind after a device switch would be worse — it would be
             ANOTHER tokamak's launcher, silently.
             ★What is the page's own is the STARTING power (the first system
             at 2 MW, the rest at 0) — an operating point, not a machine
             fact — and the note under the box says which is which. -->
        <p class="note" id="model-evolve-lh-src"></p>
        <div id="model-evolve-lhgrp1">
          <div class="ctl"><label><span id="model-evolve-lh-p1-lab"></span> <span class="val" id="model-evolve-v-lhpower1"></span></label>
            <input type="range" id="model-evolve-lhpower1" min="0" max="6" step="0.1"></div>
          <div class="ctl"><label><span id="model-evolve-lh-n1lo-lab"></span> <span class="val" id="model-evolve-v-lhnpar1lo"></span></label>
            <input type="range" id="model-evolve-lhnpar1lo" min="1" max="4" step="0.01"></div>
          <div class="ctl"><label><span id="model-evolve-lh-n1hi-lab"></span> <span class="val" id="model-evolve-v-lhnpar1hi"></span></label>
            <input type="range" id="model-evolve-lhnpar1hi" min="1" max="4" step="0.01"></div>
        </div>
        <!-- ★a second system whose absorbed power is zero is DROPPED, not
             carried as a zero — the same rule `lh.east_launchers` applies to
             a shot that ran only one of two systems.  So this slider at 0 is
             how you say "one launcher", and no extra switch is needed.
             ★And the whole group is hidden on a machine that declares only
             one antenna: a control for hardware the machine does not have
             is an invitation to invent it. -->
        <div id="model-evolve-lhgrp2">
          <div class="ctl"><label><span id="model-evolve-lh-p2-lab"></span> <span class="val" id="model-evolve-v-lhpower2"></span></label>
            <input type="range" id="model-evolve-lhpower2" min="0" max="6" step="0.1"></div>
          <div class="ctl"><label><span id="model-evolve-lh-n2lo-lab"></span> <span class="val" id="model-evolve-v-lhnpar2lo"></span></label>
            <input type="range" id="model-evolve-lhnpar2lo" min="1" max="4" step="0.01"></div>
          <div class="ctl"><label><span id="model-evolve-lh-n2hi-lab"></span> <span class="val" id="model-evolve-v-lhnpar2hi"></span></label>
            <input type="range" id="model-evolve-lhnpar2hi" min="1" max="4" step="0.01"></div>
        </div>
        <!-- ★★THE UP-SHIFT IS A RANGE, not a factor, and it is the input
             that decides where the current lands: a launched band resonates
             above the plasma unless multi-pass propagation up-shifts it, and
             the factor itself is poorly known.  A range widens the effective
             band and therefore sigma_j, which is the honest form. -->
        <div class="ctl"><label><span data-i18n="e.lh.uplo">n<sub>∥</sub> 上移因子 下端</span> <span class="val" id="model-evolve-v-lhuplo"></span></label>
          <input type="range" id="model-evolve-lhuplo" min="0.5" max="4" step="0.05" value="1.80"></div>
        <div class="ctl"><label><span data-i18n="e.lh.uphi">n<sub>∥</sub> 上移因子 上端</span> <span class="val" id="model-evolve-v-lhuphi"></span></label>
          <input type="range" id="model-evolve-lhuphi" min="0.5" max="4" step="0.05" value="2.20"></div>
        <div class="ctl"><label><span data-i18n="e.lh.eta">η<sub>CD</sub> [10<sup>19</sup> A W<sup>-1</sup> m<sup>-2</sup>]</span> <span class="val" id="model-evolve-v-lhetacd"></span></label>
          <input type="range" id="model-evolve-lhetacd" min="0.1" max="5" step="0.05" value="1.00"></div>
        <div class="ctl"><label><span data-i18n="e.lh.xi">朗道共振倍数 ξ = v<sub>∥</sub>/v<sub>th,e</sub></span> <span class="val" id="model-evolve-v-lhxi"></span></label>
          <input type="range" id="model-evolve-lhxi" min="2" max="4" step="0.1" value="3.0"></div>
        <div class="ctl"><label><span data-i18n="e.lh.width">阻尼层最小宽度 ψ<sub>N</sub></span> <span class="val" id="model-evolve-v-lhwidth"></span></label>
          <input type="range" id="model-evolve-lhwidth" min="0.01" max="0.3" step="0.01" value="0.05"></div>
        <div class="ctl"><label><span data-i18n="e.lh.shells">沉积壳层数</span> <span class="val" id="model-evolve-v-lhshells"></span></label>
          <input type="range" id="model-evolve-lhshells" min="8" max="48" step="4" value="24"></div>
        <p class="note" data-i18n="e.lh_note"></p>
      </div>
      <p class="note" id="model-evolve-lh-off" hidden></p>
      <div class="ctl"><label><span data-i18n="e.fuel">加料速率 [10<sup>20</sup> s<sup>-1</sup>]</span> <span class="val" id="model-evolve-v-fuel"></span></label>
        <input type="range" id="model-evolve-fuel" min="0" max="20" step="0.5" value="2"></div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-alpha"> <span data-i18n="e.alpha">α 加热（D-T）</span></label>
        <label><input type="checkbox" id="model-evolve-brem" checked> <span data-i18n="e.brem">韧致辐射</span></label>
        <label><input type="checkbox" id="model-evolve-ohmic" checked> <span data-i18n="e.ohmic">欧姆加热</span></label>
        <label><input type="checkbox" id="model-evolve-bootstrap" checked> <span data-i18n="e.bs">自举电流（Redl）</span></label>
      </div>
      <div class="ctl"><label><span data-i18n="e.icd">驱动电流 I<sub>CD</sub> [kA]</span> <span class="val" id="model-evolve-v-icd"></span></label>
        <input type="range" id="model-evolve-icd" min="0" max="1000" step="10" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.zeff">Z<sub>eff</sub></span> <span class="val" id="model-evolve-v-zeff"></span></label>
        <input type="range" id="model-evolve-zeff" min="1" max="4" step="0.1" value="1.5"></div>
      <!-- ★the species menu is FILLED FROM THE KERNEL on ready, never
           written here: an unknown name radiates zero rather than
           complaining, so a hand-written menu that drifted from the ADAS
           table would offer species with no line radiation at all. -->
      <div class="ctl"><label for="model-evolve-species" data-i18n="e.species">杂质物种（线辐射）</label>
        <select id="model-evolve-species">
          <option value="" data-i18n="e.species.none"></option>
        </select></div>
      <div class="ctl"><label><span data-i18n="e.cimp">杂质浓度 n<sub>z</sub>/n<sub>e</sub> [%]</span> <span class="val" id="model-evolve-v-cimp"></span></label>
        <input type="range" id="model-evolve-cimp" min="0" max="5" step="0.01" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.dtfrac">燃料占比 n<sub>D</sub> = n<sub>T</sub> = f·n<sub>e</sub></span> <span class="val" id="model-evolve-v-dtfrac"></span></label>
        <input type="range" id="model-evolve-dtfrac" min="0.1" max="0.5" step="0.025" value="0.500"></div>
      <!-- ★the impurity in the quasi-neutrality.  Without it Z_eff entered
           the resistivity, the radiation and the bootstrap while the main
           ion stayed undiluted — a Z_eff = 1.7 plasma with the fusion rate
           and the ion heat capacity of a pure hydrogenic one. -->
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-quasi"> <span data-i18n="e.quasi">杂质进准中性（主离子被稀释）</span></label>
      </div>
      <p class="note" id="model-evolve-quasi-note" hidden></p>
      <p class="note" data-i18n="e.src_note"></p>
    </div>

    <div data-part="model" class="panel">
      <h2 data-i18n="e.closure">闭包与耦合</h2>
      <div class="ctl"><label for="model-evolve-closure" data-i18n="x.closure">闭包</label>
        <select id="model-evolve-closure">
          <option value="0" data-i18n="x.cl.const"></option>
          <option value="2" data-i18n="x.cl.neo"></option>
          <option value="3" data-i18n="x.cl.turb"></option>
        </select></div>
      <!-- ★the turbulent tier's budget.  TGLF at every radius on every step
           is minutes of arithmetic for a plasma whose turbulence
           equilibrates in microseconds — the standard separation of
           timescales — so the cadence is a control and the page says what
           it costs before the run. -->
      <div id="model-evolve-turb" hidden>
        <div class="ctl"><label><span data-i18n="e.turb.every">TGLF 求值节律（每 N 步）</span> <span class="val" id="model-evolve-v-turbevery"></span></label>
          <input type="range" id="model-evolve-turbevery" min="1" max="50" step="1" value="10"></div>
        <div class="ctl"><label><span data-i18n="x.turb_nrad">求值半径数</span> <span class="val" id="model-evolve-v-turbnrad"></span></label>
          <input type="range" id="model-evolve-turbnrad" min="3" max="12" step="1" value="6"></div>
        <div class="ctl"><label><span data-i18n="x.turb_nky">k<sub>y</sub> 点数</span> <span class="val" id="model-evolve-v-turbnky"></span></label>
          <input type="range" id="model-evolve-turbnky" min="4" max="16" step="1" value="6"></div>
        <div class="ctl"><label><span data-i18n="e.turb.relax">χ<sub>turb</sub> 欠松弛</span> <span class="val" id="model-evolve-v-turbrelax"></span></label>
          <input type="range" id="model-evolve-turbrelax" min="0.1" max="1" step="0.05" value="0.5"></div>
        <p class="note" data-i18n="e.turb_note"></p>
      </div>
      <div class="ctl"><label><span data-i18n="e.chiratio">χ<sub>e</sub>/χ<sub>i</sub>（规定）</span> <span class="val" id="model-evolve-v-chiratio"></span></label>
        <input type="range" id="model-evolve-chiratio" min="0.2" max="3" step="0.1" value="1.0"></div>
      <div class="ctl"><label><span data-i18n="e.dchi">D<sub>n</sub>/χ<sub>e</sub>（规定）</span> <span class="val" id="model-evolve-v-dchi"></span></label>
        <input type="range" id="model-evolve-dchi" min="0.05" max="1.5" step="0.05" value="0.3"></div>
      <div class="ctl"><label><span data-i18n="e.pinch">粒子箍缩 v [m/s]</span> <span class="val" id="model-evolve-v-pinch"></span></label>
        <input type="range" id="model-evolve-pinch" min="-3" max="1" step="0.05" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.dpc">Pereverzev–Corrigan d<sub>PC</sub> [m²/s]</span> <span class="val" id="model-evolve-v-dpc"></span></label>
        <input type="range" id="model-evolve-dpc" min="0" max="4" step="0.05" value="0"></div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-useref"> <span data-i18n="e.useref">以导入的参考剖面为初值 / 规定密度</span></label>
      </div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-evolve-sawtooth"> <span data-i18n="e.saw">锯齿混合（需电流道）</span></label>
      </div>
      <div class="ctl"><label><span data-i18n="e.sawmix">混合半径 r<sub>mix</sub> = k · r<sub>q=1</sub></span> <span class="val" id="model-evolve-v-sawmix"></span></label>
        <input type="range" id="model-evolve-sawmix" min="1" max="1.4" step="0.05" value="1.20"></div>
      <div class="ctl"><label><span data-i18n="e.ip">等离子体电流 I<sub>p</sub> [kA]</span> <span class="val" id="model-evolve-v-ip"></span></label>
        <input type="range" id="model-evolve-ip" min="50" max="20000" step="50" value="400"></div>
      <div class="ctl"><label><span data-i18n="e.couple">耦合节律 K（0 = 冻结几何）</span> <span class="val" id="model-evolve-v-couple"></span></label>
        <input type="range" id="model-evolve-couple" min="0" max="40" step="1" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.relax">β<sub>0</sub> 欠松弛</span> <span class="val" id="model-evolve-v-relax"></span></label>
        <input type="range" id="model-evolve-relax" min="0.1" max="1" step="0.05" value="0.5"></div>
      <!-- ★★the coupling's plasma source.  The free-boundary solver takes a
           TWO-PARAMETER current family, so a coupled march could only hand
           its pressure back through (emp, enp) — a shape outside that
           family could not be represented at all.  The fixed-boundary
           refinement takes p' and FF' as polynomials, so the transport's
           own gradient goes in as itself. -->
      <div class="ctl checks">

<div>

        <input type="range" id="model-interp-ip" min="50" max="20000" step="50" value="400"></div>
      <p class="note" id="model-interp-refstate"></p>
      <p class="note" data-i18n="i.setup_note"></p>
    </div>

    <div data-part="model" class="panel">
      <h2 data-i18n="i.sources">维持这条剖面的源</h2>
      <div class="ctl"><label><span data-i18n="e.pe">电子加热 P<sub>e</sub> [MW]</span> <span class="val" id="model-interp-v-pe"></span></label>

        <input type="range" id="model-interp-dep" min="0" max="0.9" step="0.02" value="0"></div>
      <div class="ctl"><label><span data-i18n="e.depw">沉积宽度 ρ</span> <span class="val" id="model-interp-v-depw"></span></label>
        <input type="range" id="model-interp-depw" min="0.05" max="0.8" step="0.05" value="0.35"></div>
      <div class="ctl"><label><span data-i18n="i.vloop">环电压 V<sub>loop</sub> [V]（0 = 不计欧姆）</span> <span class="val" id="model-interp-v-vloop"></span></label>
        <input type="range" id="model-interp-vloop" min="0" max="5" step="0.05" value="0"></div>
      <div class="ctl checks">
        <label><input type="checkbox" id="model-interp-alpha"> <span data-i18n="e.alpha">α 加热（D-T）</span></label>

      </div>
      <div class="ctl"><label for="model-interp-species" data-i18n="e.species">杂质物种（线辐射）</label>

      <div class="ctl"><label><span data-i18n="e.cimp">杂质浓度 n<sub>z</sub>/n<sub>e</sub> [%]</span> <span class="val" id="model-interp-v-cimp"></span></label>

        <input type="range" id="model-interp-dtfrac" min="0.1" max="0.5" step="0.025" value="0.500"></div>
      <p class="note" data-i18n="i.src_note"></p>
    </div>
</div>

<div>
    <div data-part="model" class="panel">
      <p class="scope" data-i18n="i.scope"></p>
