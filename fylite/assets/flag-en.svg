<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 0 45 30" width="30" height="20" role="img" aria-label="English">
  <!-- Union Flag, the canonical minimal construction on a 60 x 30 field: white
       saltire at 6 units, the red saltire counterchanged by clipping each arm
       to alternating half-quadrants, then the white and red crosses over it.
       ★The viewBox crops 7.5 units from each side so this file is 3:2 like
       `flag-zh.svg` — the two sit side by side in the same 24x16 button and a
       flag squeezed by `preserveAspectRatio` would look bent.  Cropping the
       Union Flag keeps the cross centred and every angle true.
       ★An SVG rather than the 🇬🇧 emoji, for the reason in `flag-zh.svg`. -->
  <clipPath id="uj"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
  <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uj)" stroke="#C8102E" stroke-width="4"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
</svg>
