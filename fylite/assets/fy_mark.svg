<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fylite">
  <!-- The square mark: the `Fy` of the fylite wordmark, on its own, on nothing.
       ★WHY A SECOND FILE and not the wordmark scaled down.  `fylite_logo.svg`
       is 240x100 and carries the strapline `FUYUN TOKAMAK SIMULATOR - LITE` at
       7 px; at a 16 px favicon or a 30 px header strip that line is a smear and
       the white plate is most of the pixels.
       ★NO PLATE HERE, not even the wordmark's navy one: the mark sits directly
       on the header, so it takes the reader's theme instead of punching a
       coloured tile into it.  The letterform is the wordmark's own #FF8C00,
       which carries on a light panel and on a dark one alike — which is the
       whole reason the plate was needed in the first place and is not here. -->
  <text x="31" y="34" font-family="Arial, Helvetica, sans-serif" font-size="44"
        font-weight="bold" font-style="italic" fill="#FF8C00"
        dominant-baseline="middle" text-anchor="middle">Fy</text>
</svg>
