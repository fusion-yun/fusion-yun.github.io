<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ln.report.title">fylite</title>
<link rel="icon" href="../assets/fy_mark.svg">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* ★the report is a DOCUMENT, not an instrument: one measure, figures in
     the flow, tables captioned above (the run-report template's rule). */
  #tool-report .layout { grid-template-columns: 320px minmax(0, 1fr); }
  @media (max-width: 980px) { #tool-report .layout { grid-template-columns: 1fr; } }
  .report-host { max-width: none; }
  .report-host:empty::before { content: attr(data-empty); color: var(--muted); }
  .report-drop { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); }
  .report-drop.over { border-color: var(--accent); color: var(--fg); }
  .report-table { margin: 8px 0 16px; }
  .report-table caption { caption-side: top; text-align: left; font-weight: 600; padding: 4px 0 6px; }
  .report-table th:first-child, .report-table td:first-child { text-align: left; white-space: nowrap; }
  .report-fig { margin: 12px 0 18px; }
  .report-fig svg { max-width: 100%; height: auto; }
  .report-fig figcaption { color: var(--muted); margin-top: 4px; }
  .report-refused { border-left: 3px solid var(--warn); padding-left: 8px; }
</style>
<script src="../assets/i18n.js"></script>
<script src="../assets/lang-zh.js"></script>
<script src="../assets/lang-en.js"></script>
<script src="../assets/lang-site-zh.js"></script>
<script src="../assets/lang-site-en.js"></script>
<script src="../assets/lang-report-zh.js"></script>
<script src="../assets/lang-report-en.js"></script>
<script src="../assets/theme.js"></script>
<!-- which host is serving this (site vs desktop viewer); see assets/host.js -->
<script src="../assets/host.js"></script>
<!-- GENERATED by rust/build.sh: kernel / front-end release + ABI -->
<script src="../assets/version.js"></script>
<script src="../assets/site.js"></script>
</head>
<body data-page="report">

<header class="top">
  <a class="brand" href="../index.html"><img src="../assets/fy_mark.svg" alt="" width="32" height="32"></a>
  <div class="titles">
  <h1 data-i18n="report.h1">&nbsp;</h1>
  <span class="sub" data-i18n="report.sub"></span>
  </div>
  <p class="warn-band" role="note"><span class="warn-alpha" data-i18n="chrome.alpha">alpha 版，用于概念验证</span></p>
  <nav>
    <button id="theme-toggle" class="iconbtn" type="button"></button>
  </nav>
</header>

<main>

<div class="doc intro-host">
  <div class="intro">
    <p class="lead" data-i18n="report.lead"></p>
    <p class="bound" data-i18n="report.bound"></p>
  </div>
</div>

<section class="tool" id="tool-report">
<div class="layout">

<!-- the apparatus column: what to render -->
<div>
  <div class="panel">
    <h2 data-i18n="report.load">载入</h2>
    <p class="note" data-i18n="report.load.what"></p>
    <div class="ctl"><label for="report-files" data-i18n="report.files">文件</label>
      <input type="file" id="report-files" multiple accept=".jsonld,.json,application/ld+json,application/json"></div>
    <div class="report-drop" id="report-drop" data-i18n="report.drop"></div>
    <div class="ctl"><label for="report-src" data-i18n="report.src">或一个地址</label>
      <input type="text" id="report-src" placeholder="records/…/record.jsonld"></div>
    <div class="buttons">
      <button id="report-fetch" type="button" data-i18n="report.fetch">取回并渲染</button>
      <button id="report-export-spec" type="button" data-i18n="report.export.spec" disabled>导出呈现规格</button>
    </div>
    <p class="note" id="report-status" data-i18n="report.status.none"></p>
  </div>
</div>

<!-- the document column: the report itself -->
<div class="doc report-host" id="report-host" data-empty=""></div>

</div>
</section>

</main>

<footer></footer>

<script src="../assets/casereport.js"></script>
<script src="../assets/report-page.js"></script>
</body>
</html>
