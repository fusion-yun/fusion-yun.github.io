      <div data-form="evolve-dtfrac"></div>

           the resistivity, the radiation and the bootstrap while the main
           ion stayed undiluted — a Z_eff = 1.7 plasma with the fusion rate
           and the ion heat capacity of a pure hydrogenic one. -->
      <div class="ctl checks">
        <span data-form="evolve-quasi"></span>
      </div>
      <p class="note" id="model-evolve-quasi-note" hidden></p>
      <p class="note" data-i18n="e.src_note"></p>
    </div>

    <div data-part="model" class="panel">
      <h2 data-i18n="e.closure">闭包与耦合</h2>
      <div data-form="evolve-closure"></div>
      <p class="note" id="model-evolve-fm-off" hidden></p>
      <!-- ★the turbulent tier's budget.  TGLF at every radius on every step
           is minutes of arithmetic for a plasma whose turbulence
           equilibrates in microseconds — the standard separation of
           timescales — so the cadence is a control and the page says what
           it costs before the run. -->
      <div id="model-evolve-turb" hidden>
        <!-- ★the two that belong to a MARCH and to nothing else: a cadence
             counts steps, and the under-relaxation is what keeps a stiff
             closure from oscillating between two steps.  The flux-match tier
             has neither steps nor a previous chi to relax towards — its
             relaxation is the matcher's own per-point backoff — so these two
             are withdrawn there rather than shown and ignored. -->
        <div id="model-evolve-turbmarch">
          <div data-form="evolve-turbevery"></div>
        </div>
        <div data-form="evolve-turbnrad"></div>
        <div data-form="evolve-turbnky"></div>
        <div id="model-evolve-turbmarch2">
          <div data-form="evolve-turbrelax"></div>
        </div>
        <p class="note" data-i18n="e.turb_note"></p>
      </div>
      <!-- ★★T-C13 — the matcher's own four, and the reader sees all four
           because every one of them changes the ANSWER rather than only the
           cost: the tolerance is what「收敛」 means, the probe step is the
           finite difference the Jacobian is built from, and the clamp is what
           keeps a Newton step from leaping into a region where the turbulent
           model has no unstable mode at all.
           ★The MATCH RADII are not a fifth control: they are the radii TGLF
           is evaluated on (求值半径数 above), because what the match is a
           root find of is that model's flux and matching where it was never
           evaluated would be matching an interpolation. -->
      <div id="model-evolve-fmbox" hidden>
        <div data-form="evolve-fmrhomin"></div>
        <div data-form="evolve-fmiter"></div>
        <div data-form="evolve-fmtol"></div>
        <div data-form="evolve-fmdx"></div>
        <div data-form="evolve-fmdxmax"></div>
        <!-- ★★T-C14: THE OUTER LOOP, and why it is two controls rather than a
             switch.  What the matcher above closes is conduction; what it
             CANNOT close is everything that has to be held fixed while a
             Newton step is taken — the burn (already frozen per iteration,
             Picard), the pedestal (already lagged one iteration), and then
             the three that are not in it at all: the steady current, the
             sawtooth, and the equilibrium the metric comes from.  Alternating
             those with the match IS the stationary loop the reference
             framework runs, and its convergence test is the reference's own:
             the relative change of the pressure and current profiles.
             ★`fmouter = 1` is exactly today's behaviour — one match, no
             alternation — so every existing case runs unchanged.
             ★`couple` stays REFUSED on this tier: it is a per-STEP cadence
             and this tier has no time axis; two controls saying one thing
             would read as though they could be used together. -->
        <div data-form="evolve-fmouter"></div>
        <div data-form="evolve-fmotol"></div>
        <!-- ★★外环的欠松弛：一轮把下一轮甩出去多远。1 = 不阻尼，实测在
             `evolve-east-hmode` 上会跑飞（第六轮的牛顿路径 99 → 311 → 922 %）；
             阻尼不移动不动点——不动点上稳态解返回的就是喂进去的那一条。 -->
        <div data-form="evolve-fmorlx"></div>
        <p class="note" data-i18n="e.fm_note"></p>
        <p class="note" data-i18n="e.fm_outer_note"></p>
      </div>
      <div data-form="evolve-chiratio"></div>
      <div data-form="evolve-dchi"></div>
      <div data-form="evolve-pinch"></div>
      <!-- ★★T-C20：第二种离子自己的输运。内核的密度道一直是逐离子种的，装配层
           一直收 ions 列表——缺的是这两个数：闭包按 n_ion × n 开了空间却只填第一
           种，杂质拿到的是 D = 0、v = 0，等于被冻住。★缺省与主离子相同，所以
           打开第二种离子本身不改变任何东西；这两个控件买到的是「杂质可以输运得
           不一样」这件事，而那正是有两种离子唯一有意思的地方。★与主离子的那两个
           一样是**规定的**——本档没有粒子闭包。 -->
      <div data-form="evolve-dchiz"></div>
      <div data-form="evolve-pinchz"></div>
      <div data-form="evolve-dpc"></div>
      <div class="ctl checks">
        <span data-form="evolve-useref"></span>
      </div>
      <div class="ctl checks">
        <span data-form="evolve-sawtooth"></span>
      </div>
      <div data-form="evolve-sawmix"></div>
      <div data-form="evolve-ip"></div>
      <div data-form="evolve-couple"></div>
      <div data-form="evolve-relax"></div>
      <!-- ★★the coupling's plasma source.  The free-boundary solver takes a
           TWO-PARAMETER current family, so a coupled march could only hand
           its pressure back through (emp, enp) — a shape outside that
           family could not be represented at all.  The fixed-boundary
           refinement takes p' and FF' as polynomials, so the transport's
           own gradient goes in as itself. -->
      <div class="ctl checks">
        <span data-form="evolve-couplefixed"></span>
      </div>
      <div id="model-evolve-cfix" hidden>
        <div data-form="evolve-degp"></div>
        <div data-form="evolve-degf"></div>
        <p class="note" data-i18n="e.cfix_note"></p>
      </div>
      <p class="note" id="model-evolve-couple-note" data-i18n="e.couple_note"></p>
    </div>
</div>
