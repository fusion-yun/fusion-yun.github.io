id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/pf_passive
name: fyo-pf_passive
title: fyo IDS `pf_passive` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `pf_passive` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/pf_passive/dd_pf_passive.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: PfPassive
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  PfPassive:
    is_a: Dataset
    description: Description of the axisymmetric passive conductors, currents flowing in them. Electromagnetic
      simulations are expected to use only this IDS to describe passive conductors and their specific
      discretization, not the component-related IDS (e.g. wall) which are used to store e.g. the component
      machine description
    annotations:
      dd_path: pf_passive
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      loop:
        range: PfPassiveLoops
        multivalued: true
        description: Passive axisymmetric conductor description in the form of non-connected loops; any
          connected loops are expressed as active coil circuits with no power supply attached.
        annotations:
          dd_max_occurs: '500'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PfPassiveLoops:
    is_a: InformationContentEntity
    description: Passive axisymmetric conductor description in the form of non-connected loops; any connected
      loops are expressed as active coil circuits with no power supply attached.
    annotations:
      dd_type_name: pf_passive_loops
      dd_path: pf_passive/loop
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      resistance:
        range: float
        description: Passive loop resistance
        annotations:
          dd_units: ohm
      resistivity:
        range: float
        description: Passive loop resistivity
        annotations:
          dd_units: ohm.m
      element:
        range: PfCoilsElements
        multivalued: true
        description: Each loop is comprised of a number of cross-section elements described  individually
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      current:
        range: float
        multivalued: true
        description: Passive loop current
        annotations:
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes of this loop located at this level of the IDS structure
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
