id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/plasma_initiation
name: fyo-plasma_initiation
title: fyo IDS `plasma_initiation` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `plasma_initiation` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/plasma_initiation/dd_plasma_initiation.xsd (import ancestry)
  fyo_category: plasma_state
  fyo_root_class: PlasmaInitiation
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  PlasmaInitiation:
    is_a: Dataset
    description: Description the early phases of the plasma, before an equilibrium can be calculated
    annotations:
      dd_path: plasma_initiation
      fyo_category: plasma_state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      global_quantities:
        range: PlasmaInitiationGlobalQuantities
        description: Global quantities
      b_field_lines:
        range: PlasmaInitiationFieldLines
        multivalued: true
        description: Magnetic field line tracing results, given at various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_lift: representation_set
          fyo_note: elements are spo:equivalent_representation peers — one referent quantity on alternative
            grids/charts
          fyo_layout: aos
      profiles_2d:
        range: PlasmaInitiationProfiles2d
        multivalued: true
        description: 2D profiles in the poloidal plane, given at various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_lift: representation_set
          fyo_note: elements are spo:equivalent_representation peers — one referent quantity on alternative
            grids/charts
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PlasmaInitiationGlobalQuantities:
    is_a: InformationContentEntity
    description: Global quantities
    annotations:
      dd_type_name: plasma_initiation_global_quantities
      dd_path: plasma_initiation/global_quantities
    attributes:
      b_field_stray:
        range: SignalFlt1d
        description: Stray magnetic field at plasma position
        annotations:
          dd_units: T
      b_field_perpendicular:
        range: SignalFlt1d
        description: Perpendicular magnetic field at plasma position. b_field_perpendicular = sqrt(b_field_stray^2+b_field_eddy^2)
        annotations:
          dd_units: T
      connection_length:
        range: SignalFlt1d
        description: Average length of open magnetic field lines. In the case of fully closed field lines,
          connection_length = 1
        annotations:
          dd_units: m
      coulomb_logarithm:
        range: SignalFlt1d
        description: Coulomb logarithm
        annotations:
          dd_units: '1'
      ip:
        range: SignalFlt1d
        description: Total plasma current (toroidal component). Positive sign means anti-clockwise when
          viewed from above.
        annotations:
          dd_units: A
      t_e_volume_average:
        range: SignalFlt1d
        description: Volume averaged electron temperature (average over the plasma volume up to the LCFS)
        annotations:
          dd_units: eV
      n_e_volume_average:
        range: SignalFlt1d
        description: Volume averaged electron density (average over the plasma volume up to the LCFS)
        annotations:
          dd_units: m^-3
      ion:
        range: PlasmaInitiationGlobalQuantitiesIon
        multivalued: true
        description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
          sequences
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      neutral:
        range: PlasmaInitiationGlobalQuantitiesNeutral
        multivalued: true
        description: Quantities related to the different neutral species
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  PlasmaInitiationGlobalQuantitiesIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
      sequences
    annotations:
      dd_type_name: plasma_initiation_global_quantities_ion
      dd_path: plasma_initiation/global_quantities/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: '4'
          dd_coordinate1: 1...N
      z_ion:
        range: SignalFlt1d
        description: Ion charge (of the dominant ionization state; lumped ions are allowed), volume averaged
          over plasma radius
        annotations:
          dd_units: e
      name:
        range: string
        description: String identifying the species (e.g. H+, D+, T+, He+2, C+, D2, DT, CD4, ...)
        annotations:
          dd_type: constant
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: constant
      t_i_volume_average:
        range: SignalFlt1d
        description: Volume averaged temperature of this ion species (averaged over the plasma volume
          up to the LCFS)
        annotations:
          dd_units: eV
      n_i_volume_average:
        range: SignalFlt1d
        description: Volume averaged density of this ion species (averaged over the plasma volume up to
          the LCFS)
        annotations:
          dd_units: m^-3
  PlasmaInitiationGlobalQuantitiesNeutral:
    is_a: InformationContentEntity
    description: Quantities related to the different neutral species
    annotations:
      dd_type_name: plasma_initiation_global_quantities_neutral
      dd_path: plasma_initiation/global_quantities/neutral
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: '4'
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying the species (e.g. H, D, T, He, C, D2, DT, CD4, ...)
        annotations:
          dd_type: constant
      ion_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../ion array
        annotations:
          dd_type: constant
      temperature_volume_average:
        range: SignalFlt1d
        description: Volume averaged temperature of this neutral species (averaged over the plasma volume
          up to the LCFS)
        annotations:
          dd_units: eV
      density_volume_average:
        range: SignalFlt1d
        description: Volume averaged density of this neutral species (averaged over the plasma volume
          up to the LCFS)
        annotations:
          dd_units: m^-3
  PlasmaInitiationFieldLines:
    is_a: TimeSlice
    description: Magnetic field line tracing results, given at various time slices
    annotations:
      dd_type_name: plasma_initiation_field_lines
      dd_path: plasma_initiation/b_field_lines
      fyo_lift: time_slice
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      townsend_or_closed_positions:
        range: Rz1dDynamicAos
        description: List of all R, Z positions along all field lines encoutering Townsend condition or
          being closed field lines
      townsend_or_closed_grid_positions:
        range: Rz1dDynamicAos
        description: List of all R, Z grid positions (from ../grid) containing field lines encoutering
          Townsend condition or being closed field lines
      starting_positions:
        range: Rz1dDynamicAos
        description: Starting position to initiate field line tracing, for each field line
      e_field_townsend:
        range: float
        multivalued: true
        description: Townsend electric field along each field line
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 1
          dd_coordinate1: ../starting_positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../starting_positions/r
      e_field_parallel:
        range: float
        multivalued: true
        description: Parallel electric field along each field line
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 1
          dd_coordinate1: ../starting_positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../starting_positions/r
      lengths:
        range: float
        multivalued: true
        description: Length of each field line
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../starting_positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../starting_positions/r
      pressure:
        range: float
        description: Prefill gas pressure used in Townsend E field calculation
        annotations:
          dd_type: dynamic
          dd_units: Pa
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      open_fraction:
        range: float
        description: 'Fraction of open field lines : ratio open fields lines / (open+closed field lines)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaInitiationProfiles2d:
    is_a: TimeSlice
    description: 2D profiles in the poloidal plane, given at various time slices
    annotations:
      dd_type_name: plasma_initiation_profiles_2d
      dd_path: plasma_initiation/profiles_2d
      fyo_lift: time_slice
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      e_field_phi:
        range: float
        multivalued: true
        description: Toroidal component of the electric field
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
