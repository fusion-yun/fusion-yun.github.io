id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/refractometer
name: fyo-refractometer
title: fyo IDS `refractometer` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `refractometer` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/refractometer/dd_refractometer.xsd (import ancestry)
  fyo_category: measurement
  fyo_root_class: Refractometer
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Refractometer:
    is_a: Dataset
    description: Density profile refractometer diagnostic
    annotations:
      dd_path: refractometer
      fyo_category: measurement
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      type:
        range: string
        description: Type of refractometer (differential, impulse, ...)
        annotations:
          dd_type: static
      channel:
        range: RefractometerChannel
        multivalued: true
        description: Set of channels, e.g. different reception antennas of the refractometer
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  RefractometerChannel:
    is_a: InformationContentEntity
    description: Set of channels, e.g. different reception antennas of the refractometer
    annotations:
      dd_type_name: refractometer_channel
      dd_path: refractometer/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      mode:
        range: string
        description: Detection mode "X" or "O"
        annotations:
          dd_type: static
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight. The first point corresponds to the probing wave
          emission point. The second point corresponds to the probing wave detection point
      bandwidth:
        range: RefractometerChannelBandwidth
        multivalued: true
        description: Set of frequency bandwidths
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      n_e_line:
        range: SignalFlt1d
        description: Integral of the electron density along the line of sight, deduced from the envelope
          phase measurements
        annotations:
          dd_units: m^-2
          dd_coordinate1: time
      n_e_profile_approximation:
        range: RefractometerShapeApproximation
        description: Approximation of the radial electron density profile with an array of parameters
          and an approximation formula, used by post-processing programs for the identification of the
          electron density profile.
  RefractometerChannelBandwidth:
    is_a: InformationContentEntity
    description: Set of frequency bandwidths
    annotations:
      dd_type_name: refractometer_channel_bandwidth
      dd_path: refractometer/channel/bandwidth
    attributes:
      frequency_main:
        range: float
        description: Main frequency used to probe the plasma (before upshifting and modulating)
        annotations:
          dd_type: static
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phase:
        range: float
        multivalued: true
        description: Phase of the envelope of the probing signal, relative to the phase at launch
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      i_component:
        range: float
        multivalued: true
        description: I component of the IQ detector used to retrieve the phase of signal's envelope, sampled
          on a high resolution time_detector grid just before each measurement time slice represented
          by the ../time vector
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../time
      q_component:
        range: float
        multivalued: true
        description: Q component of the IQ detector used to retrieve the phase of signal's envelope, sampled
          on a high resolution time_detector grid just before each measurement time slice represented
          by the ../time vector
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../time
      n_e_line:
        range: SignalFlt1d
        description: Integral of the electron density along the line of sight, deduced from the envelope
          phase measurements
        annotations:
          dd_units: m^-2
          dd_coordinate1: time
      phase_quadrature:
        range: SignalFlt2d
        description: In-phase and Quadrature components of the analysed signal. They are returned by an
          IQ-detector, that takes carrying and reference signals as the input and yields I and Q components.
          These are respectively stored as the first and the second index of the first dimension of the
          data child.
        annotations:
          dd_units: V
          dd_coordinate1: 1...2
          dd_coordinate2: time
      time_detector:
        range: float
        multivalued: true
        description: High sampling timebase of the IQ-detector signal measurements
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../time
      time:
        range: float
        multivalued: true
        description: Timebase for this bandwidth
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  RefractometerShapeApproximation:
    is_a: InformationContentEntity
    description: Approximation of the radial electron density profile with an array of parameters and
      an approximation formula, used by post-processing programs for the identification of the electron
      density profile.
    annotations:
      dd_type_name: refractometer_shape_approximation
      dd_path: refractometer/channel/n_e_profile_approximation
    attributes:
      formula:
        range: Identifier
        description: Analytical formula representing the electron density profile as a function of a radial
          coordinate and adjustable parameters f(rho_tor_norm, alpha1, ... alphaN)
      parameters:
        range: float
        multivalued: true
        description: Values of the formula's parameters alpha1, ..., alphaN
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../../n_e_line/time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../../n_e_line/time
