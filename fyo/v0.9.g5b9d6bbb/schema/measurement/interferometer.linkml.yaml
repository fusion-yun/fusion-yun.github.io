id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/interferometer
name: fyo-interferometer
title: fyo IDS `interferometer` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `interferometer` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/interferometer/dd_interferometer.xsd (import ancestry)
  fyo_category: measurement
  fyo_root_class: Interferometer
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Interferometer:
    is_a: Dataset
    description: Interferometer diagnostic
    annotations:
      dd_path: interferometer
      fyo_category: measurement
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: InterferometerChannel
        multivalued: true
        description: Set of channels (lines-of-sight)
        annotations:
          dd_max_occurs: '15'
          dd_coordinate1: 1...N
      n_e_volume_average:
        range: SignalFlt1dValidity
        description: Volume average plasma density estimated from the line densities measured by the various
          channels
        annotations:
          dd_units: m^-3
      electrons_n:
        range: SignalFlt1dValidity
        description: Total number of electrons in the plasma, estimated from the line densities measured
          by the various channels
        annotations:
          dd_units: '1'
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  InterferometerChannel:
    is_a: InformationContentEntity
    description: Set of channels (lines-of-sight)
    annotations:
      dd_type_name: interferometer_channel
      dd_path: interferometer/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      line_of_sight:
        range: LineOfSight3points
        description: Description of the line of sight of the channel, defined by two points when the beam
          is not reflected, a third point is added to define the reflected beam path
      wavelength:
        range: InterferometerChannelWavelengthInterf
        multivalued: true
        description: Set of wavelengths used for interferometry
        annotations:
          dd_max_occurs: '2'
          dd_coordinate1: 1...N
      path_length_variation:
        range: SignalFlt1d
        description: Optical path length variation due to the plasma
        annotations:
          dd_units: m
      n_e_line:
        range: SignalFlt1dValidity
        description: 'Line integrated density, possibly obtained by a combination of multiple interferometry
          wavelengths. Corresponds to the density integrated along the full line-of-sight (i.e. forward
          AND return for a reflected channel: NO dividing by 2 correction)'
        annotations:
          dd_units: m^-2
      n_e_line_average:
        range: SignalFlt1dValidity
        description: Line average density inferred from interferometer measurements. Corresponds to the
          density integrated along the full line-of-sight and then divided by the length of the line-of-sight
        annotations:
          dd_units: m^-3
      n_e:
        range: InterferometerChannelNE
        description: Estimated electron density profile on a set of positions along the line of sight
          and used by forward models.
  InterferometerChannelWavelengthInterf:
    is_a: InformationContentEntity
    description: Set of wavelengths used for interferometry
    annotations:
      dd_type_name: interferometer_channel_wavelength_interf
      dd_path: interferometer/channel/wavelength
    attributes:
      value:
        range: float
        description: Wavelength value
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phase_corrected:
        range: SignalFlt1d
        description: Phase measured for this wavelength, corrected from fringe jumps
        annotations:
          dd_units: rad
      fringe_jump_correction:
        range: integer
        multivalued: true
        description: Signed number of 2pi phase corrections applied to remove a fringe jump, for each
          time slice on which a correction has been made
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: ../fringe_jump_correction_times
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../fringe_jump_correction_times
      fringe_jump_correction_times:
        range: float
        multivalued: true
        description: List of time slices of the pulse on which a fringe jump correction has been made
        annotations:
          dd_type: constant
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      phase_to_n_e_line:
        range: float
        description: Conversion factor to be used to convert phase into line density for this wavelength
        annotations:
          dd_type: static
          dd_units: m^-2.rad^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  InterferometerChannelNE:
    is_a: InformationContentEntity
    description: Estimated electron density profile on a set of positions along the line of sight and
      used by forward models.
    annotations:
      dd_type_name: interferometer_channel_n_e
      dd_path: interferometer/channel/n_e
    attributes:
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../positions/r
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../positions/r,../time
      time:
        range: float
        multivalued: true
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
      positions:
        range: Rphiz1dStatic
        description: Positions along the line of sight
