id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/calorimetry
name: fyo-calorimetry
title: fyo IDS `calorimetry` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `calorimetry` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/calorimetry/dd_calorimetry.xsd (import ancestry)
  fyo_category: measurement
  fyo_root_class: Calorimetry
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Calorimetry:
    is_a: Dataset
    description: Calometry measurements on various tokamak subsystems
    annotations:
      dd_path: calorimetry
      fyo_category: measurement
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      group:
        range: CalorimetryGroup
        multivalued: true
        description: Set of groups of components on which calorimetry measurements are carried out (grouped
          by tokamak subsystems or localization on the machine)
        annotations:
          dd_max_occurs: '25'
          dd_coordinate1: 1...N
      cooling_loop:
        range: CalorimetryCoolingLoop
        multivalued: true
        description: Set of cooling loops
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CalorimetryGroup:
    is_a: InformationContentEntity
    description: Set of groups of components on which calorimetry measurements are carried out (grouped
      by tokamak subsystems or localization on the machine)
    annotations:
      dd_type_name: calorimetry_group
      dd_path: calorimetry/group
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      component:
        range: CalorimetryGroupComponent
        multivalued: true
        description: Set of components on which calorimetry measurements are carried out
        annotations:
          dd_max_occurs: '40'
          dd_coordinate1: 1...N
  CalorimetryGroupComponent:
    is_a: InformationContentEntity
    description: Set of components on which calorimetry measurements are carried out
    annotations:
      dd_type_name: calorimetry_group_component
      dd_path: calorimetry/group/component
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      power:
        range: SignalFlt1dValidity
        description: Power extracted from the component
        annotations:
          dd_units: W
      energy_cumulated:
        range: SignalFlt1dValidity
        description: Energy extracted from the component since the start of the pulse
        annotations:
          dd_units: J
      energy_total:
        range: DataFlt0dConstantValidity
        description: Energy extracted from the component on the whole plasma discharge, including the
          return to thermal equilibrium of the component in the post-pulse phase
        annotations:
          dd_units: J
      temperature_in:
        range: SignalFlt1dValidity
        description: Temperature of the coolant when entering the component
        annotations:
          dd_units: K
      temperature_out:
        range: SignalFlt1dValidity
        description: Temperature of the coolant when exiting the component
        annotations:
          dd_units: K
      mass_flow:
        range: SignalFlt1dValidity
        description: Mass flow of the coolant going through the component
        annotations:
          dd_units: kg.s^-1
      transit_time:
        range: SignalFlt1dValidity
        description: Transit time for the coolant to go from the input to the output of the component
        annotations:
          dd_units: s
  DataFlt0dConstantValidity:
    is_a: InformationContentEntity
    description: Energy extracted from the component on the whole plasma discharge, including the return
      to thermal equilibrium of the component in the post-pulse phase
    annotations:
      dd_type_name: data_flt_0d_constant_validity
      dd_path: calorimetry/group/component/energy_total
    attributes:
      data:
        range: float
        description: Data
        annotations:
          dd_type: constant
          dd_units: as_parent
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: constant
  CalorimetryCoolingLoop:
    is_a: InformationContentEntity
    description: Set of cooling loops
    annotations:
      dd_type_name: calorimetry_cooling_loop
      dd_path: calorimetry/cooling_loop
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      temperature_in:
        range: SignalFlt1dValidity
        description: Temperature of the coolant when entering the loop
        annotations:
          dd_units: K
      temperature_out:
        range: SignalFlt1dValidity
        description: Temperature of the coolant when exiting the loop
        annotations:
          dd_units: K
      mass_flow:
        range: SignalFlt1dValidity
        description: Mass flow of the coolant going through the loop
        annotations:
          dd_units: kg.s^-1
