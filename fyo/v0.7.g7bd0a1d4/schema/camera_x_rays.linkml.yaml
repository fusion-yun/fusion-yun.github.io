id: https://fusion-yun.github.io/fyo/v0.draft/camera_x_rays
name: fyo-imas-camera_x_rays
title: fyo IDS `camera_x_rays` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `camera_x_rays` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/camera_x_rays/dd_camera_x_rays.xsd via dd2linkml (mechanical layer — transient
    build artifact, not in-tree)
  fyo_category: diagnostic
  fyo_root_class: CameraXRays
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  CameraXRays:
    is_a: IDS
    description: X-rays imaging camera (can be used for soft or hard X-rays imaging systems)
    annotations:
      dd_path: camera_x_rays
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      frame:
        range: CameraXRaysFrame
        multivalued: true
        description: Set of frames. Each time step corresponds to the beginning of the photon integration
          of each image
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      t_e_magnetic_axis:
        range: SignalFlt1dValidity
        description: Electron temperature at the magnetic axis, inferred from ratios of soft x-rays emissivity
          at different energies
        annotations:
          dd_units: eV
      photon_energy:
        range: float
        multivalued: true
        description: List of values of the photon energy (coordinate for quantum_effiency)
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      quantum_efficiency:
        range: float
        multivalued: true
        description: Quantum efficiency of the detector, i.e. conversion factor multiplying the number
          of counts to obtain the number of photons impacting the detector, tabulated as a function of
          the photon energy, for each pixel of the detector. If all pixels have the same quantum efficiency,
          just set the size of the first and second dimensions to 1
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 3
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: ../photon_energy
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,../photon_energy
      energy_threshold_lower:
        range: float
        multivalued: true
        description: Lower energy detection threshold on each pixel of the detector (photons are counted
          only if their energy is above this value)
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      energy_configuration_name:
        range: string
        description: Name of the chosen energy configuration (energy detection threshold)
        annotations:
          dd_type: static
      pixel_status:
        range: integer
        multivalued: true
        description: 'Status of each pixel : +1 for valid pixels, -1 for inactive pixels, -2 for mis-calibrated
          pixels.'
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      aperture:
        range: DetectorAperture
        description: Description of the collimating aperture of the diagnostic
      camera:
        range: CameraGeometry
        description: 'Characteristics of the camera used. The orientation of the camera is described as
          follows : pixels are aligned along x1 and x2 unit vectors while x3 is normal to the detector
          plane.'
      filter_window:
        range: FilterWindow
        description: Characteristics of the filter window
      exposure_time:
        range: float
        description: Exposure time
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      readout_time:
        range: float
        description: Time used to read out each frame on the detector
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      detector_humidity:
        range: SignalFlt1d
        description: Fraction of humidity (0-1) measured at the detector level
        annotations:
          dd_units: '1'
      detector_temperature:
        range: SignalFlt1d
        description: Temperature measured at the detector level
        annotations:
          dd_units: K
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CameraXRaysFrame:
    is_a: TimeSlice
    description: Set of frames. Each time step corresponds to the beginning of the photon integration
      of each image
    annotations:
      dd_type_name: camera_x_rays_frame
      dd_path: camera_x_rays/frame
      fyo_lift: time_slice
    attributes:
      counts_n:
        range: integer
        multivalued: true
        description: 'Number of counts detected on each pixel during one exposure time. First dimension
          : line index (horizontal axis). Second dimension: column index (vertical axis).'
        annotations:
          dd_type: dynamic
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
