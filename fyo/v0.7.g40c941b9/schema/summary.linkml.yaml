    attributes:
      frequency:
        range: SummaryDynamicFlt1dRoot
        description: ICRH frequency
        annotations:
          dd_units: Hz
      position:
        range: SummaryDynamicFlt1dRoot
        description: Position of the maximum of the ICRH power deposition, in rho_tor_norm
        annotations:
          dd_units: '1'
      n_phi:
        range: SummaryDynamicInt1dRoot
        description: Main toroidal mode number of IC waves. The wave vector toroidal component is defined
          as k_phi = n_phi grad phi where phi is the toroidal angle so that a positive n_tor means a wave
          propagating in the positive phi direction
      k_perpendicular:
        range: SummaryDynamicFlt1dRoot
        description: Main perpendicular wave number of IC waves
        annotations:
          dd_units: m^-1
      e_field_plus_minus_ratio:
        range: SummaryDynamicFlt1dRoot
        description: Average E+/E- power ratio of IC waves
        annotations:
          dd_units: '1'
      harmonic:
        range: SummaryDynamicInt1dRoot
        description: Harmonic number of the absorbed ICRH waves
      phase:
        range: SummaryDynamicFlt1dRoot
        description: Phase between straps
        annotations:
          dd_units: rad
      power:
        range: SummaryDynamicFlt1dRoot
        description: IC heating power coupled to the plasma from this launcher
        annotations:
          dd_units: W
      power_launched:
        range: SummaryDynamicFlt1dRoot
        description: IC heating power launched into the vacuum vessel from this launcher
        annotations:
          dd_units: W
      current:
        range: SummaryDynamicFlt1dRoot
        description: Parallel current driven by IC waves
        annotations:
          dd_units: A
      energy_fast:
