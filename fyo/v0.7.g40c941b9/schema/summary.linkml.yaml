id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/summary
name: fyo-summary
title: fyo IDS `summary` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `summary` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/summary/dd_summary.xsd (import ancestry)
  fyo_category: metadata
  fyo_root_class: Summary
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Summary:
    is_a: IDS
    description: Summary of physics quantities from a simulation or an experiment. Dynamic quantities
      are either taken at given time slices (indicated in the "time" vector) or time-averaged over an
      interval (in such case the "time_width" of the interval is indicated and the "time" vector represents
      the end of each time interval).
    annotations:
      dd_path: summary
      fyo_category: metadata
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      type:
        range: Identifier
        description: Type of data contained in the dataset
      machine:
        range: string
        description: Name of the experimental device to which this data is related (if relevant)
        annotations:
          dd_type: constant
      pulse:
        range: integer
        description: Pulse number to which this data is related (if relevant)
        annotations:
          dd_type: constant
      pulse_time_begin:
        range: string
        description: 'Date and time (UTC) at which the pulse started on the experiment (if relevant),
          expressed in a human readable form (ISO 8601) : the format of the string shall be : YYYY-MM-DDTHH:MM:SSZ.
          Example : 2020-07-24T14:19:00Z'
        annotations:
          dd_type: constant
      pulse_time_begin_epoch:
        range: SummaryEpochTime
        description: 'Time at which the pulse started on the experiment (if relevant), expressed in Unix
          Epoch time represented as two integers: seconds, plus additionally elapsed nanoseconds'
      pulse_time_end_epoch:
        range: SummaryEpochTime
        description: 'Time at which the pulse ended on the experiment (if relevant), expressed in Unix
          Epoch time represented as two integers: seconds, plus additionally elapsed nanoseconds'
      pulse_processing_time_begin:
        range: string
        description: 'For experimental processed data, date and time (UTC) at which the pulse data processing
          started on the experiment (if relevant), expressed in a human readable form (ISO 8601) : the
          format of the string shall be : YYYY-MM-DDTHH:MM:SSZ. Example : 2020-07-24T14:19:00Z'
        annotations:
          dd_type: constant
      description:
        range: string
        description: Description of the simulation or the pulse
        annotations:
          dd_type: constant
      simulation:
        range: SummarySimulation
        description: Description of the general characteristics of the simulation, if this dataset has
          been produced by a simulation
      tag:
        range: EntryTag
        description: Tag qualifying this data entry (or a list of data entries)
      configuration:
        range: SummaryStaticStr0d
        description: Device configuration (the content may be device-specific)
      magnetic_shear_flag:
        range: SummaryStaticInt0d
        description: 'Magnetic field shear indicator for stellarators: 0 for shearless stellarators (W7-A,
          W7-AS, W7-X); 1, otherwise. See [Stroth U. et al 1996 Nucl. Fusion 36 1063]'
      stationary_phase_flag:
        range: SummaryDynamicInt1dRoot
        description: This flag is set to one if the pulse is in a stationary phase from the point of the
          of the energy content (if the time derivative of the energy dW/dt can be neglected when calculating
          tau_E as W/(P_abs-dW/dt).)
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      composition:
        range: SummarySpeciesConstant
        description: Ratios of the volume-averaged density (inside LCFS) of each ion species to the volume-averaged
          electron density, taken at the time of maximum electron density during the pulse
        annotations:
          dd_units: '1'
      global_quantities:
        range: SummaryGlobalQuantities
        description: Various global quantities derived from the profiles
      local:
        range: SummaryLocal
        description: Plasma parameter values at different locations
      boundary:
        range: SummaryBoundary
        description: Description of the plasma boundary
      pedestal_fits:
        range: SummaryPedestalFits
        description: Quantities derived from specific fits of pedestal profiles, typically used in the
          Pedestal Database.
      line_average:
        range: SummaryAverageQuantities
        description: Line average plasma parameters
      volume_average:
        range: SummaryAverageQuantities
        description: Volume-averaged plasma parameters (averaged over the confined plasma volume, i.e.
          inside the LCFS)
      disruption:
        range: SummaryDisruption
        description: Disruption characteristics, if the pulse is terminated by a disruption
      elms:
        range: SummaryElms
        description: Edge Localized Modes related quantities
      fusion:
        range: SummaryFusion
        description: Fusion reactions
      gas_injection_rates:
        range: SummaryGasInjection
        description: Gas injection rates in equivalent electrons.s^-1
        annotations:
          dd_units: s^-1
      gas_injection_accumulated:
        range: SummaryGasInjectionAccumulated
        description: Accumulated injected gas since the plasma breakdown in equivalent electrons
        annotations:
          dd_units: '1'
      gas_injection_prefill:
        range: SummaryGasInjectionPrefill
        description: Accumulated injected gas during the prefill in equivalent electrons
        annotations:
          dd_units: '1'
      heating_current_drive:
        range: SummaryHCd
        description: Heating and current drive parameters
      kicks:
        range: SummaryKicks
        description: Vertical kicks of the plasma position
      pellets:
        range: SummaryPellets
        description: Pellet related quantities
      rmps:
        range: SummaryRmp
        description: Resonant magnetic perturbations related quantities
      runaways:
        range: SummaryRunaways
        description: Runaway electrons
      scrape_off_layer:
        range: SummarySol
        description: Scrape-Off-Layer (SOL) characteristics
      wall:
        range: SummaryWall
        description: Wall characteristics
      limiter:
        range: SummaryLimiter
        description: Limiter characteristics
      time_breakdown:
        range: SummaryConstantFlt0d
        description: Time of the plasma breakdown
        annotations:
          dd_units: s
      plasma_duration:
        range: SummaryConstantFlt0d
        description: Duration of existence of a confined plasma during the pulse
        annotations:
          dd_units: s
      time_width:
        range: float
        multivalued: true
        description: In case the time-dependent quantities of this IDS are averaged over a time interval,
          this node is the width of this time interval (empty otherwise). By convention, the time interval
          starts at time-time_width and ends at time.
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SummaryEpochTime:
    is_a: InformationContentEntity
    description: 'Time at which the pulse started on the experiment (if relevant), expressed in Unix Epoch
      time represented as two integers: seconds, plus additionally elapsed nanoseconds'
    annotations:
      dd_type_name: summary_epoch_time
      dd_path: summary/pulse_time_begin_epoch
    attributes:
      seconds:
        range: integer
        description: Elapsed seconds since the Unix Epoch time (01/01/1970 00:00:00 UTC)
        annotations:
          dd_type: constant
      nanoseconds:
        range: integer
        description: Elapsed nanoseconds since Unix Epoch time in seconds
        annotations:
          dd_type: constant
  SummarySimulation:
    is_a: InformationContentEntity
    description: Description of the general characteristics of the simulation, if this dataset has been
      produced by a simulation
    annotations:
      dd_type_name: summary_simulation
      dd_path: summary/simulation
    attributes:
      time_begin:
        range: float
        description: Start time (relative to the beginning of the pulse)
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time_step:
        range: float
        description: Time interval between main steps, e.g. storage step (if relevant and constant)
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time_end:
        range: float
        description: Stop time (relative to the beginning of the pulse)
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      workflow:
        range: string
        description: Description of the workflow which has been used to produce this data entry
        annotations:
          dd_type: constant
  EntryTag:
    is_a: InformationContentEntity
    description: Tag qualifying this data entry (or a list of data entries)
    annotations:
      dd_type_name: entry_tag
      dd_path: summary/tag
    attributes:
      name:
        range: string
        description: Name of the tag
        annotations:
          dd_type: constant
      comment:
        range: string
        description: Any comment describing the content of the tagged list of entries
        annotations:
          dd_type: constant
  SummaryStaticStr0d:
    is_a: InformationContentEntity
    description: Device configuration (the content may be device-specific)
    annotations:
      dd_type_name: summary_static_str_0d
      dd_path: summary/configuration
    attributes:
      value:
        range: string
        description: Value
        annotations:
          dd_type: static
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummaryStaticInt0d:
    is_a: InformationContentEntity
    description: 'Magnetic field shear indicator for stellarators: 0 for shearless stellarators (W7-A,
      W7-AS, W7-X); 1, otherwise. See [Stroth U. et al 1996 Nucl. Fusion 36 1063]'
    annotations:
      dd_type_name: summary_static_int_0d
      dd_path: summary/magnetic_shear_flag
    attributes:
      value:
        range: integer
        description: Value
        annotations:
          dd_type: static
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummaryDynamicInt1dRoot:
    is_a: InformationContentEntity
    description: This flag is set to one if the pulse is in a stationary phase from the point of the of
      the energy content (if the time derivative of the energy dW/dt can be neglected when calculating
      tau_E as W/(P_abs-dW/dt).)
    annotations:
      dd_type_name: summary_dynamic_int_1d_root
      dd_path: summary/stationary_phase_flag
    attributes:
      value:
        range: integer
        multivalued: true
        description: Value
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummarySpeciesConstant:
    is_a: InformationContentEntity
    description: Ratios of the volume-averaged density (inside LCFS) of each ion species to the volume-averaged
      electron density, taken at the time of maximum electron density during the pulse
    annotations:
      dd_type_name: summary_species_constant
      dd_path: summary/composition
    attributes:
      hydrogen:
        range: SummaryConstantFlt0d2
        description: Hydrogen (H)
      deuterium:
        range: SummaryConstantFlt0d2
        description: Deuterium (D)
      tritium:
        range: SummaryConstantFlt0d2
        description: Tritium (T)
      deuterium_tritium:
        range: SummaryConstantFlt0d2
        description: Fictitious DT single species with mass 2.5, used in some simulations
      helium_3:
        range: SummaryConstantFlt0d2
        description: Helium isotope with 3 nucleons (3He)
      helium_4:
        range: SummaryConstantFlt0d2
        description: Helium isotope with 4 nucleons (4He)
      beryllium:
        range: SummaryConstantFlt0d2
        description: Beryllium (Be)
      boron:
        range: SummaryConstantFlt0d2
        description: Boron (B)
      lithium:
        range: SummaryConstantFlt0d2
        description: Lithium (Li)
      carbon:
        range: SummaryConstantFlt0d2
        description: Carbon (C)
      nitrogen:
        range: SummaryConstantFlt0d
        description: Nitrogen (N)
      neon:
        range: SummaryConstantFlt0d2
        description: Neon (Ne)
      argon:
        range: SummaryConstantFlt0d2
        description: Argon (Ar)
      xenon:
        range: SummaryConstantFlt0d2
        description: Xenon (Xe)
      oxygen:
        range: SummaryConstantFlt0d2
        description: Oxygen (O)
      tungsten:
        range: SummaryConstantFlt0d2
        description: Tungsten (W)
      iron:
        range: SummaryConstantFlt0d2
        description: Iron (Fe)
      krypton:
        range: SummaryConstantFlt0d2
        description: Krypton (Kr)
  SummaryConstantFlt0d2:
    is_a: InformationContentEntity
    description: Hydrogen (H)
    annotations:
      dd_type_name: summary_constant_flt_0d_2
      dd_path: summary/composition/hydrogen
    attributes:
      value:
        range: float
        description: Value
        annotations:
          dd_type: constant
          dd_units: as_parent_level_2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummaryConstantFlt0d:
    is_a: InformationContentEntity
    description: Nitrogen (N)
    annotations:
      dd_type_name: summary_constant_flt_0d
      dd_path: summary/composition/nitrogen
    attributes:
      value:
        range: float
        description: Value
        annotations:
          dd_type: constant
          dd_units: as_parent
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummaryGlobalQuantities:
    is_a: InformationContentEntity
    description: Various global quantities derived from the profiles
    annotations:
      dd_type_name: summary_global_quantities
      dd_path: summary/global_quantities
    attributes:
      ip:
        range: SummaryDynamicFlt1dRoot
        description: Total plasma current (toroidal component). Positive sign means anti-clockwise when
          viewed from above.
        annotations:
          dd_units: A
      current_non_inductive:
        range: SummaryDynamicFlt1dRoot
        description: Total non-inductive current (toroidal component). Positive sign means anti-clockwise
          when viewed from above.
        annotations:
          dd_units: A
      current_bootstrap:
        range: SummaryDynamicFlt1dRoot
        description: Bootstrap current (toroidal component). Positive sign means anti-clockwise when viewed
          from above.
        annotations:
          dd_units: A
      current_ohm:
        range: SummaryDynamicFlt1dRoot
        description: Ohmic current (toroidal component). Positive sign means anti-clockwise when viewed
          from above.
        annotations:
          dd_units: A
      current_alignment:
        range: SummaryDynamicFlt1dRoot
        description: 'Figure of merit of the alignment of the current profile sources, defined in the
          following reference: http://iopscience.iop.org/article/10.1088/0029-5515/43/7/318'
        annotations:
          dd_units: A
      v_loop:
        range: SummaryDynamicFlt1dRoot
        description: LCFS loop voltage (positive value drives positive ohmic current that flows anti-clockwise
          when viewed from above)
        annotations:
          dd_units: V
      li_3:
        range: SummaryDynamicFlt1dRoot
        description: Internal inductance. The li_3 definition is used, i.e. li_3 = 2/R0/mu0^2/Ip^2 * int(Bp^2
          dV).
        annotations:
          dd_units: '1'
      li_3_mhd:
        range: SummaryDynamicFlt1dRoot
        description: Internal inductance as determined by an equilibrium reconstruction code. Use this
          only when the li node above is used for another estimation method and there is a need to store
          a second value of li (determined by an equilibrium reconstruction code). The li_3 definition
          is used, i.e. li_3 = 2/R0/mu0^2/Ip^2 * int(Bp^2 dV).
        annotations:
          dd_units: '1'
      beta_tor:
        range: SummaryDynamicFlt1dRoot
        description: Toroidal beta, defined as the volume-averaged total perpendicular pressure divided
          by (B0^2/(2*mu0)), i.e. beta_toroidal = 2 mu0 int(p dV) / V / B0^2
        annotations:
          dd_units: '1'
      beta_tor_mhd:
        range: SummaryDynamicFlt1dRoot
        description: Toroidal beta, using the pressure determined by an equilibrium reconstruction code
        annotations:
          dd_units: '1'
      beta_tor_norm:
        range: SummaryDynamicFlt1dRoot
        description: Normalized toroidal beta, defined as 100 * beta_tor * a[m] * B0 [T] / ip [MA]
        annotations:
          dd_units: '1'
      beta_tor_norm_mhd:
        range: SummaryDynamicFlt1dRoot
        description: Normalized toroidal beta, using the pressure determined by an equilibrium reconstruction
          code
        annotations:
          dd_units: '1'
      beta_tor_thermal_norm:
        range: SummaryDynamicFlt1dRoot
        description: Normalized toroidal beta from thermal pressure only, defined as 100 * beta_tor_thermal
          * a[m] * B0 [T] / ip [MA]
        annotations:
          dd_units: '1'
      beta_pol:
        range: SummaryDynamicFlt1dRoot
        description: Poloidal beta. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
        annotations:
          dd_units: '1'
      beta_pol_mhd:
        range: SummaryDynamicFlt1dRoot
        description: Poloidal beta estimated from the pressure determined by an equilibrium reconstruction
          code. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
        annotations:
          dd_units: '1'
      energy_diamagnetic:
        range: SummaryDynamicFlt1dRoot
        description: Plasma diamagnetic energy content = 3/2 * integral over the plasma volume of the
          total perpendicular pressure
        annotations:
          dd_units: J
      denergy_diamagnetic_dt:
        range: SummaryDynamicFlt1dRoot
        description: Time derivative of the diamagnetic plasma energy content
        annotations:
          dd_units: W
      energy_total:
        range: SummaryDynamicFlt1dRoot
        description: Plasma energy content = 3/2 * integral over the plasma volume of the total kinetic
          pressure
        annotations:
          dd_units: J
      energy_mhd:
        range: SummaryDynamicFlt1dRoot
        description: Plasma energy content = 3/2 * integral over the plasma volume of the total kinetic
          pressure (pressure determined by an equilibrium reconstruction code)
        annotations:
          dd_units: J
      energy_thermal:
        range: SummaryDynamicFlt1dRoot
        description: Thermal plasma energy content = 3/2 * integral over the plasma volume of the thermal
          pressure
        annotations:
          dd_units: J
      energy_ion_total_thermal:
        range: SummaryDynamicFlt1dRoot
        description: Thermal ion plasma energy content (sum over the ion species) = 3/2 * integral over
          the plasma volume of the thermal ion pressure
        annotations:
          dd_units: J
      energy_electrons_thermal:
        range: SummaryDynamicFlt1dRoot
        description: Thermal electron plasma energy content = 3/2 * integral over the plasma volume of
          the thermal electron pressure
        annotations:
          dd_units: J
      denergy_thermal_dt:
        range: SummaryDynamicFlt1dRoot
        description: Time derivative of the thermal plasma energy content
        annotations:
          dd_units: W
      energy_b_field_pol:
        range: SummaryDynamicFlt1dRoot
        description: Poloidal magnetic plasma energy content = 1/(2.mu0) * integral over the plasma volume
          of b_field_pol^2
        annotations:
          dd_units: J
      energy_fast_perpendicular:
        range: SummaryDynamicFlt1dRoot
        description: Fast particles perpendicular energy content = 3/2 * integral over the plasma volume
          of the fast perpendicular pressure
        annotations:
          dd_units: J
      energy_fast_parallel:
        range: SummaryDynamicFlt1dRoot
        description: Fast particles parallel energy content = 3/2 * integral over the plasma volume of
          the fast parallel pressure
        annotations:
          dd_units: J
      volume:
        range: SummaryDynamicFlt1dRoot
        description: Volume of the confined plasma
        annotations:
          dd_units: m^3
      h_mode:
        range: SummaryDynamicInt1dRoot
        description: 'H-mode flag: 0 when the plasma is in L-mode and 1 when in H-mode'
      r0:
        range: SummaryConstantFlt0d
        description: Reference major radius where the vacuum toroidal magnetic field is given (usually
          a fixed position such as the middle of the vessel at the equatorial midplane)
        annotations:
          dd_units: m
      b0:
        range: SummaryDynamicFlt1dRoot
        description: Vacuum toroidal field at R0. Positive sign means anti-clockwise when viewed from
          above. The product R0B0 must be consistent with the b_tor_vacuum_r field of the tf IDS.
        annotations:
          dd_units: T
      fusion_gain:
        range: SummaryDynamicFlt1dRoot
        description: 'Fusion gain : ratio of the power provided by fusion reactions to the auxiliary power
          needed to heat the plasma. Often noted as Q in the litterature.'
        annotations:
          dd_units: '1'
      h_98:
        range: SummaryDynamicFlt1dRoot
        description: Energy confinement time enhancement factor over the IPB98(y,2) scaling
        annotations:
          dd_units: '1'
      tau_energy:
        range: SummaryDynamicFlt1dRoot
        description: Energy confinement time
        annotations:
          dd_units: s
      tau_helium:
        range: SummaryDynamicFlt1dRoot
        description: Helium confinement time
        annotations:
          dd_units: s
      tau_resistive:
        range: SummaryDynamicFlt1dRoot
        description: Current diffusion characteristic time
        annotations:
          dd_units: s
      tau_energy_98:
        range: SummaryDynamicFlt1dRoot
        description: Energy confinement time estimated from the IPB98(y,2) scaling
        annotations:
          dd_units: s
      ratio_tau_helium_fuel:
        range: SummaryDynamicFlt1dRoot
        description: Ratio of Helium confinement time to fuel confinement time
        annotations:
          dd_units: '1'
      resistance:
        range: SummaryDynamicFlt1dRoot
        description: Plasma electric resistance
        annotations:
          dd_units: ohm
      q_95:
        range: SummaryDynamicFlt1dRoot
        description: q at the 95% poloidal flux surface (only positive when toroidal current and magnetic
          field are in same direction)
        annotations:
          dd_units: '1'
      power_ohm:
        range: SummaryDynamicFlt1dRoot
        description: Ohmic power
        annotations:
          dd_units: W
      power_steady:
        range: SummaryDynamicFlt1dRoot
        description: Total power coupled to the plasma minus dW/dt (correcting from transient energy content)
        annotations:
          dd_units: W
      power_radiated:
        range: SummaryDynamicFlt1dRoot
        description: Total radiated power
        annotations:
          dd_units: W
      power_radiated_inside_lcfs:
        range: SummaryDynamicFlt1dRoot
        description: Radiated power from the plasma inside the Last Closed Flux Surface
        annotations:
          dd_units: W
      power_radiated_outside_lcfs:
        range: SummaryDynamicFlt1dRoot
        description: Radiated power from the plasma outside the Last Closed Flux Surface
        annotations:
          dd_units: W
      power_line:
        range: SummaryDynamicFlt1dRoot
        description: Radiated power from line radiation
        annotations:
          dd_units: W
      power_bremsstrahlung:
        range: SummaryDynamicFlt1dRoot
        description: Radiated power from Bremsstrahlung
        annotations:
          dd_units: W
      power_synchrotron:
        range: SummaryDynamicFlt1dRoot
        description: Radiated power from synchrotron radiation
        annotations:
          dd_units: W
      power_loss:
        range: SummaryDynamicFlt1dRoot
        description: Power through separatrix
        annotations:
          dd_units: W
      greenwald_fraction:
        range: SummaryDynamicFlt1dRoot
        description: Greenwald fraction =line_average/n_e/value divided by (global_quantities/ip/value
          *1e6 * pi * minor_radius^2)
        annotations:
          dd_units: '1'
      fusion_fluence:
        range: SummaryDynamicFlt1dRoot
        description: 'Fusion fluence : power provided by fusion reactions, integrated over time since
          the beginning of the pulse'
        annotations:
          dd_units: J
      psi_external_average:
        range: SummaryDynamicFlt1dRoot
        description: 'Average (over the plasma poloidal cross section) plasma poloidal magnetic flux produced
          by all toroidal loops (active coils and passive loops) but the plasma, given by the following
          formula : int(psi_loops.j_tor.dS) / Ip'
        annotations:
          dd_units: Wb
  SummaryDynamicFlt1dRoot:
    is_a: InformationContentEntity
    description: Total plasma current (toroidal component). Positive sign means anti-clockwise when viewed
      from above.
    annotations:
      dd_type_name: summary_dynamic_flt_1d_root
