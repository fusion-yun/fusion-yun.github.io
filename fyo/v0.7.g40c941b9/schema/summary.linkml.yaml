  SummaryDisruption:
    is_a: InformationContentEntity
    description: Disruption characteristics, if the pulse is terminated by a disruption
    annotations:
      dd_type_name: summary_disruption
      dd_path: summary/disruption
    attributes:
      time:
        range: SummaryConstantFlt0d
        description: Time of the disruption =  min(t_TQ, t_VDE), where t_TQ and t_VDE are the times at
          which the Thermal Quench (TQ) and the Vertical Displacement Event (VDE) are detected by their
          respective detectors
        annotations:
          dd_units: s
      time_predisruption:
        range: SummaryConstantFlt0d
        description: Pre-disruption time = disruption.time - t_pre, where t_pre[s] is approximately given
          by 0.0025 * R0[m]^2 and R0 is the major radius where the toroidal field is defined (../../global_quantities/r0)
        annotations:
          dd_units: s
      time_radiated_power_max:
        range: SummaryConstantFlt0d
        description: Time of maximum radiated power, relative to the time of the disruption
        annotations:
          dd_units: s
      time_half_ip:
        range: SummaryConstantFlt0d
        description: Time at which the plasma current has fallen to half of the initial current at the
          start of the disruption, relative to the time of the disruption
        annotations:
          dd_units: s
      vertical_displacement:
        range: SummaryConstantInt0d
        description: Direction of the plasma vertical displacement just before the disruption 1 (upwards)
          / 0 (no displacement)/ -1 (downwards)
        annotations:
          dd_units: s
      mitigation_valve:
        range: SummaryConstantInt0d
        description: Flag indicating whether any disruption mitigation valve has been used (1) or none
          (0)
      decay_times:
        range: SummaryDisruptionDecay
        description: Characteristic decay times describing the loss of different quantities during the
          disruption
      halo_current:
        range: SummaryHalo
        description: Characteristics of halo current
      type:
        range: Identifier
        description: Type of the disruption
  SummaryConstantInt0d:
    is_a: InformationContentEntity
    description: Direction of the plasma vertical displacement just before the disruption 1 (upwards)
      / 0 (no displacement)/ -1 (downwards)
    annotations:
      dd_type_name: summary_constant_int_0d
      dd_path: summary/disruption/vertical_displacement
    attributes:
      value:
        range: integer
        description: Value
        annotations:
          dd_type: constant
      source:
        range: string
        description: 'Source of the data (any comment describing the origin of the data : code, path to
          diagnostic signals, processing method, ...)'
        annotations:
          dd_type: constant
  SummaryDisruptionDecay:
    is_a: InformationContentEntity
    description: Characteristic decay times describing the loss of different quantities during the disruption
    annotations:
      dd_type_name: summary_disruption_decay
      dd_path: summary/disruption/decay_times
    attributes:
      ip:
        range: SummaryDisruptionDecayTimes
        description: Total toroidal plasma current (including runaway electrons and halo currents)
      current_runaways:
        range: SummaryDisruptionDecayTimes
        description: Total toroidal current carried by runaway electrons
      t_e_volume_average:
        range: SummaryDisruptionDecayTimes
        description: Volume average electron temperature
      t_e_magnetic_axis:
        range: SummaryDisruptionDecayTimes
        description: Electron temperature at the magnetic axis
      energy_thermal:
        range: SummaryDisruptionDecayTimes
        description: Thermal plasma energy content = 3/2 * integral over the plasma volume of the thermal
          pressure
  SummaryDisruptionDecayTimes:
    is_a: InformationContentEntity
    description: Total toroidal plasma current (including runaway electrons and halo currents)
    annotations:
      dd_type_name: summary_disruption_decay_times
      dd_path: summary/disruption/decay_times/ip
    attributes:
      linear_20_80:
        range: SummaryConstantFlt0d
        description: Decay time defined as (t(0.2)-t(0.8))/0.6, where t(X) corresponds to the time where
          this quantity reaches X*100% of its pre-disruptive value
        annotations:
          dd_units: s
      linear_custom:
        range: SummaryDisruptionDecayLinear
        description: Decay time defined as (t(X2)-t(X1))/(X1-X2), where t(Xj) corresponds to the time
          where this quantity reaches Xj*100% of its pre-disruptive value
      exponential:
        range: SummaryConstantFlt0d
        description: Exponential decay time (tau) used when the process is described by an exponential
          function (exp(-(t-t0)/tau))). Here "t" is time and "t0" is the time where the decay process
          starts
        annotations:
          dd_units: s
  SummaryDisruptionDecayLinear:
    is_a: InformationContentEntity
    description: Decay time defined as (t(X2)-t(X1))/(X1-X2), where t(Xj) corresponds to the time where
      this quantity reaches Xj*100% of its pre-disruptive value
    annotations:
      dd_type_name: summary_disruption_decay_linear
      dd_path: summary/disruption/decay_times/ip/linear_custom
    attributes:
      x1:
        range: float
        description: User-defined parameter, see description of linear_custom
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2:
        range: float
        description: User-defined value, see description of linear_custom
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      decay_time:
