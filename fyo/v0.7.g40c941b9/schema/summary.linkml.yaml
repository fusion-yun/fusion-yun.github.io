  SummaryPedestalFitStability:
    is_a: InformationContentEntity
    description: MHD stability analysis of the pedestal (for this fit of the profiles)
    annotations:
      dd_type_name: summary_pedestal_fit_stability
      dd_path: summary/pedestal_fits/mtanh/stability
    attributes:
      alpha_experimental:
        range: SummaryDynamicFlt1dRoot
        description: Experimental normalized pressure gradient reconstructed by an MHD stability code
          (with assumptions on the ion pressure). See definition in [Miller PoP 5 (1998),973,Eq. 42]
        annotations:
          dd_units: '1'
      bootstrap_current_sauter:
        range: SummaryPedestalFitStabilityMethod
        description: MHD calculations of the critical alpha parameter using the Sauter formula for the
          calculation of the bootstrap current, from Phys. Plasmas 6 (1999) 2834
      bootstrap_current_hager:
        range: SummaryPedestalFitStabilityMethod
        description: MHD calculations of the critical alpha parameter using the Hager formula for the
          calculation of the bootstrap current, from Phys. Plasmas 23 (2016) 042503
  SummaryPedestalFitStabilityMethod:
    is_a: InformationContentEntity
    description: MHD calculations of the critical alpha parameter using the Sauter formula for the calculation
      of the bootstrap current, from Phys. Plasmas 6 (1999) 2834
    annotations:
      dd_type_name: summary_pedestal_fit_stability_method
      dd_path: summary/pedestal_fits/mtanh/stability/bootstrap_current_sauter
    attributes:
      alpha_critical:
        range: SummaryDynamicFlt1dRoot
        description: Critical normalized pressure gradient determined with self-consistent runs with an
          MHD stability code. Details of the method for scanning parameters in the series of runs must
          be described in the 'source' node
        annotations:
          dd_units: '1'
      alpha_ratio:
        range: SummaryDynamicFlt1dRoot
        description: Ratio of alpha_critical over alpha_experimental
        annotations:
          dd_units: '1'
      t_e_pedestal_top_critical:
        range: SummaryDynamicFlt1dRoot
        description: Critical electron temperature at pedestal top determined with self-consistent runs
          with an MHD stability code. Details of the method for scanning parameters in the series of runs
