  SummaryHCd:
    is_a: InformationContentEntity
    description: Heating and current drive parameters
    annotations:
      dd_type_name: summary_h_cd
      dd_path: summary/heating_current_drive
    attributes:
      ec:
        range: SummaryHCdEc
        multivalued: true
        description: Set of ECRH/ECCD launchers
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
      nbi:
        range: SummaryHCdNbi
        multivalued: true
        description: Set of NBI units
        annotations:
          dd_max_occurs: '32'
          dd_coordinate1: 1...N
      ic:
        range: SummaryHCdIc
        multivalued: true
        description: Set of ICRH launchers
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
      lh:
        range: SummaryHCdLh
        multivalued: true
        description: Set of LHCD launchers
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
      power_ec:
        range: SummaryDynamicFlt1dRoot
        description: Total EC power coupled to the plasma
        annotations:
          dd_units: W
      power_launched_ec:
        range: SummaryDynamicFlt1dRoot
        description: Total EC power launched from EC launchers into the vacuum vessel
        annotations:
          dd_units: W
      power_nbi:
        range: SummaryDynamicFlt1dRoot
        description: Total NBI power coupled to the plasma
        annotations:
          dd_units: W
      power_launched_nbi:
        range: SummaryDynamicFlt1dRoot
        description: Total NBI power launched from neutral beam injectors into the vacuum vessel
        annotations:
          dd_units: W
      power_launched_nbi_co_injected_ratio:
        range: SummaryDynamicFlt1dRoot
        description: Ratio of co-injected beam launched power to total NBI launched power. Is set to 1
          for purely perpendicular injection
        annotations:
          dd_units: '1'
      power_ic:
        range: SummaryDynamicFlt1dRoot
        description: Total IC power coupled to the plasma
        annotations:
          dd_units: W
      power_launched_ic:
        range: SummaryDynamicFlt1dRoot
        description: Total IC power launched from IC antennas into the vacuum vessel
        annotations:
          dd_units: W
      power_lh:
        range: SummaryDynamicFlt1dRoot
        description: Total LH power coupled to the plasma
        annotations:
          dd_units: W
      power_launched_lh:
        range: SummaryDynamicFlt1dRoot
        description: Total LH power launched from LH antennas into the vacuum vessel
        annotations:
          dd_units: W
      power_additional:
        range: SummaryDynamicFlt1dRoot
        description: Total additional external power (NBI+EC+IC+LH, without ohmic) coupled to the plasma
        annotations:
          dd_units: W
  SummaryHCdEc:
    is_a: InformationContentEntity
    description: Set of ECRH/ECCD launchers
    annotations:
      dd_type_name: summary_h_cd_ec
      dd_path: summary/heating_current_drive/ec
    attributes:
      frequency:
        range: SummaryDynamicFlt1dRoot
        description: ECRH frequency
        annotations:
          dd_units: Hz
      position:
        range: SummaryDynamicFlt1dRoot
        description: Position of the maximum of the ECRH power deposition, in rho_tor_norm
        annotations:
          dd_units: '1'
      polarization:
        range: SummaryDynamicInt1dRoot
        description: Polarization of the ECRH waves (0 = O mode, 1 = X mode)
      harmonic:
        range: SummaryDynamicInt1dRoot
        description: Harmonic number of the absorbed ECRH waves
      phi:
        range: SummaryDynamicFlt1dRoot
        description: Toroidal angle of ECRH at resonance
        annotations:
          dd_units: rad
      angle_pol:
        range: SummaryDynamicFlt1dRoot
        description: Poloidal angle of ECRH at resonance
        annotations:
          dd_units: rad
      power:
        range: SummaryDynamicFlt1dRoot
        description: Electron cyclotron heating power coupled to the plasma from this launcher
        annotations:
          dd_units: W
      power_launched:
        range: SummaryDynamicFlt1dRoot
        description: Electron cyclotron heating power launched into the vacuum vessel from this launcher
        annotations:
          dd_units: W
      current:
        range: SummaryDynamicFlt1dRoot
        description: Parallel current driven by EC waves
        annotations:
          dd_units: A
      energy_fast:
        range: SummaryDynamicFlt1dRoot
        description: Fast particle energy content driven by EC waves
        annotations:
          dd_units: J
  SummaryHCdNbi:
    is_a: InformationContentEntity
    description: Set of NBI units
    annotations:
      dd_type_name: summary_h_cd_nbi
      dd_path: summary/heating_current_drive/nbi
    attributes:
      species:
        range: SummaryPlasmaCompositionSpecies
        description: Injected species
      power:
        range: SummaryDynamicFlt1dRoot
        description: NBI power coupled to the plasma by this unit (i.e. without shine-through and fast
          ion losses)
        annotations:
          dd_units: W
      power_launched:
        range: SummaryDynamicFlt1dRoot
        description: NBI power launched into the vacuum vessel from this unit
        annotations:
          dd_units: W
      current:
        range: SummaryDynamicFlt1dRoot
        description: Parallel current driven by this NBI unit
        annotations:
          dd_units: A
      position:
        range: SummaryRphiz0dStatic
        description: R, Z, Phi position of the NBI unit centre
      tangency_radius:
        range: SummaryStaticFlt0d
        description: Tangency radius (major radius where the central line of a NBI unit is tangent to
          a circle around the torus)
        annotations:
          dd_units: m
      angle:
        range: SummaryStaticFlt0d
        description: Angle of inclination between a beamlet at the centre of the injection unit surface
          and the horizontal plane
        annotations:
          dd_units: rad
      direction:
        range: SummaryStaticInt0d
        description: 'Direction of the beam seen from above the torus: -1 = clockwise; 1 = counter clockwise'
      energy:
        range: SummaryDynamicFlt1dRoot
        description: Full energy of the injected species (acceleration of a single atom)
        annotations:
          dd_units: eV
      beam_current_fraction:
        range: SummaryDynamicFlt2dFraction2
        description: 'Fractions of beam current distributed among the different energies, the first index
          corresponds to the fast neutrals energy (1:full, 2: half, 3: one third)'
        annotations:
          dd_units: '1'
      beam_power_fraction:
        range: SummaryDynamicFlt2dFraction2
        description: 'Fractions of beam power distributed among the different energies, the first index
          corresponds to the fast neutrals energy (1:full, 2: half, 3: one third)'
        annotations:
          dd_units: '1'
  SummaryPlasmaCompositionSpecies:
    is_a: InformationContentEntity
    description: Injected species
