        range: float
        multivalued: true
        description: Poloidal magnetic flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../../../time
          spo_class: spo:Signal
          fyo_lift: signal
      r:
        range: float
        multivalued: true
