id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/ic_antennas
name: fyo-ic_antennas
title: fyo IDS `ic_antennas` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `ic_antennas` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/ic_antennas/dd_ic_antennas.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: IcAntennas
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  IcAntennas:
    is_a: IDS
    description: Antenna systems for heating and current drive in the ion cyclotron (IC) frequencies.
    annotations:
      dd_path: ic_antennas
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      reference_point:
        range: Rz0dConstant
        description: Reference point used to define the poloidal angle, e.g. the geometrical centre of
          the vacuum vessel. Used to define the poloidal mode numbers under antenna/surface_current
      antenna:
        range: IcAntennasAntenna
        multivalued: true
        description: Set of Ion Cyclotron antennas
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      power_launched:
        range: SignalFlt1d
        description: Power launched into the vacuum vessel by the whole ICRH system (sum over antennas)
        annotations:
          dd_units: W
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  IcAntennasAntenna:
    is_a: InformationContentEntity
    description: Set of Ion Cyclotron antennas
    annotations:
      dd_type_name: ic_antennas_antenna
      dd_path: ic_antennas/antenna
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      frequency:
        range: SignalFlt1d
        description: Frequency (average over modules)
        annotations:
          dd_units: Hz
      power_launched:
        range: SignalFlt1d
        description: Power launched from this antenna into the vacuum vessel
        annotations:
          dd_units: W
      power_forward:
        range: SignalFlt1d
        description: Forward power arriving to the back of the antenna
        annotations:
          dd_units: W
      power_reflected:
        range: SignalFlt1d
        description: Reflected power
        annotations:
          dd_units: W
      module:
        range: IcAntennasAntennaModule
        multivalued: true
        description: Set of antenna modules (each module is fed by a single transmission line)
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      surface_current:
        range: IcAntennasSurfaceCurrent
        multivalued: true
        description: Description of the IC surface current on the antenna straps and on passive components,
          for every time slice
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  IcAntennasAntennaModule:
    is_a: InformationContentEntity
    description: Set of antenna modules (each module is fed by a single transmission line)
    annotations:
      dd_type_name: ic_antennas_antenna_module
      dd_path: ic_antennas/antenna/module
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      frequency:
        range: SignalFlt1d
        description: Frequency
        annotations:
          dd_units: Hz
      power_launched:
        range: SignalFlt1d
        description: Power launched from this module into the vacuum vessel
        annotations:
          dd_units: W
      power_forward:
        range: SignalFlt1d
        description: Forward power arriving to the back of the module
        annotations:
          dd_units: W
      power_reflected:
        range: SignalFlt1d
        description: Reflected power
        annotations:
          dd_units: W
      coupling_resistance:
        range: SignalFlt1d
        description: Coupling resistance
        annotations:
          dd_units: ohm
      phase_forward:
        range: SignalFlt1d
        description: Phase of the forward power with respect to the first module
        annotations:
          dd_units: rad
      phase_reflected:
        range: SignalFlt1d
        description: Phase of the reflected power with respect to the forward power of this module
        annotations:
          dd_units: rad
      voltage:
        range: IcAntennasMeasurement
        multivalued: true
        description: Set of voltage measurements
        annotations:
          dd_units: V
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      current:
        range: IcAntennasMeasurement
        multivalued: true
        description: Set of current measurements
        annotations:
          dd_units: A
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      pressure:
        range: IcAntennasMeasurement
        multivalued: true
        description: Set of pressure measurements
        annotations:
          dd_units: Pa
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      matching_element:
        range: IcAntennasMatchingElement
        multivalued: true
        description: Set of matching elements
        annotations:
          dd_units: A
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      strap:
        range: IcAntennasStrap
        multivalued: true
        description: Set of IC antenna straps
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  IcAntennasMeasurement:
    is_a: InformationContentEntity
    description: Set of voltage measurements
    annotations:
      dd_type_name: ic_antennas_measurement
      dd_path: ic_antennas/antenna/module/voltage
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      position:
        range: Rphiz0dStatic
        description: Position of the measurement
      amplitude:
        range: SignalFlt1dUnitsLevel2
        description: Amplitude of the measurement
        annotations:
          dd_units: as_parent
      phase:
        range: SignalFlt1d
        description: Phase of the measurement
        annotations:
          dd_units: rad
  SignalFlt1dUnitsLevel2:
    is_a: InformationContentEntity
    description: Amplitude of the measurement
    annotations:
      dd_type_name: signal_flt_1d_units_level_2
      dd_path: ic_antennas/antenna/module/voltage/amplitude
    attributes:
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: as_parent_level_2
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  IcAntennasMatchingElement:
    is_a: InformationContentEntity
    description: Set of matching elements
    annotations:
      dd_type_name: ic_antennas_matching_element
      dd_path: ic_antennas/antenna/module/matching_element
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: 'Type of the matching element. Index = 1 : capacitor (fill capacitance); Index =
          2 : stub (fill phase)'
      capacitance:
        range: SignalFlt1d
        description: Capacitance of the macthing element
        annotations:
          dd_units: F
      phase:
        range: SignalFlt1d
        description: Phase delay induced by the stub
        annotations:
          dd_units: rad
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
  IcAntennasStrap:
    is_a: InformationContentEntity
    description: Set of IC antenna straps
    annotations:
      dd_type_name: ic_antennas_strap
      dd_path: ic_antennas/antenna/module/strap
    attributes:
      outline:
        range: Rphiz1dStatic
        description: Strap outline
      width_phi:
        range: float
        description: Width of strap in the toroidal direction
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      distance_to_conductor:
        range: float
        description: Distance to conducting wall or other conductor behind the antenna strap
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      geometry:
        range: Outline2dGeometryStatic
        description: Cross-sectional shape of the strap
      current:
        range: SignalFlt1d
        description: Root mean square current flowing along the strap
        annotations:
          dd_units: A
      phase:
        range: SignalFlt1d
        description: Phase of the strap current
        annotations:
          dd_units: rad
  IcAntennasSurfaceCurrent:
    is_a: TimeSlice
    description: Description of the IC surface current on the antenna straps and on passive components,
      for every time slice
    annotations:
      dd_type_name: ic_antennas_surface_current
      dd_path: ic_antennas/antenna/surface_current
      fyo_lift: time_slice
    attributes:
      m_pol:
        range: integer
        multivalued: true
        description: Poloidal mode numbers, used to describe the spectrum of the antenna current. The
          poloidal angle is defined from the reference point; the angle at a point (R,Z) is given by atan((Z-Zref)/(R-Rref)),
          where Rref=reference_point/r and Zref=reference_point/z
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      n_phi:
        range: integer
        multivalued: true
        description: Toroidal mode numbers, used to describe the spectrum of the antenna current. The
          wave vector toroidal component is defined as k_phi = n_phi grad phi where phi is the toroidal
          angle so that a positive n_phi means a wave propagating in the positive phi direction
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      spectrum:
        range: float
        multivalued: true
        description: Spectrum of the total surface current on the antenna strap and passive components
          expressed in poloidal and toroidal modes
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 2
          dd_coordinate1: ../m_pol
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../m_pol,../n_phi
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
