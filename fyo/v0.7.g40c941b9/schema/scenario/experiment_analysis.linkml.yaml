# SPDX-License-Identifier: Apache-2.0
# Scenario S-8 — experiment analysis / inversion (实验分析 / 反演), PRIMARY task.
# Source: FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-8; R109 axis: experiment.
id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/scenario/experiment_analysis
name: fyo-scenario-experiment-analysis
title: "Fyo Scenario S-8 — Experiment Analysis / Inversion (实验分析 / 反演)"
description: >-
  Ontology of the S-8 application-task scenario: INVERSE experiment analysis — the second
  primary task (confronting the model with measurement). Measured diagnostic signals are
  inverted into a plasma configuration / profiles through the unified forward–inference
  framework (FYTOK-REPORT-107): the loss ℒ(θ)=‖F(θ)−d_obs‖²_Σ compares synthetic diagnostics
  against measurement over the SAME forward operator F the prediction task uses; equilibrium /
  profile reconstruction is its linear-Gaussian MAP special case. Outputs are
  reconstructed-modality IDS occurrences.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-scenario
annotations:
  fyo_module: scenario/experiment_analysis
  conops_scenario: S-8
  r109_axis: experiment
  primary_task: "true"
  conops_ref: "FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-8 (reuses S-1 entities + S-5 data + diagnostic geometry operators); FYTOK-REPORT-107"
  maturity: "◐ partial — EAST data access + equilibrium reconstruction (kinetic_reconstruction) working; synthetic-diagnostic forward models at zero, Bayesian posterior / UQ not generalized (gaps G-B2 / G-C1), informative"

classes:

  ExperimentAnalysisTask:
    is_a: ApplicationTask
    description: >-
      An experiment-analysis / inversion run (S-8, primary). FUNCTION: assemble measured
      diagnostic IDS occurrences of one Discharge (via the data-adaptation face, S-5), pose
      the plasma configuration θ as the unknown, and minimize / infer over
      ℒ(θ)=‖F(θ)−d_obs‖²_Σ — where F is the SHARED forward operator composed with the
      diagnostic geometry / response (SyntheticDiagnosticEvaluation) — yielding reconstructed
      equilibrium and profiles with quantified misfit. Direction: inverse (d_obs → θ). The
      inference engine is exchangeable (least-squares / MAP / Bayesian / UQ) over the fixed
      forward spine. Inputs carry modality `measured`; outputs carry modality `reconstructed`
      (measured-derived) in their provenance.
    slots:
      - uses_inference_engine
      - has_part               # parts: SyntheticDiagnosticEvaluation / solver invocations
    attributes:
      measured_diagnostics:
        range: IDS
        multivalued: true
        description: >-
          INPUT — the measured diagnostic signal set of the analyzed discharge (d_obs):
          magnetic probes / flux loops, interferometry / polarimetry, Thomson scattering,
          charge exchange, ECE, MSE, bolometry, … — each an IDS occurrence with modality
          `measured`, produced by the MeasurementProcesses of the Discharge.
        annotations:
          io: input
          fyo_ids: magnetics, interferometer, polarimeter, thomson_scattering, charge_exchange, ece, mse, bolometer
      machine_description:
        range: MachineDescription
        description: >-
          INPUT — static as-built machine description (probe / chord / sensor positions,
          wall and coil geometry) fixing the diagnostic geometry operators.
        annotations:
          io: input
      constraints_and_priors:
        range: InformationContentEntity
        multivalued: true
        description: >-
          INPUT (optional) — parameterization, regularization and prior information (the
          middle layer of the forward / parameterization+prior / inference-engine
          decoupling).
        annotations:
          io: input
      reconstructed_equilibrium:
        range: IDS
        description: >-
          OUTPUT — the reconstructed equilibrium (flux map, boundary, global quantities) best
          matching the measurements; modality reconstructed.
        annotations:
          io: output
          fyo_ids: equilibrium
      reconstructed_profiles:
        range: IDS
        description: OUTPUT — the reconstructed kinetic core profiles; modality reconstructed.
        annotations:
          io: output
          fyo_ids: core_profiles
      misfit_report:
        range: InformationContentEntity
        description: >-
          OUTPUT — the residual / uncertainty report of the inference (per-channel misfit,
          posterior spreads when a Bayesian engine is used).
        annotations:
          io: output
    annotations:
      conops_scenario: S-8
      free_variables_note: "free = plasma configuration θ (equilibrium + profiles parameterization); fixed = machine, measured data"

  SyntheticDiagnosticEvaluation:
    is_a: ComputationalProcess
    description: >-
      A forward evaluation of a diagnostic's response to a candidate plasma configuration —
      composing the forward operator F with the diagnostic geometry / response model to
      produce SYNTHETIC signals comparable with d_obs. The reusable half of the unified
      forward–inference loss; also the verification loop of prediction (predict → synthesize
      → compare). GAP (informative): synthetic-diagnostic forward models are the identified
      zero of the as-built state (R-3).
    slots:
      - consumes_ids
      - produces_ids
    annotations:
      conops_ref: "FYTOK-REPORT-107; FYTOK-CONOPS-00 S-8"
