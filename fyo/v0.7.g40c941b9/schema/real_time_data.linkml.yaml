id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/real_time_data
name: fyo-real_time_data
title: fyo IDS `real_time_data` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `real_time_data` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/real_time_data/dd_real_time_data.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: RealTimeData
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  RealTimeData:
    is_a: IDS
    description: Description of the data bus circulating on the real time data network of the machine.
      This is typically used (but not only) as an interface to the Plasma Control System (PCS)
    annotations:
      dd_path: real_time_data
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      topic:
        range: RtdTopic
        multivalued: true
        description: List of topics. Signals are grouped by topic
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      code:
        range: CodeConstant
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
  RtdTopic:
    is_a: InformationContentEntity
    description: List of topics. Signals are grouped by topic
    annotations:
      dd_type_name: rtd_topic
      dd_path: real_time_data/topic
    attributes:
      name:
        range: string
        description: Topic name
        annotations:
          dd_type: constant
      signal:
        range: RtdAllocatableSignals
        multivalued: true
        description: List of signals that are allocated to the PCS interface
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      time_stamp:
        range: float
        multivalued: true
        description: Time of creation for all signals belonging to this topic. A set of time stamps can
          be recorded if needed
        annotations:
          dd_type: constant
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      sample:
        range: integer
        multivalued: true
        description: Index of sample (time stamp counter)
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: ../time_stamp
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_stamp
  RtdAllocatableSignals:
    is_a: InformationContentEntity
    description: List of signals that are allocated to the PCS interface
    annotations:
      dd_type_name: rtd_allocatable_signals
      dd_path: real_time_data/topic/signal
    attributes:
      name:
        range: string
        description: Signal name
        annotations:
          dd_type: constant
      data_type:
        range: string
        description: Signal data type
        annotations:
          dd_type: constant
      allocated_position:
        range: integer
        multivalued: true
        description: Allocation of signal to a position in the SDN (1..N), or several positions in case
          of signal reshaping; this will be implementation specific
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      data_str:
        range: string
        multivalued: true
        description: Signal data (e.g. diagnostic signal or PCS command), serialized as a string
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: ../../time_stamp
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../time_stamp
      quality:
        range: integer
        multivalued: true
        description: 'Indicator of the quality of the signal. Following ITER PCS documentation (https://user.iter.org/?uid=354SJ3&action=get_document),
          possible values are: 1 - GOOD (the nominal state); 2 - INVALID (data no usable); 3 - DATA INTEGRITY
          ERROR (e.g. out of bounds with respect to expectations, calibration error,...)'
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: ../../time_stamp
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../time_stamp
