id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/amns_data
name: fyo-amns_data
title: fyo IDS `amns_data` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `amns_data` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/amns_data/dd_amns_data.xsd (import ancestry)
  fyo_category: metadata
  fyo_root_class: AmnsData
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  AmnsData:
    is_a: IDS
    description: Atomic, molecular, nuclear and surface physics data. Each occurrence contains the data
      for a given element (nuclear charge), describing various physical processes. For each process, data
      tables are organized by charge states. The coordinate system used by the data tables is described
      under the coordinate_system node.
    annotations:
      dd_path: amns_data
      fyo_category: metadata
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      z_n:
        range: integer
        description: Nuclear charge
        annotations:
          dd_type: static
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: static
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      process:
        range: AmnsDataProcess
        multivalued: true
        description: Description and data for a set of physical processes.
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      coordinate_system:
        range: AmnsDataCoordinateSystem
        multivalued: true
        description: Array of possible coordinate systems for process tables
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      release:
        range: AmnsDataRelease
        multivalued: true
        description: List of available releases of the AMNS data; each element contains information about
          the AMNS data that is included in the release. This part of the IDS is filled and stored only
          into shot/run=0/1, playing the role of a catalogue.
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      code:
        range: CodeConstant
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
  AmnsDataProcess:
    is_a: InformationContentEntity
    description: Description and data for a set of physical processes.
    annotations:
      dd_type_name: amns_data_process
      dd_path: amns_data/process
    attributes:
      source:
        range: string
        description: Filename or subroutine name used to provide this data
        annotations:
          dd_type: static
      provider:
        range: string
        description: Name of the person in charge of producing this data
        annotations:
          dd_type: static
      citation:
        range: string
        description: Reference to publication(s)
        annotations:
          dd_type: static
      name:
        range: string
        description: String identifying the process (e.g. EI, RC, ...)
        annotations:
          dd_type: static
      reactants:
        range: AmnsDataProcessReactant
        multivalued: true
        description: Set of reactants involved in this process
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      products:
        range: AmnsDataProcessReactant
        multivalued: true
        description: Set of products resulting of this process
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      table_dimension:
        range: integer
        description: Table dimensionality of the process (1 to 6), valid for all charge states. Indicates
          which of the tables is filled (below the charge_state node)
        annotations:
          dd_type: static
      coordinate_index:
        range: integer
        description: Index in tables_coord, specifying what coordinate systems to use for this process
          (valid for all tables)
        annotations:
          dd_type: static
      result_label:
        range: string
        description: Description of the process result (rate, cross section, sputtering yield, ...)
        annotations:
          dd_type: static
      result_units:
        range: string
        description: Units of the process result
        annotations:
          dd_type: static
      result_transformation:
        range: integer
        description: 'Transformation of the process result. Integer flag: 0=no transformation; 1=10^;
          2=exp()'
        annotations:
          dd_type: static
      charge_state:
        range: AmnsDataProcessChargeState
        multivalued: true
        description: Process tables for a set of charge states. Only one table is used for that process,
          defined by process(:)/table_dimension. If the data in the table_Nd array are used as parameters
          for a function, then no coordinates are needed, and coordinate_index should be set to -1, and
          result_transformation should contain the integer identifier to the internally provided functions.
          If the results will come from an interpolation in the table_Nd data, then coordinates must be
          provided in coordinate_system(process(i1)/coordinate_index), and the shape of the table should
          match the cartesian product of the coordinates
        annotations:
          dd_max_occurs: '75'
          dd_coordinate1: 1...N
  AmnsDataProcessReactant:
    is_a: InformationContentEntity
    description: Set of reactants involved in this process
    annotations:
      dd_type_name: amns_data_process_reactant
      dd_path: amns_data/process/reactants
    attributes:
      name:
        range: string
        description: String identifying reaction participant (e.g. "D", "e", "W", "CD4", "photon", "n")
        annotations:
          dd_type: static
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom (in such case, this array should be of size 1)
          or molecule. Mass of atom and nuclear charge should be set to 0 for photons and electrons. The
          mass of atom shouldn't be set for an atomic process that is not isotope dependent.
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      role:
        range: Identifier
        description: Identifier for the role of this paricipant in the reaction. For surface reactions
          distinguish between projectile and wall.
      mass:
        range: float
        description: Mass of the participant
        annotations:
          dd_type: static
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      charge:
        range: float
        description: Charge number of the participant
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      relative_charge:
        range: integer
        description: This is a flag indicating that charges are absolute (if set to 0), relative (if 1)
          or irrelevant (-1); relative would be used to categorize the ionization reactions from i to
          i+1 for all charge states; in the case of bundles, the +1 relative indicates the next bundle
        annotations:
          dd_type: static
      multiplicity:
        range: float
        description: Multiplicity in the reaction
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      metastable:
        range: integer
        multivalued: true
        description: An array identifying the metastable; if zero-length, then not a metastable; if of
          length 1, then the value indicates the electronic level for the metastable (mostly used for
          atoms/ions); if of length 2, then the 1st would indicate the electronic level and the second
          the vibrational level for the metastable (mostly used for molecules and molecular ions); if
          of length 3, then the 1st would indicate the electronic level, the second the vibrational level
          and the third the rotational level for the metastable (mostly used for molecules and molecular
          ions)
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      metastable_label:
        range: string
        description: Label identifying in text form the metastable
        annotations:
          dd_type: static
  AmnsDataProcessChargeState:
    is_a: InformationContentEntity
    description: Process tables for a set of charge states. Only one table is used for that process, defined
      by process(:)/table_dimension. If the data in the table_Nd array are used as parameters for a function,
      then no coordinates are needed, and coordinate_index should be set to -1, and result_transformation
      should contain the integer identifier to the internally provided functions. If the results will
      come from an interpolation in the table_Nd data, then coordinates must be provided in coordinate_system(proc
    annotations:
      dd_type_name: amns_data_process_charge_state
      dd_path: amns_data/process/charge_state
    attributes:
      name:
        range: string
        description: String identifying charge state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: static
      z_min:
        range: float
        description: Minimum Z of the charge state bundle
        annotations:
          dd_type: static
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: static
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      table_0d:
        range: float
        description: 0D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(:)/results_units
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      table_1d:
        range: float
        multivalued: true
        description: 1D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(i1)/results_units
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      table_2d:
        range: float
        multivalued: true
        description: 2D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(i1)/results_units
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      table_3d:
        range: float
        multivalued: true
        description: 3D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(:)/results_units
          dd_ndim: 3
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N
      table_4d:
        range: float
        multivalued: true
        description: 4D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(i1)/results_units
          dd_ndim: 4
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          dd_coordinate4: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N,1...N
      table_5d:
        range: float
        multivalued: true
        description: 5D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(i1)/results_units
          dd_ndim: 5
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          dd_coordinate4: 1...N
          dd_coordinate5: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N,1...N,1...N
      table_6d:
        range: float
        multivalued: true
        description: 6D table describing the process data
        annotations:
          dd_type: static
          dd_units: units given by process(i1)/results_units
          dd_ndim: 6
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          dd_coordinate4: 1...N
          dd_coordinate5: 1...N
          dd_coordinate6: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N,1...N,1...N,1...N
  AmnsDataCoordinateSystem:
    is_a: InformationContentEntity
    description: Array of possible coordinate systems for process tables
    annotations:
      dd_type_name: amns_data_coordinate_system
      dd_path: amns_data/coordinate_system
    attributes:
      coordinate:
        range: AmnsDataCoordinateSystemCoordinate
        multivalued: true
        description: Set of coordinates for that coordinate system. A coordinate an be either a range
          of real values or a set of discrete values (if interpolation_type=0)
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
  AmnsDataCoordinateSystemCoordinate:
    is_a: InformationContentEntity
    description: Set of coordinates for that coordinate system. A coordinate an be either a range of real
      values or a set of discrete values (if interpolation_type=0)
    annotations:
      dd_type_name: amns_data_coordinate_system_coordinate
      dd_path: amns_data/coordinate_system/coordinate
    attributes:
      name:
        range: string
        description: Name of coordinate (e.g. "Electron temperature")
        annotations:
          dd_type: static
      values:
        range: float
        multivalued: true
        description: Coordinate values
        annotations:
          dd_type: static
          dd_units: units given by coordinate_system(:)/coordinate(:)/units
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      interpolation_type:
        range: integer
        description: 'Interpolation strategy in this coordinate direction. Integer flag: 0=discrete (no
          interpolation); 1=linear; ...'
        annotations:
          dd_type: static
      extrapolation_type:
        range: integer
        multivalued: true
        description: 'Extrapolation strategy when leaving the domain. The first value of the vector describes
          the behaviour at lower bound, the second describes the at upper bound. Possible values: 0=none,
          report error; 1=boundary value; 2=linear extrapolation'
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      value_labels:
        range: string
        multivalued: true
        description: String description of discrete coordinate values (if interpolation_type=0). E.g.,
          for spectroscopic lines, the spectroscopic description of the transition.
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: ../values
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../values
      units:
        range: string
        description: Units of coordinate (e.g. eV)
        annotations:
          dd_type: static
      transformation:
        range: integer
        description: 'Coordinate transformation applied to coordinate values stored in coord. Integer
          flag: 0=none; 1=log10; 2=ln'
        annotations:
          dd_type: static
      spacing:
        range: integer
        description: 'Flag for specific coordinate spacing (for optimization purposes). Integer flag:
          0=undefined; 1=uniform; ...'
        annotations:
          dd_type: static
  AmnsDataRelease:
    is_a: InformationContentEntity
    description: List of available releases of the AMNS data; each element contains information about
      the AMNS data that is included in the release. This part of the IDS is filled and stored only into
      shot/run=0/1, playing the role of a catalogue.
    annotations:
      dd_type_name: amns_data_release
      dd_path: amns_data/release
    attributes:
      description:
        range: string
        description: Description of this release
        annotations:
          dd_type: static
      date:
        range: string
        description: Date of this release
        annotations:
          dd_type: static
      data_entry:
        range: AmnsDataDataEntry
        multivalued: true
        description: For this release, list of each data item (i.e. shot/run pair containing the actual
          data) included in this release
        annotations:
          dd_max_occurs: '30'
          dd_coordinate1: 1...N
  AmnsDataDataEntry:
    is_a: InformationContentEntity
    description: For this release, list of each data item (i.e. shot/run pair containing the actual data)
      included in this release
    annotations:
      dd_type_name: amns_data_data_entry
      dd_path: amns_data/release/data_entry
    attributes:
      description:
        range: string
        description: Description of this data entry
        annotations:
          dd_type: static
      shot:
        range: integer
        description: Shot number = Mass*1000+Nuclear_charge
        annotations:
          dd_type: static
      run:
        range: integer
        description: Which run number is the active run number for this version
        annotations:
          dd_type: static
