id: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/cryostat
name: fyo-cryostat
title: fyo IDS `cryostat` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `cryostat` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g40c941b9/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/cryostat/dd_cryostat.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Cryostat
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Cryostat:
    is_a: IDS
    description: Description of the cryostat surrounding the machine (if any)
    annotations:
      dd_path: cryostat
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      description_2d:
        range: Cryostat2d
        multivalued: true
        description: Set of 2D cryostat descriptions, for each type of possible physics or engineering
          configurations necessary
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  Cryostat2d:
    is_a: InformationContentEntity
    description: Set of 2D cryostat descriptions, for each type of possible physics or engineering configurations
      necessary
    annotations:
      dd_type_name: cryostat_2d
      dd_path: cryostat/description_2d
    attributes:
      cryostat:
        range: Vessel2d
        description: 'Mechanical structure of the cryostat. It is described as a set of nested layers
          with given physics properties; Two representations are admitted for each vessel unit : annular
          (two contours) or block elements.'
      thermal_shield:
        range: Vessel2d
        description: 'Mechanical structure of the cryostat thermal shield. It is described as a set of
          nested layers with given physics properties; Two representations are admitted for each vessel
          unit : annular (two contours) or block elements.'
