  DistributionsDProfiles2dGrid:
    is_a: Mesh
    description: Grid. The grid has to be rectangular in a pair of coordinates, as specified in type
    annotations:
      dd_type_name: distributions_d_profiles_2d_grid
      dd_path: distributions/distribution/profiles_2d/grid
      fyo_lift: grid
    attributes:
      type:
        range: Identifier
        description: 'Grid type: index=0: Rectangular grid in the (R,Z) coordinates; index=1: Rectangular
          grid in the (radial, theta_geometric) coordinates; index=2: Rectangular grid in the (radial,
          theta_straight) coordinates.'
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      theta_straight:
        range: float
        multivalued: true
        description: Straight field line poloidal angle
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      theta_geometric:
        range: float
        multivalued: true
        description: Geometrical poloidal angle
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate. The normalizing value for rho_tor_norm, is the
          toroidal flux coordinate at the equilibrium boundary (LCFS or 99.x % of the LCFS in case of
          a fixed boundary equilibium calculation)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      rho_tor:
        range: float
        multivalued: true
        description: Toroidal flux coordinate. The toroidal field used in its definition is indicated
          under vacuum_toroidal_field/b0
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      psi:
        range: float
        multivalued: true
        description: Poloidal magnetic flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      volume:
        range: float
        multivalued: true
        description: Volume enclosed inside the magnetic surface
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      area:
        range: float
        multivalued: true
        description: Cross-sectional area of the flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
