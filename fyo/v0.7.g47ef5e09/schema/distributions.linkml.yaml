id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/distributions
name: fyo-distributions
title: fyo IDS `distributions` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `distributions` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/distributions/dd_distributions.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Distributions
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Distributions:
    is_a: IDS
    description: Distribution function(s) of one or many particle species. This structure is specifically
      designed to handle non-Maxwellian distribution function generated during heating and current drive,
      typically solved using a Fokker-Planck calculation perturbed by a heating scheme (e.g. IC, EC, LH,
      NBI, or alpha heating) and then relaxed by Coloumb collisions.
    annotations:
      dd_path: distributions
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      distribution:
        range: DistributionsD
        multivalued: true
        description: Set of distribution functions. Every distribution function has to be associated with
          only one particle species, specified in distri_vec/species/, but there could be multiple distribution
          function for each species. In this case, the fast particle populations should be superposed
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: 1...N
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      magnetic_axis:
        range: Rz1dDynamic1
        description: Magnetic axis position (used to define a poloidal angle for the 2D profiles)
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  DistributionsD:
    is_a: InformationContentEntity
    description: Set of distribution functions. Every distribution function has to be associated with
      only one particle species, specified in distri_vec/species/, but there could be multiple distribution
      function for each species. In this case, the fast particle populations should be superposed
    annotations:
      dd_type_name: distributions_d
      dd_path: distributions/distribution
    attributes:
      wave:
        range: WavesCoherentWaveIdentifier
        multivalued: true
        description: List all waves affecting the distribution, identified as in waves/coherent_wave(i)/identifier
          in the waves IDS
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      process:
        range: DistributionProcessIdentifier
        multivalued: true
        description: List all processes (NBI units, fusion reactions, ...) affecting the distribution,
          identified as in distribution_sources/source(i)/process in the DISTRIBUTION_SOURCES IDS
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: 1...N
      gyro_type:
        range: integer
        description: 'Defines how to interpret the spatial coordinates: 1 = given at the actual particle
          birth point; 2 =given at the gyro centre of the birth point'
        annotations:
          dd_type: constant
      species:
        range: DistributionSpecies
        description: Species described by this distribution
      global_quantities:
        range: DistributionsDGlobalQuantities
        multivalued: true
        description: Global quantities (integrated over plasma volume for moments of the distribution,
          collisional exchange and source terms), for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_1d:
        range: DistributionsDProfiles1d
        multivalued: true
        description: Radial profiles (flux surface averaged quantities) for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_2d:
        range: DistributionsDProfiles2d
        multivalued: true
        description: 2D profiles in the poloidal plane for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      is_delta_f:
        range: integer
        description: If is_delta_f=1, then the distribution represents the deviation from a Maxwellian;
          is_delta_f=0, then the distribution represents all particles, i.e. the full-f solution
        annotations:
          dd_type: constant
      ggd:
        range: DistributionsDGgd
        multivalued: true
        description: Distribution represented using the ggd, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      markers:
        range: DistributionMarkers
        multivalued: true
        description: Distribution represented by a set of markers (test particles)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  DistributionsDGlobalQuantities:
    is_a: TimeSlice
    description: Global quantities (integrated over plasma volume for moments of the distribution, collisional
      exchange and source terms), for various time slices
    annotations:
      dd_type_name: distributions_d_global_quantities
      dd_path: distributions/distribution/global_quantities
      fyo_lift: time_slice
    attributes:
      particles_n:
        range: float
        description: 'Number of particles in the distribution, i.e. the volume integral of the density
          (note: this is the number of real particles and not markers)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      particles_fast_n:
        range: float
        description: 'Number of fast particles in the distribution, i.e. the volume integral of the density
          (note: this is the number of real particles and not markers)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energy:
        range: float
        description: Total energy in the distribution
        annotations:
          dd_type: dynamic
          dd_units: J
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energy_fast:
        range: float
        description: Total energy of the fast particles in the distribution
        annotations:
          dd_type: dynamic
          dd_units: J
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energy_fast_parallel:
        range: float
        description: Parallel energy of the fast particles in the distribution
        annotations:
          dd_type: dynamic
          dd_units: J
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_tor_j_radial:
        range: float
        description: Toroidal torque due to radial currents
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current_phi:
        range: float
        description: Toroidal current driven by the distribution
        annotations:
          dd_type: dynamic
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_first_orbit:
        range: float
        description: Power loss due to first orbit losses
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_rotation:
        range: float
        description: Power going to plasma rotation. This power goes into sustaining the plasma rotation
          rather than heating the plasma. This is given because the injection energy in the rotating plasma
          frame is (assuming rotation in the same direction of the NB injection) lower than in the lab-frame.
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_charge_exchange:
        range: float
        description: Power loss due to Charge Exchange loss of fast ions
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      collisions:
        range: DistributionsDGlobalQuantitiesCollisions
        description: Power and torque exchanged between the species described by the distribution and
          the different plasma species through collisions
      thermalization:
        range: DistributionsDGlobalQuantitiesThermalized
        description: Volume integrated source of thermal particles, momentum and energy due to thermalization.
          Here thermalization refers to non-thermal particles, sufficiently assimilated to the thermal
          background to be re-categorized as thermal particles. Note that this source may also be negative
          if thermal particles are being accelerated such that they form a distinct non-thermal contribution,
          e.g. due run-away of RF interactions.
      source:
        range: DistributionsDGlobalQuantitiesSource
        multivalued: true
        description: Set of volume integrated sources and sinks of particles, momentum and energy included
          in the Fokker-Planck modelling, related to the various waves or particle source processes affecting
          the distribution
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDGlobalQuantitiesCollisions:
    is_a: InformationContentEntity
    description: Power and torque exchanged between the species described by the distribution and the
      different plasma species through collisions
    annotations:
      dd_type_name: distributions_d_global_quantities_collisions
      dd_path: distributions/distribution/global_quantities/collisions
    attributes:
      electrons:
        range: DistributionsDGlobalQuantitiesCollisionsElectrons
        description: Collisional exchange with electrons
      ion:
        range: DistributionsDGlobalQuantitiesCollisionsIon
        multivalued: true
        description: Collisional exchange with the various ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  DistributionsDGlobalQuantitiesCollisionsElectrons:
    is_a: InformationContentEntity
    description: Collisional exchange with electrons
    annotations:
      dd_type_name: distributions_d_global_quantities_collisions_electrons
      dd_path: distributions/distribution/global_quantities/collisions/electrons
    attributes:
      power_thermal:
        range: float
        description: Collisional power to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast:
        range: float
        description: Collisional power to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_thermal_phi:
        range: float
        description: Collisional toroidal torque to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_fast_phi:
        range: float
        description: Collisional toroidal torque to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDGlobalQuantitiesCollisionsIon:
    is_a: InformationContentEntity
    description: Collisional exchange with the various ion species
    annotations:
      dd_type_name: distributions_d_global_quantities_collisions_ion
      dd_path: distributions/distribution/global_quantities/collisions/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed).
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H+, D+, T+, He+2, C+, D2, DT, CD4, ...)
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: dynamic
      power_thermal:
        range: float
        description: Collisional power to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast:
        range: float
        description: Collisional power to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_thermal_phi:
        range: float
        description: Collisional toroidal torque to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_fast_phi:
        range: float
        description: Collisional toroidal torque to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      multiple_states_flag:
        range: integer
        description: 'Multiple state calculation flag : 0-Only one state is considered; 1-Multiple states
          are considered and are described in the state structure'
        annotations:
          dd_type: dynamic
      state:
        range: DistributionsDGlobalQuantitiesCollisionsIonState
        multivalued: true
        description: Collisional exchange with the various states of the ion species (ionization, energy,
          excitation, ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  DistributionsDGlobalQuantitiesCollisionsIonState:
    is_a: InformationContentEntity
    description: Collisional exchange with the various states of the ion species (ionization, energy,
      excitation, ...)
    annotations:
      dd_type_name: distributions_d_global_quantities_collisions_ion_state
      dd_path: distributions/distribution/global_quantities/collisions/ion/state
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle (z_min = z_max = 0 for a neutral)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying charge state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      power_thermal:
        range: float
        description: Collisional power to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast:
        range: float
        description: Collisional power to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_thermal_phi:
        range: float
        description: Collisional toroidal torque to the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_fast_phi:
        range: float
        description: Collisional toroidal torque to the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDGlobalQuantitiesThermalized:
    is_a: InformationContentEntity
    description: Volume integrated source of thermal particles, momentum and energy due to thermalization.
      Here thermalization refers to non-thermal particles, sufficiently assimilated to the thermal background
      to be re-categorized as thermal particles. Note that this source may also be negative if thermal
      particles are being accelerated such that they form a distinct non-thermal contribution, e.g. due
      run-away of RF interactions.
    annotations:
      dd_type_name: distributions_d_global_quantities_thermalized
      dd_path: distributions/distribution/global_quantities/thermalization
    attributes:
      particles:
        range: float
        description: Source rate of thermal particles due to the thermalization of fast particles
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power:
        range: float
        description: Power input to the thermal particle population due to the thermalization of fast
          particles
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque:
        range: float
        description: Torque input to the thermal particle population due to the thermalization of fast
          particles
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDGlobalQuantitiesSource:
    is_a: InformationContentEntity
    description: Set of volume integrated sources and sinks of particles, momentum and energy included
      in the Fokker-Planck modelling, related to the various waves or particle source processes affecting
      the distribution
    annotations:
      dd_type_name: distributions_d_global_quantities_source
      dd_path: distributions/distribution/global_quantities/source
    attributes:
      identifier:
        range: DistributionsDSourceIdentifier
        description: Identifier of the wave or particle source process, defined respectively in distribution/wave
          or distribution/process
      particles:
        range: float
        description: Particle source rate
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power:
        range: float
        description: Total power of the source
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_phi:
        range: float
        description: Total toroidal torque of the source
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDSourceIdentifier:
    is_a: InformationContentEntity
    description: Identifier of the wave or particle source process, defined respectively in distribution/wave
      or distribution/process
    annotations:
      dd_type_name: distributions_d_source_identifier
      dd_path: distributions/distribution/global_quantities/source/identifier
    attributes:
      type:
        range: Identifier
        description: Type of the source term. Index  = 1 for a wave, index = 2 for a particle source process
      wave_index:
        range: integer
        description: Index into distribution/wave
        annotations:
          dd_type: dynamic
      process_index:
        range: integer
        description: Index into distribution/process
        annotations:
          dd_type: dynamic
  DistributionsDProfiles1d:
    is_a: TimeSlice
    description: Radial profiles (flux surface averaged quantities) for various time slices
    annotations:
      dd_type_name: distributions_d_profiles_1d
      dd_path: distributions/distribution/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      fast_filter:
        range: DistributionsDFastFilter
        description: Description of how the fast and the thermal particle populations are separated
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      density_fast:
        range: float
        multivalued: true
        description: Density of fast particles
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure:
        range: float
        multivalued: true
        description: Pressure (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_fast:
        range: float
        multivalued: true
        description: Pressure of fast particles
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_fast_parallel:
        range: float
        multivalued: true
        description: Pressure of fast particles in the parallel direction
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_fast_perpendicular:
        range: float
        multivalued: true
        description: Pressure of fast particles in the perpendicular direction
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      current_phi:
        range: float
        multivalued: true
        description: Total toroidal driven current density (including electron and thermal ion back-current,
          or drag-current)
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      current_fast_phi:
        range: float
        multivalued: true
        description: Total toroidal driven current density of fast (non-thermal) particles (excluding
          electron and thermal ion back-current, or drag-current)
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      torque_phi_j_radial:
        range: float
        multivalued: true
        description: Toroidal torque due to radial currents
        annotations:
          dd_type: dynamic
          dd_units: N.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      collisions:
        range: DistributionsDProfiles1dCollisions
        description: Power and torque exchanged between the species described by the distribution and
          the different plasma species through collisions
      thermalization:
        range: DistributionsDProfiles1dThermalized
        description: Flux surface averaged source of thermal particles, momentum and energy due to thermalization.
          Here thermalization refers to non-thermal particles, sufficiently assimilated to the thermal
          background to be re-categorized as thermal particles. Note that this source may also be negative
          if thermal particles are being accelerated such that they form a distinct non-thermal contribution,
          e.g. due run-away of RF interactions.
      source:
        range: DistributionsDProfiles1dSource
        multivalued: true
        description: Set of flux averaged sources and sinks of particles, momentum and energy included
          in the Fokker-Planck modelling, related to the various waves or particle source processes affecting
          the distribution
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      trapped:
        range: DistributionsDProfiles1dPartial
        description: Flux surface averaged profile evaluated using the trapped particle part of the distribution.
      co_passing:
        range: DistributionsDProfiles1dPartial
        description: Flux surface averaged profile evaluated using the co-passing particle part of the
          distribution.
      counter_passing:
        range: DistributionsDProfiles1dPartial
        description: Flux surface averaged profile evaluated using the counter-passing particle part of
          the distribution.
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionsDFastFilter:
    is_a: InformationContentEntity
    description: Description of how the fast and the thermal particle populations are separated
    annotations:
      dd_type_name: distributions_d_fast_filter
      dd_path: distributions/distribution/profiles_1d/fast_filter
    attributes:
      method:
        range: Identifier
        description: Method used to separate the fast and thermal particle population (indices TBD)
      energy:
        range: float
        multivalued: true
        description: Energy at which the fast and thermal particle populations were separated, as a function
          of radius
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
  DistributionsDProfiles1dCollisions:
