  DistributionsDGgd:
    is_a: TimeSlice
    description: Distribution represented using the ggd, for various time slices
    annotations:
      dd_type_name: distributions_d_ggd
      dd_path: distributions/distribution/ggd
      fyo_lift: time_slice
    attributes:
      grid:
        range: GenericGridDynamic
        description: Grid description
      temperature:
        range: float
        multivalued: true
        description: Reference temperature profile used to define the local thermal energy and the thermal
          velocity (for normalization of the grid coordinates)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../../profiles_1d(itime)/grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../profiles_1d(itime)/grid/rho_tor_norm
      orbit_frequency_pol:
        range: GenericGridScalar
        description: Poloidal orbit frequency (transit or bounce) at the grid location (in phase space)
        annotations:
          dd_units: rad.s^-1
      orbit_frequency_tor:
        range: GenericGridScalar
        description: Toroidal orbit frequency (transit or precession) at the grid location (in phase space)
        annotations:
          dd_units: rad.s^-1
      expansion:
        range: DistributionsDGgdExpansion
        multivalued: true
        description: Distribution function expanded into a vector of successive approximations. The first
          element in the vector (expansion(1)) is the zeroth order distribution function, while the K:th
          element in the vector (expansion(K)) is the K:th correction, such that the total distribution
          function is a sum over all elements in the expansion vector.
        annotations:
          dd_units: m^-6.s^3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      expansion_fd3v:
        range: DistributionsDGgdExpansion
        multivalued: true
        description: Distribution function multiplied by the volume of the local velocity cell d3v, expanded
          into a vector of successive approximations. The first element in the vector (expansion(1)) is
          the zeroth order distribution function, while the K:th element in the vector (expansion(K))
          is the K:th correction, such that the total distribution function is a sum over all elements
          in the expansion vector.
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      amplitude:
        range: GenericGridScalar
        description: Value of the distribution function at the grid position in phase space. The interpolation
          coefficients refer to a C-2 spline.
        annotations:
          dd_units: m^-6.s^3
      orbit:
        range: GenericGridMatrix
        description: Orbit description of the particle at this position in phase space. First dimension
          is the element index. Second dimension is the time along the orbit. Third dimension contains
          the particle phase space coordinates.
        annotations:
          dd_units: mixed
      orbit_type:
        range: GenericGridInteger
        description: Orbit type identifier
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  GenericGridMatrix:
    is_a: InformationContentEntity
    description: Orbit description of the particle at this position in phase space. First dimension is
      the element index. Second dimension is the time along the orbit. Third dimension contains the particle
      phase space coordinates.
    annotations:
      dd_type_name: generic_grid_matrix
      dd_path: distributions/distribution/ggd/orbit
    attributes:
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: 'Index of the grid subset the data is provided on. Corresponds to the index used
          in the grid subset definition: grid_subset(:)/identifier/index'
        annotations:
          dd_type: dynamic
      values:
        range: float
        multivalued: true
        description: 'List of matrix components, one list per element in the grid subset. First dimension:
          element index. Second dimension: first matrix index. Third dimension: second matrix index.'
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 3
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N
      coefficients:
        range: float
        multivalued: true
        description: 'Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity with finite elements, provided per element in the grid subset (first dimension). Second
          dimension: first matrix index. Third dimension: second matrix index. Fourth dimension: coefficient
          index'
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 4
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          dd_coordinate4: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,1...N,1...N
  GenericGridInteger:
    is_a: InformationContentEntity
    description: Orbit type identifier
    annotations:
      dd_type_name: generic_grid_integer
      dd_path: distributions/distribution/ggd/orbit_type
    attributes:
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: 'Index of the grid subset the data is provided on. Corresponds to the index used
          in the grid subset definition: grid_subset(:)/identifier/index'
        annotations:
          dd_type: dynamic
      values:
        range: integer
        multivalued: true
        description: One integer value is provided per element in the grid subset.
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
