id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/hard_x_rays
name: fyo-hard_x_rays
title: fyo IDS `hard_x_rays` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `hard_x_rays` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/hard_x_rays/dd_hard_x_rays.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: HardXRays
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  HardXRays:
    is_a: IDS
    description: Hard X-rays tomography diagnostic
    annotations:
      dd_path: hard_x_rays
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: HxrChannel
        multivalued: true
        description: Set of channels (detector or pixel of a camera)
        annotations:
          dd_max_occurs: '60'
          dd_coordinate1: 1...N
      emissivity_profile_1d:
        range: HxrEmissivityProfile
        multivalued: true
        description: Emissivity profile per energy band (assumed common to all channels used in the profile
          reconstruction)
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  HxrChannel:
    is_a: InformationContentEntity
    description: Set of channels (detector or pixel of a camera)
    annotations:
      dd_type_name: hxr_channel
      dd_path: hard_x_rays/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      detector:
        range: DetectorAperture
        description: Detector description
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      etendue:
        range: float
        description: Etendue (geometric extent) of the channel's optical system
        annotations:
          dd_type: static
          dd_units: m^2.sr
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      etendue_method:
        range: Identifier
        description: 'Method used to calculate the etendue. Index = 0 : exact calculation with a 4D integral;
          1 : approximation with first order formula (detector surface times solid angle subtended by
          the apertures); 2 : other methods'
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight of the channel, given by 2 points
      filter_window:
        range: FilterWindow
        multivalued: true
        description: Set of filter windows
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      energy_band:
        range: DetectorEnergyBand
        multivalued: true
        description: Set of energy bands in which photons are counted by the detector
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      radiance:
        range: SignalFlt2dValidity
        description: Photons received by the detector per unit time, per unit solid angle and per unit
          area (i.e. photon flux divided by the etendue), in multiple energy bands if available from the
          detector
        annotations:
          dd_units: s^-1.m^-2.sr^-1
          dd_coordinate1: ../energy_band
          dd_coordinate2: time
  HxrEmissivityProfile:
    is_a: InformationContentEntity
    description: Emissivity profile per energy band (assumed common to all channels used in the profile
      reconstruction)
    annotations:
      dd_type_name: hxr_emissivity_profile
      dd_path: hard_x_rays/emissivity_profile_1d
    attributes:
      lower_bound:
        range: float
        description: Lower bound of the energy band
        annotations:
          dd_type: static
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      upper_bound:
        range: float
        description: Upper bound of the energy band
        annotations:
          dd_type: static
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate grid
        annotations:
          dd_type: constant
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      emissivity:
        range: float
        multivalued: true
        description: Radial profile of the plasma emissivity in this energy band
        annotations:
          dd_type: dynamic
          dd_units: m^-3.sr^-1.s^-1
          dd_ndim: 2
          dd_coordinate1: ../rho_tor_norm
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../rho_tor_norm,../time
      peak_position:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate position at which the emissivity peaks
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      half_width_internal:
        range: float
        multivalued: true
        description: Internal (towards magnetic axis) half width of the emissivity peak (in normalized
          toroidal flux)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      half_width_external:
        range: float
        multivalued: true
        description: External (towards separatrix) half width of the emissivity peak (in normalized toroidal
          flux)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the emissivity profile data for each time slice. 0:
          valid from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem
          identified in the data processing (request verification by the diagnostic RO), -2: invalid data,
          should not be used (values lower than -2 have a code-specific meaning detailing the origin of
          their invalidity)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
