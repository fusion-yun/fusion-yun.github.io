id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/ece
name: fyo-ece
title: fyo IDS `ece` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `ece` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/ece/dd_ece.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: Ece
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Ece:
    is_a: IDS
    description: Electron cyclotron emission diagnostic
    annotations:
      dd_path: ece
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      line_of_sight:
        range: LineOfSight2points
        description: Line of sight of the diagnostic (fill when valid for all channels), defined by two
          points. By convention, the first point is the closest to the diagnostic. In case the channels
          have different lines of sight, they should be described within the channel array of structures
      t_radiation_central:
        range: SignalFlt1dValidityPosition
        description: Radiation temperature from the closest channel to the magnetic axis, together with
          its radial location
        annotations:
          dd_units: eV
      t_radiation_central_x:
        range: SignalFlt1dValidityPosition
        description: Predicted radiation temperature of the channel closest to the magnetic axis, together
          with its radial location (eXtraordinary mode)
        annotations:
          dd_units: eV
      t_radiation_central_o:
        range: SignalFlt1dValidityPosition
        description: Predicted radiation temperature of the channel closest to the magnetic axis, together
          with its radial location (Ordinary mode)
        annotations:
          dd_units: eV
      channel:
        range: EceChannel
        multivalued: true
        description: Set of channels (frequency)
        annotations:
          dd_max_occurs: '200'
          dd_coordinate1: 1...N
      polarizer:
        range: Polarizer
        multivalued: true
        description: Set of polarizers placed in front of the diagnostic (if any). Polarizers are assumed
          to be orthogonal to the line of sight, so that the x3 unit vector is aligned with the line of
          sight
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      psi_normalization:
        range: PsiNormalization
        description: Quantities to use to normalize psi, as a function of time
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SignalFlt1dValidityPosition:
    is_a: InformationContentEntity
    description: Radiation temperature from the closest channel to the magnetic axis, together with its
      radial location
    annotations:
      dd_type_name: signal_flt_1d_validity_position
      dd_path: ece/t_radiation_central
    attributes:
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate of the measurement
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the data for each time slice. 0: valid from automated
          processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified in the
          data processing (request verification by the diagnostic RO), -2: invalid data, should not be
          used (values lower than -2 have a code-specific meaning detailing the origin of their invalidity)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: constant
      time:
        range: float
        multivalued: true
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EceChannel:
    is_a: InformationContentEntity
    description: Set of channels (frequency)
    annotations:
      dd_type_name: ece_channel
      dd_path: ece/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      frequency:
        range: PhysicalQuantityFlt1dTime1
        description: Frequency of the channel
        annotations:
          dd_units: Hz
      harmonic:
        range: Int1dTime1AndTypeChange
        description: Harmonic detected by the channel. 1 corresponds to the "O1" mode, while 2 corresponds
          to the "X2" mode.
      line_of_sight:
        range: LineOfSight2points
        description: Line of sight of this channel, defined by two points. By convention, the first point
          is the closest to the diagnostic. Fill only in case the channels have different lines of sight
      if_bandwidth:
        range: float
        description: Full-width of the Intermediate Frequency (IF) bandpass filter
        annotations:
          dd_type: static
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      position:
        range: Rphizrhopsitheta1dDynamicAos1CommonTime1
        description: Position of the measurements (taking into account the suprathermal shift)
      delta_position_suprathermal:
        range: Rphizrhopsitheta1dDynamicAos1CommonTime1
        description: Simple estimate of the difference in position induced by the presence of suprathermal
          electrons. Position without corrections = position - delta_position_suprathermal
      t_radiation:
        range: PhysicalQuantityFlt1dTime1
        description: Radiation temperature
        annotations:
          dd_units: eV
      t_radiation_x:
        range: PhysicalQuantityFlt1dTime1
        description: Predicted radiation temperature of the e(X)traordinary mode
        annotations:
          dd_units: eV
      t_radiation_o:
        range: PhysicalQuantityFlt1dTime1
        description: Predicted radiation temperature of the Ordinary mode
        annotations:
          dd_units: eV
      voltage_t_radiation:
        range: SignalFlt1dValidity
        description: Raw voltage measured on each channel, from which the calibrated temperature data
          is then derived
        annotations:
          dd_units: V
      optical_depth:
        range: PhysicalQuantityFlt1dTime1
        description: Optical depth of the plasma at the position of the measurement. This parameter is
          a proxy for the local / non-local character of the ECE emission. It must be greater than 1 to
          guarantee that the measurement is dominated by local ECE emission (non-local otherwise)
        annotations:
          dd_units: '1'
      time:
        range: float
        multivalued: true
        description: Timebase for the processed dynamic data of this channel (outside of the beam and
          calibration_offset structures)
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
      calibration_factor:
        range: float
        description: Calibration factor, used as t_radiation = calibration_factor * (voltage_t_radiation
          - calibration_offset)
        annotations:
          dd_type: static
          dd_units: eV.V^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      calibration_offset:
        range: SignalFlt1d
        description: Calibration offset, may be re-evaluated dynamically during long pulses on some experiments
        annotations:
          dd_units: V
      beam:
        range: EceChannelBeam
        description: ECE Gaussian optics parameters taken at the line_of_sight/first_point position (for
          synthetic modelling of the ECE emission)
      beam_tracing:
        range: EceBeamTracing
        multivalued: true
        description: Beam tracing calculations, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  Int1dTime1AndTypeChange:
    is_a: InformationContentEntity
    description: Harmonic detected by the channel. 1 corresponds to the "O1" mode, while 2 corresponds
      to the "X2" mode.
    annotations:
      dd_type_name: int_1d_time_1_and_type_change
      dd_path: ece/channel/harmonic
    attributes:
      data:
        range: integer
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the data for each time slice. 0: valid from automated
          processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified in the
          data processing (request verification by the diagnostic RO), -2: invalid data, should not be
          used (values lower than -2 have a code-specific meaning detailing the origin of their invalidity)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: constant
  Rphizrhopsitheta1dDynamicAos1CommonTime1:
    is_a: InformationContentEntity
    description: Position of the measurements (taking into account the suprathermal shift)
    annotations:
      dd_type_name: rphizrhopsitheta1d_dynamic_aos1_common_time_1
      dd_path: ece/channel/position
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      phi:
        range: float
        multivalued: true
        description: Toroidal angle  (oriented counter-clockwise when viewing from above)
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      psi:
        range: float
        multivalued: true
        description: Poloidal flux
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      theta:
        range: float
        multivalued: true
        description: Poloidal angle (oriented clockwise when viewing the poloidal cross section on the
          right hand side of the tokamak axis of symmetry, with the origin placed on the plasma magnetic
          axis)
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  EceChannelBeam:
    is_a: InformationContentEntity
    description: ECE Gaussian optics parameters taken at the line_of_sight/first_point position (for synthetic
      modelling of the ECE emission)
    annotations:
      dd_type_name: ece_channel_beam
      dd_path: ece/channel/beam
    attributes:
      spot:
        range: EceChannelBeamSpot
        description: Spot ellipse characteristics
      phase:
        range: EceChannelBeamPhase
        description: Phase ellipse characteristics
  EceChannelBeamSpot:
    is_a: InformationContentEntity
    description: Spot ellipse characteristics
    annotations:
      dd_type_name: ece_channel_beam_spot
      dd_path: ece/channel/beam/spot
    attributes:
      size:
        range: SignalFlt2d
        description: Size of the spot ellipse
        annotations:
          dd_units: m
          dd_coordinate1: 1...2
          dd_coordinate2: time
      angle:
        range: SignalFlt1d
        description: Rotation angle for the spot ellipse
        annotations:
          dd_units: rad
  EceChannelBeamPhase:
    is_a: InformationContentEntity
    description: Phase ellipse characteristics
    annotations:
      dd_type_name: ece_channel_beam_phase
      dd_path: ece/channel/beam/phase
    attributes:
      curvature:
        range: SignalFlt2d
        description: Inverse curvature radii for the phase ellipse, positive/negative for divergent/convergent
          beams
        annotations:
          dd_units: m^-1
          dd_coordinate1: 1...2
          dd_coordinate2: time
      angle:
        range: SignalFlt1d
        description: Rotation angle for the phase ellipse
        annotations:
          dd_units: rad
  EceBeamTracing:
    is_a: TimeSlice
    description: Beam tracing calculations, for various time slices
    annotations:
      dd_type_name: ece_beam_tracing
      dd_path: ece/channel/beam_tracing
      fyo_lift: time_slice
    attributes:
      beam:
        range: EceBeamTracingBeam
        multivalued: true
        description: Set of rays/beams describing the wave propagation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EceBeamTracingBeam:
    is_a: InformationContentEntity
    description: Set of rays/beams describing the wave propagation
    annotations:
      dd_type_name: ece_beam_tracing_beam
      dd_path: ece/channel/beam_tracing/beam
    attributes:
      power_initial:
        range: float
        description: Initial power in the ray/beam
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      mode:
        range: string
        description: X or O mode for this beam
        annotations:
          dd_type: dynamic
      length:
        range: float
        multivalued: true
        description: Ray/beam curvilinear length
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      position:
        range: WavesRphizpsitheta1dDynamicAos3
        description: Position of the ray/beam along its path
      wave_vector:
        range: WavesBeamTracingBeamK
        description: Wave vector of the ray/beam along its path
      e_field:
        range: WavesBeamTracingBeamEField
        description: Electric field polarization of the ray/beam along its path
      power_flow_norm:
        range: WavesBeamTracingPowerFlow
        description: Normalised power flow
      electrons:
        range: WavesBeamTracingElectrons
        description: Quantities related to the electrons
      spot:
        range: WavesBeamSpot
        description: Spot ellipse characteristics
      phase:
        range: WavesBeamPhase
        description: Phase ellipse characteristics
  Polarizer:
    is_a: InformationContentEntity
    description: Set of polarizers placed in front of the diagnostic (if any). Polarizers are assumed
      to be orthogonal to the line of sight, so that the x3 unit vector is aligned with the line of sight
    annotations:
      dd_type_name: polarizer
      dd_path: ece/polarizer
    attributes:
      centre:
        range: Rphiz0dStatic
        description: If geometry_type=2, coordinates of the centre of the circle. If geometry_type=1 or
          3, coordinates of the origin of the local coordinate system (X1,X2,X3) describing the plane
          polarizer. This origin is located within the polarizer area. Note that there is some flexibility
          here and the data provider should choose the most convenient coordinate system for the object,
          respecting the definitions of (X1,X2,X3) indicated below.
      radius:
        range: float
        description: Radius of the circle, used only if geometry_type = 2
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the polarizer plane and oriented towards the plasma.
      polarization_angle:
        range: float
        description: Alignment angle of the polarizer in the (x1,x2) plane. Electric fields parallel to
          the polarizer angle will be reflected. The angle is defined with respect to the x1 unit vector,
          positive in the counter-clockwise direction when looking towards the plasma
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
