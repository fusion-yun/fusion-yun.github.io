id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/nbi
name: fyo-nbi
title: fyo IDS `nbi` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `nbi` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/nbi/dd_nbi.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Nbi
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Nbi:
    is_a: IDS
    description: Neutral Beam Injection systems and description of the fast neutrals that arrive into
      the torus
    annotations:
      dd_path: nbi
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      unit:
        range: NbiUnit
        multivalued: true
        description: The NBI system is described as a set of units of which the power can be controlled
          individually.
        annotations:
          dd_max_occurs: '32'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  NbiUnit:
    is_a: InformationContentEntity
    description: The NBI system is described as a set of units of which the power can be controlled individually.
    annotations:
      dd_type_name: nbi_unit
      dd_path: nbi/unit
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      species:
        range: PlasmaCompositionSpecies
        description: Injected species
      power_launched:
        range: SignalFlt1d
        description: Power launched from this unit into the vacuum vessel
        annotations:
          dd_units: W
      energy:
        range: SignalFlt1d
        description: Full energy of the injected species (acceleration of a single atom)
        annotations:
          dd_units: eV
      beam_current_fraction:
        range: SignalFlt2d
        description: 'Fractions of beam current distributed among the different energies, the first index
          corresponds to the fast neutrals energy (1:full, 2: half, 3: one third)'
        annotations:
          dd_units: '1'
          dd_coordinate1: 1...3
          dd_coordinate2: time
      beam_power_fraction:
        range: SignalFlt2d
        description: 'Fractions of beam power distributed among the different energies, the first index
          corresponds to the fast neutrals energy (1:full, 2: half, 3: one third)'
        annotations:
          dd_units: '1'
          dd_coordinate1: 1...3
          dd_coordinate2: time
      beamlets_group:
        range: NbiUnitBeamletsGroup
        multivalued: true
        description: Group of beamlets with common vertical and horizontal focal point. If there are no
          common focal points, then select small groups of beamlets such that a focal point description
          of the beamlets group provides a fair description. Beamlet groups are assumed to be Gaussian.
        annotations:
          dd_max_occurs: '16'
          dd_coordinate1: 1...N
      source:
        range: DetectorAperture
        description: Description of the surface of the ion source from which the beam is extracted
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures through which the beam is launched
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
  PlasmaCompositionSpecies:
    is_a: InformationContentEntity
    description: Injected species
    annotations:
      dd_type_name: plasma_composition_species
      dd_path: nbi/unit/species
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: constant
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: integer
        description: Nuclear charge
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H, D, T, ...)
        annotations:
          dd_type: constant
  NbiUnitBeamletsGroup:
    is_a: InformationContentEntity
    description: Group of beamlets with common vertical and horizontal focal point. If there are no common
      focal points, then select small groups of beamlets such that a focal point description of the beamlets
      group provides a fair description. Beamlet groups are assumed to be Gaussian.
    annotations:
      dd_type_name: nbi_unit_beamlets_group
      dd_path: nbi/unit/beamlets_group
    attributes:
      position:
        range: Rphiz0dStatic
        description: R, Z, Phi position of the beamlet group centre
      tangency_radius:
        range: float
        description: Tangency radius (major radius where the central line of a NBI unit is tangent to
          a circle around the torus)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      angle:
        range: float
        description: Angle of inclination between a beamlet at the centre of the injection unit surface
          and the horiontal plane
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      tilting:
        range: NbiUnitBeamletsGroupTilting
        multivalued: true
        description: In case of dynamic beam tilting (i.e. during the pulse), e.g. for some Beam Emission
          Spectroscopy use cases, variations of position, tangency radius and angle with respect to their
          static value, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      direction:
        range: integer
        description: 'Direction of the beam seen from above the torus: -1 = clockwise; 1 = counter clockwise'
        annotations:
          dd_type: static
      width_horizontal:
        range: float
        description: Horizontal width (dimensions of the smallest rectangle that surrounds the outer dimensions
          of the beamlets) of the beamlet group at the injection unit surface (or grounded grid)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      width_vertical:
        range: float
        description: Vertical width (dimensions of the smallest rectangle that surrounds the outer dimensions
          of the beamlets) of the beamlet group at the injection unit surface (or grounded grid)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      focus:
        range: NbiUnitBeamletsGroupFocus
        description: Describes how the beamlet group is focused. Calculations of width_min_horizontal
          and width_min_vertical are on a plane defined by the average normal vector of the two constituent
          accelerator nbi target planes.
      divergence_component:
        range: NbiUnitBeamletsGroupDivergence
        multivalued: true
        description: Detailed information on beamlet divergence. Divergence is described as a superposition
          of Gaussian components with amplitide "particles_fraction" and vertical/horizontal divergence.
          Note that for positive ion NBI the divergence is well described by a single Gaussian
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      beamlets:
        range: NbiUnitBeamletsGroupBeamlets
        description: Detailed information on beamlets
  NbiUnitBeamletsGroupTilting:
    is_a: TimeSlice
    description: In case of dynamic beam tilting (i.e. during the pulse), e.g. for some Beam Emission
      Spectroscopy use cases, variations of position, tangency radius and angle with respect to their
      static value, for various time slices
    annotations:
      dd_type_name: nbi_unit_beamlets_group_tilting
      dd_path: nbi/unit/beamlets_group/tilting
      fyo_lift: time_slice
    attributes:
      delta_position:
        range: Rphiz0dDynamicAos3
        description: Variation of the position of the beamlet group centre
      delta_tangency_radius:
        range: float
        description: Variation of the tangency radius (major radius where the central line of a NBI unit
          is tangent to a circle around the torus)
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      delta_angle:
        range: float
        description: Variation of the angle of inclination between a beamlet at the centre of the injection
          unit surface and the horiontal plane
        annotations:
          dd_type: dynamic
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NbiUnitBeamletsGroupFocus:
    is_a: InformationContentEntity
    description: Describes how the beamlet group is focused. Calculations of width_min_horizontal and
      width_min_vertical are on a plane defined by the average normal vector of the two constituent accelerator
      nbi target planes.
    annotations:
      dd_type_name: nbi_unit_beamlets_group_focus
      dd_path: nbi/unit/beamlets_group/focus
    attributes:
      focal_length_horizontal:
        range: float
        description: Horizontal focal length along the beam line, i.e. the point along the centre of the
          beamlet-group where the beamlet-group has its minimum horizontal width
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      focal_length_vertical:
        range: float
        description: Vertical focal length along the beam line, i.e. the point along the centre of the
          beamlet-group where the beamlet-group has its minimum vertical width
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      width_min_horizontal:
        range: float
        description: The horizontal width (Full Width at Half Maximum) of the beamlets group at the horizontal
          focal point
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      width_min_vertical:
        range: float
        description: The vertical width (Full Width at Half Maximum) of the beamlets group at the vertical
          focal point
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NbiUnitBeamletsGroupDivergence:
    is_a: InformationContentEntity
    description: Detailed information on beamlet divergence. Divergence is described as a superposition
      of Gaussian components with amplitide "particles_fraction" and vertical/horizontal divergence. Note
      that for positive ion NBI the divergence is well described by a single Gaussian
    annotations:
      dd_type_name: nbi_unit_beamlets_group_divergence
      dd_path: nbi/unit/beamlets_group/divergence_component
    attributes:
      particles_fraction:
        range: float
        description: Fraction of injected particles in the component
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vertical:
        range: float
        description: 'The vertical beamlet divergence of the component. Here the divergence is defined
          for Gaussian beams as the angle where the beam density is reduced by a factor 1/e compared to
          the maximum density (equivalent to the intensity for the divergence of each individual beamlet
          as the energy is assumed constant). For non-Gaussian beams the divergence is mean((x-mean(x))**2)/sqrt(2),
          where x is the angle and the mean should be performed over the beam density, P(x): mean(y)=int(y*P(x)*dx).'
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      horizontal:
        range: float
        description: 'The horiztonal beamlet divergence of the component. Here the divergence is defined
          for Gaussian beams as the angle where the beam density is reduced by a factor 1/e compared to
          the maximum density (equivalent to the intensity for the divergence of each individual beamlet
          as the energy is assumed constant). For non-Gaussian beams the divergence is mean((x-mean(x))**2)/sqrt(2),
          where x is the angle and the mean should be performed over the beam density, P(x): mean(y)=int(y*P(x)*dx).'
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NbiUnitBeamletsGroupBeamlets:
    is_a: InformationContentEntity
    description: Detailed information on beamlets
    annotations:
      dd_type_name: nbi_unit_beamlets_group_beamlets
      dd_path: nbi/unit/beamlets_group/beamlets
    attributes:
      positions:
        range: Rphiz1dStatic
        description: Position of each beamlet
      tangency_radii:
        range: float
        multivalued: true
        description: Tangency radius (major radius where the central line of a beamlet is tangent to a
          circle around the torus), for each beamlet
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../positions/r
      angles:
        range: float
        multivalued: true
        description: Angle of inclination between a line at the centre of a beamlet and the horizontal
          plane, for each beamlet
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../positions/r
      power_fractions:
        range: float
        multivalued: true
        description: Fraction of power of a unit injected by each beamlet
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../positions/r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../positions/r
