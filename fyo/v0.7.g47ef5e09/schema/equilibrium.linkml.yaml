  EqulibriumGlobalQuantities:
    is_a: InformationContentEntity
    description: 0D parameters of the equilibrium
    annotations:
      dd_type_name: equlibrium_global_quantities
      dd_path: equilibrium/time_slice/global_quantities
    attributes:
      beta_pol:
        range: float
        description: Poloidal beta. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      beta_tor:
        range: float
        description: Toroidal beta, defined as the volume-averaged total perpendicular pressure divided
          by (B0^2/(2*mu0)), i.e. beta_toroidal = 2 mu0 int(p dV) / V / B0^2
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      beta_tor_norm:
        range: float
        description: Normalized toroidal beta, defined as 100 * beta_tor * a[m] * B0 [T] / ip [MA]
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      ip:
        range: float
        description: Plasma current (toroidal component). Positive sign means anti-clockwise when viewed
          from above.
        annotations:
          dd_type: dynamic
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      li_3:
        range: float
        description: Internal inductance
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      volume:
        range: float
        description: Total plasma volume
        annotations:
          dd_type: dynamic
          dd_units: m^3
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      area:
        range: float
        description: Area of the LCFS poloidal cross section
        annotations:
          dd_type: dynamic
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      surface:
        range: float
        description: Surface area of the toroidal flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length_pol:
        range: float
        description: Poloidal length of the magnetic surface
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_axis:
        range: float
        description: Poloidal flux at the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_magnetic_axis:
        range: float
        description: Poloidal flux at the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_boundary:
        range: float
        description: Poloidal flux at the selected plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rho_tor_boundary:
        range: float
        description: Toroidal flux coordinate at the selected plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      magnetic_axis:
        range: EquilibriumGlobalQuantitiesMagneticAxis
        description: Magnetic axis position and toroidal field
      current_centre:
        range: EquilibriumGlobalQuantitiesCurrentCentre
        description: Position and vertical velocity of the current centre
      q_axis:
        range: float
        description: q at the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      q_95:
        range: float
        description: q at the 95% poloidal flux surface (only positive when toroidal current and magnetic
          field are in same direction)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      q_min:
        range: EquilibriumGlobalQuantitiesQmin
        description: Minimum q value and position
      energy_mhd:
        range: float
        description: Plasma energy content = 3/2 * int(p,dV) with p being the total pressure (thermal
          + fast particles) [J]. Time-dependent; Scalar
        annotations:
          dd_type: dynamic
          dd_units: J
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_external_average:
        range: float
        description: 'Average (over the plasma poloidal cross section) plasma poloidal magnetic flux produced
          by all external circuits (CS and PF coils, eddy currents, VS in-vessel coils), given by the
          following formula : int(psi_external.j_tor.dS) / Ip'
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      v_external:
        range: float
        description: 'External voltage, i.e. time derivative of psi_external_average (with a minus sign
          : - d_psi_external_average/d_time)'
        annotations:
          dd_type: dynamic
          dd_units: V
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      plasma_inductance:
        range: float
        description: Plasma inductance 2 E_magnetic/Ip^2, where E_magnetic = 1/2 * int(psi.j_tor.dS) (integral
          over the plasma poloidal cross-section)
        annotations:
          dd_type: dynamic
          dd_units: H
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      plasma_resistance:
        range: float
        description: Plasma resistance = int(e_field.j.dV) / Ip^2
        annotations:
          dd_type: dynamic
          dd_units: ohm
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumGlobalQuantitiesMagneticAxis:
    is_a: InformationContentEntity
    description: Magnetic axis position and toroidal field
    annotations:
      dd_type_name: equilibrium_global_quantities_magnetic_axis
