id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/equilibrium
name: fyo-equilibrium
title: fyo IDS `equilibrium` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `equilibrium` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/equilibrium/dd_equilibrium.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Equilibrium
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Equilibrium:
    is_a: IDS
    description: Description of a 2D, axi-symmetric, tokamak equilibrium; result of an equilibrium code.
    annotations:
      dd_path: equilibrium
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      grids_ggd:
        range: EquilibriumGgdArray
        multivalued: true
        description: Grids (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the time_slice timebase
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      time_slice:
        range: EquilibriumTimeSlice
        multivalued: true
        description: Set of equilibria at various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EquilibriumGgdArray:
    is_a: TimeSlice
    description: Grids (using the Generic Grid Description), for various time slices. The timebase of
      this array of structure must be a subset of the time_slice timebase
    annotations:
      dd_type_name: equilibrium_ggd_array
      dd_path: equilibrium/grids_ggd
      fyo_lift: time_slice
    attributes:
      grid:
        range: GenericGridDynamic
        multivalued: true
        description: Set of GGD grids for describing the equilibrium, at a given time slice
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumTimeSlice:
    is_a: TimeSlice
    description: Set of equilibria at various time slices
    annotations:
      dd_type_name: equilibrium_time_slice
      dd_path: equilibrium/time_slice
      fyo_lift: time_slice
    attributes:
      boundary:
        range: EquilibriumBoundary
        description: Description of the plasma boundary. The boundary can be either the real separatrix
          (provided by a free boundary equilibrium solver) or the 0.99x psi_norm flux surface provided
          by a fixed boundary equilibrium
      contour_tree:
        range: EquilibriumContourTree
        description: Description of the topological connectivity of the poloidal flux map critical points
          as an undirected graph. Critical points are ether local extremum (o-points) or saddle points
          (x-points) of the poloidal flux map. X-points have zero gradients in orthogonal directions but
          are not local extremum of the poloidal flux map whilst O-points are.
      constraints:
        range: EquilibriumConstraints
        description: 'In case of equilibrium reconstruction under constraints, measurements used to constrain
          the equilibrium, reconstructed values and accuracy of the fit. The names of the child nodes
          correspond to the following definition: the solver aims at minimizing a cost function defined
          as : J=1/2*sum_i [ weight_i^2 (reconstructed_i - measured_i)^2 / sigma_i^2 ]. in which sigma_i
          is the standard deviation of the measurement error (to be found in the IDS of the measurement)'
      global_quantities:
        range: EqulibriumGlobalQuantities
        description: 0D parameters of the equilibrium
      profiles_1d:
        range: EquilibriumProfiles1d
        description: Equilibrium profiles (1D radial grid) as a function of the poloidal flux
      profiles_2d:
        range: EquilibriumProfiles2d
        multivalued: true
        description: Equilibrium 2D profiles in the poloidal plane. Multiple 2D representations of the
          equilibrium can be stored here.
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
          fyo_lift: representation_set
          fyo_note: elements are spo:equivalent_representation peers — one referent quantity on alternative
            grids/charts
      ggd:
        range: EquilibriumGgd
        multivalued: true
        description: Set of equilibrium representations using the generic grid description
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: ../../grids_ggd(itime)/grid
      coordinate_system:
        range: EquilibriumCoordinateSystem
        description: Flux surface coordinate system on a square grid of flux and poloidal angle
      convergence:
        range: EquilibriumConvergence
        description: Convergence details
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumBoundary:
    is_a: InformationContentEntity
    description: Description of the plasma boundary. The boundary can be either the real separatrix (provided
      by a free boundary equilibrium solver) or the 0.99x psi_norm flux surface provided by a fixed boundary
      equilibrium
    annotations:
      dd_type_name: equilibrium_boundary
      dd_path: equilibrium/time_slice/boundary
    attributes:
      type:
        range: integer
        description: 0 (limiter) or 1 (diverted)
        annotations:
          dd_type: dynamic
      outline:
        range: Rz1dDynamicAos
        description: RZ outline of the plasma boundary
      psi_norm:
        range: float
        description: Value of the normalized poloidal flux at which the boundary is taken, the flux being
          normalized to its value at the separatrix (so psi_norm = 1 if the boundary is the separatrix)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi:
        range: float
        description: Value of the poloidal flux at which the boundary is taken
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      geometric_axis:
        range: Rz0dDynamicAos
        description: RZ position of the geometric axis (defined as (Rmin+Rmax) / 2 and (Zmin+Zmax) / 2
          of the boundary)
      minor_radius:
        range: float
        description: Minor radius of the plasma boundary (defined as (Rmax-Rmin) / 2 of the boundary)
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      elongation:
        range: float
        description: Elongation of the plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      triangularity:
        range: float
        description: Triangularity of the plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      triangularity_upper:
        range: float
        description: Upper triangularity of the plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      triangularity_lower:
        range: float
        description: Lower triangularity of the plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      squareness_upper_inner:
        range: float
        description: Upper inner squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      squareness_upper_outer:
        range: float
        description: Upper outer squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      squareness_lower_inner:
        range: float
        description: Lower inner squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      squareness_lower_outer:
        range: float
        description: Lower outer squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      closest_wall_point:
        range: EquilibriumBoundaryClosest
        description: Position and distance to the plasma boundary of the point of the first wall which
          is the closest to plasma boundary
      dr_dz_zero_point:
        range: Rz0dDynamicAos
        description: Outboard point on the separatrix on which dr/dz = 0 (local maximum of the major radius
          of the separatrix). In case of multiple local maxima, the closest one from z=z_magnetic_axis
          is chosen.
      gap:
        range: EquilibriumGap
        multivalued: true
        description: Set of gaps, defined by a reference point and a direction.
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      rho_tor:
        range: float
        description: Toroidal flux coordinate at the selected plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phi:
        range: float
        description: Toroidal flux at the selected plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phi_poloidal_current:
        range: float
        description: Toroidal flux at the selected plasma boundary generated by the plasma poloidal current
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumBoundaryClosest:
    is_a: InformationContentEntity
    description: Position and distance to the plasma boundary of the point of the first wall which is
      the closest to plasma boundary
    annotations:
      dd_type_name: equilibrium_boundary_closest
      dd_path: equilibrium/time_slice/boundary/closest_wall_point
    attributes:
      r:
        range: float
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      distance:
        range: float
        description: Distance to the plasma boundary
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumGap:
    is_a: InformationContentEntity
    description: Set of gaps, defined by a reference point and a direction.
    annotations:
      dd_type_name: equilibrium_gap
      dd_path: equilibrium/time_slice/boundary/gap
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: dynamic
      description:
        range: string
        description: Description, e.g. mid-plane gap
        annotations:
          dd_type: dynamic
      r:
        range: float
        description: Major radius of the reference point
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Height of the reference point
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      angle:
        range: float
        description: Angle measured clockwise from radial cylindrical vector (grad R) to gap vector (pointing
          away from reference point)
        annotations:
          dd_type: dynamic
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      value:
        range: float
        description: Value of the gap, i.e. distance between the reference point and the separatrix along
          the gap direction
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumContourTree:
    is_a: InformationContentEntity
    description: Description of the topological connectivity of the poloidal flux map critical points
      as an undirected graph. Critical points are ether local extremum (o-points) or saddle points (x-points)
      of the poloidal flux map. X-points have zero gradients in orthogonal directions but are not local
      extremum of the poloidal flux map whilst O-points are.
    annotations:
      dd_type_name: equilibrium_contour_tree
      dd_path: equilibrium/time_slice/contour_tree
    attributes:
      node:
        range: EquilibriumContourTreeNode
        multivalued: true
        description: Set of nodes. A contour tree node is defined by its critical type and position within
          the poloidal plane. A critical type of 1 references an x-point whilst a critical type of 0 or
          2 references an o-point. Both X-points and O-points are rarely coincident with nodes defining
          the poloidal upon which the poloidal flux map is defined. The order in which the critical points
          are stored in the nodes array of structure is only important for the primary plasma O-point
          and X-points. If present, the primary plasma O-point should be placed as the first element of
          the nodes array of structure. If present, the primary plasma X-point should be the second element
          in the nodes structure
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      edges:
        range: integer
        multivalued: true
        description: Edges connect nodes to one another. A single node may connect to multiple edges such
          as the case where a single maximum (a hill) may topologically link to multiple minima (the floors
          of different valleys). For each edge (1st dimension), the index of the two connected nodes are
          listed (index referring to the ../node array)
        annotations:
          dd_type: dynamic
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...2
  EquilibriumContourTreeNode:
    is_a: InformationContentEntity
    description: Set of nodes. A contour tree node is defined by its critical type and position within
      the poloidal plane. A critical type of 1 references an x-point whilst a critical type of 0 or 2
      references an o-point. Both X-points and O-points are rarely coincident with nodes defining the
      poloidal upon which the poloidal flux map is defined. The order in which the critical points are
      stored in the nodes array of structure is only important for the primary plasma O-point and X-points.
      If present, the primary
    annotations:
      dd_type_name: equilibrium_contour_tree_node
      dd_path: equilibrium/time_slice/contour_tree/node
    attributes:
      critical_type:
        range: integer
        description: 0-minimum, 1-saddle, 2-maximum
        annotations:
          dd_type: dynamic
      r:
        range: float
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi:
        range: float
        description: Value of the poloidal flux at the node
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      levelset:
        range: Rz1dDynamicAos
        description: Single poloidal flux contour including critical point (x-point only)
  EquilibriumConstraints:
    is_a: InformationContentEntity
    description: 'In case of equilibrium reconstruction under constraints, measurements used to constrain
      the equilibrium, reconstructed values and accuracy of the fit. The names of the child nodes correspond
      to the following definition: the solver aims at minimizing a cost function defined as : J=1/2*sum_i
      [ weight_i^2 (reconstructed_i - measured_i)^2 / sigma_i^2 ]. in which sigma_i is the standard deviation
      of the measurement error (to be found in the IDS of the measurement)'
    annotations:
      dd_type_name: equilibrium_constraints
      dd_path: equilibrium/time_slice/constraints
    attributes:
      b_field_tor_vacuum_r:
        range: EquilibriumConstraints0D
        description: Vacuum field times major radius in the toroidal field magnet. Positive sign means
          anti-clockwise when viewed from above
        annotations:
          dd_units: T.m
      b_field_pol_probe:
        range: EquilibriumConstraints0DOneLike
        multivalued: true
        description: Set of poloidal field probes
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:magnetics/b_field_pol_probe
      diamagnetic_flux:
        range: EquilibriumConstraints0DB0Like
        description: Diamagnetic flux
        annotations:
          dd_units: Wb
      faraday_angle:
        range: EquilibriumConstraints0D
        multivalued: true
        description: Set of faraday angles
        annotations:
          dd_units: rad
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:polarimeter/channel
      mse_polarization_angle:
        range: EquilibriumConstraints0D
        multivalued: true
        description: Set of MSE polarization angles
        annotations:
          dd_units: rad
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:mse/channel
      flux_loop:
        range: EquilibriumConstraints0D
        multivalued: true
        description: Set of flux loops
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:magnetics/flux_loop
      ip:
        range: EquilibriumConstraints0DIpLike
        description: Plasma current. Positive sign means anti-clockwise when viewed from above
        annotations:
          dd_units: A
      iron_core_segment:
        range: EquilibriumConstraintsMagnetization
        multivalued: true
        description: Magnetization M of a set of iron core segments
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:iron_core/segment
      n_e:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of local density measurements
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      n_e_line:
        range: EquilibriumConstraints0D
        multivalued: true
        description: Set of line integrated density measurements
        annotations:
          dd_units: m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:interferometer/channel
      pf_current:
        range: EquilibriumConstraints0DIpLike
        multivalued: true
        description: Current in a set of poloidal field coils
        annotations:
          dd_units: A
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:pf_active/coil
      pf_passive_current:
        range: EquilibriumConstraints0D
        multivalued: true
        description: Current in a set of axisymmetric passive conductors
        annotations:
          dd_units: A
          dd_max_occurs: unbounded
          dd_coordinate1: IDS:pf_passive/loop
      pressure:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of total pressure estimates
        annotations:
          dd_units: Pa
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      pressure_rotational:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of rotational pressure estimates. The rotational pressure is defined as R0^2*rho*omega^2
          / 2, where omega is the toroidal rotation frequency, rho=ne(R0,psi)*m, and m is the plasma equivalent
          mass.
        annotations:
          dd_units: Pa
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      q:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of safety factor estimates at various positions
        annotations:
          dd_units: '1'
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_phi:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of flux-surface averaged toroidal current density approximations at various positions  (=
          average(j_tor/R) / average(1/R))
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_parallel:
        range: EquilibriumConstraints0DPosition
        multivalued: true
        description: Set of flux-surface averaged parallel current density approximations at various positions
          (= average(j.B) / B0, where B0 = /vacuum_toroidal_field/b0)
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      x_point:
        range: EquilibriumConstraintsPurePosition
        multivalued: true
        description: Array of X-points, for each of them the RZ position is given
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      strike_point:
        range: EquilibriumConstraintsPurePosition
        multivalued: true
        description: Array of strike points, for each of them the RZ position is given
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      chi_squared_reduced:
        range: float
        description: Sum of the chi_squared of all constraints used for the equilibrium reconstruction,
          divided by the number of degrees of freedom of the identification model
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      freedom_degrees_n:
        range: integer
        description: Number of degrees of freedom of the identification model
        annotations:
          dd_type: dynamic
      constraints_n:
        range: integer
        description: Number of constraints used (i.e. having a non-zero weight)
        annotations:
          dd_type: dynamic
  EquilibriumConstraints0D:
    is_a: InformationContentEntity
    description: Vacuum field times major radius in the toroidal field magnet. Positive sign means anti-clockwise
      when viewed from above
    annotations:
      dd_type_name: equilibrium_constraints_0D
      dd_path: equilibrium/time_slice/constraints/b_field_tor_vacuum_r
    attributes:
      measured:
        range: float
        description: Measured value
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      source:
        range: string
        description: Path to the source data for this measurement in the IMAS data dictionary
        annotations:
          dd_type: dynamic
      time_measurement:
        range: float
        description: Exact time slice used from the time array of the measurement source data. If the
          time slice does not exist in the time array of the source data, it means linear interpolation
          has been used
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      exact:
        range: integer
        description: 'Integer flag : 1 means exact data, taken as an exact input without being fitted;
          0 means the equilibrium code does a least square fit'
        annotations:
          dd_type: dynamic
      weight:
        range: float
        description: Weight given to the measurement
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      reconstructed:
        range: float
        description: Value calculated from the reconstructed equilibrium
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      chi_squared:
        range: float
        description: 'Squared error normalized by the variance considered in the minimization process
          : chi_squared = weight^2 *(reconstructed - measured)^2 / sigma^2, where sigma is the standard
          deviation of the measurement error'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumConstraints0DOneLike:
    is_a: InformationContentEntity
    description: Set of poloidal field probes
    annotations:
      dd_type_name: equilibrium_constraints_0D_one_like
      dd_path: equilibrium/time_slice/constraints/b_field_pol_probe
    attributes:
      measured:
        range: float
        description: Measured value
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      source:
        range: string
        description: Path to the source data for this measurement in the IMAS data dictionary
        annotations:
          dd_type: dynamic
      time_measurement:
        range: float
        description: Exact time slice used from the time array of the measurement source data. If the
          time slice does not exist in the time array of the source data, it means linear interpolation
          has been used
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      exact:
        range: integer
        description: 'Integer flag : 1 means exact data, taken as an exact input without being fitted;
          0 means the equilibrium code does a least square fit'
        annotations:
          dd_type: dynamic
      weight:
        range: float
        description: Weight given to the measurement
        annotations:
          dd_type: dynamic
