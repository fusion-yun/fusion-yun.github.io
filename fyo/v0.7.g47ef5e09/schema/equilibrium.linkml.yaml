          fyo_domain: ../psi
      volume:
        range: float
        multivalued: true
        description: Volume enclosed in the flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
