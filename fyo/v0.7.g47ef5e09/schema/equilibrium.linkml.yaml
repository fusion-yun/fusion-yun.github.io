        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      b_field_phi:
        range: float
        description: Total toroidal magnetic field at the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: T
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumGlobalQuantitiesCurrentCentre:
    is_a: InformationContentEntity
    description: Position and vertical velocity of the current centre
    annotations:
