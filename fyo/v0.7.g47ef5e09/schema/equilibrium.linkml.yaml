        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      squareness_lower_outer:
        range: float
        multivalued: true
