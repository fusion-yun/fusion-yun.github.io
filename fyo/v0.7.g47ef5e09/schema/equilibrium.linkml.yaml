          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      dvolume_drho_tor:
        range: float
        multivalued: true
        description: Radial derivative of the volume enclosed in the flux surface with respect to Rho_Tor
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      area:
        range: float
        multivalued: true
        description: Cross-sectional area of the flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../psi
