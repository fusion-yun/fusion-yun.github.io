          fyo_domain: ../psi
      surface:
        range: float
        multivalued: true
        description: Surface area of the toroidal flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      trapped_fraction:
        range: float
        multivalued: true
        description: Trapped particle fraction
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm1:
        range: float
        multivalued: true
        description: Flux surface averaged 1/R^2
        annotations:
          dd_type: dynamic
          dd_units: m^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm2:
        range: float
        multivalued: true
        description: Flux surface averaged |grad_rho_tor|^2/R^2
        annotations:
          dd_type: dynamic
          dd_units: m^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm3:
        range: float
        multivalued: true
        description: Flux surface averaged |grad_rho_tor|^2
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm4:
        range: float
        multivalued: true
        description: Flux surface averaged 1/B^2
        annotations:
          dd_type: dynamic
          dd_units: T^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm5:
        range: float
        multivalued: true
        description: Flux surface averaged B^2
        annotations:
          dd_type: dynamic
          dd_units: T^2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm6:
        range: float
        multivalued: true
        description: Flux surface averaged |grad_rho_tor|^2/B^2
        annotations:
          dd_type: dynamic
          dd_units: T^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm7:
        range: float
        multivalued: true
        description: Flux surface averaged |grad_rho_tor|
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm8:
        range: float
        multivalued: true
        description: Flux surface averaged R
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      gm9:
        range: float
        multivalued: true
        description: Flux surface averaged 1/R
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      b_field_average:
        range: float
        multivalued: true
        description: Flux surface averaged modulus of B (always positive, irrespective of the sign convention
          for the B-field direction).
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      b_field_min:
        range: float
        multivalued: true
        description: Minimum(modulus(B)) on the flux surface (always positive, irrespective of the sign
          convention for the B-field direction)
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      b_field_max:
        range: float
        multivalued: true
        description: Maximum(modulus(B)) on the flux surface (always positive, irrespective of the sign
          convention for the B-field direction)
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      beta_pol:
        range: float
        multivalued: true
        description: Poloidal beta profile. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      mass_density:
        range: float
        multivalued: true
        description: Mass density
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-3
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
  EquilibriumProfiles1dRz1dDynamicAos:
    is_a: InformationContentEntity
    description: RZ position of the geometric axis of the magnetic surfaces (defined as (Rmin+Rmax) /
      2 and (Zmin+Zmax) / 2 of the surface)
    annotations:
      dd_type_name: equilibrium_profiles_1d_rz1d_dynamic_aos
      dd_path: equilibrium/time_slice/profiles_1d/geometric_axis
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../psi
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../psi
  EquilibriumProfiles2d:
    is_a: InformationContentEntity
    description: Equilibrium 2D profiles in the poloidal plane. Multiple 2D representations of the equilibrium
      can be stored here.
    annotations:
      dd_type_name: equilibrium_profiles_2d
      dd_path: equilibrium/time_slice/profiles_2d
    attributes:
      type:
        range: Identifier
        description: Type of profiles (distinguishes contribution from plasma, vaccum fields and total
          fields)
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      r:
        range: float
        multivalued: true
        description: Values of the major radius on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      z:
        range: float
        multivalued: true
        description: Values of the Height on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      psi:
        range: float
        multivalued: true
        description: Values of the poloidal flux at the grid in the poloidal plane. The poloidal flux
          is integral of magnetic field passing through a contour defined by the intersection of a flux
          surface passing through the point of interest and a Z=constant plane. If the integration surface
          is flat, the surface normal vector is in the increasing vertical coordinate direction, Z, namely
          upwards.
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      theta:
        range: float
        multivalued: true
        description: Values of poloidal angle on the grid. The poloidal angle is centered on the magnetic
          axis and oriented such that (grad rho_tor_norm, grad theta, grad phi) form a right-handed set
          where grad rho_tor_norm points away from the magnetic axis.
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      phi:
        range: float
        multivalued: true
        description: Toroidal flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      j_phi:
        range: float
        multivalued: true
        description: Toroidal plasma current density
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      j_parallel:
        range: float
        multivalued: true
        description: Defined as (j.B)/B0 where j and B are the current density and magnetic field vectors
          and B0 is the (signed) vacuum toroidal magnetic field strength at the geometric reference point
          (R0,Z0). It is formally not the component of the plasma current density parallel to the magnetic
          field
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      b_field_r:
        range: float
        multivalued: true
        description: R component of the poloidal magnetic field
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      b_field_phi:
        range: float
        multivalued: true
        description: Toroidal component of the magnetic field
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      b_field_z:
        range: float
        multivalued: true
        description: Z component of the magnetic field
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
  EquilibriumGgd:
    is_a: InformationContentEntity
    description: Set of equilibrium representations using the generic grid description
    annotations:
      dd_type_name: equilibrium_ggd
      dd_path: equilibrium/time_slice/ggd
    attributes:
      r:
        range: GenericGridScalar
        multivalued: true
        description: Values of the major radius on various grid subsets
        annotations:
          dd_units: m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z:
        range: GenericGridScalar
        multivalued: true
        description: Values of the Height on various grid subsets
        annotations:
          dd_units: m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      psi:
        range: GenericGridScalar
        multivalued: true
        description: Values of the poloidal flux, given on various grid subsets
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      phi:
        range: GenericGridScalar
        multivalued: true
        description: Values of the toroidal flux, given on various grid subsets
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      theta:
        range: GenericGridScalar
        multivalued: true
        description: Values of the poloidal angle, given on various grid subsets. The poloidal angle is
          centered on the magnetic axis and oriented such that (grad rho_tor_norm, grad theta, grad phi)
          form a right-handed set where grad rho_tor_norm points away from the magnetic axis.
        annotations:
          dd_units: rad
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal plasma current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_parallel:
        range: GenericGridScalar
        multivalued: true
        description: Parallel (to magnetic field) plasma current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_r:
        range: GenericGridScalar
        multivalued: true
        description: R component of the poloidal magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_z:
        range: GenericGridScalar
        multivalued: true
        description: Z component of the magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  EquilibriumCoordinateSystem:
    is_a: InformationContentEntity
    description: Flux surface coordinate system on a square grid of flux and poloidal angle
    annotations:
      dd_type_name: equilibrium_coordinate_system
      dd_path: equilibrium/time_slice/coordinate_system
    attributes:
      grid_type:
        range: Identifier
        description: Type of coordinate system
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid
      r:
        range: float
        multivalued: true
        description: Values of the major radius on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      z:
        range: float
        multivalued: true
        description: Values of the Height on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      jacobian:
        range: float
        multivalued: true
        description: Absolute value of the jacobian of the coordinate system
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      tensor_covariant:
        range: float
        multivalued: true
        description: Covariant metric tensor on every point of the grid described by grid_type
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 4
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          dd_coordinate3: 1...3
          dd_coordinate4: 1...3
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2,1...3,1...3
      tensor_contravariant:
        range: float
        multivalued: true
        description: Contravariant metric tensor on every point of the grid described by grid_type
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 4
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          dd_coordinate3: 1...3
          dd_coordinate4: 1...3
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2,1...3,1...3
  EquilibriumConvergence:
    is_a: InformationContentEntity
    description: Convergence details
    annotations:
      dd_type_name: equilibrium_convergence
      dd_path: equilibrium/time_slice/convergence
    attributes:
      iterations_n:
        range: integer
        description: Number of iterations carried out in the convergence loop
        annotations:
          dd_type: dynamic
      grad_shafranov_deviation_expression:
        range: Identifier
        description: Expression for calculating the residual deviation between the left and right hand
          side of the Grad Shafranov equation
      grad_shafranov_deviation_value:
        range: float
        description: Value of the residual deviation between the left and right hand side of the Grad
          Shafranov equation, evaluated as per grad_shafranov_deviation_expression
        annotations:
          dd_type: dynamic
          dd_units: mixed
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      result:
        range: Identifier
        description: Convergence result
