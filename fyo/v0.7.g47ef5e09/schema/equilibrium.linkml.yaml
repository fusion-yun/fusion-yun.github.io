      dd_path: equilibrium/time_slice/global_quantities/current_centre
    attributes:
      r:
        range: float
        description: Major radius of the current center, defined as integral over the poloidal cross section
          of (j_tor*r*dS) / Ip
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Height of the current center, defined as integral over the poloidal cross section
          of (j_tor*z*dS) / Ip
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      velocity_z:
        range: float
        description: Vertical velocity of the current center
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumGlobalQuantitiesQmin:
    is_a: InformationContentEntity
    description: Minimum q value and position
    annotations:
      dd_type_name: equilibrium_global_quantities_qmin
      dd_path: equilibrium/time_slice/global_quantities/q_min
    attributes:
      value:
        range: float
        description: Minimum q value
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rho_tor_norm:
        range: float
        description: Minimum q position in normalized toroidal flux coordinate
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_norm:
        range: float
        description: Minimum q position in normalised poloidal flux
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi:
        range: float
        description: Minimum q position in poloidal flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  EquilibriumProfiles1d:
    is_a: InformationContentEntity
    description: Equilibrium profiles (1D radial grid) as a function of the poloidal flux
    annotations:
      dd_type_name: equilibrium_profiles_1d
      dd_path: equilibrium/time_slice/profiles_1d
    attributes:
      psi:
        range: float
        multivalued: true
        description: Poloidal flux. Integral of magnetic field passing through a contour defined by the
          intersection of a flux surface passing through the point of interest and a Z=constant plane.
          If the integration surface is flat, the surface normal vector is in the increasing vertical
          coordinate direction, Z, namely upwards.
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      psi_norm:
        range: float
        multivalued: true
        description: Normalised poloidal flux, namely (psi(rho)-psi(magnetic_axis)) / (psi(LCFS)-psi(magnetic_axis))
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      phi:
        range: float
        multivalued: true
        description: Toroidal flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      pressure:
        range: float
        multivalued: true
        description: Pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      f:
        range: float
        multivalued: true
        description: Diamagnetic function (F=R B_Phi)
        annotations:
          dd_type: dynamic
          dd_units: T.m
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      dpressure_dpsi:
        range: float
        multivalued: true
        description: Derivative of pressure w.r.t. psi
        annotations:
          dd_type: dynamic
          dd_units: Pa.Wb^-1
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      f_df_dpsi:
        range: float
        multivalued: true
        description: Derivative of F w.r.t. Psi, multiplied with F
        annotations:
          dd_type: dynamic
          dd_units: T^2.m^2.Wb^-1
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      j_phi:
        range: float
        multivalued: true
        description: Flux surface averaged toroidal current density = average(j_tor/R) / average(1/R)
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      j_parallel:
        range: float
        multivalued: true
        description: Flux surface averaged approximation to parallel current density = average(j.B) /
          B0, where B0 = /vacuum_toroidal_field/b0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      q:
        range: float
        multivalued: true
        description: Safety factor (only positive when toroidal current and magnetic field are in same
          direction)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      magnetic_shear:
        range: float
        multivalued: true
        description: Magnetic shear, defined as rho_tor/q . dq/drho_tor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      r_inboard:
        range: float
        multivalued: true
        description: Radial coordinate (major radius) on the inboard side of the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      r_outboard:
        range: float
        multivalued: true
        description: Radial coordinate (major radius) on the outboard side of the magnetic axis
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      rho_tor:
        range: float
        multivalued: true
        description: Toroidal flux coordinate = sqrt(phi/(pi*b0)), where the toroidal flux, phi, corresponds
          to time_slice/profiles_1d/phi, the toroidal magnetic field, b0, corresponds to that stored in
          vacuum_toroidal_field/b0 and pi can be found in the IMAS constants
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate. The normalizing value for rho_tor_norm, is the
          toroidal flux coordinate at the equilibrium boundary (LCFS or 99.x % of the LCFS in case of
          a fixed boundary equilibium calculation). Namely (rho_tor(rho)-rho_tor(magnetic_axis)) / (rho_tor(boundary)-rho_tor(magnetic_axis))
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      dpsi_drho_tor:
        range: float
        multivalued: true
        description: Derivative of Psi with respect to Rho_Tor
        annotations:
          dd_type: dynamic
          dd_units: Wb.m^-1
          dd_ndim: 1
          dd_coordinate1: ../psi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../psi
      geometric_axis:
        range: EquilibriumProfiles1dRz1dDynamicAos
