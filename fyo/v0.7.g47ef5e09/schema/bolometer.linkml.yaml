id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/bolometer
name: fyo-bolometer
title: fyo IDS `bolometer` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `bolometer` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/bolometer/dd_bolometer.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: Bolometer
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Bolometer:
    is_a: IDS
    description: Bolometer diagnostic
    annotations:
      dd_path: bolometer
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      camera:
        range: BolometerCamera
        multivalued: true
        description: Set of cameras
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      power_radiated_total:
        range: float
        multivalued: true
        description: Total radiated power reconstructed from bolometry data
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_radiated_inside_lcfs:
        range: float
        multivalued: true
        description: Radiated power from the plasma inside the Last Closed Flux Surface, reconstructed
          from bolometry data
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_radiated_validity:
        range: integer
        multivalued: true
        description: Validity flag related to the radiated power reconstructions
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types for the 2D power density map
      grid:
        range: Profiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      power_density:
        range: SignalFlt3d
        description: Power density map in the poloidal cross-section, obtained from tomographic inversion
          of the bolometer data
        annotations:
          dd_units: W.m^-3
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  BolometerCamera:
    is_a: InformationContentEntity
    description: Set of cameras
    annotations:
      dd_type_name: bolometer_camera
      dd_path: bolometer/camera
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “Camera viewing the upper divertor”
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: Camera type
      channel:
        range: BolometerChannel
        multivalued: true
        description: Set of channels (detector or pixel of a camera)
        annotations:
          dd_max_occurs: '500'
          dd_coordinate1: 1...N
  BolometerChannel:
    is_a: InformationContentEntity
    description: Set of channels (detector or pixel of a camera)
    annotations:
      dd_type_name: bolometer_channel
      dd_path: bolometer/camera/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      detector:
        range: DetectorAperture
        description: Detector description
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      subcollimators_n:
        range: integer
        description: Number of sub-collimators
        annotations:
          dd_type: static
      subcollimators_separation:
        range: float
        description: Thickness of separation between sub-collimators
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      etendue:
        range: float
        description: Etendue (geometric extent) of the channel's optical system
        annotations:
          dd_type: static
          dd_units: m^2.sr
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      etendue_method:
        range: Identifier
        description: 'Method used to calculate the etendue. Index = 0 : exact calculation with a 4D integral;
          1 : approximation with first order formula (detector surface times solid angle subtended by
          the apertures); 2 : other methods'
      line_of_sight:
        range: LineOfSight3points
        description: Description of the reference line of sight of the channel, defined by two points
          when the beam is not reflected, a third point is added to define the reflected beam path
      power:
        range: SignalFlt1d
        description: Power received on the detector
        annotations:
          dd_units: W
      validity_timed:
        range: SignalInt1d
        description: Indicator of the validity of the channel as a function of time (0 means valid, negative
          values mean non-valid)
      validity:
        range: integer
        description: Indicator of the validity of the channel for the whole acquisition period (0 means
          valid, negative values mean non-valid)
        annotations:
          dd_type: static
  Profiles2dGrid:
    is_a: Mesh
    description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected grid_type)
    annotations:
      dd_type_name: profiles_2d_grid
      dd_path: bolometer/grid
      fyo_lift: grid
    attributes:
      dim1:
        range: float
        multivalued: true
        description: First dimension values
        annotations:
          dd_type: constant
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      dim2:
        range: float
        multivalued: true
        description: Second dimension values
        annotations:
          dd_type: constant
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      volume_element:
        range: float
        multivalued: true
        description: Volume of plasma enclosed in the cell formed by the nodes [dim1(i) dim2(j)], [dim1(i+1)
          dim2(j)], [dim1(i) dim2(j+1)] and [dim1(i+1) dim2(j+1)]
        annotations:
          dd_type: constant
          dd_units: m^3
          dd_ndim: 2
          dd_coordinate1: ../dim1
          dd_coordinate2: ../dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../dim1,../dim2
