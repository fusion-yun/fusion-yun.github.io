id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/edge_sources
name: fyo-edge_sources
title: fyo IDS `edge_sources` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `edge_sources` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/edge_sources/dd_edge_sources.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: EdgeSources
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  EdgeSources:
    is_a: IDS
    description: Edge plasma sources. Energy terms correspond to the full kinetic energy equation (i.e.
      the energy flux takes into account the energy transported by the particle flux)
    annotations:
      dd_path: edge_sources
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebases
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      source:
        range: EdgeSourcesSource
        multivalued: true
        description: Set of source terms
        annotations:
          dd_max_occurs: '80'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EdgeSourcesSource:
    is_a: InformationContentEntity
    description: Set of source terms
    annotations:
      dd_type_name: edge_sources_source
      dd_path: edge_sources/source
    attributes:
      identifier:
        range: Identifier
        description: Source term identifier (process causing this source term)
      species:
        range: DistributionSpecies
        description: Species causing this source term (if relevant, e.g. a particular ion or neutral state
          in case of line radiation)
      ggd:
        range: PlasmaSourcesSourceGgd
        multivalued: true
        description: Source terms represented using the general grid description, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd_fast:
        range: PlasmaSourcesSourceGgdFast
        multivalued: true
        description: Quantities provided at a faster sampling rate than the full ggd quantities. These
          are either integrated quantities or local quantities provided on a reduced set of positions.
          Positions and integration domains are described by a set of grid_subsets (of size 1 for a position).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
