id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/core_transport
name: fyo-core_transport
title: fyo IDS `core_transport` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `core_transport` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/core_transport/dd_core_transport.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: CoreTransport
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  CoreTransport:
    is_a: IDS
    description: 'Core plasma transport of particles, energy, momentum and poloidal flux. The transport
      of particles, energy and momentum is described by diffusion coefficients, D, and convection velocities,
      v. These are defined by the total fluxes of particles, energy and momentum, across a flux surface
      given by : V'' [-D Y'' <|grad(rho_tor_norm)|^2> + v Y <|grad(rho_tor_norm)|>], where Y represents
      the particles, energy and momentum density, respectively, while V is the volume inside a flux surface,
      the primes de'
    annotations:
      dd_path: core_transport
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in Rho_Tor definition and in the
          normalization of current densities)
      model:
        range: CoreTransportModel
        multivalued: true
        description: Transport is described by a combination of various transport models
        annotations:
          dd_max_occurs: '18'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CoreTransportModel:
    is_a: InformationContentEntity
    description: Transport is described by a combination of various transport models
    annotations:
      dd_type_name: core_transport_model
      dd_path: core_transport/model
    attributes:
      comment:
        range: string
        description: Any comment describing the model
        annotations:
          dd_type: constant
      identifier:
        range: Identifier
        description: Transport model identifier
      flux_multiplier:
        range: float
        description: 'Multiplier applied to the particule flux when adding its contribution in the expression
          of the heat flux : can be 0, 3/2 or 5/2'
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      profiles_1d:
        range: CoreTransportModelProfiles1d
        multivalued: true
        description: Transport coefficient profiles for various time slices. Fluxes and convection are
          positive (resp. negative) when outwards i.e. towards the LCFS (resp. inwards i.e.  towards the
          magnetic axes).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: CodeWithTimebase
        description: Code-specific parameters used for this model
  CoreTransportModelProfiles1d:
    is_a: TimeSlice
    description: Transport coefficient profiles for various time slices. Fluxes and convection are positive
      (resp. negative) when outwards i.e. towards the LCFS (resp. inwards i.e.  towards the magnetic axes).
    annotations:
      dd_type_name: core_transport_model_profiles_1d
      dd_path: core_transport/model/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid_d:
        range: CoreRadialGrid
        description: Grid for effective diffusivities and parallel conductivity
      grid_v:
        range: CoreRadialGrid
        description: Grid for effective convections
      grid_flux:
        range: CoreRadialGrid
        description: Grid for fluxes
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid_d/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid_d/rho_tor_norm
      electrons:
        range: CoreTransportModelElectrons
        description: Transport quantities related to the electrons
      total_ion_energy:
        range: CoreTransportModel1Energy
        description: Transport coefficients for the total (summed over ion  species) energy equation
      momentum_phi:
        range: CoreTransportModel1Momentum
        description: Transport coefficients for total toroidal momentum equation
      e_field_radial:
        range: float
        multivalued: true
        description: Radial component of the electric field (calculated e.g. by a neoclassical model)
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid_flux/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid_flux/rho_tor_norm
      ion:
        range: CoreTransportModelIons
        multivalued: true
        description: Transport coefficients related to the various ion species, in the sense of isonuclear
          or isomolecular sequences. Ionization states (and other types of states) must be differentiated
          at the state level below
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: CoreTransportModelNeutral
        multivalued: true
        description: Transport coefficients related to the various neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
