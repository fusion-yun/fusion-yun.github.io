  CoreTransportModelNeutralState:
    is_a: InformationContentEntity
    description: Transport coefficients related to the different states of the species
    annotations:
      dd_type_name: core_transport_model_neutral_state
      dd_path: core_transport/model/profiles_1d/neutral/state
    attributes:
      name:
        range: string
        description: String identifying state
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      particles:
        range: CoreTransportModel3Density
        description: Transport quantities related to density equation of the charge state considered (thermal+non-thermal)
      energy:
        range: CoreTransportModel3Energy
        description: Transport quantities related to the energy equation of the charge state considered
