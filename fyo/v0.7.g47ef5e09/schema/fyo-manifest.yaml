# fyo-manifest.yaml — language-neutral manifest for fyo, the fusion-domain ontology.
#
# Mirrors spo's neutral form (SPM-ADR-107) for the downstream fyo layer (FYTOK-ADR-101; layout
# and scope revised by FYTOK-ADR-102): the single, language-neutral source of fyo's identity,
# version, module set, prefixes, and compiled-target locations. Any language/tool reads this;
# the Python binding (fytok.ontology.fyo) derives from it.
#
# fyo = TWO strata (FYTOK-ADR-102):
#   1. hand-curated core (`fyo-core`): apparatus classes (Machine/Tokamak, CoilSystem +
#      subtypes, Coil, Plasma, Diagnostic — SPM-ADR-104) + the semantic anchors of the lifted
#      DD (IDS, Discharge, MachineDescription, FluxCoordinateSystem/COCOS);
#   2. the per-IDS layer (`<ids>.linkml.yaml` + `fyo-common`, in this schema/ directory) —
#      fyo-owned sources that EVOLVE INDEPENDENTLY of the IMAS DD. The DD was their import
#      baseline (recorded in `ids-manifest.yaml` `dd_version` + per-file provenance/dd_*
#      ancestry annotations; importer/comparator = `../scripts/dd2fyo.py`). All fyo schemas
#      ground on spo (`imports: [spo]`).
#
# fyo ⊂ spo: the reusable upper (BFO-3D + 4D, quantity/field/signal, time AoS/SoA duality,
# domains, geometry, vocab, provenance/modality) lives in spo (standalone spo repo); the
# spo-class -> Python-carrier map is a LANGUAGE BINDING and lives with the binding.
id: https://fusion-yun.github.io/fyo/latest
name: fyo
version: 0.7.0
license: Apache-2.0
description: >-
  fyo — the fusion/tokamak domain ontology: hand-curated core (apparatus + lifted-DD semantic
  anchors, fyo-core) plus the generated semantic lift of the IMAS DD (per-IDS schemas +
  fyo-common at the artifact root, dd2fyo per FYTOK-ADR-102) — all grounded on spo/BFO.

# Upstream ontology this layer imports (resolved cross-repo via spo's neutral catalog).
imports:
  - spo

# Hand-curated fyo core (durable, authored).
core:
  file: fyo-core.linkml.yaml
  status: active   # apparatus layer (SPM-ADR-104 / FYTOK-ADR-101 OI-A) + lifted-DD anchors
                   # (IDS / Discharge / MachineDescription / FluxCoordinateSystem, ADR-102).

# Hand-curated application-scenario stratum (durable, authored): the five FYTOK-CONOPS-00
# application-task scenarios S-7..S-11 as process ontologies over a shared fyo-scenario base.
scenario:
  dir: scenario
  manifest: scenario/manifest.yaml   # modules: fyo-scenario + 5 per-scenario schemas
  status: active
  conops_ref: FYTOK-CONOPS-00 §conops-fytok-scenarios-app

# Generated fyo form of the IMAS DD (dd2fyo output; part of fyo — per-IDS schemas at the
# artifact root, single DD version; the source DD version is recorded in the generated
# registry's `dd_version`).
generated:
  ids:
    dir: .
    manifest: ids-manifest.yaml   # modules: fyo-common + 82 per-IDS schemas (dd_version inside)

# Import baseline (informative): the per-IDS schemas were imported from the IMAS DD
# (dd2fyo, one-shot ingest+lift from a DD checkout — no on-disk mechanical layer). fyo
# evolves independently of the DD; re-import/compare via
#   python scripts/dd2fyo.py --dd-root <IMAS-Data-Dictionary checkout> [--diff]

# Prefix map (kept in sync with the schema headers).
prefixes:
  linkml: https://w3id.org/linkml/
  spo: https://fusion-yun.github.io/spo/latest/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_

# Compiled, language-neutral serializations (deferred; needs the linkml toolchain).
targets:
  owl: ../dist/fyo.owl.ttl
  shacl: ../dist/fyo.shacl.ttl
  jsonld_context: ../dist/fyo.context.jsonld
