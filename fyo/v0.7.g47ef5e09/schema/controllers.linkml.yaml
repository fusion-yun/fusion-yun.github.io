id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/controllers
name: fyo-controllers
title: fyo IDS `controllers` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `controllers` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/controllers/dd_controllers.xsd (import ancestry)
  fyo_category: experiment-control
  fyo_root_class: Controllers
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Controllers:
    is_a: IDS
    description: Feedback and feedforward controllers
    annotations:
      dd_path: controllers
      fyo_category: experiment-control
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      linear_controller:
        range: ControllersLinearController
        multivalued: true
        description: A linear controller, this is rather conventional
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      nonlinear_controller:
        range: ControllersNonlinearController
        multivalued: true
        description: A non-linear controller, this is less conventional and will have to be developed
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
  ControllersLinearController:
    is_a: InformationContentEntity
    description: A linear controller, this is rather conventional
    annotations:
      dd_type_name: controllers_linear_controller
      dd_path: controllers/linear_controller
    attributes:
      name:
        range: string
        description: Name of this controller
        annotations:
          dd_type: constant
      description:
        range: string
        description: Description of this controller
        annotations:
          dd_type: constant
      controller_class:
        range: string
        description: One of a known class of controllers
        annotations:
          dd_type: constant
      input_names:
        range: string
        multivalued: true
        description: Names of the input signals, following the SDN convention
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      output_names:
        range: string
        multivalued: true
        description: Names of the output signals following the SDN convention
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      statespace:
        range: ControllersStatespace
        description: Statespace controller in discrete or continuous time
      pid:
        range: ControllersPid
        description: Filtered PID controller
      inputs:
        range: SignalFlt2d
        description: Input signals; the timebase is common to inputs and outputs for any particular controller
        annotations:
          dd_units: mixed
          dd_coordinate1: ../input_names
          dd_coordinate2: time
      outputs:
        range: SignalFlt2d
        description: Output signals; the timebase is common to inputs and outputs for any particular controller
        annotations:
          dd_units: mixed
          dd_coordinate1: ../output_names
          dd_coordinate2: time
  ControllersStatespace:
    is_a: InformationContentEntity
    description: Statespace controller in discrete or continuous time
    annotations:
      dd_type_name: controllers_statespace
      dd_path: controllers/linear_controller/statespace
    attributes:
      state_names:
        range: string
        multivalued: true
        description: Names of the states
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      a:
        range: SignalFlt3d
        description: A matrix
        annotations:
          dd_units: mixed
          dd_coordinate1: ../state_names
          dd_coordinate2: ../state_names
          dd_coordinate3: time
      b:
        range: SignalFlt3d
        description: B matrix
        annotations:
          dd_units: mixed
          dd_coordinate1: ../state_names
          dd_coordinate2: ../../input_names
          dd_coordinate3: time
      c:
        range: SignalFlt3d
        description: C matrix
        annotations:
          dd_units: mixed
          dd_coordinate1: ../state_names
          dd_coordinate2: ../../output_names
          dd_coordinate3: time
      d:
        range: SignalFlt3d
        description: D matrix, normally proper and D=0
        annotations:
          dd_units: mixed
          dd_coordinate1: ../state_names
          dd_coordinate2: ../../output_names
          dd_coordinate3: time
      deltat:
        range: SignalFlt1d
        description: Discrete time sampling interval ; if less than 1e-10, the controller is considered
          to be expressed in continuous time
        annotations:
          dd_units: s
  ControllersPid:
    is_a: InformationContentEntity
    description: Filtered PID controller
    annotations:
      dd_type_name: controllers_pid
      dd_path: controllers/linear_controller/pid
    attributes:
      p:
        range: SignalFlt3d
        description: Proportional term
        annotations:
          dd_units: mixed
          dd_coordinate1: ../../output_names
          dd_coordinate2: ../../input_names
          dd_coordinate3: time
      i:
        range: SignalFlt3d
        description: Integral term
        annotations:
          dd_units: mixed
          dd_coordinate1: ../../output_names
          dd_coordinate2: ../../input_names
          dd_coordinate3: time
      d:
        range: SignalFlt3d
        description: Derivative term
        annotations:
          dd_units: mixed
          dd_coordinate1: ../../output_names
          dd_coordinate2: ../../input_names
          dd_coordinate3: time
      tau:
        range: SignalFlt1d
        description: Filter time-constant for the D-term
        annotations:
          dd_units: s
  ControllersNonlinearController:
    is_a: InformationContentEntity
    description: A non-linear controller, this is less conventional and will have to be developed
    annotations:
      dd_type_name: controllers_nonlinear_controller
      dd_path: controllers/nonlinear_controller
    attributes:
      name:
        range: string
        description: Name of this controller
        annotations:
          dd_type: constant
      description:
        range: string
        description: Description of this controller
        annotations:
          dd_type: constant
      controller_class:
        range: string
        description: One of a known class of controllers
        annotations:
          dd_type: constant
      input_names:
        range: string
        multivalued: true
        description: Names of the input signals, following the SDN convention
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      output_names:
        range: string
        multivalued: true
        description: Output signal names following the SDN convention
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      function:
        range: string
        description: Method to be defined
        annotations:
          dd_type: constant
      inputs:
        range: SignalFlt2d
        description: Input signals; the timebase is common  to inputs and outputs for any particular controller
        annotations:
          dd_units: mixed
          dd_coordinate1: ../input_names
          dd_coordinate2: time
      outputs:
        range: SignalFlt2d
        description: Output signals; the timebase is common  to inputs and outputs for any particular
          controller
        annotations:
          dd_units: mixed
          dd_coordinate1: ../output_names
          dd_coordinate2: time
