id: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/radiation
name: fyo-radiation
title: fyo IDS `radiation` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `radiation` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g47ef5e09/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/radiation/dd_radiation.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Radiation
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Radiation:
    is_a: IDS
    description: Radiation emitted by the plasma and neutrals
    annotations:
      dd_path: radiation
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition)
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the process/ggd timebases
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      process:
        range: RadiationProcess
        multivalued: true
        description: Set of emission processes. The radiation characteristics are described at the level
          of the originating entity. For instance describe line radiation from neutrals under profiles_1d/neutral.
          Line and recombination radiation under profiles_1d/ion. Bremsstrahlung radiation under profiles_1d/neutral
          and ion ...
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  RadiationProcess:
    is_a: InformationContentEntity
    description: Set of emission processes. The radiation characteristics are described at the level of
      the originating entity. For instance describe line radiation from neutrals under profiles_1d/neutral.
      Line and recombination radiation under profiles_1d/ion. Bremsstrahlung radiation under profiles_1d/neutral
      and ion ...
    annotations:
