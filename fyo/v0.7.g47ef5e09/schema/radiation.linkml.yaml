        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      emissivity:
        range: GenericGridScalar
        multivalued: true
        description: Emissivity from this state, on various grid subsets
        annotations:
          dd_units: W.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
