id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/mhd
name: fyo-mhd
title: fyo IDS `mhd` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `mhd` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/mhd/dd_mhd.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Mhd
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Mhd:
    is_a: IDS
    description: Magnetohydrodynamic activity, description of perturbed fields and profiles using the
      Generic Grid Description.
    annotations:
      dd_path: mhd
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebase
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: MhdGgd
        multivalued: true
        description: Edge plasma quantities represented using the general grid description, for various
          time slices.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  MhdGgd:
    is_a: TimeSlice
    description: Edge plasma quantities represented using the general grid description, for various time
      slices.
    annotations:
      dd_type_name: mhd_ggd
      dd_path: mhd/ggd
      fyo_lift: time_slice
    attributes:
      electrons:
        range: MhdGgdElectrons
        description: Quantities related to the electrons
      t_i_average:
        range: GenericGridScalar
        multivalued: true
        description: Ion temperature (averaged on ion species), given on various grid subsets
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      n_i_total:
        range: GenericGridScalar
        multivalued: true
        description: Total ion density (sum over ion species and thermal+non-thermal), given on various
          grid subsets
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      zeff:
        range: GenericGridScalar
        multivalued: true
        description: Effective charge, given on various grid subsets
        annotations:
          dd_units: '1'
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_r:
        range: GenericGridScalar
        multivalued: true
        description: R component of the magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field_z:
        range: GenericGridScalar
        multivalued: true
        description: Z component of the magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      a_field_r:
        range: GenericGridScalar
        multivalued: true
        description: R component of the magnetic vector potential, given on various grid subsets
        annotations:
          dd_units: T.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      a_field_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the magnetic vector potential, given on various grid subsets
        annotations:
          dd_units: T.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      a_field_z:
        range: GenericGridScalar
        multivalued: true
        description: Z component of the magnetic vector potential, given on various grid subsets
        annotations:
          dd_units: T.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      psi:
        range: GenericGridScalar
        multivalued: true
        description: Poloidal flux, given on various grid subsets
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_r:
        range: GenericGridScalar
        multivalued: true
        description: R component of the plasma velocity, given on various grid subsets
        annotations:
          dd_units: m.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the plasma velocity, given on various grid subsets
        annotations:
          dd_units: m.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_z:
        range: GenericGridScalar
        multivalued: true
        description: Z component of the plasma velocity, given on various grid subsets
        annotations:
          dd_units: m.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_parallel:
        range: GenericGridScalar
        multivalued: true
        description: Parallel (to magnetic field) component of the plasma velocity, given on various grid
          subsets
        annotations:
          dd_units: m.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_parallel_over_b_field:
        range: GenericGridScalar
        multivalued: true
        description: Parallel (to magnetic field) component of the plasma velocity divided by the modulus
          of the local magnetic field, given on various grid subsets
        annotations:
          dd_units: m.s^-1.T^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      phi_potential:
        range: GenericGridScalar
        multivalued: true
        description: Electric potential, given on various grid subsets
        annotations:
          dd_units: V
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      vorticity:
        range: GenericGridScalar
        multivalued: true
        description: Vorticity, given on various grid subsets
        annotations:
          dd_units: s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      vorticity_over_r:
        range: GenericGridScalar
        multivalued: true
        description: Vorticity divided by the local major radius, given on various grid subsets
        annotations:
          dd_units: m^-1.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_r:
        range: GenericGridScalar
        multivalued: true
        description: R component of the current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      r_j_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the current density multiplied by the local major radius, given
          on various grid subsets
        annotations:
          dd_units: A.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_z:
        range: GenericGridScalar
        multivalued: true
        description: Z component of the current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      mass_density:
        range: GenericGridScalar
        multivalued: true
        description: Mass density, given on various grid subsets
        annotations:
          dd_units: kg.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  MhdGgdElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: mhd_ggd_electrons
      dd_path: mhd/ggd/electrons
    attributes:
      temperature:
        range: GenericGridScalar
        multivalued: true
        description: Temperature, given on various grid subsets
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
