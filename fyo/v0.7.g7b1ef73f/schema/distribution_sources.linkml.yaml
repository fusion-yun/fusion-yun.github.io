id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/distribution_sources
name: fyo-distribution_sources
title: fyo IDS `distribution_sources` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `distribution_sources` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/distribution_sources/dd_distribution_sources.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: DistributionSources
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  DistributionSources:
    is_a: IDS
    description: Sources of particles for input to kinetic equations, e.g. Fokker-Planck calculation.
      The sources could originate from e.g. NBI or fusion reactions.
    annotations:
      dd_path: distribution_sources
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      source:
        range: DistributionSourcesSource
        multivalued: true
        description: Set of source/sink terms. A source/sink term corresponds to the particle source due
          to an NBI injection unit, a nuclear reaction or any combination of them (described in "identifier")
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: 1...N
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition)
      magnetic_axis:
        range: Rz1dDynamic1
        description: Magnetic axis position (used to define a poloidal angle for the 2D profiles)
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  DistributionSourcesSource:
    is_a: InformationContentEntity
    description: Set of source/sink terms. A source/sink term corresponds to the particle source due to
      an NBI injection unit, a nuclear reaction or any combination of them (described in "identifier")
    annotations:
      dd_type_name: distribution_sources_source
      dd_path: distribution_sources/source
    attributes:
      process:
        range: DistributionProcessIdentifier
        multivalued: true
        description: Set of processes (NBI units, fusion reactions, ...) that provide the source.
        annotations:
          dd_max_occurs: '32'
          dd_coordinate1: 1...N
      gyro_type:
        range: integer
        description: 'Defines how to interpret the spatial coordinates: 1 = given at the actual particle
          birth point; 2 =given at the gyro centre of the birth point'
        annotations:
          dd_type: constant
      species:
        range: DistributionSpecies
        description: Species injected or consumed by this source/sink
      global_quantities:
        range: DistributionSourcesSourceGlobalQuantities
        multivalued: true
        description: Global quantities for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_1d:
        range: DistributionSourcesSourceProfiles1d
        multivalued: true
        description: Source radial profiles (flux surface averaged quantities) for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: DistributionSourcesSourceGgd
        multivalued: true
        description: Source terms in phase space (real space, velocity space, spin state), represented
          using the ggd, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      markers:
        range: DistributionMarkers
        multivalued: true
        description: Source given as a group of markers (test particles) born per second, for various
          time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  DistributionSourcesSourceGlobalQuantities:
    is_a: TimeSlice
    description: Global quantities for various time slices
    annotations:
      dd_type_name: distribution_sources_source_global_quantities
      dd_path: distribution_sources/source/global_quantities
      fyo_lift: time_slice
    attributes:
      power:
        range: float
        description: Total power of the source
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_phi:
        range: float
        description: Total toroidal torque of the source
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      particles:
        range: float
        description: Particle source rate
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      shinethrough:
        range: DistributionSourcesSourceGlobalShinethrough
        description: Shinethrough losses
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionSourcesSourceGlobalShinethrough:
    is_a: InformationContentEntity
    description: Shinethrough losses
    annotations:
      dd_type_name: distribution_sources_source_global_shinethrough
      dd_path: distribution_sources/source/global_quantities/shinethrough
    attributes:
      power:
        range: float
        description: Power losses due to shinethrough
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      particles:
        range: float
        description: Particle losses due to shinethrough
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      torque_phi:
        range: float
        description: Toroidal torque losses due to shinethrough
        annotations:
          dd_type: dynamic
          dd_units: N.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionSourcesSourceProfiles1d:
    is_a: TimeSlice
    description: Source radial profiles (flux surface averaged quantities) for various time slices
    annotations:
      dd_type_name: distribution_sources_source_profiles_1d
      dd_path: distribution_sources/source/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      energy:
        range: float
        multivalued: true
        description: Source term for the energy transport equation
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      momentum_phi:
        range: float
        multivalued: true
        description: Source term for the toroidal momentum equation
        annotations:
          dd_type: dynamic
          dd_units: N.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      particles:
        range: float
        multivalued: true
        description: Source term for the density transport equation
        annotations:
          dd_type: dynamic
          dd_units: s^-1.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionSourcesSourceGgd:
    is_a: TimeSlice
    description: Source terms in phase space (real space, velocity space, spin state), represented using
      the ggd, for various time slices
    annotations:
      dd_type_name: distribution_sources_source_ggd
      dd_path: distribution_sources/source/ggd
      fyo_lift: time_slice
    attributes:
      grid:
        range: GenericGridDynamic
        description: Grid description
      particles:
        range: GenericGridScalar
        multivalued: true
        description: Source density of particles in phase space, for various grid subsets
        annotations:
          dd_units: (m.s^-1)^-3.m^-3.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      discrete:
        range: integer
        multivalued: true
        description: List of indices of grid spaces (refers to ../grid/space) for which the source is
          discretely distributed. For example consider a source of 3.5 MeV alpha particles provided on
          a grid with two coordinates (spaces); rho_tor and energy. To specify that the source is given
          at energies exactly equal to 3.5 MeV, let discret have length 1 and set discrete(1)=2 since
          energy is dimension number 2. The source is then proportional to delta( 1 - energy / 3.5MeV
          ), where delta is the direct delta distribution. Discrete dimensions can only be used when the
          grid is rectangular.
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
