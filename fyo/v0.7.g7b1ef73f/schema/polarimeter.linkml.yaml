id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/polarimeter
name: fyo-polarimeter
title: fyo IDS `polarimeter` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `polarimeter` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/polarimeter/dd_polarimeter.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: Polarimeter
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Polarimeter:
    is_a: IDS
    description: Polarimeter diagnostic
    annotations:
      dd_path: polarimeter
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: PolarimeterChannel
        multivalued: true
        description: Set of channels (lines-of-sight)
        annotations:
          dd_max_occurs: '15'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PolarimeterChannel:
    is_a: InformationContentEntity
    description: Set of channels (lines-of-sight)
    annotations:
      dd_type_name: polarimeter_channel
      dd_path: polarimeter/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      line_of_sight:
        range: LineOfSight3points
        description: Description of the line of sight of the channel, defined by two points when the beam
          is not reflected, a third point is added to define the reflected beam path
      wavelength:
        range: float
        description: Wavelength used for polarimetry
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      polarization_initial:
        range: float
        description: Initial polarization vector before entering the plasma
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      ellipticity_initial:
        range: float
        description: Initial ellipticity before entering the plasma
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      faraday_angle:
        range: SignalFlt1dValidity
        description: Faraday angle (variation of the Faraday angle induced by crossing the plasma)
        annotations:
          dd_units: rad
      ellipticity:
        range: SignalFlt1dValidity
        description: Ellipticity
        annotations:
          dd_units: '1'
