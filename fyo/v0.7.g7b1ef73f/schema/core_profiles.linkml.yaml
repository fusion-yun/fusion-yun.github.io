id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/core_profiles
name: fyo-core_profiles
title: fyo IDS `core_profiles` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `core_profiles` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/core_profiles/dd_core_profiles.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: CoreProfiles
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  CoreProfiles:
    is_a: IDS
    description: Core plasma profiles
    annotations:
      dd_path: core_profiles
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      profiles_1d:
        range: CoreProfilesProfiles1d
        multivalued: true
        description: Core plasma radial profiles for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_2d:
        range: CoreProfilesProfiles2d
        multivalued: true
        description: Core plasma quantities in a poloidal cross section, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_lift: representation_set
          fyo_note: elements are spo:equivalent_representation peers — one referent quantity on alternative
            grids/charts
          fyo_layout: aos
      global_quantities:
        range: CoreProfilesGlobalQuantities
        description: Various global quantities derived from the profiles
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      covariance:
        range: CovarianceMatrix
        description: User defined covariance matrix. The covariance of various quantities can be stored
          here, these quantities are referred to by giving their IDS path in the rows_uri list
      statistics:
        range: Statistics
        multivalued: true
        description: Statistics for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CoreProfilesProfiles2d:
    is_a: TimeSlice
    description: Core plasma quantities in a poloidal cross section, for various time slices
    annotations:
      dd_type_name: core_profiles_profiles_2d
      dd_path: core_profiles/profiles_2d
      fyo_lift: time_slice
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      ion:
        range: CoreProfile2dIons
        multivalued: true
        description: 2D quantities related to the different ion species, in the sense of isonuclear or
          isomolecular sequences. Ionization states (or other types of states) must be differentiated
          at the state level below. This array doesn't necessarily have the same size as the profiles_1d/ion
          array, since 2D data may be relevant only for a subset of ion species.
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      t_i_average:
        range: float
        multivalued: true
        description: Ion temperature (averaged on states and ion species)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      n_i_total_over_n_e:
        range: float
        multivalued: true
        description: Ratio of total ion density (sum over species and charge states) over electron density.
          (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      n_i_thermal_total:
        range: float
        multivalued: true
        description: Total ion thermal density (sum over species and charge states)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      momentum_phi:
        range: float
        multivalued: true
        description: Total plasma toroidal momentum, summed over ion species and electrons weighted by
          their density and major radius, i.e. sum_over_species(n*R*m*Vphi)
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-1
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      zeff:
        range: float
        multivalued: true
        description: Effective charge
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      pressure_ion_total:
        range: float
        multivalued: true
        description: Total (sum over ion species) thermal ion pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      pressure_thermal:
        range: float
        multivalued: true
        description: Thermal pressure (electrons+ions)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      pressure_perpendicular:
        range: float
        multivalued: true
        description: Total perpendicular pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      pressure_parallel:
        range: float
        multivalued: true
        description: Total parallel pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CoreProfile2dIons:
    is_a: InformationContentEntity
    description: 2D quantities related to the different ion species, in the sense of isonuclear or isomolecular
      sequences. Ionization states (or other types of states) must be differentiated at the state level
      below. This array doesn't necessarily have the same size as the profiles_1d/ion array, since 2D
      data may be relevant only for a subset of ion species.
    annotations:
      dd_type_name: core_profile_2d_ions
      dd_path: core_profiles/profiles_2d/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed), volume averaged
          over plasma radius
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H, D, T, He, C, D2, ...)
        annotations:
          dd_type: dynamic
      ion_index:
        range: integer
        description: Index of the corresponding ion species in the ../../../profiles_1d/ion array
        annotations:
          dd_type: dynamic
      temperature:
        range: float
        multivalued: true
        description: Temperature (average over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      density_thermal:
        range: float
        multivalued: true
        description: Density (thermal) (sum over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      density_fast:
        range: float
        multivalued: true
        description: Density of fast (non-thermal) particles (sum over charge states when multiple charge
          states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      pressure:
        range: float
        multivalued: true
        description: Pressure (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      pressure_thermal:
        range: float
        multivalued: true
        description: Pressure (thermal) associated with random motion ~average((v-average(v))^2) (sum
          over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      pressure_fast_perpendicular:
        range: float
        multivalued: true
        description: Fast (non-thermal) perpendicular pressure  (sum over charge states when multiple
          charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      pressure_fast_parallel:
        range: float
        multivalued: true
        description: Fast (non-thermal) parallel pressure  (sum over charge states when multiple charge
          states are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      rotation_frequency_tor:
        range: float
        multivalued: true
        description: Toroidal rotation frequency  (i.e. toroidal velocity divided by the major radius
          at which the toroidal velocity is taken) (average over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: rad.s^-1
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      velocity:
        range: CoreProfiles2dVectorComponents2
        description: Velocity (average over charge states when multiple charge states are considered)
          at the position of maximum major radius on every flux surface
        annotations:
          dd_units: m.s^-1
      multiple_states_flag:
        range: integer
        description: 'Multiple states calculation flag : 0-Only the ''ion'' level is considered and the
          ''state'' array of structure is empty; 1-Ion states are considered and are described in the
          ''state'' array of structure'
        annotations:
          dd_type: dynamic
      state:
        range: CoreProfiles2dIonsStates
        multivalued: true
        description: Quantities related to the different states of the species (ionization, energy, excitation,
          ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  CoreProfiles2dVectorComponents2:
    is_a: InformationContentEntity
    description: Velocity (average over charge states when multiple charge states are considered) at the
      position of maximum major radius on every flux surface
    annotations:
      dd_type_name: core_profiles_2d_vector_components_2
      dd_path: core_profiles/profiles_2d/ion/velocity
    attributes:
      radial:
        range: float
        multivalued: true
        description: Radial component
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      diamagnetic:
        range: float
        multivalued: true
        description: Diamagnetic component
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      parallel:
        range: float
        multivalued: true
        description: Parallel component
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      poloidal:
        range: float
        multivalued: true
        description: Poloidal component
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      toroidal:
        range: float
        multivalued: true
        description: Toroidal component
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
  CoreProfiles2dIonsStates:
    is_a: InformationContentEntity
    description: Quantities related to the different states of the species (ionization, energy, excitation,
      ...)
    annotations:
      dd_type_name: core_profiles_2d_ions_states
      dd_path: core_profiles/profiles_2d/ion/state
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average:
        range: float
        description: Average Z of the charge state bundle, volume averaged over the plasma radius (equal
          to z_min if no bundle), = sum (Z*x_z) where x_z is the relative concentration of a given charge
          state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_square_average:
        range: float
        description: Average Z square of the charge state bundle, volume averaged over the plasma radius
          (equal to z_min squared if no bundle), = sum (Z^2*x_z) where x_z is the relative concentration
          of a given charge state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      ionization_potential:
        range: float
        description: Cumulative and average ionization potential to reach a given bundle. Defined as sum
          (x_z* (sum of Epot from z'=0 to z-1)), where Epot is the ionization potential of ion Xz’+, and
          x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z) = 1 over
          the bundle.
        annotations:
          dd_type: dynamic
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      rotation_frequency_tor:
        range: float
        multivalued: true
        description: Toroidal rotation frequency (i.e. toroidal velocity divided by the major radius at
          which the toroidal velocity is taken)
        annotations:
          dd_type: dynamic
          dd_units: rad.s^-1
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      temperature:
        range: float
        multivalued: true
        description: Temperature
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      density_thermal:
        range: float
        multivalued: true
        description: Density of thermal particles
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      density_fast:
        range: float
        multivalued: true
        description: Density of fast (non-thermal) particles
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      pressure:
        range: float
        multivalued: true
        description: Pressure (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      pressure_thermal:
        range: float
        multivalued: true
        description: Pressure (thermal) associated with random motion ~average((v-average(v))^2)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      pressure_fast_perpendicular:
        range: float
        multivalued: true
        description: Fast (non-thermal) perpendicular pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      pressure_fast_parallel:
        range: float
        multivalued: true
        description: Fast (non-thermal) parallel pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
  CoreProfilesGlobalQuantities:
    is_a: InformationContentEntity
    description: Various global quantities derived from the profiles
    annotations:
      dd_type_name: core_profiles_global_quantities
      dd_path: core_profiles/global_quantities
    attributes:
      ip:
        range: float
        multivalued: true
        description: Total plasma current (toroidal component). Positive sign means anti-clockwise when
          viewed from above.
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      current_non_inductive:
        range: float
        multivalued: true
        description: Total non-inductive current (toroidal component). Positive sign means anti-clockwise
          when viewed from above.
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      current_bootstrap:
        range: float
        multivalued: true
        description: Bootstrap current (toroidal component). Positive sign means anti-clockwise when viewed
          from above.
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      v_loop:
        range: float
        multivalued: true
        description: LCFS loop voltage (positive value drives positive ohmic current that flows anti-clockwise
          when viewed from above)
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      li_3:
        range: float
        multivalued: true
        description: Internal inductance. The li_3 definition is used, i.e. li_3 = 2/R0/mu0^2/Ip^2 * int(Bp^2
          dV).
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      beta_tor:
        range: float
        multivalued: true
        description: Toroidal beta, defined as the volume-averaged total perpendicular pressure divided
          by (B0^2/(2*mu0)), i.e. beta_toroidal = 2 mu0 int(p dV) / V / B0^2
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      beta_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal beta, defined as 100 * beta_tor * a[m] * B0 [T] / ip [MA]
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      beta_pol:
        range: float
        multivalued: true
        description: Poloidal beta. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_diamagnetic:
        range: float
        multivalued: true
        description: Plasma energy content = 3/2 * integral over the plasma volume of the total perpendicular
          pressure
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      z_eff_resistive:
        range: float
        multivalued: true
        description: Volume average plasma effective charge, estimated from the flux consumption in the
          ohmic phase
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      t_e_peaking:
        range: float
        multivalued: true
        description: Electron temperature peaking factor, defined as the Te value at the magnetic axis
          divided by the volume averaged Te (average over the plasma volume up to the LCFS)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      t_i_average_peaking:
        range: float
        multivalued: true
        description: Ion temperature (averaged over ion species and states) peaking factor, defined as
          the Ti value at the magnetic axis divided by the volume averaged Ti (average over the plasma
          volume up to the LCFS)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      resistive_psi_losses:
        range: float
        multivalued: true
        description: 'Resistive part of the poloidal flux losses, defined as the volume-averaged scalar
          product of the electric field and the ohmic current density, normalized by the plasma current
          and integrated in time from the beginning of the plasma discharge: int ( (int(E_field_tor.j_ohm_tor)
          dV) / Ip ) dt)'
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      ejima:
        range: float
        multivalued: true
        description: 'Ejima coefficient : resistive psi losses divided by (mu0*R*Ip). See S. Ejima et
          al, Nuclear Fusion, Vol.22, No.10 (1982), 1313'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      t_e_volume_average:
        range: float
        multivalued: true
        description: Volume averaged electron temperature (average over the plasma volume up to the LCFS)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      n_e_volume_average:
        range: float
        multivalued: true
        description: Volume averaged electron density (average over the plasma volume up to the LCFS)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      ion:
        range: CoreProfilesGlobalQuantitiesIon
        multivalued: true
        description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
          sequences. The set of ion species of this array must be the same as the one defined in profiles_1d/ion,
          at the time slice indicated in ion_time_slice
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: ../../profiles_1d(itime)/ion
      ion_time_slice:
        range: float
        description: Time slice of the profiles_1d array used to define the ion composition of the global_quantities/ion
          array.
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CoreProfilesGlobalQuantitiesIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
