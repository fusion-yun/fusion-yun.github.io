id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/ferritic
name: fyo-ferritic
title: fyo IDS `ferritic` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `ferritic` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/ferritic/dd_ferritic.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Ferritic
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Ferritic:
    is_a: IDS
    description: Description of ferritic material (inserts, TBMs, NBI shielding, welds, rebar, etc...)
    annotations:
      dd_path: ferritic
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      object:
        range: FerriticObject
        multivalued: true
        description: Set of n objects characterized by a list of centroids, volumes, and permeabilities.
          Optionally a full 3D description of the n volumes may be given in ../grid_ggd. Here the index
          for each element given in the grid_ggd should be referenced by the object set.
        annotations:
          dd_type: static
          dd_max_occurs: '32'
          dd_coordinate1: 1...N
      permeability_table:
        range: FerriticPermeabilityTable
        multivalued: true
        description: Set of tables for relative permeability as a function of the magnetic field
        annotations:
          dd_type: static
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      grid_ggd:
        range: GenericGridConstant
        description: GGD for describing the 3D geometry of the various objects and their elements
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  FerriticObject:
    is_a: InformationContentEntity
    description: Set of n objects characterized by a list of centroids, volumes, and permeabilities. Optionally
      a full 3D description of the n volumes may be given in ../grid_ggd. Here the index for each element
      given in the grid_ggd should be referenced by the object set.
    annotations:
      dd_type_name: ferritic_object
      dd_path: ferritic/object
    attributes:
      centroid:
        range: Xyz1dPositionsStatic
        description: List of positions of the centroids, in Cartesian coordinates
      volume:
        range: float
        multivalued: true
        description: Volume of each element of this object
        annotations:
          dd_type: static
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: ../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../centroid/x
      saturated_relative_permeability:
        range: float
        multivalued: true
        description: Saturated relative magnetic permeability of each element
        annotations:
          dd_type: static
          dd_units: H.m^-1
          dd_ndim: 1
          dd_coordinate1: ../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../centroid/x
      permeability_table_index:
        range: integer
        multivalued: true
        description: Index of permeability table to be used for each element. If not allocated or if an
          element is equal to EMPTY_INT, use the sibling saturated relative permeability instead ../relative_permeability,
          for that element
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: ../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../centroid/x
      axisymmetric:
        range: Outline2dGeometryStatic
        multivalued: true
        description: Optional equivalent axisymmetric representation of the geometry of each element (e.g.
          for each iron core segment), typically used to represent iron core in axisymmetric equilibrium
          solvers
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: ../centroid/x
      ggd_object_index:
        range: integer
        multivalued: true
        description: Index of GGD volumic object corresponding to each element. Refers to the array /grid_ggd/space(1)/objects_per_dimension(4)/object
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: ../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../centroid/x
      time_slice:
        range: FerriticObjectTimeSlice
        multivalued: true
        description: Dynamic quantities, per time slice
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  Xyz1dPositionsStatic:
    is_a: InformationContentEntity
    description: List of positions of the centroids, in Cartesian coordinates
    annotations:
      dd_type_name: xyz1d_positions_static
      dd_path: ferritic/object/centroid
    attributes:
      x:
        range: float
        multivalued: true
        description: List of X coordinates
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      y:
        range: float
        multivalued: true
        description: List of Y coordinates
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../x
      z:
        range: float
        multivalued: true
        description: List of Z coordinates
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../x
  FerriticObjectTimeSlice:
    is_a: TimeSlice
    description: Dynamic quantities, per time slice
    annotations:
      dd_type_name: ferritic_object_time_slice
      dd_path: ferritic/object/time_slice
      fyo_lift: time_slice
    attributes:
      b_field_r:
        range: float
        multivalued: true
        description: R component of the magnetic field at each centroid
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      b_field_phi:
        range: float
        multivalued: true
        description: Toroidal component of the magnetic field at each centroid
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      b_field_z:
        range: float
        multivalued: true
        description: Z component of the magnetic field at each centroid
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      magnetic_moment_r:
        range: float
        multivalued: true
        description: R component of the magnetic moment of each element
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      magnetic_moment_phi:
        range: float
        multivalued: true
        description: Toroidal component of the magnetic moment of each element
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      magnetic_moment_z:
        range: float
        multivalued: true
        description: Z component of the magnetic moment of each element
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../../centroid/x
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../centroid/x
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  FerriticPermeabilityTable:
    is_a: InformationContentEntity
    description: Set of tables for relative permeability as a function of the magnetic field
    annotations:
      dd_type_name: ferritic_permeability_table
      dd_path: ferritic/permeability_table
    attributes:
      name:
        range: string
        description: Name of this table
        annotations:
          dd_type: constant
      description:
        range: string
        description: Description of this table
        annotations:
          dd_type: constant
      b_field:
        range: float
        multivalued: true
        description: Array of magnetic field values, for each of which the relative permeability is given
        annotations:
          dd_type: static
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      relative_permeability:
        range: float
        multivalued: true
        description: Relative permeability as a function of the magnetic field
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../b_field
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../b_field
