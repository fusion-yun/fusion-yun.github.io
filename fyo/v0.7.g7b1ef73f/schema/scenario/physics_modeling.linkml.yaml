# SPDX-License-Identifier: Apache-2.0
# Scenario S-7 — physics modeling / prediction (物理建模 / 预测), PRIMARY task.
# Source: FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-7; R109 axis: physics.
id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/physics_modeling
name: fyo-scenario-physics-modeling
title: "Fyo Scenario S-7 — Physics Modeling / Prediction (物理建模 / 预测)"
description: >-
  Ontology of the S-7 application-task scenario: FORWARD physics modeling and prediction —
  the first of the two primary tasks (building the physics model is the precondition of all
  downstream control / design / optimization tasks). The device physical state is declared as
  fyo-modeled entities and advanced through the equilibrium–transport–source forward kernel
  to a (quasi-)steady state or a time-dependent evolution; outputs are simulated-modality IDS
  occurrences of the predicted plasma state.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-scenario
annotations:
  fyo_module: scenario/physics_modeling
  conops_scenario: S-7
  r109_axis: physics
  primary_task: "true"
  conops_ref: "FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-7 (reuses S-1..S-4)"
  maturity: "◐ partial — ohmic scenario as-built (fyeq + fytrans at benchmarkable depth); H&CD sources and turbulence closure missing (gaps G-A1 / G-A2), informative"

classes:

  PhysicsModelingTask:
    is_a: ApplicationTask
    description: >-
      A forward physics-modeling / prediction run (S-7, primary). FUNCTION: instantiate the
      device aggregate entity (S-1), bind the fyo-modeled physical state, then let the
      ScenarioLoop alternate equilibrium and transport solves — with source terms — until
      physical convergence or through a prescribed time evolution; the result PREDICTS the
      plasma equilibrium / profile / transport state. Direction: forward (θ → state); the
      plasma configuration evolves, the machine is fixed. Every output IDS carries
      data-modality `simulated` in its provenance (the schema itself is modality-blind).
    slots:
      - has_part               # its parts are ScenarioLoop / SolverInvocation occurrents
    attributes:
      machine_description:
        range: MachineDescription
        description: >-
          INPUT — static as-built geometry / configuration of the target machine (wall, coil
          and limiter geometry; the device A-Box provided by fydata, loaded by plugin name at
          device instantiation, S-1).
        annotations:
          io: input
      initial_profiles:
        range: IDS
        description: >-
          INPUT — initial core plasma profiles (densities, temperatures, current) from which
          the forward advance starts.
        annotations:
          io: input
          fyo_ids: core_profiles
      heating_and_current_drive:
        range: IDS
        multivalued: true
        description: >-
          INPUT — heating / current-drive actuator settings feeding the source terms (NBI, EC
          launchers, IC / LH antennas). GAP (informative): H&CD deposition physics is the
          identified precondition gap G-A1 — predictive scenarios are currently ohmic-only.
        annotations:
          io: input
          fyo_ids: nbi, ec_launchers, ic_antennas, lh_antennas, core_sources
      prescribed_waveforms:
        range: IDS
        description: >-
          INPUT (optional) — prescribed boundary / actuator waveforms over the simulated
          interval (time-dependent runs).
        annotations:
          io: input
          fyo_ids: pulse_schedule
      predicted_equilibrium:
        range: IDS
        description: >-
          OUTPUT — the predicted Grad–Shafranov equilibrium (flux map, boundary, global
          quantities), written back by the equilibrium solves; modality simulated.
        annotations:
          io: output
          fyo_ids: equilibrium
      predicted_profiles:
        range: IDS
        description: OUTPUT — the predicted core plasma profiles at convergence / over time; modality simulated.
        annotations:
          io: output
          fyo_ids: core_profiles
      predicted_transport:
        range: IDS
        description: >-
          OUTPUT — the transport coefficients used / predicted. GAP (informative): turbulence
          closure is analytic-only today (G-A2, QLKNN surrogate unwired).
        annotations:
          io: output
          fyo_ids: core_transport
      predicted_sources:
        range: IDS
        description: OUTPUT — the realized source / sink profiles consistent with the converged state.
        annotations:
          io: output
          fyo_ids: core_sources
    annotations:
      conops_scenario: S-7
      free_variables_note: "free = plasma configuration / profiles evolution; fixed = machine, actuator settings"
