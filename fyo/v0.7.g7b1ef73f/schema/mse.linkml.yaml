id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/mse
name: fyo-mse
title: fyo IDS `mse` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `mse` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/mse/dd_mse.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: Mse
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Mse:
    is_a: IDS
    description: Motional Stark Effect diagnostic
    annotations:
      dd_path: mse
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: MseChannel
        multivalued: true
        description: Set of channels (lines of sight)
        annotations:
          dd_max_occurs: '30'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  MseChannel:
    is_a: InformationContentEntity
    description: Set of channels (lines of sight)
    annotations:
      dd_type_name: mse_channel
      dd_path: mse/channel
    attributes:
      name:
        range: string
        description: Name of the channel
        annotations:
          dd_type: static
      detector:
        range: DetectorAperture
        description: Detector description
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight of the channel, given by 2 points
      active_spatial_resolution:
        range: MseChannelResolution
        multivalued: true
        description: Spatial resolution of the measurement, calculated as a convolution of the atomic
          smearing, magnetic and beam geometry smearing and detector projection, for a set of time slices
          (use a single time slice for the whole pulse if the beam and the line of sight are not moving
          during the pulse)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      polarization_angle:
        range: SignalFlt1dValidity
        description: MSE polarization angle
        annotations:
          dd_units: rad
  MseChannelResolution:
    is_a: TimeSlice
    description: Spatial resolution of the measurement, calculated as a convolution of the atomic smearing,
      magnetic and beam geometry smearing and detector projection, for a set of time slices (use a single
      time slice for the whole pulse if the beam and the line of sight are not moving during the pulse)
    annotations:
      dd_type_name: mse_channel_resolution
      dd_path: mse/channel/active_spatial_resolution
      fyo_lift: time_slice
    attributes:
      centre:
        range: Rphiz0dDynamicAos3
        description: Position of the centre of the spatially resolved zone
      width:
        range: Rphiz0dDynamicAos3
        description: Full width of the spatially resolved zone in the R, Z and phi directions
      geometric_coefficients:
        range: float
        multivalued: true
        description: 'Set of 9 geometric coefficients providing the MSE polarization angle as a function
          of the local electric and magnetic field components (these are related to the angle between
          beam and line of sight). The list is ordered as follows : coefficients of BZ, BR, Bphi, ER (numerator
          of the MSE angle expression); coefficients of BZ, BR, Bphi, ER, EZ (denominator)'
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...9
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...9
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
