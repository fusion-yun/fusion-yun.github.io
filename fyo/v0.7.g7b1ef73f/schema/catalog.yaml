# catalog.yaml — language-neutral LinkML import catalog for fyo (FYTOK-ADR-101 D3, layout per
# FYTOK-ADR-102; mirrors SPM-ADR-107 D3).
#
# Resolves fyo's own module names / IRIs to schema FILES without Python. The upstream ``spo``
# import is NOT duplicated here — it is delegated to spo's neutral catalog (the Python binding
# merges this with ``spo.importmap()``; a non-Python consumer reads both catalogs). Files are
# relative to this catalog's directory (``schema/``, the artifact core — mirrors spo).
#
# The generated per-IDS lift modules resolve through the generated manifest
# (ids-manifest.yaml); only the durable hand-curated modules (fyo-core + the
# scenario stratum) and the shared generated ``fyo-common`` are cataloged here by name.
version: 0.7.0

by_name:
  fyo-core: fyo-core.linkml.yaml
  fyo-common: fyo-common.linkml.yaml
  fyo-scenario: scenario/fyo-scenario.linkml.yaml
  fyo-scenario-physics-modeling: scenario/physics_modeling.linkml.yaml
  fyo-scenario-experiment-analysis: scenario/experiment_analysis.linkml.yaml
  fyo-scenario-control-simulation: scenario/control_simulation.linkml.yaml
  fyo-scenario-discharge-design: scenario/discharge_design.linkml.yaml
  fyo-scenario-device-optimization: scenario/device_optimization.linkml.yaml

by_iri:
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/core: fyo-core.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/common: fyo-common.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario: scenario/fyo-scenario.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/physics_modeling: scenario/physics_modeling.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/experiment_analysis: scenario/experiment_analysis.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/control_simulation: scenario/control_simulation.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/discharge_design: scenario/discharge_design.linkml.yaml
  https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/scenario/device_optimization: scenario/device_optimization.linkml.yaml

# Upstream resolution (informative): ``imports: [spo]`` resolves through the spo artifact's
# own schema/catalog.yaml (standalone spo repo, sibling checkout).
delegates:
  spo: https://fusion-yun.github.io/spo/latest/spo
