        annotations:
          dd_type: constant
  PulseSchedulePfActiveSupply:
    is_a: InformationContentEntity
    description: Set of PF power supplies
    annotations:
      dd_type_name: pulse_schedule_pf_active_supply
      dd_path: pulse_schedule/pf_active/supply
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      voltage:
        range: PulseScheduleReferencePfActive
        description: Voltage at the supply output (Vside1-Vside2)
        annotations:
          dd_units: V
      current:
        range: PulseScheduleReferencePfActive
        description: Current fed into one turn of the coil. (Multiply by number of turns to obtain generated
          magnetic field). Positive when flowing from side 1 to side 2 of the coil, this numbering being
          made consistently with the convention that the current flows counter-clockwise when viewed from
          above.
        annotations:
          dd_units: A
  PulseSchedulePosition:
    is_a: InformationContentEntity
    description: Plasma position and shape control references
    annotations:
      dd_type_name: pulse_schedule_position
      dd_path: pulse_schedule/position_control
    attributes:
      magnetic_axis:
        range: PulseScheduleRz
        description: Magnetic axis position
      geometric_axis:
        range: PulseScheduleRz
        description: RZ position of the geometric axis (defined as (Rmin+Rmax) / 2 and (Zmin+Zmax) / 2
          of the boundary)
      minor_radius:
        range: PulseScheduleReferencePosition
        description: Minor radius of the plasma boundary (defined as (Rmax-Rmin) / 2 of the boundary)
        annotations:
          dd_units: m
      elongation:
        range: PulseScheduleReferencePosition
        description: Elongation of the plasma boundary
        annotations:
          dd_units: '1'
      elongation_upper:
        range: PulseScheduleReferencePosition
        description: Elongation (upper half w.r.t. geometric axis) of the plasma boundary
        annotations:
          dd_units: '1'
      elongation_lower:
        range: PulseScheduleReferencePosition
        description: Elongation (lower half w.r.t. geometric axis) of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity:
        range: PulseScheduleReferencePosition
        description: Triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity_upper:
        range: PulseScheduleReferencePosition
        description: Upper triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity_lower:
        range: PulseScheduleReferencePosition
        description: Lower triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity_inner:
        range: PulseScheduleReferencePosition
        description: Inner triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity_outer:
        range: PulseScheduleReferencePosition
        description: Outer triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      triangularity_minor:
        range: PulseScheduleReferencePosition
        description: Minor triangularity of the plasma boundary
        annotations:
          dd_units: '1'
      squareness_upper_outer:
        range: PulseScheduleReferencePosition
        description: Upper outer squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_units: '1'
      squareness_upper_inner:
        range: PulseScheduleReferencePosition
        description: Upper inner squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_units: '1'
      squareness_lower_outer:
        range: PulseScheduleReferencePosition
        description: Lower outer squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_units: '1'
      squareness_lower_inner:
        range: PulseScheduleReferencePosition
        description: Lower inner squareness of the plasma boundary (definition from T. Luce, Plasma Phys.
          Control. Fusion 55 (2013) 095009)
        annotations:
          dd_units: '1'
      x_point:
        range: PulseScheduleRz
        multivalued: true
        description: Array of X-points, for each of them the RZ position is given
        annotations:
          dd_max_occurs: '2'
          dd_coordinate1: 1...N
      strike_point:
        range: PulseScheduleRz
        multivalued: true
        description: Array of strike points, for each of them the RZ position is given
        annotations:
          dd_max_occurs: '4'
          dd_coordinate1: 1...N
      active_limiter_point:
        range: PulseScheduleRz
        description: RZ position of the active limiter point (point of the plasma boundary in contact
          with the limiter)
      boundary_outline:
        range: PulseScheduleOutline
        multivalued: true
        description: Set of (R,Z) points defining the outline of the plasma boundary
        annotations:
          dd_max_occurs: '301'
          dd_coordinate1: 1...N
      z_r_max:
        range: PulseScheduleReferencePosition
        description: Height of the separatrix point of maximum major radius
        annotations:
          dd_units: m
      z_r_min:
        range: PulseScheduleReferencePosition
        description: Height of the separatrix point of minimum major radius
        annotations:
          dd_units: m
      gap:
        range: PulseScheduleGap
        multivalued: true
        description: Set of gaps, defined by a reference point and a direction.
        annotations:
          dd_max_occurs: '51'
          dd_coordinate1: 1...N
      current_centroid:
        range: PulseScheduleRz
        description: RZ position of the current centroid
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes located at this level of the IDS structure and below
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
