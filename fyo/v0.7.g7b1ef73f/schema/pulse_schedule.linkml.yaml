  PulseSchedulePfActiveCoil:
    is_a: InformationContentEntity
    description: Set of poloidal field coils
    annotations:
      dd_type_name: pulse_schedule_pf_active_coil
      dd_path: pulse_schedule/pf_active/coil
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      current:
        range: PulseScheduleReferencePfActive
        description: Current fed in the coil (for 1 turn, to be multiplied by the number of turns to obtain
          the generated magnetic field), positive when flowing from side 1 to side 2 of the coil (inside
          the coil), this numbering being made consistently with the convention that the current is counter-clockwise
          when seen from above.
        annotations:
          dd_units: A
      resistance_additional:
        range: PulseScheduleReferencePfActive
        description: Additional resistance due to e.g. dynamically switchable resistors
        annotations:
          dd_units: ohm
  PulseScheduleReferencePfActive:
    is_a: InformationContentEntity
    description: Current fed in the coil (for 1 turn, to be multiplied by the number of turns to obtain
      the generated magnetic field), positive when flowing from side 1 to side 2 of the coil (inside the
      coil), this numbering being made consistently with the convention that the current is counter-clockwise
