      power_type:
        range: Identifier
        description: 'Type of power used in the sibling power node (defining which power is referred to
          in this pulse_schedule). Index = 1: power_launched, 2: power_forward (see definitions in the
          lh_antennas  IDS)'
      power:
        range: PulseScheduleReferenceLh
        description: Power
        annotations:
          dd_units: W
      phase:
        range: PulseScheduleReferenceLh
        description: Phasing between neighbour waveguides (in the toroidal direction)
        annotations:
          dd_units: rad
      n_parallel:
        range: PulseScheduleReferenceLh
        description: Main parallel refractive index of the injected wave power spectrum
        annotations:
          dd_units: '1'
      frequency:
        range: PulseScheduleReferenceLh
        description: Frequency
        annotations:
          dd_units: Hz
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
  PulseScheduleReferenceLh:
    is_a: InformationContentEntity
    description: Power
    annotations:
