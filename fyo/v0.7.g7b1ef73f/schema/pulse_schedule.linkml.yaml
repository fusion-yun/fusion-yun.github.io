        annotations:
          dd_type: constant
      envelope_type:
        range: integer
        description: 'Envelope type:  0:relative: means that the envelope upper and lower bound values
          are defined respectively as reference.data * reference.data_error_upper and reference.data *
          reference.data_error_lower. 1: absolute: the envelope upper and lower bound values are given
