id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/pulse_schedule
name: fyo-pulse_schedule
title: fyo IDS `pulse_schedule` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `pulse_schedule` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/pulse_schedule/dd_pulse_schedule.xsd (import ancestry)
  fyo_category: experiment-control
  fyo_root_class: PulseSchedule
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  PulseSchedule:
    is_a: IDS
    description: Description of Pulse Schedule, described by subsystems waveform references and an enveloppe
      around them. The controllers, pulse schedule and SDN are defined in separate IDSs. All names and
      identifiers of subsystems appearing in the pulse_schedule must be identical to those used in the
      IDSs describing the related subsystems.
    annotations:
      dd_path: pulse_schedule
      fyo_category: experiment-control
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      ic:
        range: PulseScheduleIc
        description: Ion cyclotron heating and current drive system
      ec:
        range: PulseScheduleEc
        description: Electron cyclotron heating and current drive system
      lh:
        range: PulseScheduleLh
        description: Lower Hybrid heating and current drive system
      nbi:
        range: PulseScheduleNbi
        description: Neutral beam heating and current drive system
      density_control:
        range: PulseScheduleDensityControl
        description: Gas injection system and density control references
      event:
        range: PulseScheduleEvent
        multivalued: true
        description: List of events, either predefined triggers  or events recorded during the pulse
        annotations:
          dd_max_occurs: '130'
          dd_coordinate1: 1...N
      flux_control:
        range: PulseScheduleFluxControl
        description: Magnetic flux control references
      pf_active:
        range: PulseSchedulePfActive
        description: Poloidal field coil references
      position_control:
        range: PulseSchedulePosition
        description: Plasma position and shape control references
      tf:
        range: PulseScheduleTf
        description: Toroidal field references
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PulseScheduleIc:
    is_a: InformationContentEntity
    description: Ion cyclotron heating and current drive system
    annotations:
      dd_type_name: pulse_schedule_ic
      dd_path: pulse_schedule/ic
    attributes:
      antenna:
        range: PulseScheduleIcAntenna
        multivalued: true
        description: Set of ICRH antennas
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      power:
        range: PulseScheduleReferenceIc
        description: Total IC power (sum over the antennas)
        annotations:
          dd_units: W
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes located at this level of the IDS structure and below
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PulseScheduleIcAntenna:
    is_a: InformationContentEntity
    description: Set of ICRH antennas
    annotations:
      dd_type_name: pulse_schedule_ic_antenna
      dd_path: pulse_schedule/ic/antenna
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      power_type:
        range: Identifier
        description: 'Type of power used in the sibling power node (defining which power is referred to
          in this pulse_schedule). Index = 1: power_launched, 2: power_forward (see definitions in the
          ic_antennas  IDS)'
      power:
        range: PulseScheduleReferenceIc
        description: Power
        annotations:
          dd_units: W
      phase:
        range: PulseScheduleReferenceIc
        description: Phase
        annotations:
          dd_units: rad
      frequency:
        range: PulseScheduleReferenceIc
        description: Frequency
        annotations:
          dd_units: Hz
  PulseScheduleReferenceIc:
    is_a: InformationContentEntity
    description: Power
    annotations:
      dd_type_name: pulse_schedule_reference_ic
      dd_path: pulse_schedule/ic/antenna/power
    attributes:
      reference_name:
        range: string
        description: Reference name (e.g. in the native pulse schedule system of the device)
        annotations:
          dd_type: constant
      reference:
        range: float
        multivalued: true
        description: 'Reference waveform. Caution : error bars of the reference/data node are not used
          in the usual sense, instead they are used to describe the control envelope, with a meaning depending
          on the chosen envelope_type option.'
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: /ic/time
          spo_class: spo:Signal
          fyo_lift: signal
      reference_type:
        range: integer
        description: 'Reference type:  0:relative (don''t use for the moment, to be defined later when
          segments are introduced in the IDS structure); 1: absolute: the reference time trace is provided
          in the reference/data node'
        annotations:
          dd_type: constant
      envelope_type:
        range: integer
        description: 'Envelope type:  0:relative: means that the envelope upper and lower bound values
          are defined respectively as reference.data * reference.data_error_upper and reference.data *
          reference.data_error_lower. 1: absolute: the envelope upper and lower bound values are given
          respectively by reference/data_error_upper and reference/data_error_lower. Lower and upper are
          taken in the strict mathematical sense, without considering absolute values of the data'
        annotations:
          dd_type: constant
  PulseScheduleEc:
    is_a: InformationContentEntity
    description: Electron cyclotron heating and current drive system
    annotations:
      dd_type_name: pulse_schedule_ec
      dd_path: pulse_schedule/ec
    attributes:
      beam:
