      supply:
        range: PulseSchedulePfActiveSupply
        multivalued: true
        description: Set of PF power supplies
        annotations:
          dd_max_occurs: '32'
          dd_coordinate1: 1...N
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
