        multivalued: true
        description: Set of Electron Cyclotron beams
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      power_launched:
        range: PulseScheduleReferenceEc
        description: Total EC power launched in the plasma (sum over the beams)
        annotations:
          dd_units: W
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes located at this level of the IDS structure and below
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PulseScheduleEcBeam:
    is_a: InformationContentEntity
    description: Set of Electron Cyclotron beams
    annotations:
      dd_type_name: pulse_schedule_ec_beam
      dd_path: pulse_schedule/ec/beam
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      power_launched:
        range: PulseScheduleReferenceEc
        description: Beam power launched into the vacuum vessel
        annotations:
          dd_units: W
      frequency:
        range: PulseScheduleReferenceEc
        description: Frequency
        annotations:
          dd_units: Hz
      deposition_rho_tor_norm:
        range: PulseScheduleReferenceEc
        description: Normalized toroidal flux coordinate at which the main deposition should occur
        annotations:
          dd_units: '1'
      steering_angle_pol:
        range: PulseScheduleReferenceEc
        description: Steering angle of the EC beam in the R,Z plane (from the -R axis towards the -Z axis),
          angle_pol=atan2(-k_Z,-k_R), where k_Z and k_R are the Z and R components of the mean wave vector
          in the EC beam
        annotations:
          dd_units: rad
      steering_angle_tor:
        range: PulseScheduleReferenceEc
        description: Steering angle of the EC beam away from the poloidal plane that is increasing towards
          the positive phi axis, angle_tor=arcsin(k_phi/k), where k_phi is the component of the wave vector
          in the phi direction and k is the length of the wave vector. Here the term wave vector refers
          to the mean wave vector in the EC beam
        annotations:
          dd_units: rad
  PulseScheduleReferenceEc:
    is_a: InformationContentEntity
    description: Beam power launched into the vacuum vessel
    annotations:
