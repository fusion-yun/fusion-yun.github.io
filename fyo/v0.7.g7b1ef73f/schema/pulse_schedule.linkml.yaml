  PulseScheduleDensityControl:
    is_a: InformationContentEntity
    description: Gas injection system and density control references
    annotations:
      dd_type_name: pulse_schedule_density_control
      dd_path: pulse_schedule/density_control
    attributes:
      valve:
        range: PulseScheduleDensityControlValve
        multivalued: true
        description: Set of injection valves. Time-dependent
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      n_e_line:
        range: PulseScheduleReferenceDensity
        description: Line integrated electron density over a line of sight in the whole vacuum chamber
        annotations:
          dd_units: m^-2
      n_e_line_lcfs:
        range: PulseScheduleReferenceDensity
        description: Line integrated electron density over a line of sight within the LCFS
        annotations:
          dd_units: m^-2
      n_e_profile_average:
        range: PulseScheduleReferenceDensity
        description: Integral of a 1D core profile over rho_tor_norm up to the LCFS
        annotations:
          dd_units: m^-3
      n_e_line_of_sight:
        range: LineOfSight3points
        description: Description of the line of sight for calculating n_e, defined by two points when
          the beam is not reflected, a third point is added to define the reflected beam path
      n_e_volume_average:
        range: PulseScheduleReferenceDensity
        description: Volume averaged electron density (average over the plasma volume up to the LCFS)
        annotations:
          dd_units: m^-3
      zeff:
        range: PulseScheduleReferenceDensity
        description: Line averaged effective charge
        annotations:
          dd_units: '1'
      zeff_method:
        range: Identifier
        description: 'Method for zeff calculation : Index = 1: average over a line of sight in the whole
          vacuum chamber, 2 : average over a line of sight within the LCFS, 3 : average of a 1D core profile
          over rho_tor_norm up to the LCFS'
      zeff_line_of_sight:
        range: LineOfSight3points
        description: Description of the line of sight for calculating zeff, defined by two points when
          the beam is not reflected, a third point is added to define the reflected beam path
      n_t_over_n_d:
        range: PulseScheduleReferenceDensity
        description: Average ratio of tritium over deuterium density
        annotations:
          dd_units: '1'
      n_h_over_n_d:
        range: PulseScheduleReferenceDensity
        description: Average ratio of hydrogen over deuterium density
        annotations:
          dd_units: '1'
      ion:
        range: PulseScheduleDensityControlIon
        multivalued: true
        description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
          sequences
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
