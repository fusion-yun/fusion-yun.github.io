    annotations:
      dd_type_name: pulse_schedule_density_control_ion
      dd_path: pulse_schedule/density_control/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H, D, T, He, C, D2, ...)
        annotations:
          dd_type: constant
      n_i_volume_average:
        range: PulseScheduleReferenceDensity
        description: Volume averaged ion density (average over the plasma volume up to the LCFS)
        annotations:
          dd_units: m^-3
  PulseScheduleEvent:
    is_a: InformationContentEntity
    description: List of events, either predefined triggers  or events recorded during the pulse
    annotations:
      dd_type_name: pulse_schedule_event
      dd_path: pulse_schedule/event
    attributes:
      type:
        range: Identifier
        description: Type of this event
      identifier:
        range: string
        description: Unique identifier of this event provided by the scheduling / event handler
        annotations:
          dd_type: constant
      time_stamp:
        range: float
        description: Time stamp of this event
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      duration:
        range: float
        description: Duration of this event
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      acquisition_strategy:
        range: Identifier
        description: 'Acquisition strategy related to this event: index = 1 : on-trigger; index = 2 :
          pre-trigger; index = 3 : post-trigger'
      acquisition_state:
        range: Identifier
        description: 'Acquisition state of the related system : index = 1 : armed; index = 2 : on; index
          = 3 : off; index = 4 : closed'
      provider:
        range: string
        description: System having generated this event
        annotations:
          dd_type: constant
      listeners:
        range: string
        multivalued: true
        description: Systems listening to this event
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
  PulseScheduleFluxControl:
    is_a: InformationContentEntity
    description: Magnetic flux control references
    annotations:
      dd_type_name: pulse_schedule_flux_control
      dd_path: pulse_schedule/flux_control
    attributes:
      ip:
        range: PulseScheduleReferenceNoAos
        description: Plasma current
        annotations:
          dd_units: A
      v_loop:
        range: PulseScheduleReferenceNoAos
        description: Loop voltage
        annotations:
          dd_units: V
      li_3:
        range: PulseScheduleReferenceNoAos
        description: Internal inductance
        annotations:
          dd_units: '1'
      beta_tor_norm:
        range: PulseScheduleReferenceNoAos
        description: Normalized toroidal beta, defined as 100 * beta_tor * a[m] * B0 [T] / ip [MA]
        annotations:
          dd_units: '1'
      mode:
        range: integer
        multivalued: true
        description: Control mode (operation mode and/or settings used by the controller)
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes located at this level of the IDS structure and below
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PulseScheduleReferenceNoAos:
    is_a: InformationContentEntity
    description: Plasma current
    annotations:
      dd_type_name: pulse_schedule_reference_no_aos
      dd_path: pulse_schedule/flux_control/ip
    attributes:
      reference_name:
        range: string
        description: Reference name (e.g. in the native pulse schedule system of the device)
        annotations:
          dd_type: constant
      reference:
        range: float
        multivalued: true
        description: 'Reference waveform. Caution : error bars of the reference/data node are not used
          in the usual sense, instead they are used to describe the control envelope, with a meaning depending
          on the chosen envelope_type option.'
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      reference_type:
        range: integer
        description: 'Reference type:  0:relative (don''t use for the moment, to be defined later when
          segments are introduced in the IDS structure); 1: absolute: the reference time trace is provided
          in the reference/data node'
        annotations:
          dd_type: constant
      envelope_type:
        range: integer
        description: 'Envelope type:  0:relative: means that the envelope upper and lower bound values
          are defined respectively as reference.data * reference.data_error_upper and reference.data *
          reference.data_error_lower. 1: absolute: the envelope upper and lower bound values are given
          respectively by reference/data_error_upper and reference/data_error_lower. Lower are upper are
          taken in the strict mathematical sense, without considering absolute values of the data'
        annotations:
          dd_type: constant
  PulseSchedulePfActive:
    is_a: InformationContentEntity
