id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/focs
name: fyo-focs
title: fyo IDS `focs` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `focs` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/focs/dd_focs.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: Focs
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Focs:
    is_a: IDS
    description: Fiber Optic Current Sensor (FOCS)
    annotations:
      dd_path: focs
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: 'Description, e.g. “Current sensor installed around vacuum vessel sector #5”'
        annotations:
          dd_type: static
      fibre_properties:
        range: FocsFibreProperties
        description: Intrinsic properties of the fibre installed on the vacuum vessel
      fibre_length:
        range: float
        description: Spun fibre length on the vacuum vessel
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: Rphiz1dStatic
        description: FOCS outline
      b_field_z:
        range: SignalFlt2dValidity
        description: Vertical component of the magnetic field on each point of the FOCS outline
        annotations:
          dd_units: T
          dd_coordinate1: ../outline/r
      stokes_initial:
        range: StokesInitial
        description: Initial Stokes vector at the entrance of the FOCS
      stokes_output:
        range: StokesDynamic
        multivalued: true
        description: Stokes vector at the output of the FOCS as a function of time
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      current:
        range: SignalFlt1dValidity
        description: Total toroidal current flowing through the area outlined by the FOCS
        annotations:
          dd_units: A
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  FocsFibreProperties:
    is_a: InformationContentEntity
    description: Intrinsic properties of the fibre installed on the vacuum vessel
    annotations:
      dd_type_name: focs_fibre_properties
      dd_path: focs/fibre_properties
    attributes:
      id:
        range: string
        description: ID of the fibre, e.g. commercial reference
        annotations:
          dd_type: static
      beat_length:
        range: float
        description: Linear beat length
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      spun:
        range: float
        description: Spun period
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      twist:
        range: float
        description: Twist period
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      spun_initial_azimuth:
        range: float
        description: Spun fibre initial azimuth
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      verdet_constant:
        range: float
        description: Verdet constant
        annotations:
          dd_type: static
          dd_units: rad.T^-1.m^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  StokesInitial:
    is_a: InformationContentEntity
    description: Initial Stokes vector at the entrance of the FOCS
    annotations:
      dd_type_name: stokes_initial
      dd_path: focs/stokes_initial
    attributes:
      s0:
        range: float
        description: S0 component of the unit Stokes vector
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s1:
        range: float
        description: S1 component of the unit Stokes vector
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s2:
        range: float
        description: S2 component of the unit Stokes vector
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s3:
        range: float
        description: S3 component of the unit Stokes vector
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  StokesDynamic:
    is_a: TimeSlice
    description: Stokes vector at the output of the FOCS as a function of time
    annotations:
      dd_type_name: stokes_dynamic
      dd_path: focs/stokes_output
      fyo_lift: time_slice
    attributes:
      s0:
        range: float
        description: S0 component of the unit Stokes vector
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s1:
        range: float
        description: S1 component of the unit Stokes vector
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s2:
        range: float
        description: S2 component of the unit Stokes vector
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      s3:
        range: float
        description: S3 component of the unit Stokes vector
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
