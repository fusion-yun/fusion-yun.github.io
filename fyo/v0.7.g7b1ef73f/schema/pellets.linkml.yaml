id: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/pellets
name: fyo-pellets
title: fyo IDS `pellets` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `pellets` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7b1ef73f/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/pellets/dd_pellets.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Pellets
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Pellets:
    is_a: IDS
    description: Description of pellets launched into the plasma
    annotations:
      dd_path: pellets
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      time_slice:
        range: PelletsTimeSlice
        multivalued: true
        description: Description of the pellets launched at various time slices. The time of this structure
          corresponds to the full ablation of the pellet inside the plasma.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PelletsTimeSlice:
    is_a: TimeSlice
    description: Description of the pellets launched at various time slices. The time of this structure
      corresponds to the full ablation of the pellet inside the plasma.
    annotations:
      dd_type_name: pellets_time_slice
      dd_path: pellets/time_slice
      fyo_lift: time_slice
    attributes:
      pellet:
        range: PelletsTimeSlicePellet
        multivalued: true
        description: Set of pellets ablated in the plasma at a given time
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PelletsTimeSlicePellet:
    is_a: InformationContentEntity
    description: Set of pellets ablated in the plasma at a given time
    annotations:
      dd_type_name: pellets_time_slice_pellet
      dd_path: pellets/time_slice/pellet
    attributes:
      shape:
        range: PelletsTimeSlicePelletShape
        description: Initial shape of a pellet at launch
      species:
        range: PelletsTimeSlicePelletSpecies
        multivalued: true
        description: Set of atomic species included in the pellet composition
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_initial:
        range: float
        description: Initial velocity of the pellet as it enters the vaccum chamber
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      path_geometry:
        range: LineOfSight2pointsDynamicAos3
        description: Geometry of the pellet path in the vaccuum chamber
      path_profiles:
        range: PelletsTimeSlicePelletPathProfiles
        description: 1-D profiles of plasma and pellet along the pellet path
      propellant_gas:
        range: PelletsPropellantGas
        description: Propellant gas
  PelletsTimeSlicePelletShape:
    is_a: InformationContentEntity
    description: Initial shape of a pellet at launch
    annotations:
      dd_type_name: pellets_time_slice_pellet_shape
      dd_path: pellets/time_slice/pellet/shape
    attributes:
      type:
        range: Identifier
        description: 'Identifier structure for the shape type: 1-spherical; 2-cylindrical; 3-rectangular'
      size:
        range: float
        multivalued: true
        description: 'Size of the pellet in the various dimensions, depending on the shape type. Spherical
          pellets: size(1) is the radius of the pellet. Cylindrical pellets: size(1) is the radius and
          size(2) is the height of the cylinder. Rectangular pellets: size(1) is the height, size(2) is
          the width and size(3) is the length'
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
  PelletsTimeSlicePelletSpecies:
    is_a: InformationContentEntity
    description: Set of atomic species included in the pellet composition
    annotations:
      dd_type_name: pellets_time_slice_pellet_species
      dd_path: pellets/time_slice/pellet/species
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: dynamic
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: integer
        description: Nuclear charge
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H, D, T, ...)
        annotations:
          dd_type: dynamic
      density:
        range: float
        description: Material density of the species in the pellet
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      fraction:
        range: float
        description: Atomic fraction of the species in the pellet
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      sublimation_energy:
        range: float
        description: Sublimation energy per atom
        annotations:
          dd_type: dynamic
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PelletsTimeSlicePelletPathProfiles:
    is_a: InformationContentEntity
    description: 1-D profiles of plasma and pellet along the pellet path
    annotations:
      dd_type_name: pellets_time_slice_pellet_path_profiles
      dd_path: pellets/time_slice/pellet/path_profiles
    attributes:
      distance:
        range: float
        multivalued: true
        description: Distance along the pellet path, with the origin taken at path_geometry/first_point.
          Used as the main coordinate for the path_profiles structure
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal coordinate along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      psi:
        range: float
        multivalued: true
        description: Poloidal flux along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      velocity:
        range: float
        multivalued: true
        description: Pellet velocity along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      n_e:
        range: float
        multivalued: true
        description: Electron density along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      t_e:
        range: float
        multivalued: true
        description: Electron temperature along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      ablation_rate:
        range: float
        multivalued: true
        description: Ablation rate (electrons) along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      ablated_particles:
        range: float
        multivalued: true
        description: Number of ablated particles (electrons) along the pellet path
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      rho_tor_norm_drift:
        range: float
        multivalued: true
        description: Difference to due ExB drifts between the ablation and the final deposition locations,
          in terms of the normalized toroidal flux coordinate
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../distance
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance
      position:
        range: Rphiz1dDynamicAos3
        description: Position along the pellet path
  PelletsPropellantGas:
    is_a: InformationContentEntity
    description: Propellant gas
    annotations:
      dd_type_name: pellets_propellant_gas
      dd_path: pellets/time_slice/pellet/propellant_gas
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the gas molecule
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying the neutral molecule (e.g. H2, D2, T2, N2, ...)
        annotations:
          dd_type: dynamic
      molecules_n:
        range: float
        description: Number of molecules of the propellant gas injected in the vacuum vessel when launching
          the pellet
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
