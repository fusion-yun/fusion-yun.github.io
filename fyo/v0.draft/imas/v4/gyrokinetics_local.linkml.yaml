          for Z=Z0 and R>R0 (LFS)
        annotations:
          dd_type: constant
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
