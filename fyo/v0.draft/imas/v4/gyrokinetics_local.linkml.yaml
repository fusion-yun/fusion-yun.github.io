          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      time_interval_norm:
        range: float
        multivalued: true
        description: normalized time interval used to average fluxes in non-linear runs
        annotations:
          dd_type: constant
          dd_units: '1'
