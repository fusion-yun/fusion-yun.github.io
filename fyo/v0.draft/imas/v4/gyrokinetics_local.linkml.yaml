  GyrokineticsModel:
    is_a: InformationContentEntity
    description: Assumptions of the GK calculations
    annotations:
      dd_type_name: gyrokinetics_model
      dd_path: gyrokinetics_local/model
    attributes:
      include_a_field_parallel:
        range: integer
        description: Flag = 1 if fluctuations of the parallel vector potential are retained, 0 otherwise
        annotations:
          dd_type: constant
      include_b_field_parallel:
        range: integer
        description: Flag = 1 if fluctuations of the parallel magnetic field are retained, 0 otherwise
        annotations:
          dd_type: constant
      use_mhd_approximation:
        range: integer
        description: Flag = 1 if the geometric dependence of the grad-B drift is approximated to be that
          of the curvature drift (including the pressure gradient contribution), 0 otherwise. Using this
          approximation (Flag=1) is only recommended together with the neglect of parallel magnetic field
          fluctuations
        annotations:
          dd_type: constant
      include_coriolis_drift:
        range: integer
        description: Flag = 1 if Coriolis drift is included, 0 otherwise
        annotations:
          dd_type: constant
      include_centrifugal_effects:
        range: integer
        description: Flag = 1 if centrifugal effects are retained, 0 otherwise
        annotations:
          dd_type: constant
      collisions_pitch_only:
        range: integer
        description: Flag = 1 if only pitch-angle scattering is retained, 0 otherwise
        annotations:
          dd_type: constant
      collisions_momentum_conservation:
        range: integer
        description: Flag = 1 if the collision operator conserves momentum, 0 otherwise
        annotations:
          dd_type: constant
      collisions_energy_conservation:
        range: integer
        description: Flag = 1 if the collision operator conserves energy, 0 otherwise
        annotations:
          dd_type: constant
      collisions_finite_larmor_radius:
        range: integer
        description: Flag = 1 if finite larmor radius effects are retained in the collision operator,
          0 otherwise
        annotations:
          dd_type: constant
      adiabatic_electrons:
        range: integer
        description: Flag = 1 if electrons are adiabatic, 0 otherwise
        annotations:
          dd_type: constant
  GyrokineticsInputSpeciesGlobal:
    is_a: InformationContentEntity
    description: Physical quantities common to all species
    annotations:
      dd_type_name: gyrokinetics_input_species_global
      dd_path: gyrokinetics_local/species_all
    attributes:
      beta_reference:
        range: float
        description: Reference plasma beta (see detailed documentation at the root of the IDS)
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      velocity_phi_norm:
        range: float
        description: normalized toroidal velocity of species (all species are assumed to have a purely
          toroidal velocity with a common toroidal angular frequency)
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      debye_length_norm:
        range: float
        description: Debye length computed from the reference quantities (see detailed documentation at
          the root of the IDS)
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      shearing_rate_norm:
        range: float
        description: normalized ExB shearing rate (for non-linear runs only)
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      angle_pol_equilibrium:
        range: float
        multivalued: true
        description: Poloidal angle grid, from -pi to pi, on which the species dependent effective potential
          energy (which determines the poloidal variation of the density) is expressed. The angle is defined
          with respect to (R0,Z0) with R0=(Rmax-Rmin)/2 and Z0=(Zmax-Zmin)/2. It is increasing clockwise.
          So (r,theta,phi) is right-handed. theta=0 for Z=Z0 and R>R0 (LFS)
        annotations:
          dd_type: constant
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
