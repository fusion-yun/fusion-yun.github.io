      x2:
        range: float
        multivalued: true
        description: Positions along x2 axis
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../x1
          spo_class: spo:Function
          fyo_lift: field
