          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      extinction_coefficient:
        range: float
        multivalued: true
        description: Extinction coefficient (for metal)
        annotations:
          dd_type: constant
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      transmission_coefficient:
        range: float
        multivalued: true
        description: Transmission coefficient (for dielectric)
        annotations:
          dd_type: constant
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
