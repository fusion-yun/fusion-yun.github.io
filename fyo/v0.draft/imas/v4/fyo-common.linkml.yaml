        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H+, D+, T+, He+2, C+, ...)
        annotations:
          dd_type: constant
      state:
        range: PlasmaCompositionIonStateConstant
        description: Quantities related to the different states of the species (ionization, energy, excitation,
          ...)
  PlasmaCompositionNeutralConstant:
    is_a: InformationContentEntity
    description: Description of the neutral species, used if type/index = 4 or 5
    annotations:
      dd_type_name: plasma_composition_neutral_constant
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '5'
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying neutral (e.g. H, D, T, He, C, ...)
        annotations:
          dd_type: constant
      state:
        range: PlasmaCompositionNeutralStateConstant
        description: State of the species (energy, excitation, ...)
  PlasmaCompositionNeutralElement:
    is_a: InformationContentEntity
    description: List of elements forming the atom or molecule
    annotations:
      dd_type_name: plasma_composition_neutral_element
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '16'
    attributes:
      a:
        range: float
