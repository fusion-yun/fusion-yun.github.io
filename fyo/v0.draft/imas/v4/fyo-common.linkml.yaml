        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Height of the reference point (from which the alpha and beta angles are defined,
          marked by a + on the diagram)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length_alpha:
        range: float
        description: Length of the parallelogram side inclined with angle alpha with respect to the major
          radius axis
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length_beta:
        range: float
        description: Length of the parallelogram side inclined with angle beta with respect to the height
          axis
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      alpha:
        range: float
        description: Inclination of first angle measured counter-clockwise from horizontal outwardly directed
          radial vector (grad R).
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      beta:
        range: float
        description: Inclination of second angle measured counter-clockwise from vertically upwards directed
          vector (grad Z). If both alpha and beta are zero (rectangle) then the simpler rectangular elements
          description should be used.
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  OpticalElement:
