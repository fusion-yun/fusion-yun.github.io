          dd_units: ohm^-1.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      electrons:
        range: PlasmaTransportModelGgdElectrons
        description: Transport quantities related to the electrons
      total_ion_energy:
        range: PlasmaTransportModelEnergy
        description: Transport coefficients for the total (summed over ion  species) energy equation
      momentum:
        range: PlasmaTransportModelMomentum
        description: Transport coefficients for total momentum equation. The various components two levels
          below this node refer to the momentum vector components, while their flux is given in the direction
          perpendicular to the edges or faces of the grid.
      ion:
        range: PlasmaTransportModelGgdIon
        multivalued: true
