  PlasmaRadialGrid:
    is_a: InformationContentEntity
    description: Radial grid. Note that some of the radial coordinates listed above are undefined outside
      the last closed flux surface, thus they must be filled with EMPTY_FLOAT values in such locations
    annotations:
      dd_type_name: plasma_radial_grid
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '4'
    attributes:
      rho_pol_norm:
        range: float
        multivalued: true
        description: Normalised poloidal flux coordinate = sqrt((psi(rho)-psi(magnetic_axis) / (psi(LCFS)-psi(magnetic_axis)))
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      psi:
        range: float
        multivalued: true
        description: Poloidal magnetic flux. Integral of magnetic field passing through a contour defined
          by the intersection of a flux surface passing through the point of interest and a Z=constant
          plane. If the integration surface is flat, the surface normal vector is in the increasing vertical
          coordinate direction, Z, namely upwards.
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalised toroidal flux coordinate. The normalizing value for rho_tor_norm, is the
          toroidal flux coordinate at the equilibrium boundary (LCFS or 99.x % of the LCFS in case of
          a fixed boundary equilibium calculation, see time_slice/boundary/b_flux_pol_norm in the equilibrium
          IDS)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      rho_tor:
        range: float
        multivalued: true
        description: Toroidal flux coordinate. rho_tor = sqrt(b_flux_tor/(pi*b0)) ~ sqrt(pi*r^2*b0/(pi*b0))
          ~ r [m]. The toroidal field used in its definition is indicated under vacuum_toroidal_field/b0
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      volume:
        range: float
        multivalued: true
        description: Volume enclosed inside the magnetic surface
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      area:
        range: float
        multivalued: true
        description: Cross-sectional area of the flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      surface:
        range: float
        multivalued: true
        description: Surface area of the toroidal flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_pol_norm
      psi_magnetic_axis:
        range: float
        description: Value of the poloidal magnetic flux at the magnetic axis (useful to normalize the
          psi array values when the radial grid doesn't go from the magnetic axis to the plasma boundary)
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_boundary:
        range: float
        description: Value of the poloidal magnetic flux at the plasma boundary (useful to normalize the
          psi array values when the radial grid doesn't go from the magnetic axis to the plasma boundary)
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
