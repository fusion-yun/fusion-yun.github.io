id: https://fusion-yun.github.io/fyo/v0.draft/imas/v4/common
name: fyo-common
title: fyo-common — shared DD utility types, lifted (DD 4.1.1)
description: Deduplicated dd_support utility types of the IMAS DD, semantically lifted onto spo (Signal
  / Mesh / Field / geometry / Code / ICE). Generated by dd2fyo from the mechanical layer; imported by
  every lifted per-IDS schema.
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  provenance: DO NOT EDIT — regenerate via ontology/dd2fyo.py.
classes:
  AnnulusStatic:
    is_a: Surface
    description: The element is an annulus of centre R, Z, with inner radius radius_inner and outer radius
      radius_outer
    annotations:
      dd_type_name: annulus_static
      fyo_lift: shared:Surface
      dd_shared_in: '6'
    attributes:
      r:
        range: float
        description: Centre major radius
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Centre height
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      radius_inner:
        range: float
        description: Inner radius
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      radius_outer:
        range: float
        description: Outer radius
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  ArcsOfCircleStatic:
    is_a: Surface
    description: Description of the element contour by a set of arcs of circle. For each of these, the
      position of the start point is given together with the curvature radius. The end point is given
      by the start point of the next arc of circle.
    annotations:
      dd_type_name: arcs_of_circle_static
      fyo_lift: shared:Surface
      dd_shared_in: '6'
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radii of the start point of each arc of circle
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      z:
        range: float
        multivalued: true
        description: Height of the start point of each arc of circle
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../r
      curvature_radii:
        range: float
        multivalued: true
        description: Curvature radius of each arc of circle
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../r
  BTorVacuum1:
    is_a: InformationContentEntity
    description: Characteristics of the vacuum toroidal field (used in Rho_Tor definition and in the normalization
      of current densities)
    annotations:
      dd_type_name: b_tor_vacuum_1
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '19'
    attributes:
      r0:
        range: float
        description: Reference major radius where the vacuum toroidal magnetic field is given (usually
          a fixed position such as the middle of the vessel at the equatorial midplane)
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      b0:
        range: float
        multivalued: true
        description: Vacuum toroidal field at R0 [T]; Positive sign means anti-clockwise when viewing
          from above. The product R0B0 must be consistent with the b_tor_vacuum_r field of the tf IDS.
        annotations:
          dd_type: dynamic
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
  CameraGeometry:
    is_a: InformationContentEntity
    description: 'Characteristics of the camera used. The orientation of the camera is described as follows
      : pixels are aligned along x1 and x2 unit vectors while x3 is normal to the detector plane.'
    annotations:
      dd_type_name: camera_geometry
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      pixel_dimensions:
        range: float
        multivalued: true
        description: Pixel dimension in each direction (x1, x2)
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      pixels_n:
        range: integer
        multivalued: true
        description: Number of pixels in each direction (x1, x2)
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      pixel_position:
        range: Rphiz2dStatic
        description: 'Position of the centre of each pixel. First dimension : line index (x1 axis). Second
          dimension: column index (x2 axis).'
      camera_dimensions:
        range: float
        multivalued: true
        description: Total camera dimension in each direction (x1, x2)
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      centre:
        range: Rphiz0dStatic
        description: Position of the camera centre
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the camera plane and oriented towards the plasma.
      line_of_sight:
        range: LineOfSight2pointsRphiz2d
        description: 'Description of the line of sight for each pixel, given by 2 points. For each coordinate
          : first dimension : line index (x1 axis); second dimension: column index (x2 axis).'
  CodeConstant:
    is_a: Code
    description: Plugins used to PUT a node (potentially, multiple plugins can be applied, if so they
      are listed by order of application)
    annotations:
      dd_type_name: code_constant
      fyo_lift: shared:Code
      dd_shared_in: '82'
    attributes:
      name:
        range: string
        description: Name of software used
        annotations:
          dd_type: constant
      description:
        range: string
        description: Short description of the software (type, purpose)
        annotations:
          dd_type: constant
      commit:
        range: string
        description: Unique commit reference of software
        annotations:
          dd_type: constant
      version:
        range: string
        description: Unique version (tag) of software
        annotations:
          dd_type: constant
      repository:
        range: string
        description: URL of software repository
        annotations:
          dd_type: constant
      parameters:
        range: string
        description: List of the code specific parameters in XML format
        annotations:
          dd_type: constant
      library:
        range: Library
        multivalued: true
        description: List of external libraries used by the code that has produced this IDS
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  CodeConstantNoparam:
    is_a: Code
    description: Plugin infrastructure used to PUT the data
    annotations:
      dd_type_name: code_constant_noparam
      fyo_lift: shared:Code
      dd_shared_in: '82'
    attributes:
      name:
        range: string
        description: Name of software used
        annotations:
          dd_type: constant
      description:
        range: string
        description: Short description of the software (type, purpose)
        annotations:
          dd_type: constant
      commit:
        range: string
        description: Unique commit reference of software
        annotations:
          dd_type: constant
      version:
        range: string
        description: Unique version (tag) of software
        annotations:
          dd_type: constant
      repository:
        range: string
        description: URL of software repository
        annotations:
          dd_type: constant
  CodeWithTimebase:
    is_a: InformationContentEntity
    description: Code-specific parameters used for this source
    annotations:
      dd_type_name: code_with_timebase
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '5'
    attributes:
      name:
        range: string
        description: Name of software used
        annotations:
          dd_type: constant
      description:
        range: string
        description: Short description of the software (type, purpose)
        annotations:
          dd_type: constant
      commit:
        range: string
        description: Unique commit reference of software
        annotations:
          dd_type: constant
      version:
        range: string
        description: Unique version (tag) of software
        annotations:
          dd_type: constant
      repository:
        range: string
        description: URL of software repository
        annotations:
          dd_type: constant
      parameters:
        range: string
        description: List of the code specific parameters in XML format
        annotations:
          dd_type: constant
      output_flag:
        range: SignalInt1d
        description: 'Output flag : 0 means the run is successful, other values mean some difficulty has
          been encountered, the exact meaning is then code specific. Negative values mean the result shall
          not be used.'
  DdCoil:
    is_a: InformationContentEntity
    description: Set of coils
    annotations:
      dd_type_name: coil
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “Coil between sector 1 and 2”
        annotations:
          dd_type: static
      identifier:
        range: string
        description: Alphanumeric identifier of coil
        annotations:
          dd_type: static
      conductor:
        range: CoilConductor
        multivalued: true
        description: Set of conductors inside the coil. The structure can be used with size 1 for a simplified
          description as a single conductor. A conductor is composed of several elements, serially connected,
          i.e. transporting the same current.
        annotations:
          dd_type: static
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      turns:
        range: float
        description: Number of total turns in the coil. May be a fraction when describing the coil connections.
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      resistance:
        range: float
        description: Coil resistance
        annotations:
          dd_type: static
          dd_units: ohm
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current:
        range: SignalFlt1d
        description: 'Current in one turn of the coil (to be multiplied by the number of turns to calculate
          the magnetic field generated). Sign convention : a positive current flows in the direction in
          which conductor elements are ordered (from start to end for a positive polarity coil)'
        annotations:
          dd_units: A
      voltage:
        range: SignalFlt1d
        description: 'Voltage on the coil terminals. Sign convention : positive when the current flows
          in the direction in which conductor elements are ordered (from start to end for a positive polarity
          coil)'
        annotations:
          dd_units: V
      neutron_fast_flux_inboard:
        range: SignalFlt1d
        description: Fast neutron flux arriving on the inboard side of this coil
        annotations:
          dd_units: m^-2.s^-1
  CoilConductor:
    is_a: InformationContentEntity
    description: Set of conductors inside the coil. The structure can be used with size 1 for a simplified
      description as a single conductor. A conductor is composed of several elements, serially connected,
      i.e. transporting the same current.
    annotations:
      dd_type_name: coil_conductor
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      elements:
        range: CoilConductorElements
        description: 'Set of geometrical elements (line segments and/or arcs of a circle) describing the
          contour of the conductor centre. We define a coordinate system associated to each element as
          follows: for the arc and circle elements: binormal = (start point - center) x (intermediate
          point - center). This vector points in the direction of the circle / arc axis. normal = (center
          - point on curve). The normal vector will rotate as the point moves around the curve. Tangent
          = normal x binormal. For the line element we require an extra point, using the currently redundant
          intermediate point to define the line element''s normal axis. The local coordinates for the
          line element then become: tangent = end point - start point; normal = intermediate point - start
          point; binormal = tangent x normal. It is assumed that all the axes above are normalized such
          that they have a unit length.'
      cross_section:
        range: CoilCrossSection
        multivalued: true
        description: The cross-section perpendicular to the conductor contour is described by a series
          of contour points, given by their relative position with respect to the start point of each
          element. If the size of this array of structure is equal to 1, then the cross-section is given
          only for the first element and translated along the conductor elements. Otherwise, it's given
          explictly for each element, allowing to describe changes of the cross section shape
        annotations:
          dd_max_occurs: '50'
          dd_coordinate1: ../elements/types OR 1...1
      resistance:
        range: float
        description: conductor resistance
        annotations:
          dd_type: static
          dd_units: ohm
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      voltage:
        range: SignalFlt1d
        description: 'Voltage on the conductor terminals. Sign convention : positive when the current
          flows in the direction in which conductor elements are ordered (from start to end for a positive
          polarity coil)'
        annotations:
          dd_units: V
  CoilConductorElements:
    is_a: InformationContentEntity
    description: 'Set of geometrical elements (line segments and/or arcs of a circle) describing the contour
      of the conductor centre. We define a coordinate system associated to each element as follows: for
      the arc and circle elements: binormal = (start point - center) x (intermediate point - center).
      This vector points in the direction of the circle / arc axis. normal = (center - point on curve).
      The normal vector will rotate as the point moves around the curve. Tangent = normal x binormal.
      For the line element '
    annotations:
      dd_type_name: coil_conductor_elements
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      types:
        range: integer
        multivalued: true
        description: 'Type of every element: 1: line segment, its ends are given by the start and end
          points; index = 2: arc of a circle; index = 3: full circle'
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      start_points:
        range: CoilNaRphiz1dStatic
        description: Position of the start point of every element
      intermediate_points:
        range: CoilNaRphiz1dStatic
        description: Position of an intermediate point along the circle or arc of circle, for every element,
          providing the orientation of the element (must define with the corresponding start point an
          aperture angle strictly inferior to PI). In the case of a line segment (../types/index=1), fill
          this node with a point such that the vector intermediate_point - start_point defines the direction
          of the element's normal axis (see documentation of ../elements)
      end_points:
        range: CoilNaRphiz1dStatic
        description: Position of the end point of every element. Meaningful only if type/index = 1 or
          2, fill with default/empty value otherwise
      centres:
        range: CoilNaRphiz1dStatic
        description: Position of the centre of the arc of a circle of every element (meaningful only if
          type/index = 2 or 3, fill with default/empty value otherwise)
  CoilCrossSection:
    is_a: InformationContentEntity
    description: The cross-section perpendicular to the conductor contour is described by a series of
      contour points, given by their relative position with respect to the start point of each element.
      If the size of this array of structure is equal to 1, then the cross-section is given only for the
      first element and translated along the conductor elements. Otherwise, it's given explictly for each
      element, allowing to describe changes of the cross section shape
    annotations:
      dd_type_name: coil_cross_section
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      geometry_type:
        range: Identifier
        description: Geometry type used to describe the cross section of this element. The conductor centre
          is given by the ../../elements description.
      width:
        range: float
        description: Full width of the rectangle or square in the normal direction, when geometry_type/index
          = 3 or 4. Diameter of the circle when geometry_type/index = 2. Outer diameter of the annulus
          in case geometry_type/index = 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      height:
        range: float
        description: Full height of the rectangle in the binormal direction, used only if geometry_type/index
          = 3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      radius_inner:
        range: float
        description: Inner radius of the annulus, used only if geometry_type/index = 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: NormalBinormalStatic
        description: Polygonal outline of the cross section in the (normal, binormal) coordinate system.
          Do NOT repeat the first point.
      area:
        range: float
        description: Area of the conductor cross-section, derived from the above geometric data
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CoilNaRphiz1dStatic:
    is_a: InformationContentEntity
    description: Position of the start point of every element
    annotations:
      dd_type_name: coil_na_rphiz1d_static
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../types
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../types
      phi:
        range: float
        multivalued: true
        description: Toroidal angle (oriented counter-clockwise when viewing from above)
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../types
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../types
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../types
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../types
  CoreProfileIons:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
      sequences. Ionization states (or other types of states) must be differentiated at the state level
      below
    annotations:
      dd_type_name: core_profile_ions
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed), volume averaged
          over plasma radius
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H, D, T, He, C, D2, ...)
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: dynamic
      z_ion_1d:
        range: float
        multivalued: true
        description: Average charge of the ion species (sum of states charge weighted by state density
          and divided by ion density)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      z_ion_square_1d:
        range: float
        multivalued: true
        description: Average square charge of the ion species (sum of states square charge weighted by
          state density and divided by ion density)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      temperature:
        range: float
        multivalued: true
        description: Temperature (average over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      temperature_validity:
        range: integer
        description: 'Indicator of the validity of the temperature profile. 0: valid from automated processing,
          1: valid and certified by the RO; - 1 means problem identified in the data processing (request
          verification by the RO), -2: invalid data, should not be used'
        annotations:
          dd_type: dynamic
      temperature_fit:
        range: CoreProfiles1DFit
        description: Information on the fit used to obtain the temperature profile
        annotations:
          dd_units: eV
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      density_validity:
        range: integer
        description: 'Indicator of the validity of the density profile. 0: valid from automated processing,
          1: valid and certified by the RO; - 1 means problem identified in the data processing (request
          verification by the RO), -2: invalid data, should not be used'
        annotations:
          dd_type: dynamic
      density_fit:
        range: CoreProfiles1DFit
        description: Information on the fit used to obtain the density profile
        annotations:
          dd_units: m^-3
      density_thermal:
        range: float
        multivalued: true
        description: Density (thermal) (sum over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      density_fast:
        range: float
        multivalued: true
        description: Density of fast (non-thermal) particles (sum over charge states when multiple charge
          states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      pressure:
        range: float
        multivalued: true
        description: Pressure (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      pressure_thermal:
        range: float
        multivalued: true
        description: Pressure (thermal) associated with random motion ~average((v-average(v))^2) (sum
          over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      pressure_fast_perpendicular:
        range: float
        multivalued: true
        description: Fast (non-thermal) perpendicular pressure  (sum over charge states when multiple
          charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      pressure_fast_parallel:
        range: float
        multivalued: true
