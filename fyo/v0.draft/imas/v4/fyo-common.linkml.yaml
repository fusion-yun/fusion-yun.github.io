        annotations:
          dd_type: constant
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
  Outline2dGeometryStatic:
    is_a: Geometry
    description: Optional equivalent axisymmetric representation of the geometry of each element (e.g.
      for each iron core segment), typically used to represent iron core in axisymmetric equilibrium solvers
    annotations:
      dd_type_name: outline_2d_geometry_static
      fyo_lift: shared:Geometry
      dd_shared_in: '6'
    attributes:
      geometry_type:
        range: integer
        description: 'Type used to describe the element shape (1:''outline'', 2:''rectangle'', 3:''oblique'',
          4:''arcs of circle, 5: ''annulus'', 6 : ''thick line'')'
      outline:
        range: Rz1dStatic
        description: Irregular outline of the element. Repeat the first point since this is a closed contour
      rectangle:
        range: RectangleStatic
        description: Rectangular description of the element
      oblique:
        range: ObliqueStatic
        description: Parallelogram description of the element
      arcs_of_circle:
        range: ArcsOfCircleStatic
        description: Description of the element contour by a set of arcs of circle. For each of these,
          the position of the start point is given together with the curvature radius. The end point is
          given by the start point of the next arc of circle.
      annulus:
        range: AnnulusStatic
        description: The element is an annulus of centre R, Z, with inner radius radius_inner and outer
          radius radius_outer
      thick_line:
        range: ThickLineStatic
        description: The element is approximated by a rectangle defined by a central segment and a thickness
          in the direction perpendicular to the segment
  PfCoilsElements:
    is_a: InformationContentEntity
    description: Each PF coil is comprised of a number of cross-section elements described  individually
      and connected serially
    annotations:
      dd_type_name: pf_coils_elements
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      turns_with_sign:
        range: float
        description: Number of effective turns in the element for calculating the magnetic field from
          the coil/loop. Should be positive, unless the coil has elements going in opposite directions.
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      area:
        range: float
        description: Cross-sectional areas of the element
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      geometry:
        range: Outline2dGeometryStatic
        description: Cross-sectional shape of the element
  PhysicalQuantityFlt1dTime1:
    is_a: InformationContentEntity
    description: Frequency of the channel
    annotations:
      dd_type_name: physical_quantity_flt_1d_time_1
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the data for each time slice. 0: valid from automated
          processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified in the
          data processing (request verification by the diagnostic RO), -2: invalid data, should not be
          used (values lower than -2 have a code-specific meaning detailing the origin of their invalidity)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: constant
  PlasmaCompositionIonStateConstant:
    is_a: InformationContentEntity
