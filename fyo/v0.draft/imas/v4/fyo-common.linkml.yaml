        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      psi:
        range: float
        multivalued: true
        description: Poloidal flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalised toroidal flux coordinate
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
