  CoreRadialGrid:
    is_a: Mesh
    description: Radial grid
    annotations:
      dd_type_name: core_radial_grid
      fyo_lift: shared:Mesh
      dd_shared_in: '12'
    attributes:
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate. The normalizing value for rho_tor_norm, is the
          toroidal flux coordinate at the equilibrium boundary (LCFS or 99.x % of the LCFS in case of
          a fixed boundary equilibium calculation, see time_slice/boundary/b_flux_pol_norm in the equilibrium
          IDS)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      rho_tor:
        range: float
        multivalued: true
        description: Toroidal flux coordinate = sqrt(phi/(pi*b0)), where the toroidal magnetic field,
          b0, corresponds to that stored in vacuum_toroidal_field/b0 and pi can be found in the IMAS constants
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      rho_pol_norm:
        range: float
        multivalued: true
        description: Normalized poloidal flux coordinate = sqrt((psi(rho)-psi(magnetic_axis)) / (psi(LCFS)-psi(magnetic_axis)))
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      psi:
        range: float
        multivalued: true
        description: Poloidal magnetic flux. Integral of magnetic field passing through a contour defined
          by the intersection of a flux surface passing through the point of interest and a Z=constant
          plane. If the integration surface is flat, the surface normal vector is in the increasing vertical
          coordinate direction, Z, namely upwards.
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      volume:
        range: float
        multivalued: true
        description: Volume enclosed inside the magnetic surface
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      area:
        range: float
        multivalued: true
        description: Cross-sectional area of the flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      surface:
        range: float
        multivalued: true
        description: Surface area of the toroidal flux surface
        annotations:
          dd_type: dynamic
          dd_units: m^2
          dd_ndim: 1
          dd_coordinate1: ../rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../rho_tor_norm
      psi_magnetic_axis:
        range: float
        description: Value of the poloidal magnetic flux at the magnetic axis (useful to normalize the
          psi array values when the radial grid doesn't go from the magnetic axis to the plasma boundary)
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      psi_boundary:
        range: float
        description: Value of the poloidal magnetic flux at the plasma boundary (useful to normalize the
          psi array values when the radial grid doesn't go from the magnetic axis to the plasma boundary)
        annotations:
          dd_type: dynamic
          dd_units: Wb
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CovarianceMatrix:
    is_a: InformationContentEntity
    description: User defined covariance matrix. The covariance of various quantities can be stored here,
      these quantities are referred to by giving their IDS path in the rows_uri list
    annotations:
      dd_type_name: covariance_matrix
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      description:
        range: string
        description: Description of this covariance matrix
        annotations:
          dd_type: constant
      rows_uri:
        range: string
        multivalued: true
        description: List of URIs corresponding to the rows (1st dimension) of the covariance matrix.
          If not all indices of a given node are used, they must be listed explicitly e.g. rows_uri(i)
          = pf_active:1/coil(i) will refer to a list of indices of the occurrence 1 of the pf_active IDS
          of this data entry. If the rows correspond to all indices of a given vector it is sufficient
          to give a single URI where this vector is denoted using the (:) implicit notation, e.g. rows_uri(1)
          = /grid_ggd(3)/grid_subset(2)/elements(:).
        annotations:
          dd_type: constant
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      data:
        range: float
        multivalued: true
        description: Covariance matrix
        annotations:
          dd_type: constant
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../rows_uri
          dd_coordinate2: ../rows_uri
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../rows_uri,../rows_uri
  CurvedObject:
    is_a: InformationContentEntity
    description: Description of the geometry of the mirror, in its reference position
    annotations:
      dd_type_name: curved_object
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      geometry_type:
        range: Identifier
        description: Geometry of the object contour. Note that there is some flexibility in the choice
          of the local coordinate system (X1,X2,X3). The data provider should choose the most convenient
          coordinate system for the object, respecting the definitions of (X1,X2,X3) indicated below.
      curvature_type:
        range: Identifier
        description: Curvature of the object.
      material:
        range: Identifier
        description: Material of the object
      centre:
        range: Rphiz0dStatic
        description: Coordinates of the origin of the local coordinate system (X1,X2,X3) describing the
          object. This origin is located within the object area and should be the middle point of the
          object surface. If geometry_type=2, it's the centre of the circular object. If geometry_type=3,
          it's the centre of the rectangular object.
      radius:
        range: float
        description: Radius of the circle, used only if geometry_type/index = 2
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the object surface and oriented towards the plasma.
      x1_width:
        range: float
        description: Full width of the object in the X1 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_width:
        range: float
        description: Full width of the object in the X2 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: X1x21dStatic
        description: Irregular outline of the object in the (X1, X2) coordinate system, used only if geometry_type/index=1.
          Repeat the first point since this is a closed contour
      x1_curvature:
        range: float
        description: Radius of curvature in the X1 direction, to be filled only for curvature_type/index
          = 2, 4 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_curvature:
        range: float
        description: Radius of curvature in the X2 direction, to be filled only for curvature_type/index
          = 3 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      surface:
        range: float
        description: Surface of the object, derived from the above geometric data
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      sphere_centre:
        range: Rphiz0dStatic
        description: Position of the center of the sphere which defines the mirror, in the case of a spherical
          mirror (geometry_type = 2), derived from the above geometric data
  CurvedSurface:
    is_a: InformationContentEntity
    description: Curvature of the front surface
    annotations:
      dd_type_name: curved_surface
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      curvature_type:
        range: Identifier
        description: Curvature of the surface
      x1_curvature:
        range: float
        description: Radius of curvature in the X1 direction, to be filled only for curvature_type/index
          = 2, 4 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_curvature:
        range: float
        description: Radius of curvature in the X2 direction, to be filled only for curvature_type/index
          = 3 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DetectorAperture:
    is_a: Geometry
    description: Detector description
    annotations:
      dd_type_name: detector_aperture
      fyo_lift: shared:Geometry
      dd_shared_in: '14'
    attributes:
      geometry_type:
        range: integer
        description: Type of geometry used to describe the surface of the detector or aperture (1:'outline',
          2:'circular', 3:'rectangle'). In case of 'outline', the surface is described by an outline of
          point in a local coordinate system defined by a centre and three unit vectors X1, X2, X3. Note
          that there is some flexibility here and the data provider should choose the most convenient
          coordinate system for the object, respecting the definitions of (X1,X2,X3) indicated below.
          In case of 'circular', the surface is a circle defined by its centre, radius, and normal vector
          oriented towards the plasma X3.  In case of 'rectangle', the surface is a rectangle defined
          by its centre, widths in the X1 and X2 directions, and normal vector oriented towards the plasma
          X3.
      centre:
        range: Rphiz0dStatic
        description: If geometry_type=2, coordinates of the centre of the circle. If geometry_type=1 or
          3, coordinates of the origin of the local coordinate system (X1,X2,X3) describing the plane
          detector/aperture. This origin is located within the detector/aperture area.
      radius:
        range: float
        description: Radius of the circle, used only if geometry_type = 2
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the detector/aperture plane and oriented towards the
          plasma.
      x1_width:
        range: float
        description: Full width of the aperture in the X1 direction, used only if geometry_type = 3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_width:
        range: float
        description: Full width of the aperture in the X2 direction, used only if geometry_type = 3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: X1x21dStatic
        description: Irregular outline of the detector/aperture in the (X1, X2) coordinate system. Repeat
          the first point since this is a closed contour
      surface:
        range: float
        description: Surface of the detector/aperture, derived from the above geometric data
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DetectorEnergyBand:
    is_a: InformationContentEntity
    description: Set of energy bands in which photons are counted by the detector
    annotations:
      dd_type_name: detector_energy_band
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      lower_bound:
        range: float
        description: Lower bound of the energy band
        annotations:
          dd_type: static
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      upper_bound:
        range: float
        description: Upper bound of the energy band
        annotations:
          dd_type: static
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energies:
        range: float
        multivalued: true
        description: Array of discrete energy values inside the band
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      detection_efficiency:
        range: float
        multivalued: true
        description: Probability of detection of a photon impacting the detector as a function of its
          energy
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../energies
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../energies
  DistributionMarkers:
    is_a: InformationContentEntity
    description: Source given as a group of markers (test particles) born per second, for various time
      slices
    annotations:
      dd_type_name: distribution_markers
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      coordinate_identifier:
        range: Identifier
        multivalued: true
        description: Set of coordinate identifiers, coordinates on which the markers are represented
        annotations:
          dd_units: W.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      weights:
        range: float
        multivalued: true
        description: Weight of the markers, i.e. number of real particles represented by each marker.
          The dimension of the vector correspond to the number of markers
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      positions:
        range: float
        multivalued: true
        description: Position of the markers in the set of coordinates. The first dimension corresponds
          to the number of markers, the second dimension to the set of coordinates
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../weights
          dd_coordinate2: ../coordinate_identifier
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../weights,../coordinate_identifier
      orbit_integrals:
        range: DistributionMarkersOrbit
        description: 'Integrals along the markers orbit. These dimensionless expressions are of the form:
          (1/tau) integral (f(n_tor,m_pol,k,eq,...) dt) from time - tau to time, where tau is the transit/trapping
          time of the marker and f() a dimensionless function (phase factor,drift,etc) of the equilibrium
          (e.g. q) and perturbation (Fourier harmonics n_tor,m_pol and bounce harmonic k) along the particles
          orbits. In fact the integrals are taken during the last orbit of each marker at the time value
          of the time node below'
      orbit_integrals_instant:
        range: DistributionMarkersOrbitInstant
        description: 'Integrals/quantities along the markers orbit. These dimensionless expressions are
          of the form: (1/tau) integral ( f(eq) dt) from time - tau to time_orbit for different values
          of time_orbit in the interval from time - tau to time, where tau is the transit/trapping time
          of the marker and f(eq) a dimensionless function (phase, drift,q,etc) of the equilibrium along
          the markers orbits. The integrals are taken during the last orbit of each marker at the time
          value of the time node below'
      toroidal_mode:
        range: integer
        description: In case the orbit integrals are calculated for a given MHD perturbation, index of
          the toroidal mode considered. Refers to the time_slice/toroidal_mode array of the MHD_LINEAR
          IDS in which this perturbation is described
        annotations:
          dd_type: dynamic
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DistributionMarkersOrbit:
    is_a: InformationContentEntity
    description: 'Integrals along the markers orbit. These dimensionless expressions are of the form:
      (1/tau) integral (f(n_tor,m_pol,k,eq,...) dt) from time - tau to time, where tau is the transit/trapping
      time of the marker and f() a dimensionless function (phase factor,drift,etc) of the equilibrium
      (e.g. q) and perturbation (Fourier harmonics n_tor,m_pol and bounce harmonic k) along the particles
      orbits. In fact the integrals are taken during the last orbit of each marker at the time value of
      the time node bel'
    annotations:
      dd_type_name: distribution_markers_orbit
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      expressions:
        range: string
        multivalued: true
        description: List of the expressions f(n_tor,m_pol,k,q,...) used in the orbit integrals
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      n_phi:
        range: integer
        multivalued: true
        description: Array of toroidal mode numbers, where quantities vary as exp(i.n_phi.phi) and phi
          runs anticlockwise when viewed from above
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      m_pol:
        range: integer
        multivalued: true
        description: Array of poloidal mode numbers, where quantities vary as exp(-i.m_pol.theta) and
          theta is the angle defined by the choice of ../../coordinate_identifier, with its centre at
          the magnetic axis recalled at the root of this IDS
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      bounce_harmonics:
        range: integer
        multivalued: true
        description: Array of bounce harmonics k
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      values:
        range: complex
        multivalued: true
        description: Values of the orbit integrals
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 5
          dd_coordinate1: ../expressions
          dd_coordinate2: ../../weights
          dd_coordinate3: ../n_phi
          dd_coordinate4: ../m_pol
          dd_coordinate5: ../bounce_harmonics
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../expressions,../../weights,../n_phi,../m_pol,../bounce_harmonics
  DistributionMarkersOrbitInstant:
    is_a: InformationContentEntity
    description: 'Integrals/quantities along the markers orbit. These dimensionless expressions are of
      the form: (1/tau) integral ( f(eq) dt) from time - tau to time_orbit for different values of time_orbit
      in the interval from time - tau to time, where tau is the transit/trapping time of the marker and
      f(eq) a dimensionless function (phase, drift,q,etc) of the equilibrium along the markers orbits.
      The integrals are taken during the last orbit of each marker at the time value of the time node
      below'
    annotations:
      dd_type_name: distribution_markers_orbit_instant
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      expressions:
        range: string
        multivalued: true
        description: List of the expressions f(eq) used in the orbit integrals
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      time_orbit:
        range: float
        multivalued: true
        description: Time array along the markers last orbit
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      values:
        range: complex
        multivalued: true
        description: Values of the orbit integrals
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 3
          dd_coordinate1: ../expressions
          dd_coordinate2: ../../weights
          dd_coordinate3: ../time_orbit
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../expressions,../../weights,../time_orbit
  DistributionProcessIdentifier:
    is_a: InformationContentEntity
    description: Set of processes (NBI units, fusion reactions, ...) that provide the source.
    annotations:
      dd_type_name: distribution_process_identifier
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      type:
        range: Identifier
        description: Process type
      reactant_energy:
        range: Identifier
        description: For nuclear reaction source, energy of the reactants. index = 0 for a sum over all
          energies; index = 1 for thermal-thermal; index = 2 for beam-beam; index = 3 for beam-thermal
      nbi_energy:
        range: Identifier
        description: For NBI source, energy of the accelerated species considered. index = 0 for a sum
          over all energies; index = 1 for full energiy; index = 2 for half energy; index = 3 for third
          energy
      nbi_unit:
        range: integer
        description: Index of the NBI unit considered. Refers to the "unit" array of the NBI IDS. 0 means
          sum over all NBI units.
        annotations:
          dd_type: constant
      nbi_beamlets_group:
        range: integer
        description: Index of the NBI beamlets group considered. Refers to the "unit/beamlets_group" array
          of the NBI IDS. 0 means sum over all beamlets groups.
        annotations:
          dd_type: constant
  DistributionSpecies:
    is_a: InformationContentEntity
    description: Species causing this source term (if relevant, e.g. a particular ion or neutral state
      in case of line radiation)
    annotations:
      dd_type_name: distribution_species
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '5'
    attributes:
      type:
        range: Identifier
        description: Species type. index=1 for electron; index=2 for ion species in a single/average state
          (refer to ion structure); index=3 for ion species in a particular state (refer to ion/state
          structure);  index=4 for neutral species in a single/average state (refer to neutral structure);
          index=5 for neutral species in a particular state (refer to neutral/state structure);  index=6
          for neutron; index=7 for photon
      ion:
        range: PlasmaCompositionIonsConstant
        description: Description of the ion or neutral species, used if type/index = 2 or 3
      neutral:
        range: PlasmaCompositionNeutralConstant
        description: Description of the neutral species, used if type/index = 4 or 5
  DistributionsDGgdExpansion:
    is_a: InformationContentEntity
    description: Distribution function expanded into a vector of successive approximations. The first
      element in the vector (expansion(1)) is the zeroth order distribution function, while the K:th element
      in the vector (expansion(K)) is the K:th correction, such that the total distribution function is
      a sum over all elements in the expansion vector.
    annotations:
      dd_type_name: distributions_d_ggd_expansion
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      grid_subset:
        range: GenericGridScalar
        multivalued: true
        description: Values of the distribution function expansion, for various grid subsets
        annotations:
          dd_units: mixed
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  EquilibriumProfiles2dGrid:
    is_a: InformationContentEntity
    description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected grid_type)
    annotations:
      dd_type_name: equilibrium_profiles_2d_grid
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '5'
    attributes:
      dim1:
        range: float
        multivalued: true
        description: First dimension values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      dim2:
        range: float
        multivalued: true
        description: Second dimension values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      volume_element:
        range: float
        multivalued: true
        description: Elementary plasma volume of plasma enclosed in the cell formed by the nodes [dim1(i)
          dim2(j)], [dim1(i+1) dim2(j)], [dim1(i) dim2(j+1)] and [dim1(i+1) dim2(j+1)]
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 2
          dd_coordinate1: ../dim1
          dd_coordinate2: ../dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../dim1,../dim2
  FibreBundle:
    is_a: InformationContentEntity
    description: Description of the fibre bundle
    annotations:
      dd_type_name: fibre_bundle
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      geometry:
        range: DetectorAperture
        description: Geometry of the fibre bundle entrance
      fibre_radius:
        range: float
        description: Radius of a single fibre
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      fibre_positions:
        range: X1x21dStatic
        description: Individual fibres centres positions in the (X1, X2) coordinate system
  FilterWindow:
    is_a: InformationContentEntity
    description: Characteristics of the filter window
    annotations:
      dd_type_name: filter_window
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '4'
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      geometry_type:
        range: Identifier
        description: Geometry of the filter contour. Note that there is some flexibility in the choice
          of the local coordinate system (X1,X2,X3). The data provider should choose the most convenient
          coordinate system for the filter, respecting the definitions of (X1,X2,X3) indicated below.
      curvature_type:
        range: Identifier
        description: Curvature of the filter.
      centre:
        range: Rphiz0dStatic
        description: Coordinates of the origin of the local coordinate system (X1,X2,X3) describing the
          filter. This origin is located within the filter area and should be the middle point of the
          filter surface. If geometry_type=2, it's the centre of the circular filter. If geometry_type=3,
          it's the centre of the rectangular filter.
      radius:
        range: float
        description: Radius of the circle, used only if geometry_type/index = 2
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the filter surface and oriented towards the plasma.
      x1_width:
        range: float
        description: Full width of the filter in the X1 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_width:
        range: float
        description: Full width of the filter in the X2 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: X1x21dStatic
        description: Irregular outline of the filter in the (X1, X2) coordinate system, used only if geometry_type/index=1.
          Repeat the first point since this is a closed contour
      x1_curvature:
        range: float
        description: Radius of curvature in the X1 direction, to be filled only for curvature_type/index
          = 2, 4 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_curvature:
        range: float
        description: Radius of curvature in the X2 direction, to be filled only for curvature_type/index
          = 3 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      surface:
        range: float
        description: Surface of the filter, derived from the above geometric data
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      material:
        range: Identifier
        description: Material of the filter window
      thickness:
        range: float
        description: Thickness of the filter window
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_lower:
        range: float
        description: Lower bound of the filter wavelength range
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_upper:
        range: float
        description: Upper bound of the filter wavelength range
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelengths:
        range: float
        multivalued: true
        description: Array of wavelength values
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      photon_absorption:
        range: float
        multivalued: true
        description: Probability of absorbing a photon passing through the filter as a function of its
          wavelength
        annotations:
          dd_type: static
