  CoreProfiles1DFit:
    is_a: InformationContentEntity
    description: Information on the fit used to obtain the temperature profile
    annotations:
      dd_type_name: core_profiles_1D_fit
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      measured:
        range: float
        multivalued: true
        description: Measured values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      source:
        range: string
        multivalued: true
        description: Path to the source data for each measurement in the IMAS data dictionary, e.g. ece/channel(i)/t_e
          for the electron temperature on the i-th channel in the ECE IDS
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      time_measurement:
        range: float
        multivalued: true
        description: Exact time slices used from the time array of the measurement source data. The time
          slice is indicated for each measurement point considered in the fit since measurements may come
          from different and thus asynchronous diagnostics. If the time slice does not exist in the time
          array of the source data, it means linear interpolation has been used
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      time_measurement_slice_method:
        range: Identifier
        description: 'Method used to slice the data : index = 0 means using exact time slice of the measurement,
          1 means linear interpolation, ...'
      time_measurement_width:
        range: float
        multivalued: true
        description: In case the measurements are averaged over a time interval, this node is the full
          width of this time interval (empty otherwise). In case the slicing/averaging method doesn't
          use a hard time interval cutoff, this width is the characteristic time span of the slicing/averaging
          method. By convention, the time interval starts at time_measurement-time_width and ends at time_measurement.
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      local:
        range: integer
        multivalued: true
        description: 'Integer flag : 1 means local measurement, 0 means line-integrated measurement'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate of each measurement (local value for a local
          measurement, minimum value reached by the line of sight for a line measurement)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      weight:
        range: float
        multivalued: true
        description: Weight given to each measured value
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      reconstructed:
        range: float
        multivalued: true
        description: Value reconstructed from the fit
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      chi_squared:
        range: float
        multivalued: true
        description: 'Squared error normalized by the weighted standard deviation considered in the minimization
          process : chi_squared = weight^2 *(reconstructed - measured)^2 / sigma^2, where sigma is the
          standard deviation of the measurement error'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      parameters:
        range: string
        description: List of the fit specific parameters in XML format
        annotations:
          dd_type: dynamic
  CoreProfilesIonsChargeStates2:
    is_a: InformationContentEntity
    description: Quantities related to the different states of the species (ionization, energy, excitation,
      ...)
    annotations:
      dd_type_name: core_profiles_ions_charge_states2
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average:
        range: float
        description: Average Z of the charge state bundle, volume averaged over the plasma radius (equal
          to z_min if no bundle), = sum (Z*x_z) where x_z is the relative concentration of a given charge
          state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_square_average:
        range: float
        description: Average Z square of the charge state bundle, volume averaged over the plasma radius
          (equal to z_min squared if no bundle), = sum (Z^2*x_z) where x_z is the relative concentration
          of a given charge state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average_1d:
        range: float
        multivalued: true
        description: Average charge profile of the charge state bundle (equal to z_min if no bundle),
          = sum (Z*x_z) where x_z is the relative concentration of a given charge state in the bundle,
          i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      z_average_square_1d:
        range: float
        multivalued: true
        description: Average square charge profile of the charge state bundle (equal to z_min squared
          if no bundle), = sum (Z^2*x_z) where x_z is the relative concentration of a given charge state
          in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      ionization_potential:
        range: float
        description: Cumulative and average ionization potential to reach a given bundle. Defined as sum
          (x_z* (sum of Epot from z'=0 to z-1)), where Epot is the ionization potential of ion Xz’+, and
          x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z) = 1 over
          the bundle.
        annotations:
          dd_type: dynamic
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
