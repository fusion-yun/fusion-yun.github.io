          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_non_inductive:
        range: float
        multivalued: true
        description: Non-inductive (includes bootstrap) parallel current density = average(jni.B) / B0,
          where B0 = Core_Profiles/Vacuum_Toroidal_Field/ B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_bootstrap:
        range: float
        multivalued: true
        description: Bootstrap current density = average(J_Bootstrap.B) / B0, where B0 = Core_Profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      e_field:
        range: CoreProfilesVectorComponents1
        description: Electric field, averaged on the magnetic surface. E.g for the parallel component,
          average(E.B) / B0, using core_profiles/vacuum_toroidal_field/b0
        annotations:
          dd_units: V.m^-1
      phi_potential:
        range: float
        multivalued: true
        description: Electrostatic potential, averaged on the magnetic flux surface
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      rotation_frequency_tor_sonic:
        range: float
        multivalued: true
        description: Derivative of the flux surface averaged electrostatic potential with respect to the
          poloidal flux, multiplied by (1/2pi). This quantity is the toroidal angular rotation frequency
          due to the ExB drift, introduced in formula (43) of Hinton and Wong, Physics of Fluids 3082
          (1985), also referred to as sonic flow in regimes in which the toroidal velocity is dominant
          over the poloidal velocity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      q:
        range: float
        multivalued: true
        description: Safety factor (only positive when toroidal current and magnetic field are in same
          direction)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      magnetic_shear:
        range: float
        multivalued: true
        description: Magnetic shear, defined as rho_tor/q . dq/drho_tor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
