    description: Transport coefficients represented using the general grid description, for various time
      slices. Fluxes are given in the direction perpendicular to the edges or faces of the grid (flow
      crossing that surface divided by its actual area). Radial fluxes are positive when they are directed
      away from the magnetic axis. Poloidal fluxes are positive when they are directed in such a way that
      they travel clockwise around the magnetic axis (poloidal plane viewed such that the centerline of
      the tokamak is on
    annotations:
      dd_type_name: plasma_transport_model_ggd
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
