        description: Quantities related to the electrons
      ion:
        range: CoreProfileIons
        multivalued: true
        description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
          sequences. Ionization states (or other types of states) must be differentiated at the state
          level below
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: CoreProfileNeutral
        multivalued: true
        description: Quantities related to the different neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      t_i_average:
        range: float
        multivalued: true
        description: Ion temperature (averaged on charge states and ion species)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
