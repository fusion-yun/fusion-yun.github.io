  PlasmaProfilesTimeSlice:
    is_a: InformationContentEntity
    description: Edge plasma quantities represented using the general grid description, for various time
      slices. The timebase of this array of structure must be a subset of the ggd_fast timebase (only
      if the ggd_fast array of structure is used)
    annotations:
      dd_type_name: plasma_profiles_time_slice
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      electrons:
        range: PlasmaProfilesTimeSliceElectrons
        description: Quantities related to the electrons
      ion:
        range: PlasmaProfilesTimeSliceIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: PlasmaProfilesTimeSliceNeutral
        multivalued: true
        description: Quantities related to the different neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      t_i_average:
        range: GenericGridScalar
        multivalued: true
        description: Ion temperature (averaged on ion species), given on various grid subsets
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      n_i_total_over_n_e:
        range: GenericGridScalar
        multivalued: true
        description: Ratio of total ion density (sum over ion species) over electron density. (thermal+non-thermal),
          given on various grid subsets
        annotations:
          dd_units: '1'
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      n_i_total:
        range: GenericGridScalar
        multivalued: true
        description: Total ion density (sum over ion species and thermal+non-thermal), given on various
          grid subsets
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      zeff:
        range: GenericGridScalar
        multivalued: true
        description: Effective charge, given on various grid subsets
        annotations:
          dd_units: '1'
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      pressure_thermal:
        range: GenericGridScalar
        multivalued: true
        description: Thermal pressure (electrons+ions), given on various grid subsets
        annotations:
          dd_units: Pa
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      pressure_perpendicular:
        range: GenericGridScalar
        multivalued: true
        description: Total perpendicular pressure (electrons+ions, thermal+non-thermal), given on various
          grid subsets
        annotations:
          dd_units: Pa
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      pressure_parallel:
        range: GenericGridScalar
        multivalued: true
        description: Total parallel pressure (electrons+ions, thermal+non-thermal), given on various grid
          subsets
        annotations:
          dd_units: Pa
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_total:
        range: GenericGridVectorComponents
        multivalued: true
        description: Total current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      r_j_total_phi:
        range: GenericGridScalar
        multivalued: true
        description: Toroidal component of the current density multiplied by the local major radius, given
          on various grid subsets
        annotations:
          dd_units: A.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_parallel:
        range: GenericGridScalar
        multivalued: true
        description: Current due to parallel electric and thermo-electric conductivity and potential and
          electron temperature gradients along the field line, differences away from ambipolar flow in
          the parallel direction between ions and electrons (this is not the parallel component of j_total)
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_anomalous:
        range: GenericGridVectorComponents
        multivalued: true
        description: Anomalous current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_inertial:
        range: GenericGridVectorComponents
        multivalued: true
        description: Inertial current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_ion_neutral_friction:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to ion neutral friction, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_parallel_viscosity:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to the parallel viscosity, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_perpendicular_viscosity:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to the perpendicular viscosity, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_heat_viscosity:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to the heat viscosity, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_pfirsch_schlueter:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to Pfirsch-Schlüter effects, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      j_diamagnetic:
        range: GenericGridVectorComponents
        multivalued: true
        description: Current density due to the diamgnetic drift, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      e_field:
        range: GenericGridVectorComponents
        multivalued: true
        description: Electric field, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field:
        range: GenericGridVectorComponents
        multivalued: true
        description: Magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      a_field:
        range: GenericGridVectorComponents
        multivalued: true
        description: Magnetic vector potential, given on various grid subsets
        annotations:
          dd_units: T.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      phi_potential:
        range: GenericGridScalar
        multivalued: true
        description: Electric potential, given on various grid subsets
        annotations:
          dd_units: V
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      psi:
        range: GenericGridScalar
        multivalued: true
        description: Poloidal flux, given on various grid subsets. Integral of magnetic field passing
          through a contour defined by the intersection of a flux surface passing through the point of
          interest and a Z=constant plane. If the integration surface is flat, the surface normal vector
          is in the increasing vertical coordinate direction, Z, namely upwards.
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      mass_density:
        range: GenericGridScalar
        multivalued: true
        description: Mass density, given on various grid subsets
        annotations:
          dd_units: kg.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_mass_centre:
        range: GenericGridVectorComponents
        multivalued: true
        description: 'Velocity of the centre of mass of all the species (see equation 2 in the paper linked
          below), given on various grid subsets. It is defined as : rho.velocity_mass_centre = sum over
          all species (rho_species.velocity_species), where rho_species is the mass density of each species
          and rho = sum over all species (rho_species)'
        annotations:
          dd_units: m.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      velocity_parallel_over_b_field:
        range: GenericGridScalar
        multivalued: true
        description: Parallel (to magnetic field) velocity of the centre of mass of all the species (see
          equation 2 in the paper linked below), divided by the module of the local magnetic field, given
          on various grid subsets
        annotations:
          dd_units: m.s^-1.T^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      vorticity:
        range: GenericGridVectorComponents
        multivalued: true
        description: Curl of the velocity_mass_centre vector, given on various grid subsets
        annotations:
          dd_units: s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      vorticity_over_r:
        range: GenericGridVectorComponents
        multivalued: true
        description: Vorticity divided by the local major radius, given on various grid subsets
        annotations:
          dd_units: m^-1.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
