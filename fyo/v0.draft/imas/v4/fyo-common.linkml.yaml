          dd_type: constant
      homogeneous_time:
        range: integer
        description: This node must be filled (with 0, 1, or 2) for the IDS to be valid. If 1, the time
          of this IDS is homogeneous, i.e. the time values for this IDS are stored in the time node just
          below the root of this IDS. If 0, the time values are stored in the various time fields at lower
          levels in the tree. In the case only constant or static nodes are filled within the IDS, homogeneous_time
          must be set to 2
        annotations:
          dd_type: constant
      occurrence_type:
        range: Identifier
        description: Type of data contained in this occurrence
      provider:
        range: string
        description: Name of the person in charge of producing this data
        annotations:
          dd_type: constant
      creation_date:
        range: string
        description: Date at which this data has been produced
        annotations:
          dd_type: constant
      version_put:
        range: VersionDdAl
        description: Version of the access layer package used to PUT this IDS
      provenance:
        range: IdsProvenance
        description: Provenance information about this IDS
      plugins:
        range: IdsPlugins
        description: Information about the plugins used to write/read this IDS. This structure is filled
          automatically by the Access Layer at GET/PUT time, no need to fill it via a user program.
  IdsCode:
    is_a: Code
    description: 'DD per-IDS `code` block, deduplicated: the program whose execution produced this IDS
      (spo:Code = name/commit/version/repository) plus DD extras (parameters, output_flag). The run itself
      is a spo ComputationalProcess; its run manifest is a spo ComputationRecord.'
    annotations:
      fyo_lift: synthesized:code
    attributes:
      name:
        range: string
        description: Name of software generating IDS
        annotations:
          dd_type: constant
      description:
        range: string
        description: Short description of the software (type, purpose)
        annotations:
          dd_type: constant
      commit:
        range: string
        description: Unique commit reference of software
        annotations:
          dd_type: constant
      version:
        range: string
        description: Unique version (tag) of software
        annotations:
          dd_type: constant
      repository:
        range: string
        description: URL of software repository
        annotations:
          dd_type: constant
      parameters:
        range: string
        description: List of the code specific parameters in XML format
        annotations:
          dd_type: constant
      output_flag:
        range: integer
        multivalued: true
        description: 'Output flag : 0 means the run is successful, other values mean some difficulty has
          been encountered, the exact meaning is then code specific. Negative values mean the result shall
          not be used.'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      library:
        range: Library
        multivalued: true
        description: List of external libraries used by the code that has produced this IDS
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
