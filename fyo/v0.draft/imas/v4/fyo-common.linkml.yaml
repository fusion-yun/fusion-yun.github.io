        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      parallel:
        range: float
        multivalued: true
        description: Normalized power flow in the direction parallel to the magnetic field
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
  WavesCoherentWaveIdentifier:
    is_a: InformationContentEntity
    description: List all waves affecting the distribution, identified as in waves/coherent_wave(i)/identifier
