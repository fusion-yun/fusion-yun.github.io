        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
