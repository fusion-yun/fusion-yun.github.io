      dd_type_name: statistics_distribution_2d
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      bins:
        range: float
        multivalued: true
        description: Bins of quantitiy values, defined for each element (first dimension) corresponding
          to the first dimension of the original 2D quantity
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      probability:
        range: float
        multivalued: true
        description: Probability to have a value of the quantity between bins(n) and bins(n+1) (thus the
          size of its second dimension is the size of the second dimension of the bins array - 1). The
          first dimension correspond to the first dimension of the original 2D quantity
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
  StatisticsInput2d:
    is_a: InformationContentEntity
    description: If the statistics are based on an uncertainty quantification process, set of 2D input
      quantities that are varied
    annotations:
      dd_type_name: statistics_input_2d
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      path:
        range: string
        description: Path of the quantity within the IDS, following the syntax given in the link below
        annotations:
          dd_type: dynamic
      distribution:
        range: StatisticsDistribution2d
        description: Probability distribution function of the quantity
  StatisticsQuantity2d:
    is_a: InformationContentEntity
    description: Set of 2D quantities on which statistics are provided. 2D means 1D+time dimension, so
      either a 1D quantity within a dynamic array of structure, or a 2D dynamic quantity outside of an
      array of structure. Therefore the resulting statistical value is 1D for a given statistics time
      slice.
    annotations:
      dd_type_name: statistics_quantity_2d
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      path:
        range: string
        description: Path of the quantity within the IDS, following the syntax given in the link below
        annotations:
          dd_type: dynamic
      statistics_type:
        range: StatisticsQuantity2dType
        multivalued: true
        description: Set of statistics types applied to the quantity
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      distribution:
        range: StatisticsDistribution2d
        description: Probability distribution function of the quantity
  StatisticsQuantity2dType:
    is_a: InformationContentEntity
    description: Set of statistics types applied to the quantity
    annotations:
      dd_type_name: statistics_quantity_2d_type
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '3'
    attributes:
      identifier:
        range: Identifier
        description: Identifier of the statistics type
      value:
        range: float
        multivalued: true
        description: Value of the statistics for that quantity, the array corresponding to the first dimension
          of the original 2D quantity
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      grid_subset_index:
        range: integer
        description: 'Only if the statistics value is given on a different GGD grid subset than the original
          quantity (e.g. if the statistics has worked over a dimension of the GGD), index of the new grid
          subset the statistics value is provided on. Corresponds to the index used in the grid subset
          definition: grid_subset(:)/identifier/index'
        annotations:
          dd_type: dynamic
      grid_index:
        range: integer
        description: Only if the statistics value is given on a different GGD grid subset than the original
          quantity (e.g. if the statistics has worked over a dimension of the GGD), index of the grid
          used to represent the statistics value
        annotations:
          dd_type: dynamic
      uq_input_path:
        range: integer
        description: For Sobol index only, path to the related the uq_input quantity, e.g. ../../../uq_input_2d(3)
        annotations:
          dd_type: dynamic
  ThickLineStatic:
    is_a: Surface
    description: The element is approximated by a rectangle defined by a central segment and a thickness
      in the direction perpendicular to the segment
    annotations:
      dd_type_name: thick_line_static
      fyo_lift: shared:Surface
      dd_shared_in: '6'
    attributes:
      first_point:
        range: Rz0dStatic
        description: Position of the first point
      second_point:
        range: Rz0dStatic
        description: Position of the second point
      thickness:
        range: float
        description: Thickness
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  VersionDdAl:
    is_a: InformationContentEntity
    description: Version of the access layer package used to PUT this IDS
    annotations:
      dd_type_name: version_dd_al
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      data_dictionary:
        range: string
        description: Version of Data Dictionary used to PUT this IDS
        annotations:
          dd_type: constant
      access_layer:
        range: string
        description: Version of Access Layer used to PUT this IDS
        annotations:
          dd_type: constant
      access_layer_language:
        range: string
        description: Programming language of the Access Layer high level API used to PUT this IDS
        annotations:
          dd_type: constant
  Vessel2d:
    is_a: InformationContentEntity
    description: 'Mechanical structure of the cryostat. It is described as a set of nested layers with
      given physics properties; Two representations are admitted for each vessel unit : annular (two contours)
      or block elements.'
    annotations:
      dd_type_name: vessel_2d
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      type:
        range: Identifier
        description: Type of the description. index = 0 for the official single/multiple annular representation
          and 1 for the official block element representation for each unit. Additional representations
          needed on a code-by-code basis follow same incremental pair tagging starting on index=2
      unit:
        range: Vessel2dUnit
        multivalued: true
        description: Set of units
        annotations:
          dd_max_occurs: '15'
          dd_coordinate1: 1...N
  Vessel2dAnnular:
    is_a: InformationContentEntity
    description: Annular representation of a layer by two contours, inner and outer. Alternatively, the
      layer can be described by a centreline and thickness.
    annotations:
      dd_type_name: vessel_2d_annular
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      outline_inner:
        range: Rz1dStatic
        description: Inner vessel outline. Repeat the first point in case of a closed contour
      outline_outer:
        range: Rz1dStatic
        description: Outer vessel outline. Repeat the first point in case of a closed contour
      centreline:
        range: Rz1dStatic
        description: Centreline, i.e. middle of the vessel layer as a series of point. Repeat the first
          point in case of a closed contour
      thickness:
        range: float
        multivalued: true
        description: Thickness of the vessel layer  in the perpendicular direction to the centreline.
          Thickness(i) is the thickness of the layer between centreline/r(i),z(i) and centreline/r(i+1),z(i+1),
          so its size is equal to the length of centreline/r-1 if the thickness is varying. If the thickness
          is constant for all points, allocate this node to size 1 to store a single value.
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      resistivity:
        range: float
        description: Resistivity of the vessel unit
        annotations:
          dd_type: static
          dd_units: ohm.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  Vessel2dElement:
    is_a: InformationContentEntity
    description: Set of block elements
    annotations:
      dd_type_name: vessel_2d_element
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      name:
        range: string
        description: Name of the block element
        annotations:
          dd_type: static
      outline:
        range: Rz1dStatic
        description: Outline of the block element. Repeat the first point in case of a closed contour
      midplane_thickness:
        range: float
        description: Thickness of this element evaluated at the midplane (whenever relevant)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      resistivity:
        range: float
        description: Resistivity of the block element
        annotations:
          dd_type: static
          dd_units: ohm.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      j_phi:
        range: SignalFlt1d
        description: Toroidal current induced in this block element
        annotations:
          dd_units: A
      resistance:
        range: float
        description: Resistance of the block element
        annotations:
          dd_type: static
          dd_units: ohm
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  Vessel2dUnit:
    is_a: InformationContentEntity
    description: Set of units
    annotations:
      dd_type_name: vessel_2d_unit
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      annular:
        range: Vessel2dAnnular
        description: Annular representation of a layer by two contours, inner and outer. Alternatively,
          the layer can be described by a centreline and thickness.
      element:
        range: Vessel2dElement
        multivalued: true
        description: Set of block elements
        annotations:
          dd_max_occurs: '38'
          dd_coordinate1: 1...N
      material:
        range: Identifier
        multivalued: true
        description: Set of materials in this unit
        annotations:
          dd_max_occurs: '4'
          dd_coordinate1: 1...N
      material_volume_fraction:
        range: float
        multivalued: true
        description: Fraction of the volume of each material in this unit
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../material
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../material
  WavesCPX1D:
    is_a: InformationContentEntity
    description: Left hand polarised electric field component
    annotations:
      dd_type_name: waves_CPX_1D
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      real:
        range: float
        multivalued: true
        description: Real part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../length
      imaginary:
        range: float
        multivalued: true
        description: Imaginary part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../length
  WavesBeamPhase:
    is_a: InformationContentEntity
    description: Phase ellipse characteristics
    annotations:
      dd_type_name: waves_beam_phase
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      curvature:
        range: float
        multivalued: true
        description: Inverse curvature radii for the phase ellipse, positive/negative for divergent/convergent
          beams, in the horizontal direction (first index of the first coordinate) and in the vertical
          direction (second index of the first coordinate)
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: ../../length
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,../../length
      angle:
        range: float
        multivalued: true
        description: Rotation angle for the phase ellipse
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
  WavesBeamSpot:
    is_a: InformationContentEntity
    description: Spot ellipse characteristics
    annotations:
      dd_type_name: waves_beam_spot
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      size:
        range: float
        multivalued: true
        description: 'Size of the spot ellipse: distance between the central ray and the peripheral rays
          in the horizontal (first index of the first coordinate) and vertical direction (second index
          of the first coordinate)'
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: ../../length
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,../../length
      angle:
        range: float
        multivalued: true
        description: Rotation angle for the spot ellipse
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
  WavesBeamTracingBeamEField:
    is_a: InformationContentEntity
    description: Electric field polarization of the ray/beam along its path
    annotations:
      dd_type_name: waves_beam_tracing_beam_e_field
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      plus:
        range: WavesCPX1D
        description: Left hand polarised electric field component
        annotations:
          dd_units: V.m^-1
      minus:
        range: WavesCPX1D
        description: Right hand polarised electric field component
        annotations:
          dd_units: V.m^-1
      parallel:
        range: WavesCPX1D
        description: Parallel to magnetic field polarised electric field component
        annotations:
          dd_units: V.m^-1
  WavesBeamTracingBeamK:
    is_a: InformationContentEntity
    description: Wave vector of the ray/beam along its path
    annotations:
      dd_type_name: waves_beam_tracing_beam_k
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      k_r:
        range: float
        multivalued: true
        description: Wave vector component in the major radius direction
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      k_z:
        range: float
        multivalued: true
        description: Wave vector component in the vertical direction
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      k_phi:
        range: float
        multivalued: true
        description: Wave vector component in the toroidal direction
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      k_r_norm:
        range: float
        multivalued: true
        description: Normalized wave vector component in the major radius direction = k_r / norm(k)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      k_z_norm:
        range: float
        multivalued: true
        description: Normalized wave vector component in the vertical direction = k_z / norm(k)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      k_phi_norm:
        range: float
        multivalued: true
        description: Normalized wave vector component in the toroidal direction = k_phi / norm(k)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      n_parallel:
        range: float
        multivalued: true
        description: Parallel refractive index
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      n_perpendicular:
        range: float
        multivalued: true
        description: Perpendicular refractive index
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      n_phi:
        range: integer
        multivalued: true
        description: Toroidal wave number, contains a single value if varying_n_phi = 0 to avoid useless
          repetition of constant values. The wave vector toroidal component is defined as k_phi = n_phi
          grad phi where phi is the toroidal angle so that a positive n_phi means a wave propagating in
          the positive phi direction
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../length OR 1...1
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length OR 1...1
      varying_n_phi:
        range: integer
        description: Flag telling whether n_phi is constant along the ray path (0) or varying (1)
        annotations:
          dd_type: dynamic
  WavesBeamTracingElectrons:
    is_a: InformationContentEntity
