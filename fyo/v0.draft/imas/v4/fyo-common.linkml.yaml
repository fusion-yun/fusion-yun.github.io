  PlasmaProfilesTimeSliceIonChargeState:
    is_a: InformationContentEntity
    description: Quantities related to the different states of the species (ionisation, energy, excitation,
      ...)
    annotations:
      dd_type_name: plasma_profiles_time_slice_ion_charge_state
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      z_min:
        range: float
        description: Minimum Z of the state bundle (z_min = z_max = 0 for a neutral)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average:
        range: GenericGridScalar
        multivalued: true
        description: Average Z of the state bundle (equal to z_min if no bundle), = sum (Z*x_z) where
          x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z) = 1 over
          the bundle, given on various grid subsets
        annotations:
          dd_units: e
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_square_average:
        range: GenericGridScalar
        multivalued: true
        description: Average Z square of the state bundle (equal to z_min if no bundle), = sum (Z^2*x_z)
          where x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z)
          = 1 over the bundle, given on various grid subsets
        annotations:
          dd_units: e
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      ionisation_potential:
        range: GenericGridScalar
        multivalued: true
        description: Cumulative and average ionisation potential to reach a given bundle. Defined as sum
          (x_z* (sum of Epot from z'=0 to z-1)), where Epot is the ionisation potential of ion Xz_+, and
          x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z) = 1 over
          the bundle, given on various grid subsets
        annotations:
          dd_units: e
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      temperature:
        range: GenericGridScalar
        multivalued: true
        description: Temperature, given on various grid subsets
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      density:
        range: GenericGridScalar
        multivalued: true
        description: Density (thermal+non-thermal), given on various grid subsets
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      density_fast:
