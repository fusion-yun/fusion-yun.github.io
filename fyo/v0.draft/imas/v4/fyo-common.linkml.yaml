          dd_type: constant
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: constant
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: constant
  PlasmaCompositionIonsConstant:
    is_a: InformationContentEntity
    description: Description of the ion or neutral species, used if type/index = 2 or 3
    annotations:
      dd_type_name: plasma_composition_ions_constant
