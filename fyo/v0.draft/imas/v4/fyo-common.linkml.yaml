          fyo_lift: quantity
      atoms_n:
        range: integer
        description: Number of atoms of this element in the molecule
        annotations:
          dd_type: dynamic
  PlasmaCompositionNeutralElementConstant:
    is_a: InformationContentEntity
    description: List of elements forming the atom (in such case, this array should be of size 1) or molecule.
      Mass of atom and nuclear charge should be set to 0 for photons and electrons. The mass of atom shouldn't
      be set for an atomic process that is not isotope dependent.
    annotations:
      dd_type_name: plasma_composition_neutral_element_constant
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '12'
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: constant
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: integer
        description: Nuclear charge
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      atoms_n:
        range: integer
        description: Number of atoms of this element in the molecule
        annotations:
          dd_type: constant
  PlasmaCompositionNeutralStateConstant:
    is_a: InformationContentEntity
    description: State of the species (energy, excitation, ...)
    annotations:
      dd_type_name: plasma_composition_neutral_state_constant
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '5'
    attributes:
      name:
        range: string
        description: String identifying neutral state
        annotations:
          dd_type: constant
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: constant
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: constant
      neutral_type:
        range: Identifier
        description: 'Neutral type, in terms of energy. ID =1: cold; 2: thermal; 3: fast; 4: NBI'
  PlasmaProfiles1dFit:
    is_a: InformationContentEntity
    description: Information on the fit used to obtain the temperature profile
    annotations:
      dd_type_name: plasma_profiles_1d_fit
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      measured:
        range: float
        multivalued: true
        description: Measured values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      source:
        range: string
        multivalued: true
        description: Path to the source data for each measurement in the IMAS data dictionary, e.g. ece/channel(i)/t_e
          for the electron temperature on the i-th channel in the ECE IDS
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      time_measurement:
        range: float
        multivalued: true
        description: Exact time slices used from the time array of the measurement source data. If the
          time slice does not exist in the time array of the source data, it means linear interpolation
          has been used
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      time_measurement_slice_method:
        range: Identifier
        description: 'Method used to slice the data : index = 0 means using exact time slice of the measurement,
          1 means linear interpolation, ...'
      time_measurement_width:
        range: float
        multivalued: true
        description: In case the measurements are averaged over a time interval, this node is the full
          width of this time interval (empty otherwise). In case the slicing/averaging method doesn't
          use a hard time interval cutoff, this width is the characteristic time span of the slicing/averaging
          method. By convention, the time interval starts at time_measurement-time_width and ends at time_measurement.
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      local:
        range: integer
        multivalued: true
        description: 'Integer flag : 1 means local measurement, 0 means line-integrated measurement'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalised toroidal flux coordinate of each measurement (local value for a local
          measurement, minimum value reached by the line of sight for a line measurement)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      rho_pol_norm:
        range: float
        multivalued: true
        description: Normalised poloidal flux coordinate of each measurement (local value for a local
          measurement, minimum value reached by the line of sight for a line measurement)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      weight:
        range: float
        multivalued: true
        description: Weight given to each measured value
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      reconstructed:
        range: float
        multivalued: true
        description: Value reconstructed from the fit
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      chi_squared:
        range: float
        multivalued: true
        description: 'Squared error normalized by the weighted standard deviation considered in the minimization
          process : chi_squared = weight^2 *(reconstructed - measured)^2 / sigma^2, where sigma is the
          standard deviation of the measurement error'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../measured
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../measured
      parameters:
        range: string
        description: List of the fit specific parameters in XML format
        annotations:
          dd_type: dynamic
  PlasmaProfilesGgdFast:
    is_a: InformationContentEntity
    description: Quantities provided at a faster sampling rate than the full ggd quantities. These are
      either integrated quantities or local quantities provided on a reduced set of positions. Positions
      and integration domains are described by a set of grid_subsets (of size 1 for a position).
    annotations:
      dd_type_name: plasma_profiles_ggd_fast
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      electrons:
        range: PlasmaProfilesGgdFastElectrons
        description: Quantities related to the electrons
      ion:
        range: PlasmaProfilesGgdFastIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      energy_thermal:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Plasma energy content = 3/2 * integral over the volume of the grid subset of the
          thermal pressure (summed over all species), for various grid subsets
        annotations:
          dd_units: J
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaProfilesGgdFastElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: plasma_profiles_ggd_fast_electrons
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      temperature:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Temperature, given at various positions (grid subset of size 1)
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      density:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Density (thermal+non-thermal), given at various positions (grid subset of size 1)
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  PlasmaProfilesGgdFastIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species
    annotations:
      dd_type_name: plasma_profiles_ggd_fast_ion
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionisation state; lumped ions are allowed).
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H+, D+, T+, He+2, C+, D2, DT, CD4, ...)
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: dynamic
      content:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Particle content = total number of particles for this ion species in the volume of
          the grid subset, for various grid subsets
        annotations:
          dd_units: '1'
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      temperature:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Temperature (average over states when multiple states are considered), given at various
          positions (grid subset of size 1)
        annotations:
          dd_units: eV
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      density:
        range: GenericGridScalarSinglePosition
        multivalued: true
        description: Density (thermal+non-thermal) (sum over states when multiple states are considered),
          given at various positions (grid subset of size 1)
        annotations:
          dd_units: m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  PlasmaProfilesProfiles1d:
    is_a: InformationContentEntity
    description: SOL radial profiles for various time slices, taken on outboard equatorial mid-plane
    annotations:
      dd_type_name: plasma_profiles_profiles_1d
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      grid:
        range: PlasmaRadialGrid
        description: Radial grid. Note that some of the radial coordinates listed above are undefined
          outside the last closed flux surface, thus they must be filled with EMPTY_FLOAT values in such
          locations
      electrons:
        range: PlasmaProfilesProfiles1dElectrons
        description: Quantities related to the electrons
      ion:
        range: PlasmaProfilesProfiles1dIon
        multivalued: true
        description: Quantities related to the different ion species, in the sense of isonuclear or isomolecular
          sequences. Ionisation states (and other types of states) must be differentiated at the state
          level below
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: PlasmaProfilesProfiles1dNeutral
        multivalued: true
        description: Quantities related to the different neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      t_i_average:
        range: float
        multivalued: true
        description: Ion temperature (averaged on charge states and ion species)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      t_i_average_fit:
        range: PlasmaProfiles1dFit
        description: Information on the fit used to obtain the t_i_average profile
        annotations:
          dd_units: eV
      n_i_total_over_n_e:
        range: float
        multivalued: true
        description: Ratio of total ion density (sum over species and charge states) over electron density.
          (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      n_i_thermal_total:
        range: float
        multivalued: true
        description: Total ion thermal density (sum over species and charge states)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      momentum_phi:
        range: float
        multivalued: true
        description: Total plasma toroidal momentum, summed over ion species and electrons weighted by
          their density and major radius, i.e. sum_over_species(n*R*m*Vphi)
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      zeff:
        range: float
        multivalued: true
        description: Effective charge
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      zeff_fit:
        range: PlasmaProfiles1dFit
        description: Information on the fit used to obtain the zeff profile
        annotations:
          dd_units: '1'
      pressure_ion_total:
        range: float
        multivalued: true
        description: Total (sum over ion species) thermal ion pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      pressure_thermal:
        range: float
        multivalued: true
        description: Thermal pressure (electrons+ions)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      pressure_perpendicular:
        range: float
        multivalued: true
        description: Total perpendicular pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      pressure_parallel:
        range: float
        multivalued: true
        description: Total parallel pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      j_total:
        range: float
        multivalued: true
        description: Total parallel current density = average(jtot.B) / B0, where B0 = plasma_profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      current_parallel_inside:
        range: float
        multivalued: true
        description: Parallel current driven inside the flux surface. Cumulative surface integral of j_total
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      j_phi:
        range: float
        multivalued: true
        description: Total toroidal current density = average(j_phi/R) / average(1/R)
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      j_ohmic:
        range: float
        multivalued: true
        description: Ohmic parallel current density = average(J_Ohmic.B) / B0, where B0 = plasma_profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      j_non_inductive:
        range: float
        multivalued: true
        description: Non-inductive (includes bootstrap) parallel current density = average(jni.B) / B0,
          where B0 = plasma_profiles/Vacuum_Toroidal_Field/ B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      j_bootstrap:
        range: float
        multivalued: true
        description: Bootstrap current density = average(J_Bootstrap.B) / B0, where B0 = plasma_profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      e_field:
        range: PlasmaProfilesVectorComponents1
        description: Electric field, averaged on the magnetic surface. E.g for the parallel component,
          average(E.B) / B0, using plasma_profiles/vacuum_toroidal_field/b0
        annotations:
          dd_units: V.m^-1
      phi_potential:
        range: float
        multivalued: true
        description: Electrostatic potential, averaged on the magnetic flux surface
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      rotation_frequency_tor_sonic:
        range: float
        multivalued: true
        description: Derivative of the flux surface averaged electrostatic potential with respect to the
          poloidal flux, multiplied by (-1/2pi). This quantity is the toroidal angular rotation frequency
          due to the ExB drift, introduced in formula (43) of Hinton and Wong, Physics of Fluids 3082
          (1985), also referred to as sonic flow in regimes in which the toroidal velocity is dominant
          over the poloidal velocity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      q:
        range: float
        multivalued: true
        description: Safety factor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      magnetic_shear:
        range: float
        multivalued: true
        description: Magnetic shear, defined as rho_tor/q . dq/drho_tor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_pol_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaProfilesProfiles1dElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: plasma_profiles_profiles_1d_electrons
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      temperature:
        range: float
        multivalued: true
        description: Temperature
        annotations:
          dd_type: dynamic
          dd_units: eV
