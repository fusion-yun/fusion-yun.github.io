  IdsPlugins:
    is_a: InformationContentEntity
    description: Information about the plugins used to write/read this IDS. This structure is filled automatically
      by the Access Layer at GET/PUT time, no need to fill it via a user program.
    annotations:
      dd_type_name: ids_plugins
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      node:
        range: IdsPluginsNode
        multivalued: true
        description: Set of IDS nodes for which a plugin has been applied
        annotations:
          dd_type: constant
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      infrastructure_put:
        range: CodeConstantNoparam
        description: Plugin infrastructure used to PUT the data
      infrastructure_get:
        range: CodeConstantNoparam
        description: Plugin infrastructure used to GET the data
  IdsPluginsNode:
    is_a: InformationContentEntity
    description: Set of IDS nodes for which a plugin has been applied
    annotations:
      dd_type_name: ids_plugins_node
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      path:
        range: string
        description: Path of the node within the IDS, following the syntax given in the link below. If
          empty, means the plugin applies to the whole IDS.
        annotations:
          dd_type: constant
      put_operation:
        range: CodeConstant
        multivalued: true
        description: Plugins used to PUT a node (potentially, multiple plugins can be applied, if so they
          are listed by order of application)
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      readback:
        range: CodeConstant
        multivalued: true
        description: Plugins to be used to read back a node (potentially, multiple plugins can be applied,
          listed in reverse order of application)
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      get_operation:
        range: CodeConstant
        multivalued: true
        description: Plugins actually used to read back a node (potentially, multiple plugins can be applied,
          listed in reverse order of application). This information is filled by the plugin infrastructure
          during the GET operation.
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  IdsProvenance:
    is_a: InformationContentEntity
    description: Provenance information about this IDS
    annotations:
      dd_type_name: ids_provenance
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      node:
        range: IdsProvenanceNode
        multivalued: true
        description: Set of IDS nodes for which the provenance is given. The provenance information applies
          to the whole structure below the IDS node. For documenting provenance information for the whole
          IDS, set the size of this array of structure to 1 and leave the child "path" node empty
        annotations:
          dd_type: constant
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
  IdsProvenanceNode:
    is_a: InformationContentEntity
    description: Set of IDS nodes for which the provenance is given. The provenance information applies
      to the whole structure below the IDS node. For documenting provenance information for the whole
      IDS, set the size of this array of structure to 1 and leave the child "path" node empty
    annotations:
      dd_type_name: ids_provenance_node
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      path:
        range: string
        description: Path of the node within the IDS, following the syntax given in the link below. If
          empty, means the provenance information applies to the whole IDS.
        annotations:
          dd_type: constant
      reference:
        range: IdsProvenanceNodeReference
        multivalued: true
        description: List of references used to populate or calculate this node, identified as explained
          below. In case the node is the result of of a calculation / data processing, the reference is
          an input to the process described in the "code" structure at the root of the IDS. The reference
          can be an IDS (identified by a URI or a persitent identifier, see syntax in the link below)
          or non-IDS data imported directly from an non-IMAS database (identified by the command used
          to import the reference, or the persistent identifier of the data reference). Often data are
          obtained by a chain of processes, however only the last process input are recorded here. The
          full chain of provenance has then to be reconstructed recursively from the provenance information
          contained in the data references.
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  IdsProvenanceNodeReference:
    is_a: InformationContentEntity
    description: List of references used to populate or calculate this node, identified as explained below.
      In case the node is the result of of a calculation / data processing, the reference is an input
      to the process described in the "code" structure at the root of the IDS. The reference can be an
      IDS (identified by a URI or a persitent identifier, see syntax in the link below) or non-IDS data
      imported directly from an non-IMAS database (identified by the command used to import the reference,
      or the persistent
    annotations:
      dd_type_name: ids_provenance_node_reference
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '82'
    attributes:
      name:
        range: string
        description: Reference name
        annotations:
          dd_type: constant
      timestamp:
        range: string
        description: 'Date and time (UTC) at which the reference was created, expressed in a human readable
          form (ISO 8601) : the format of the string shall be : YYYY-MM-DDTHH:MM:SSZ. Example : 2020-07-24T14:19:00Z'
        annotations:
          dd_type: constant
