  PlasmaProfilesProfiles1dIonState:
    is_a: InformationContentEntity
    description: Quantities related to the different states of the species (ionisation, energy, excitation,
      ...)
    annotations:
      dd_type_name: plasma_profiles_profiles_1d_ion_state
      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average:
        range: float
        description: Average Z of the charge state bundle, volume averaged over the plasma radius (equal
          to z_min if no bundle), = sum (Z*x_z) where x_z is the relative concentration of a given charge
          state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_square_average:
        range: float
        description: Average Z square of the charge state bundle, volume averaged over the plasma radius
          (equal to z_min squared if no bundle), = sum (Z^2*x_z) where x_z is the relative concentration
          of a given charge state in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_average_1d:
        range: float
        multivalued: true
        description: Average charge profile of the charge state bundle (equal to z_min if no bundle),
          = sum (Z*x_z) where x_z is the relative concentration of a given charge state in the bundle,
          i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_pol_norm
      z_average_square_1d:
        range: float
        multivalued: true
        description: Average square charge profile of the charge state bundle (equal to z_min squared
          if no bundle), = sum (Z^2*x_z) where x_z is the relative concentration of a given charge state
          in the bundle, i.e. sum(x_z) = 1 over the bundle.
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_pol_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_pol_norm
      ionisation_potential:
        range: float
        description: Cumulative and average ionisation potential to reach a given bundle. Defined as sum
          (x_z* (sum of Epot from z'=0 to z-1)), where Epot is the ionisation potential of ion Xz_+, and
          x_z is the relative concentration of a given charge state in the bundle, i.e. sum(x_z) = 1 over
          the bundle.
        annotations:
          dd_type: dynamic
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
