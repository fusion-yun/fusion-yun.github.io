      fyo_lift: shared:InformationContentEntity
      dd_shared_in: '2'
    attributes:
      power:
        range: float
        multivalued: true
        description: Power absorbed along the beam by the species
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
  WavesBeamTracingPowerFlow:
