id: https://fusion-yun.github.io/fyo/v0.draft/imas/v4/spectrometer_x_ray_crystal
name: fyo-imas-spectrometer_x_ray_crystal
title: fyo IDS `spectrometer_x_ray_crystal` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `spectrometer_x_ray_crystal` onto SpO/BFO (FYTOK-ADR-102):
  structures grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo
  carrier classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_*
  annotations (reverse map ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: ../imas/v4/spectrometer_x_ray_crystal.linkml.yaml (mechanical layer)
  fyo_category: diagnostic
  fyo_root_class: SpectrometerXRayCrystal
  provenance: DO NOT EDIT — regenerate via ontology/dd2fyo.py.
classes:
  SpectrometerXRayCrystal:
    is_a: IDS
    description: X-crystal spectrometer diagnostic
    annotations:
      dd_path: spectrometer_x_ray_crystal
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: SpectrometerXRayCrystalChannel
        multivalued: true
        description: Measurement channel, composed of a camera, a crystal, and (optional) a set of reflectors.
          The light coming from the plasma passes through the (optional) set of reflectors, then the crystal
          and arrives at the camera
        annotations:
          dd_max_occurs: '30'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpectrometerXRayCrystalChannel:
    is_a: InformationContentEntity
    description: Measurement channel, composed of a camera, a crystal, and (optional) a set of reflectors.
      The light coming from the plasma passes through the (optional) set of reflectors, then the crystal
      and arrives at the camera
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_channel
      dd_path: spectrometer_x_ray_crystal/channel
    attributes:
      exposure_time:
        range: float
        description: Exposure time of the measurement
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energy_bound_lower:
        range: float
        multivalued: true
        description: Lower energy bound for the photon detection, for each pixel (horizontal, vertical)
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../z_frames
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../z_frames
      energy_bound_upper:
        range: float
        multivalued: true
        description: Upper energy bound for the photon detection, for each pixel (horizontal, vertical)
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../z_frames
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../z_frames
      aperture:
        range: DetectorAperture
        description: Collimating aperture
      reflector:
        range: CurvedObject
        multivalued: true
        description: Set of reflectors (optional) reflecting the light coming from the plasma towards
          the crystal. If empty, means that the plasma light directly arrives on the crystal.
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      crystal:
        range: SpectrometerXRayCrystalCrystal
        description: Characteristics of the crystal used
      filter_window:
        range: FilterWindow
        multivalued: true
        description: Set of filter windows
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      camera:
        range: CameraGeometry
        description: Characteristics of the camera used
      z_frames:
        range: float
        multivalued: true
        description: Height of the observed zone at the focal plane in the plasma, corresponding to the
          vertical dimension of the frame
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      wavelength_frames:
        range: float
        multivalued: true
        description: Wavelength of incoming photons on each pixel of the frames, mainly varying accross
          the horizontal dimension of the frame. However a 2D map of the wavelength is given since it
          is not constant vertically due to the elliptical curvature of the photon iso-surfaces
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../z_frames
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../z_frames
      bin:
        range: SpectrometerXRayCrystalBin
        multivalued: true
        description: Set of bins (binning in the vertical dimension) defined to increase the signal to
          noise ratio of the spectra
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      frame:
        range: SpectrometerXRayCrystalFrame
        multivalued: true
        description: Set of frames
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      energies:
        range: float
        multivalued: true
        description: Array of energy values for tabulation of the detection efficiency
        annotations:
          dd_type: static
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      detection_efficiency:
        range: float
        multivalued: true
        description: Probability of detection of a photon impacting the detector as a function of its
          energy
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../energies
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../energies
      profiles_line_integrated:
        range: SpectrometerXRayCrystalProxy
        description: Profiles proxies are given in the vertical direction of the detector. They are estimated
          directly from the camera, without tomographic inversion. Binning is allowed so the number of
          profile points may be lower than the length of z_frames. Physical quantities deduced from the
          measured spectra are given for each profile point. They correspond to the spectra integrated
          along lines of sight, defined by a first point given by the centre of the crystal and a second
          point (depending on the profile point) described below.
      instrument_function:
        range: SpectrometerXRayCrystalInstrumentFunction
        description: Instrument function (to be used in case vertical binning is not used), i.e. response
          of the detector to a monochromatic emission passing through the spectrometer. The resulting
          image on the detector will be a 2-D distribution of pixel values, for each wavelength. It can
          be given as explicit values for each detector pixel (values node) or as a parametric function
          of wavelength (described by the other nodes)
  SpectrometerXRayCrystalCrystal:
    is_a: InformationContentEntity
    description: Characteristics of the crystal used
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_crystal
      dd_path: spectrometer_x_ray_crystal/channel/crystal
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      geometry_type:
        range: Identifier
        description: Geometry of the object contour. Note that there is some flexibility in the choice
          of the local coordinate system (X1,X2,X3). The data provider should choose the most convenient
          coordinate system for the object, respecting the definitions of (X1,X2,X3) indicated below.
      curvature_type:
        range: Identifier
        description: Curvature of the object.
      material:
        range: Identifier
        description: Material of the object
      centre:
        range: Rphiz0dStatic
        description: Coordinates of the origin of the local coordinate system (X1,X2,X3) describing the
          object. This origin is located within the object area and should be the middle point of the
          object surface. If geometry_type=2, it's the centre of the circular object. If geometry_type=3,
          it's the centre of the rectangular object.
      radius:
        range: float
        description: Radius of the circle, used only if geometry_type/index = 2
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is more horizontal than X2 (has a smaller abs(Z) component) and
          oriented in the positive phi direction (counter-clockwise when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the object surface and oriented towards the plasma.
      x1_width:
        range: float
        description: Full width of the object in the X1 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_width:
        range: float
        description: Full width of the object in the X2 direction, used only if geometry_type/index =
          3
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      outline:
        range: X1x21dStatic
        description: Irregular outline of the object in the (X1, X2) coordinate system, used only if geometry_type/index=1.
          Repeat the first point since this is a closed contour
      x1_curvature:
        range: float
        description: Radius of curvature in the X1 direction, to be filled only for curvature_type/index
          = 2, 4 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x2_curvature:
        range: float
        description: Radius of curvature in the X2 direction, to be filled only for curvature_type/index
          = 3 or 5
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      surface:
        range: float
        description: Surface of the object, derived from the above geometric data
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_bragg:
        range: float
        description: Bragg wavelength of the crystal
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      angle_bragg:
        range: float
        description: Bragg angle of the crystal
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      thickness:
        range: float
        description: Thickness of the crystal
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      cut:
        range: integer
        multivalued: true
        description: Miller indices characterizing the cut of the crystal (can be of length 3 or 4)
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      mesh_type:
        range: Identifier
        description: Crystal mesh type
  SpectrometerXRayCrystalBin:
    is_a: InformationContentEntity
    description: Set of bins (binning in the vertical dimension) defined to increase the signal to noise
      ratio of the spectra
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_bin
      dd_path: spectrometer_x_ray_crystal/channel/bin
    attributes:
      z_pixel_range:
        range: integer
        multivalued: true
        description: Vertical pixel index range indicating the corresponding binned detector area
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      wavelength:
        range: float
        multivalued: true
        description: Wavelength of incoming photons on each horizontal pixel of this bin.
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight from the crystal to the plasma for this bin, defined
          by two points
      instrument_function:
        range: SpectrometerXRayCrystalInstrumentFuncBin
        description: Instrument function for this bin (replaces the ../../instrument function in case
          vertical binning is used), i.e. response of the detector to a monochromatic emission passing
          through the spectrometer. The resulting image on the detector will be a 2-D distribution of
          pixel values, for each wavelength. It can be given as explicit values for each detector pixel
          (values node) or as a parametric function of wavelength (described by the other nodes)
  SpectrometerXRayCrystalInstrumentFuncBin:
    is_a: InformationContentEntity
    description: Instrument function for this bin (replaces the ../../instrument function in case vertical
      binning is used), i.e. response of the detector to a monochromatic emission passing through the
      spectrometer. The resulting image on the detector will be a 2-D distribution of pixel values, for
      each wavelength. It can be given as explicit values for each detector pixel (values node) or as
      a parametric function of wavelength (described by the other nodes)
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_instrument_func_bin
      dd_path: spectrometer_x_ray_crystal/channel/bin/instrument_function
    attributes:
      wavelengths:
        range: float
        multivalued: true
        description: Array of wavelengths on which the instrument function is defined
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      values:
        range: float
        multivalued: true
        description: Explicit instrument function values for the detector. When multiplied by the line-integrated
          emission spectrum in photons/second/sr/m/m^2 received on a binned pixel of the detector, gives
          the detector pixel output in counts/seconds.
        annotations:
          dd_type: static
          dd_units: sr.m
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../wavelengths
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../wavelengths
      type:
        range: Identifier
        description: Instrument function type
      intensity:
        range: float
        multivalued: true
        description: Scaling factor for the instrument function such that convolving the instrument function
          with an emission spectrum gives the counts per second on the detector
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      centre:
        range: float
        multivalued: true
        description: Centre (in terms of absolute wavelength) of instrument function
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      sigma:
        range: float
        multivalued: true
        description: Standard deviation of Gaussian instrument function
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      scale:
        range: float
        multivalued: true
        description: Scale of Lorentzian instrument function (full width at half height)
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
  SpectrometerXRayCrystalFrame:
    is_a: TimeSlice
    description: Set of frames
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_frame
      dd_path: spectrometer_x_ray_crystal/channel/frame
      fyo_lift: time_slice
    attributes:
      counts_n:
        range: float
        multivalued: true
        description: Number of counts detected on each pixel of the frame during one exposure time
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../../z_frames
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../../z_frames
      counts_bin_n:
        range: float
        multivalued: true
        description: Number of counts detected on each pixel/bin of the binned frame during one exposure
          time
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: ../../bin
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../../bin
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpectrometerXRayCrystalProxy:
    is_a: InformationContentEntity
    description: Profiles proxies are given in the vertical direction of the detector. They are estimated
      directly from the camera, without tomographic inversion. Binning is allowed so the number of profile
      points may be lower than the length of z_frames. Physical quantities deduced from the measured spectra
      are given for each profile point. They correspond to the spectra integrated along lines of sight,
      defined by a first point given by the centre of the crystal and a second point (depending on the
      profile poin
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_proxy
      dd_path: spectrometer_x_ray_crystal/channel/profiles_line_integrated
    attributes:
      lines_of_sight_second_point:
        range: Rphiz1dStatic
        description: For each profile point, a line of sight is defined by a first point given by the
          centre of the crystal and a second point described here.
      lines_of_sight_rho_tor_norm:
        range: SpectrometerXRayCrystalFlt2dTime1
        description: 'Shortest distance in rho_tor_norm between lines of sight and magnetic axis, signed
          with following convention : positive (resp. negative) means the point of shortest distance is
          above (resp. below) the magnetic axis'
        annotations:
          dd_units: '1'
          dd_coordinate1: ../lines_of_sight_second_point/r
      t_i:
        range: SpectrometerXRayCrystalFlt2dTime1
        description: Ion temperature (estimated from a spectral fit directly on the output line-integrated
          signal, without tomographic inversion)
        annotations:
          dd_units: eV
          dd_coordinate1: ../lines_of_sight_second_point/r
      t_e:
        range: SpectrometerXRayCrystalFlt2dTime1
        description: Electron temperature (estimated from a spectral fit directly on the output line-integrated
          signal, without tomographic inversion)
        annotations:
          dd_units: eV
          dd_coordinate1: ../lines_of_sight_second_point/r
      velocity_tor:
        range: SpectrometerXRayCrystalFlt2dTime1
        description: Toroidal velocity (estimated from a spectral fit directly on the output line-integrated
          signal, without tomographic inversion)
        annotations:
          dd_units: m.s^-1
          dd_coordinate1: ../lines_of_sight_second_point/r
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes of this probe located at this level of the IDS structure
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpectrometerXRayCrystalFlt2dTime1:
    is_a: InformationContentEntity
    description: 'Shortest distance in rho_tor_norm between lines of sight and magnetic axis, signed with
      following convention : positive (resp. negative) means the point of shortest distance is above (resp.
      below) the magnetic axis'
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_flt_2d_time_1
      dd_path: spectrometer_x_ray_crystal/channel/profiles_line_integrated/lines_of_sight_rho_tor_norm
    attributes:
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: as_parent
          dd_coordinate2: ../../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: as_parent,../../time
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the data for each time slice. 0: valid from automated
          processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified in the
          data processing (request verification by the diagnostic RO), -2: invalid data, should not be
          used (values lower than -2 have a code-specific meaning detailing the origin of their invalidity)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: constant
  SpectrometerXRayCrystalInstrumentFunction:
    is_a: InformationContentEntity
    description: Instrument function (to be used in case vertical binning is not used), i.e. response
      of the detector to a monochromatic emission passing through the spectrometer. The resulting image
      on the detector will be a 2-D distribution of pixel values, for each wavelength. It can be given
      as explicit values for each detector pixel (values node) or as a parametric function of wavelength
      (described by the other nodes)
    annotations:
      dd_type_name: spectrometer_x_ray_crystal_instrument_function
      dd_path: spectrometer_x_ray_crystal/channel/instrument_function
    attributes:
      wavelengths:
        range: float
        multivalued: true
        description: Array of wavelengths on which the instrument function is defined
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      values:
        range: float
        multivalued: true
        description: Explicit instrument function values for the detector. When multiplied by the line-integrated
          emission spectrum in photons/second/sr/m/m^2 received on a pixel of the detector, gives the
          detector pixel output in counts/seconds.
        annotations:
          dd_type: static
          dd_units: sr.m
          dd_ndim: 3
          dd_coordinate1: 1...N
          dd_coordinate2: ../../z_frames
          dd_coordinate3: ../wavelengths
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,../../z_frames,../wavelengths
      type:
        range: Identifier
        description: Instrument function type
      intensity:
        range: float
        multivalued: true
        description: Scaling factor for the instrument function such that convolving the instrument function
          with an emission spectrum gives the counts per second on the detector
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../../z_frames
          dd_coordinate2: ../wavelengths
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../z_frames,../wavelengths
      centre:
        range: float
        multivalued: true
        description: Centre (in terms of absolute wavelength) of instrument function
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../../z_frames
          dd_coordinate2: ../wavelengths
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../z_frames,../wavelengths
      sigma:
        range: float
        multivalued: true
