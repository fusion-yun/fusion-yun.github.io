id: https://fusion-yun.github.io/fyo/v0.draft/imas/v4/sawteeth
name: fyo-imas-sawteeth
title: fyo IDS `sawteeth` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `sawteeth` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: ../imas/v4/sawteeth.linkml.yaml (mechanical layer)
  fyo_category: physics-state
  fyo_root_class: Sawteeth
  provenance: DO NOT EDIT — regenerate via ontology/dd2fyo.py.
classes:
  Sawteeth:
    is_a: IDS
    description: Description of sawtooth events. This IDS must be used in homogeneous_time = 1 mode
    annotations:
      dd_path: sawteeth
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition)
      crash_trigger:
        range: integer
        multivalued: true
        description: 'Flag indicating whether a crash condition has been satisfied : 0 = no crash. N(>0)
          = crash triggered due to condition N as follows. 1: crash triggered by the ideal kink criterion;
          2: crash triggered by the ideal kink criterion including kinetic effects from fast particles;
          31: crash triggered by the resistive kink criterion (meeting necessary conditions for reconnection);
          32: crash triggered by the resistive kink criterion (resistive kink mode is unstable). The distinction
          between 31 and 32 only indicates whether (31) or (32) was the last criterion to be satisfied'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      profiles_1d:
        range: SawteethProfiles1d
        multivalued: true
        description: Core profiles after sawtooth crash for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      diagnostics:
        range: SawteethDiagnostics
        description: Detailed information about the sawtooth characteristics
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SawteethProfiles1d:
    is_a: TimeSlice
    description: Core profiles after sawtooth crash for various time slices
    annotations:
      dd_type_name: sawteeth_profiles_1d
      dd_path: sawteeth/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      t_e:
        range: float
        multivalued: true
        description: Electron temperature
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      t_i_average:
        range: float
        multivalued: true
        description: Ion temperature (averaged on charge states and ion species)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      n_e:
        range: float
        multivalued: true
        description: Electron density (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      n_e_fast:
        range: float
        multivalued: true
        description: Density of fast (non-thermal) electrons
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      n_i_total_over_n_e:
        range: float
        multivalued: true
        description: Ratio of total ion density (sum over species and charge states) over electron density.
          (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      momentum_phi:
        range: float
        multivalued: true
        description: Total plasma toroidal momentum, summed over ion species and electrons
        annotations:
          dd_type: dynamic
          dd_units: kg.m.s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      zeff:
        range: float
        multivalued: true
        description: Effective charge
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_e:
        range: float
        multivalued: true
        description: Electron pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_e_fast_perpendicular:
        range: float
        multivalued: true
        description: Fast (non-thermal) electron perpendicular pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_e_fast_parallel:
        range: float
        multivalued: true
        description: Fast (non-thermal) electron parallel pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_i_total:
        range: float
        multivalued: true
        description: Total ion pressure (sum over the ion species)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_i_total_fast_perpendicular:
        range: float
        multivalued: true
        description: Fast (non-thermal) total ion (sum over the ion species) perpendicular pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      p_i_total_fast_parallel:
        range: float
        multivalued: true
        description: Fast (non-thermal) total ion (sum over the ion species) parallel pressure
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_thermal:
        range: float
        multivalued: true
        description: Thermal pressure (electrons+ions)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_perpendicular:
        range: float
        multivalued: true
        description: Total perpendicular pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      pressure_parallel:
        range: float
        multivalued: true
        description: Total parallel pressure (electrons+ions, thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_total:
        range: float
        multivalued: true
        description: Total parallel current density = average(jtot.B) / B0, where B0 = Core_Profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_phi:
        range: float
        multivalued: true
        description: Total toroidal current density = average(j_phi/R) / average(1/R)
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_ohmic:
        range: float
        multivalued: true
        description: Ohmic parallel current density = average(J_Ohmic.B) / B0, where B0 = Core_Profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_non_inductive:
        range: float
        multivalued: true
        description: Non-inductive (includes bootstrap) parallel current density = average(jni.B) / B0,
          where B0 = Core_Profiles/Vacuum_Toroidal_Field/ B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_bootstrap:
        range: float
        multivalued: true
        description: Bootstrap current density = average(J_Bootstrap.B) / B0, where B0 = Core_Profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      e_field_parallel:
        range: float
        multivalued: true
        description: Parallel electric field = average(E.B) / B0, where Core_Profiles/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      q:
        range: float
        multivalued: true
        description: Safety factor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      magnetic_shear:
        range: float
        multivalued: true
        description: Magnetic shear, defined as rho_tor/q . dq/drho_tor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      phi:
        range: float
        multivalued: true
        description: Toroidal flux
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      psi_star_pre_crash:
        range: float
        multivalued: true
        description: Psi* = psi - phi, just before the sawtooth crash
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      psi_star_post_crash:
        range: float
        multivalued: true
        description: Psi* = psi - phi, after the sawtooth crash
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SawteethDiagnostics:
    is_a: InformationContentEntity
    description: Detailed information about the sawtooth characteristics
    annotations:
      dd_type_name: sawteeth_diagnostics
      dd_path: sawteeth/diagnostics
    attributes:
      magnetic_shear_q1:
        range: float
        multivalued: true
        description: Magnetic shear at surface q = 1, defined as rho_tor/q . dq/drho_tor
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      rho_tor_norm_q1:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate at surface q = 1
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      rho_tor_norm_inversion:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate at inversion radius
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      rho_tor_norm_mixing:
        range: float
        multivalued: true
        description: Normalized toroidal flux coordinate at mixing radius
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      previous_crash_trigger:
        range: integer
        multivalued: true
        description: 'Previous crash trigger. Flag indicating whether a crash condition has been satisfied
          : 0 = no crash. N(>0) = crash triggered due to condition N'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      previous_crash_time:
        range: float
        multivalued: true
        description: Time at which the previous sawtooth crash occured
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      previous_period:
        range: float
        multivalued: true
        description: Previous sawtooth period
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
