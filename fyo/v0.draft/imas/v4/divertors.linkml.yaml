id: https://fusion-yun.github.io/fyo/v0.draft/imas/v4/divertors
name: fyo-imas-divertors
title: fyo IDS `divertors` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `divertors` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: ../imas/v4/divertors.linkml.yaml (mechanical layer)
  fyo_category: device
  fyo_root_class: Divertors
  provenance: DO NOT EDIT — regenerate via ontology/dd2fyo.py.
classes:
  Divertors:
    is_a: IDS
    description: Description of divertors
    annotations:
      dd_path: divertors
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      divertor:
        range: Divertor
        multivalued: true
        description: Set of divertors
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  Divertor:
    is_a: InformationContentEntity
    description: Set of divertors
    annotations:
      dd_type_name: divertor
      dd_path: divertors/divertor
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      target:
        range: DivertorTarget
        multivalued: true
        description: Set of divertor targets
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
      wetted_area:
        range: SignalFlt1d
        description: Wetted area of the divertor (sum over all targets)
        annotations:
          dd_units: m^2
      power_incident:
        range: SignalFlt1d
        description: Total power incident on the divertor (sum over all targets). This power is split
          in the various physical categories listed below
        annotations:
          dd_units: W
      power_conducted:
        range: SignalFlt1d
        description: Power conducted by the plasma on the divertor targets (sum over all targets)
        annotations:
          dd_units: W
      power_convected:
        range: SignalFlt1d
        description: Power convected by the plasma on the divertor targets (sum over all targets)
        annotations:
          dd_units: W
      power_radiated:
        range: SignalFlt1d
        description: Net radiated power on the divertor targets (incident - reflected) (sum over all targets)
        annotations:
          dd_units: W
      power_black_body:
        range: SignalFlt1d
        description: Black body radiated power emitted from the divertor targets (emissivity is included)
          (sum over all targets)
        annotations:
          dd_units: W
      power_neutrals:
        range: SignalFlt1d
        description: Net power from neutrals on the divertor targets (positive means power is deposited
          on the target) (sum over all targets)
        annotations:
          dd_units: W
      power_recombination_plasma:
        range: SignalFlt1d
        description: Power deposited on the divertor targets due to recombination of plasma ions (sum
          over all targets)
        annotations:
          dd_units: W
      power_recombination_neutrals:
        range: SignalFlt1d
        description: Power deposited on the divertor targets due to recombination of neutrals into a ground
          state (e.g. molecules) (sum over all targets)
        annotations:
          dd_units: W
      power_currents:
        range: SignalFlt1d
        description: Power deposited on the divertor targets due to electric currents (positive means
          power is deposited on the target) (sum over all targets)
        annotations:
          dd_units: W
      power_nuclear:
        range: SignalFlt1d
        description: Nuclear power heating the divertor
        annotations:
          dd_units: W
      particle_flux_recycled_total:
        range: SignalFlt1d
        description: Total recycled particle flux from  the divertor (in equivalent electrons)
        annotations:
          dd_units: s^-1
      current_incident:
        range: SignalFlt1d
        description: Total current incident on this divertor
        annotations:
          dd_units: A
  DivertorTarget:
    is_a: InformationContentEntity
    description: Set of divertor targets
    annotations:
      dd_type_name: divertor_target
      dd_path: divertors/divertor/target
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      heat_flux_steady_limit_max:
        range: float
        description: Maximum steady state heat flux allowed on divertor target surface (engineering design
          limit)
        annotations:
          dd_type: static
          dd_units: W.m^-2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      temperature_limit_max:
        range: float
        description: Maximum surface target temperature allowed to prevent damage (melting, recrystallization,
          sublimation, etc...)
        annotations:
          dd_type: static
          dd_units: K
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      t_e_target_sputtering_limit_max:
        range: float
        description: Maximum plasma temperature allowed on the divertor target to avoid excessive sputtering
        annotations:
          dd_type: static
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_flux_peak:
        range: SignalFlt1d
        description: Peak power flux on the divertor target surface
        annotations:
          dd_units: W.m^-2
      flux_expansion:
        range: SignalFlt1d
        description: 'Magnetic flux expansion as defined by Stangeby : ratio between the poloidal field
          at the midplane separatrix and the poloidal field at the strike-point see formula attached,
          where u means upstream (midplane separatrix) and t means at divertor target (downstream).'
        annotations:
          dd_units: '1'
      two_point_model:
        range: DivertorTargetTwoPointModel
        multivalued: true
        description: Description of SOL according to the two point model, the downstream point being on
          this target, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      tilt_angle_pol:
        range: SignalFlt1d
        description: Angle between field lines projected in poloidal plane and target, measured clockwise
          from the target to the projected field lines
        annotations:
          dd_units: rad
      extension_r:
        range: float
        description: Target length projected on the major radius axis
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      extension_z:
        range: float
        description: Target length projected on the height axis
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wetted_area:
        range: SignalFlt1d
        description: Wetted area of the target, defined by the SOL heat flux decay length (lambda_q) mapped
          to the target using flux expansion and spreading factor and the target toroidal circumference.
          In other words, this is the area getting heat flux from the maximum value down to one e-fold
          decay.
        annotations:
          dd_units: m^2
      power_incident_fraction:
        range: SignalFlt1d
        description: Power fraction incident on the target (normalized to the total power incident on
          the divertor)
        annotations:
          dd_units: '1'
      power_incident:
        range: SignalFlt1d
        description: Total power incident on this target. This power is split in the various physical
          categories listed below
        annotations:
          dd_units: W
      power_conducted:
        range: SignalFlt1d
        description: Power conducted by the plasma on this divertor target
        annotations:
          dd_units: W
      power_convected:
        range: SignalFlt1d
        description: Power convected by the plasma on this divertor target
        annotations:
          dd_units: W
      power_radiated:
        range: SignalFlt1d
        description: Net radiated power on this divertor target (incident - reflected)
        annotations:
          dd_units: W
      power_black_body:
        range: SignalFlt1d
        description: Black body radiated power emitted from this divertor target (emissivity is included)
        annotations:
          dd_units: W
      power_neutrals:
        range: SignalFlt1d
        description: Net power from neutrals on this divertor target (positive means power is deposited
          on the target)
        annotations:
          dd_units: W
      power_recombination_plasma:
        range: SignalFlt1d
        description: Power deposited on this divertor target due to recombination of plasma ions
        annotations:
          dd_units: W
      power_recombination_neutrals:
        range: SignalFlt1d
        description: Power deposited on this divertor target due to recombination of neutrals into a ground
          state (e.g. molecules)
        annotations:
          dd_units: W
      power_currents:
        range: SignalFlt1d
        description: Power deposited on this divertor target due to electric currents (positive means
          power is deposited on the target)
        annotations:
          dd_units: W
      current_incident:
        range: SignalFlt1d
        description: Total current incident on this target
        annotations:
          dd_units: A
      tile:
        range: DivertorTargetTile
        multivalued: true
        description: Set of divertor tiles belonging to this target
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
  DivertorTargetTwoPointModel:
    is_a: TimeSlice
    description: Description of SOL according to the two point model, the downstream point being on this
      target, for various time slices
    annotations:
      dd_type_name: divertor_target_two_point_model
      dd_path: divertors/divertor/target/two_point_model
      fyo_lift: time_slice
    attributes:
      t_e_target:
        range: float
        description: Electron temperature at divertor target
        annotations:
          dd_type: dynamic
          dd_units: eV
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      n_e_target:
        range: float
        description: Electron density at divertor target
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      sol_heat_decay_length:
        range: float
        description: Heat flux decay length in SOL at divertor entrance, mapped to the mid-plane, this
          is the lambda_q parameter defined in reference T. Eich et al, Nucl. Fusion 53 (2013) 093031
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      sol_heat_spreading_length:
        range: float
        description: Heat flux spreading length in SOL at equatorial mid-plane, this is the S power spreading
          parameter defined in reference T. Eich et al, Nucl. Fusion 53 (2013) 093031. Relevant only for
          attached plasmas.
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DivertorTargetTile:
    is_a: InformationContentEntity
    description: Set of divertor tiles belonging to this target
    annotations:
      dd_type_name: divertor_target_tile
      dd_path: divertors/divertor/target/tile
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      surface_outline:
        range: Rphiz1dStatic
        description: Outline of the tile surface facing the plasma
      surface_area:
        range: float
        description: Area of the tile surface facing the plasma
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current_incident:
        range: SignalFlt1d
        description: Total current incident on this tile
        annotations:
          dd_units: A
      shunt_index:
        range: integer
        description: If the tile carries a measurement shunt, index of that shunt (in the magnetics IDS
          shunt array)
        annotations:
          dd_type: static
