# fyo-manifest.yaml — language-neutral manifest for fyo, the fusion-domain ontology.
#
# Mirrors spo's neutral form (SPM-ADR-107) for the downstream fyo layer (FYTOK-ADR-101; layout
# and scope revised by FYTOK-ADR-102): the single, language-neutral source of fyo's identity,
# version, module set, prefixes, and compiled-target locations. Any language/tool reads this;
# the Python binding (fytok.ontology.fyo) derives from it.
#
# fyo = TWO strata (FYTOK-ADR-102):
#   1. hand-curated core (`fyo-core`): apparatus classes (Machine/Tokamak, CoilSystem +
#      subtypes, Coil, Plasma, Diagnostic — SPM-ADR-104) + the semantic anchors of the lifted
#      DD (IDS, Discharge, MachineDescription, FluxCoordinateSystem/COCOS);
#   2. the LIFTED IMAS DD (`../imas/v<major>/`): per-IDS schemas + the deduplicated
#      `fyo-common`, generated by `../../dd2fyo.py` from the mechanical DD LinkML
#      (`../../imas/v<major>/`, dd2linkml.py output — which itself remains OUTSIDE fyo,
#      the ω-side layout anchor). All fyo schemas ground on spo (`imports: [spo]`).
#
# fyo ⊂ spo: the reusable upper (BFO-3D + 4D, quantity/field/signal, time AoS/SoA duality,
# domains, geometry, vocab, provenance/modality) lives in spo (spmodel/ontology); the
# spo-class -> Python-carrier map is a LANGUAGE BINDING and lives with the binding.
id: https://fusion-yun.github.io/fyo/v0.draft
name: fyo
version: 0.6.0
license: CC-BY-ND-4.0   # CC BY-ND 4.0 — see the artifact LICENSE file
description: >-
  fyo — the fusion/tokamak domain ontology: hand-curated core (apparatus + lifted-DD semantic
  anchors, fyo-core) plus the generated semantic lift of the IMAS DD (per-IDS schemas +
  fyo-common under ../imas/v<major>/, dd2fyo per FYTOK-ADR-102) — all grounded on spo/BFO.

# Upstream ontology this layer imports (resolved cross-repo via spo's neutral catalog).
imports:
  - spo

# Hand-curated fyo core (durable, authored).
core:
  file: fyo-core.linkml.yaml
  status: active   # apparatus layer (SPM-ADR-104 / FYTOK-ADR-101 OI-A) + lifted-DD anchors
                   # (IDS / Discharge / MachineDescription / FluxCoordinateSystem, ADR-102).

# Generated fyo form of the IMAS DD, per DD major version (dd2fyo output; part of fyo).
generated:
  imas-dd-fyo:
    dir: ../imas
    manifest: ../imas/v4/manifest.yaml   # modules: fyo-common + 82 per-IDS schemas

# Companion artifact (informative, NOT a fyo module): the MECHANICAL LinkML rendering of the
# DD (dd2linkml output) — layout-faithful, spo-free; the input of dd2fyo and the ω anchor.
related:
  imas-dd-linkml:
    dir: ../../imas
    manifest: ../../imas/v4/manifest.yaml

# Prefix map (kept in sync with the schema headers).
prefixes:
  linkml: https://w3id.org/linkml/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  imas: https://imas.iter.org/dd/

# Compiled, language-neutral serializations (deferred; needs the linkml toolchain).
targets:
  owl: ../../dist/fyo.owl.ttl
  shacl: ../../dist/fyo.shacl.ttl
  jsonld_context: ../../dist/fyo.context.jsonld
