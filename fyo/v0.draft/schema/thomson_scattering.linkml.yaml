id: https://fusion-yun.github.io/fyo/v0.draft/thomson_scattering
name: fyo-imas-thomson_scattering
title: fyo IDS `thomson_scattering` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `thomson_scattering` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/thomson_scattering/dd_thomson_scattering.xsd via dd2linkml (mechanical layer
    — transient build artifact, not in-tree)
  fyo_category: diagnostic
  fyo_root_class: ThomsonScattering
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  ThomsonScattering:
    is_a: IDS
    description: Thomson scattering diagnostic
    annotations:
      dd_path: thomson_scattering
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition for the mapping of measurements on an equilibrium.
          Indicate the IMAS URI of the used equilibrium IDS in the ids_properties/provenance section.
      channel:
        range: ThomsonScatteringChannel
        multivalued: true
        description: Set of channels (lines-of-sight)
        annotations:
          dd_max_occurs: '150'
          dd_coordinate1: 1...N
      laser:
        range: ThomsonScatteringLaser
        multivalued: true
        description: Set of probing lasers
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      polychromator:
        range: ThomsonScatteringPolychromator
        multivalued: true
        description: Set of polychromators
        annotations:
          dd_max_occurs: '40'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  ThomsonScatteringChannel:
    is_a: InformationContentEntity
    description: Set of channels (lines-of-sight)
    annotations:
      dd_type_name: thomson_scattering_channel
      dd_path: thomson_scattering/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight of the channel, given by 2 points
      polychromator_index:
        range: integer
        description: Index of the polychromator used by this channel (refers to the ../../polychromator
          array)
        annotations:
          dd_type: static
      scattering_angle:
        range: float
        multivalued: true
        description: Angle formed by the laser beam wave vector and the line of sight, counted clockwise
          when projected in the poloidal plane
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../laser
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../laser
      scattering_length:
        range: float
        description: Length of the light scattering volume (full width) along the laser beam path, for
          this line of sight (i.e. length of the intersection between the laser beam and the viewing cone).
          This is a time average value in case of different lasers fired at different times
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      solid_angle:
        range: integer
        description: Solid angle of the line of sight
        annotations:
          dd_type: static
      position:
        range: Rphiz0dStatic
        description: Average position of the measurements (intersection between laser beam and line of
          sight)
      delta_position:
        range: Rphiz1dDynamicAos1CommonTime
        description: Incremental variation of the position of the measurements, due to e.g. different
          lasers not intersecting the line of sight at the same position. The actual position is then
          the static position + delta_position
      position_per_laser:
        range: Rphiz1dStatic
        description: Position of the intersection between each laser beam and this line of sight
        annotations:
          dd_coordinate1: ../../laser
      distance_separatrix_midplane:
        range: SignalFlt1d
        description: Distance between the measurement position and the separatrix, mapped along flux surfaces
          to the outboard midplane, in the major radius direction. Positive value means the measurement
          is outside of the separatrix.
        annotations:
          dd_units: m
      t_e:
        range: SignalFlt1dValidity
        description: Electron temperature
        annotations:
          dd_units: eV
      n_e:
        range: SignalFlt1dValidity
        description: Electron density
        annotations:
          dd_units: m^-3
      gaussian_fit:
        range: float
        multivalued: true
        description: Amplitude of the gaussian fit of the measured signal in each energy band, used to
          estimate the electron temperature
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../../polychromator(channel(i1)/polychromator_index)/wavelength_band
          dd_coordinate2: ../t_e/time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../polychromator(channel(i1)/polychromator_index)/wavelength_band,../t_e/time
  ThomsonScatteringLaser:
    is_a: InformationContentEntity
    description: Set of probing lasers
    annotations:
      dd_type_name: thomson_scattering_laser
      dd_path: thomson_scattering/laser
    attributes:
      energy_in:
        range: SignalFlt1d
        description: Energy of the laser pulse measured just before entering the vacuum vessel
        annotations:
          dd_units: J
      energy_out:
        range: SignalFlt1d
        description: Energy of the laser pulse measured after crossing the plasma
        annotations:
          dd_units: J
      start_point:
        range: Rphiz0dStatic
        description: Position of the laser start point
      end_point:
        range: Rphiz0dStatic
        description: Position of the laser end point
      wavelength:
        range: float
        description: Laser wavelength
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      area:
        range: float
        description: Laser cross sectional area
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  ThomsonScatteringPolychromator:
    is_a: InformationContentEntity
    description: Set of polychromators
    annotations:
      dd_type_name: thomson_scattering_polychromator
      dd_path: thomson_scattering/polychromator
    attributes:
      wavelength_band:
        range: DetectorWavelength
        multivalued: true
        description: Set of wavelength bands in which photons are counted by the polychromator
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      calibration_absolute:
        range: float
        multivalued: true
        description: Factor to be multiplied by the spectral calibration to obtain the instrument function
          (fraction of signal received on each energy channel when a photon of relevant energy enters
          the optical system)
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelength_band
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelength_band
      calibration_absolute_date:
        range: string
        description: Date at which the absolute calibration was carried out
        annotations:
          dd_type: static
      calibration_spectral:
        range: float
        multivalued: true
        description: 'Polychromator response function: fraction of signal received on each energy channel
          when a photon of relevant energy enters the polychromator.'
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelength_band
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelength_band
      calibration_spectral_date:
        range: string
        description: Date at which the spectral calibration was carried out
        annotations:
          dd_type: static
  DetectorWavelength:
    is_a: InformationContentEntity
    description: Set of wavelength bands in which photons are counted by the polychromator
    annotations:
      dd_type_name: detector_wavelength
      dd_path: thomson_scattering/polychromator/wavelength_band
    attributes:
      wavelength_lower:
        range: float
        description: Lower bound of the detector wavelength range
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_upper:
        range: float
        description: Upper bound of the detector wavelength range
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelengths:
        range: float
        multivalued: true
        description: Array of wavelength values
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      detection_efficiency:
        range: float
        multivalued: true
        description: Probability of detection of a photon impacting the detector as a function of its
          wavelength
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
