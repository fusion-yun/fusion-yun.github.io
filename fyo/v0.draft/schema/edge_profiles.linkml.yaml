id: https://fusion-yun.github.io/fyo/v0.draft/edge_profiles
name: fyo-imas-edge_profiles
title: fyo IDS `edge_profiles` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `edge_profiles` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/edge_profiles/dd_edge_profiles.xsd via dd2linkml (mechanical layer — transient
    build artifact, not in-tree)
  fyo_category: physics-state
  fyo_root_class: EdgeProfiles
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  EdgeProfiles:
    is_a: IDS
    description: Edge plasma profiles (includes the scrape-off layer and possibly part of the confined
      plasma)
    annotations:
      dd_path: edge_profiles
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      profiles_1d:
        range: PlasmaProfilesProfiles1d
        multivalued: true
        description: SOL radial profiles for various time slices, taken on outboard equatorial mid-plane
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebase
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: PlasmaProfilesTimeSlice
        multivalued: true
        description: Edge plasma quantities represented using the general grid description, for various
          time slices. The timebase of this array of structure must be a subset of the ggd_fast timebase
          (only if the ggd_fast array of structure is used)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd_fast:
        range: PlasmaProfilesGgdFast
        multivalued: true
        description: Quantities provided at a faster sampling rate than the full ggd quantities. These
          are either integrated quantities or local quantities provided on a reduced set of positions.
          Positions and integration domains are described by a set of grid_subsets (of size 1 for a position).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      statistics:
        range: Statistics
        multivalued: true
        description: Statistics for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
