classes:
  PfPlasma:
    is_a: IDS
    description: Description of the axisymmetric currents flowing in the plasma, to be used in circuit
      equations, represented by a set of elements
    annotations:
      dd_path: pf_plasma
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      element:
        range: PfPlasmaElement
        multivalued: true
        description: Set of plasma elements
        annotations:
          dd_max_occurs: '500'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PfPlasmaElement:
    is_a: InformationContentEntity
    description: Set of plasma elements
    annotations:
      dd_type_name: pf_plasma_element
      dd_path: pf_plasma/element
    attributes:
      geometry:
        range: Outline2dGeometryStatic
        description: Cross-sectional shape of the element
      area:
        range: float
        description: Cross-sectional area of the element
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current:
        range: float
        multivalued: true
        description: Current in the plasma element
        annotations:
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes located at this level of the IDS structure
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
