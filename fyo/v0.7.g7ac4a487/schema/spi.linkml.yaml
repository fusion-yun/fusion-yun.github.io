id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/spi
name: fyo-spi
title: fyo IDS `spi` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `spi` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/spi/dd_spi.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Spi
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Spi:
    is_a: IDS
    description: Shattered pellets injectors
    annotations:
      dd_path: spi
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      injector:
        range: SpiSingle
        multivalued: true
        description: Set of shattered pellet injectors
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      shatter_cone_definition:
        range: Identifier
        description: Definition of the shatter cone
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpiSingle:
    is_a: InformationContentEntity
    description: Set of shattered pellet injectors
    annotations:
      dd_type_name: spi_single
      dd_path: spi/injector
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      optical_pellet_diagnostic:
        range: SpiOpd
        description: Information related to the embedded optical pellet diagnostic
      time_trigger:
        range: float
        description: Time of trigger request to the power supply according to the DMS sequence
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time_shatter:
        range: float
        description: Arrival time at the shattering unit
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      pellet:
        range: SpiPellet
        description: Information related to the pellet
      fragmentation_gas:
        range: SpiGas
        description: Description of the gas produced during fragmentation
      propellant_gas:
        range: SpiGas
        description: Description of the propellant gas
      injection_direction:
        range: Xyz0dConstant
        description: Unit vector of the unshattered pellet velocity direction right before shattering
      shattering_position:
        range: Rphiz0dStatic
        description: Position where the pellet is shattered. It is defined as the intersection of the
          trayectory of the pellet center of mass with the shattering element
      shattering_angle:
        range: float
        description: Impact (or grazing) angle of the pellet with the shattering element. It is the complementary
          of the incidence angle with the element surface at the shattering location
        annotations:
          dd_type: constant
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      shatter_cone:
        range: SpiShatterCone
        description: Description of the elliptic shatter cone
      velocity_mass_centre_fragments_r:
        range: float
        description: Major radius component of the velocity of the centre of mass of the fragments at
          the shattering cone origin
        annotations:
          dd_type: constant
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      velocity_mass_centre_fragments_z:
        range: float
        description: Vertical component of the velocity velocity of the centre of mass of the fragments
          at the shattering cone origin
        annotations:
          dd_type: constant
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      velocity_mass_centre_fragments_phi:
        range: float
        description: Toroidal component of the velocity of the centre of mass of the fragments at the
          shattering cone origin
        annotations:
          dd_type: constant
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      fragment:
        range: SpiFragment
        multivalued: true
        description: Set of shattered pellet fragments
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
  SpiOpd:
    is_a: InformationContentEntity
    description: Information related to the embedded optical pellet diagnostic
    annotations:
      dd_type_name: spi_opd
      dd_path: spi/injector/optical_pellet_diagnostic
    attributes:
      position:
        range: Rphiz0dStatic
        description: Position of the measurement
      time_arrival:
        range: float
        multivalued: true
        description: Arrival time at the optical pellet diagnostic, for each object
        annotations:
          dd_type: constant
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
  SpiPellet:
    is_a: InformationContentEntity
    description: Information related to the pellet
    annotations:
      dd_type_name: spi_pellet
      dd_path: spi/injector/pellet
    attributes:
      position:
        range: Rphiz1dDynamicRootTime
        description: Position of the centre of mass of the pellet
      velocity_r:
        range: float
        multivalued: true
        description: Major radius component of the velocity of the centre of mass of the pellet
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      velocity_z:
        range: float
        multivalued: true
        description: Vertical component of the velocity of the centre of mass of the pellet
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      velocity_phi:
        range: float
        multivalued: true
        description: Toroidal component of the velocity of the centre of mass of the pellet
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      velocity_shatter:
        range: float
        description: Norm of the velocity of the centre of mass of the pellet right before shattering
        annotations:
          dd_type: constant
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      diameter:
        range: float
        description: Pellet diameter
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length:
        range: float
        description: Pellet length (cylindrical pellet)
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      shell:
        range: SpiShell
        description: Shell-layer around of the unshattered pellet
      core:
        range: SpiShell
        description: Core of the unshattered pellet
  Rphiz1dDynamicRootTime:
    is_a: InformationContentEntity
    description: Position of the centre of mass of the pellet
    annotations:
      dd_type_name: rphiz1d_dynamic_root_time
      dd_path: spi/injector/pellet/position
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      phi:
        range: float
        multivalued: true
        description: Toroidal angle
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
  SpiShell:
    is_a: InformationContentEntity
    description: Shell-layer around of the unshattered pellet
    annotations:
      dd_type_name: spi_shell
      dd_path: spi/injector/pellet/shell
    attributes:
      species:
        range: SpiSpeciesDensity
        multivalued: true
        description: Atomic species in the shell composition
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      atoms_n:
        range: float
        description: Total number of atoms of desublimated gas
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpiSpeciesDensity:
    is_a: InformationContentEntity
    description: Atomic species in the shell composition
    annotations:
      dd_type_name: spi_species_density
      dd_path: spi/injector/pellet/shell/species
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: constant
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: float
        description: Nuclear charge
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H, D, T, ...)
        annotations:
          dd_type: constant
      density:
        range: float
        description: Density of the species
        annotations:
          dd_type: constant
          dd_units: m^-3
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpiGas:
    is_a: InformationContentEntity
    description: Description of the gas produced during fragmentation
    annotations:
      dd_type_name: spi_gas
      dd_path: spi/injector/fragmentation_gas
    attributes:
      flow_rate:
        range: float
        multivalued: true
        description: Flow rate of the gas at the injector exit
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      species:
        range: SpiSpeciesFraction
        multivalued: true
        description: Atomic species in the gas composition
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      atoms_n:
        range: float
        description: Total number of atoms of the gas
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      temperature:
        range: float
        description: Gas temperature
        annotations:
          dd_type: constant
          dd_units: K
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpiSpeciesFraction:
    is_a: InformationContentEntity
    description: Atomic species in the gas composition
    annotations:
      dd_type_name: spi_species_fraction
      dd_path: spi/injector/fragmentation_gas/species
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: constant
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: float
        description: Nuclear charge
        annotations:
          dd_type: constant
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H, D, T, ...)
        annotations:
          dd_type: constant
      fraction:
        range: float
        description: Atomic fraction of the species
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  Xyz0dConstant:
    is_a: InformationContentEntity
    description: Unit vector of the unshattered pellet velocity direction right before shattering
    annotations:
      dd_type_name: xyz0d_constant
      dd_path: spi/injector/injection_direction
    attributes:
      x:
        range: float
        description: Component along X axis
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      y:
        range: float
        description: Component along Y axis
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        description: Component along Z axis
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpiShatterCone:
    is_a: InformationContentEntity
    description: Description of the elliptic shatter cone
    annotations:
      dd_type_name: spi_shatter_cone
      dd_path: spi/injector/shatter_cone
    attributes:
      direction:
        range: Xyz0dConstant
        description: Unit vector of the cone direction
      origin:
        range: Rphiz0dStatic
        description: Coordinates of the origin of the shatter cone
      unit_vector_major:
        range: Xyz0dStatic
        description: Major unit vector describing the geometry of the elliptic shatter cone
      unit_vector_minor:
        range: Xyz0dStatic
        description: Minor unit vector describing the geometry of the elliptic shatter cone
      angle_major:
        range: float
        description: Angle between the cone direction and unit_vector_major
        annotations:
          dd_type: constant
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      angle_minor:
        range: float
        description: Angle between the cone direction and unit_vector_minor
        annotations:
          dd_type: constant
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpiFragment:
    is_a: InformationContentEntity
    description: Set of shattered pellet fragments
    annotations:
      dd_type_name: spi_fragment
      dd_path: spi/injector/fragment
    attributes:
      position:
        range: Rphiz1dDynamicRootTime
        description: Position of the centre of mass of the pellet
      velocity_r:
        range: float
        multivalued: true
        description: Major radius component of the fragment velocity
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      velocity_z:
        range: float
        multivalued: true
        description: Vertical component of the fragment velocity
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      velocity_phi:
        range: float
        multivalued: true
        description: Toroidal component of the fragment velocity
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      volume:
        range: float
        multivalued: true
        description: Volume of the fragment
        annotations:
          dd_type: dynamic
          dd_units: m^3
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      species:
        range: SpiSpeciesDensity
        multivalued: true
        description: Atomic species in the fragment composition
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
