id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/em_coupling
name: fyo-em_coupling
title: fyo IDS `em_coupling` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `em_coupling` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/em_coupling/dd_em_coupling.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: EmCoupling
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  EmCoupling:
    is_a: IDS
    description: Description of the axisymmetric mutual electromagnetics; does not include non-axisymmetric
      coil systems; the convention is Quantity_Sensor_Source
    annotations:
      dd_path: em_coupling
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      coupling_matrix:
        range: EmCouplingMatrix
        multivalued: true
        description: Set of user-defined coupling matrices, complementary to the other system-based coupling
          matrices of this IDS
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      grid_ggd:
        range: GenericGridConstant
        multivalued: true
        description: Set of grids for use in the coupling_matrix array of structure, described using the
          GGD
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EmCouplingMatrix:
    is_a: InformationContentEntity
    description: Set of user-defined coupling matrices, complementary to the other system-based coupling
      matrices of this IDS
    annotations:
      dd_type_name: em_coupling_matrix
      dd_path: em_coupling/coupling_matrix
    attributes:
      name:
        range: string
        description: Name of this coupling matrix
        annotations:
          dd_type: static
      quantity:
        range: Identifier
        description: Physical quantity obtained following the matrix multiplication of the data node with
          the vector constructed from references contained in the columns_uri node
      rows_uri:
        range: string
        multivalued: true
        description: List of URIs corresponding to the rows (1st dimension) of the coupling matrix. If
          not all indices of a given node are used, they must be listed explicitly e.g. rows_uri(i) =
          pf_active:1/coil(i) will refer to a list of indices of the occurrence 1 of the pf_active IDS
          of this data entry. If the rows correspond to all indices of a given vector, it is sufficient
          to give a insgle uri, the one  of the vector with the impliicit notation (:), e.g. rows_uri(1)
          = /grid_ggd(3)/grid_subset(2)/elements(:).
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      columns_uri:
        range: string
        multivalued: true
        description: List of URIs corresponding to the columns (2nd dimension) of the coupling matrix.
          See examples above (rows_uri)
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      data:
        range: float
        multivalued: true
        description: Coupling matrix
        annotations:
          dd_type: static
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../rows_uri
          dd_coordinate2: ../columns_uri
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../rows_uri,../columns_uri
