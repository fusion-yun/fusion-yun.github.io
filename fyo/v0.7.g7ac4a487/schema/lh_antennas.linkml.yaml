id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/lh_antennas
name: fyo-lh_antennas
title: fyo IDS `lh_antennas` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `lh_antennas` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/lh_antennas/dd_lh_antennas.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: LhAntennas
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  LhAntennas:
    is_a: IDS
    description: Antenna systems for heating and current drive in the Lower Hybrid (LH) frequencies. In
      the definitions below, the front (or mouth) of the antenna refers to the plasma facing side of the
      antenna, while the back refers to the waveguides connected side of the antenna (towards the RF generators).
    annotations:
      dd_path: lh_antennas
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      reference_point:
        range: Rz0dConstant
        description: Reference point used to define the poloidal angle, e.g. the geometrical centre of
          the vacuum vessel. Used to define the poloidal refraction index under antenna/row
      antenna:
        range: LhAntennasAntenna
        multivalued: true
        description: Set of Lower Hybrid antennas
        annotations:
          dd_max_occurs: '2'
          dd_coordinate1: 1...N
      power_launched:
        range: SignalFlt1d
        description: Power launched into the vacuum vessel by the whole LH system (sum over antennas)
        annotations:
          dd_units: W
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  LhAntennasAntenna:
    is_a: InformationContentEntity
    description: Set of Lower Hybrid antennas
    annotations:
      dd_type_name: lh_antennas_antenna
      dd_path: lh_antennas/antenna
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      model_name:
        range: string
        description: Name of the antenna model used for antenna spectrum computation
        annotations:
          dd_type: constant
      frequency:
        range: float
        description: Frequency
        annotations:
          dd_type: static
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_launched:
        range: SignalFlt1d
        description: Power launched from this antenna into the vacuum vessel
        annotations:
          dd_units: W
      power_forward:
        range: SignalFlt1d
        description: Forward power arriving at the back of the antenna
        annotations:
          dd_units: W
      power_reflected:
        range: SignalFlt1d
        description: Reflected power
        annotations:
          dd_units: W
      reflection_coefficient:
        range: SignalFlt1d
        description: Power reflection coefficient, averaged over modules
        annotations:
          dd_units: '1'
      phase_average:
        range: SignalFlt1d
        description: Phase difference between two neighbouring modules (average over modules), at the
          mouth (front) of the antenna
        annotations:
          dd_units: rad
      n_parallel_peak:
        range: SignalFlt1d
        description: Peak parallel refractive index of the launched wave spectrum (simple estimate based
          on the measured phase difference)
        annotations:
          dd_units: '1'
      position:
        range: Rphiz1dDynamicAos1Definition
        description: Position of a reference point on the antenna (allowing also tracking the possible
          movements of the antenna)
      pressure_tank:
        range: SignalFlt1d
        description: Pressure in the vacuum tank of the antenna
        annotations:
          dd_units: Pa
      distance_to_antenna:
        range: float
        multivalued: true
        description: Radial distance to the antenna mouth (grid for the electron density profile). 0 at
          antenna mouth, increasing towards the plasma
        annotations:
          dd_type: constant
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      n_e:
        range: SignalFlt2d
        description: Electron density profile in front of the antenna
        annotations:
          dd_units: m^-3
          dd_coordinate1: ../distance_to_antenna
      module:
        range: LhAntennasAntennaModule
        multivalued: true
        description: Set of antenna modules
        annotations:
          dd_max_occurs: '16'
          dd_coordinate1: 1...N
      row:
        range: LhAntennasAntennaRow
        multivalued: true
        description: Set of horizontal rows of waveguides (corresponding to different poloidal positions).
          A power spectrum is provided for each row.
        annotations:
          dd_max_occurs: '6'
          dd_coordinate1: 1...N
  Rphiz1dDynamicAos1Definition:
    is_a: InformationContentEntity
    description: Position of a reference point on the antenna (allowing also tracking the possible movements
      of the antenna)
    annotations:
      dd_type_name: rphiz1d_dynamic_aos1_definition
      dd_path: lh_antennas/antenna/position
    attributes:
      definition:
        range: string
        description: Definition of the reference point
        annotations:
          dd_type: static
      r:
        range: SignalFlt1d
        description: Major radius
        annotations:
          dd_units: m
      phi:
        range: SignalFlt1d
        description: Toroidal angle (oriented counter-clockwise when viewing from above)
        annotations:
          dd_units: rad
      z:
        range: SignalFlt1d
        description: Height
        annotations:
          dd_units: m
  LhAntennasAntennaModule:
    is_a: InformationContentEntity
    description: Set of antenna modules
    annotations:
      dd_type_name: lh_antennas_antenna_module
      dd_path: lh_antennas/antenna/module
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “Top module”
        annotations:
          dd_type: static
      power_launched:
        range: SignalFlt1d
        description: Power launched from this module into the vacuum vessel
        annotations:
          dd_units: W
      power_forward:
        range: SignalFlt1d
        description: Forward power arriving to the back of the module
        annotations:
          dd_units: W
      power_reflected:
        range: SignalFlt1d
        description: Reflected power
        annotations:
          dd_units: W
      reflection_coefficient:
        range: SignalFlt1d
        description: Power reflection coefficient
        annotations:
          dd_units: '1'
      phase:
        range: SignalFlt1d
        description: Phase of the forward power arriving at the back of this module
        annotations:
          dd_units: rad
  LhAntennasAntennaRow:
    is_a: InformationContentEntity
    description: Set of horizontal rows of waveguides (corresponding to different poloidal positions).
      A power spectrum is provided for each row.
    annotations:
      dd_type_name: lh_antennas_antenna_row
      dd_path: lh_antennas/antenna/row
    attributes:
      name:
        range: string
        description: Name of the row
        annotations:
          dd_type: static
      position:
        range: Rphiz1dDynamicAos1CommonTime
        description: Position of the middle on the row
      n_phi:
        range: float
        multivalued: true
        description: Refraction index in the toroidal direction
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      n_pol:
        range: float
        multivalued: true
        description: Refraction index in the poloidal direction. The poloidal angle is defined from the
          reference point; the angle at a point (R,Z) is given by atan((Z-Zref)/(R-Rref)), where Rref=reference_point/r
          and Zref=reference_point/z
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_density_spectrum_1d:
        range: float
        multivalued: true
        description: 1D power density spectrum dP/dn_phi, as a function of time
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 2
          dd_coordinate1: ../n_phi
          dd_coordinate2: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../n_phi,../time
      power_density_spectrum_2d:
        range: float
        multivalued: true
        description: 2D power density spectrum d2P/(dn_tor.dn_pol), as a function of time
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 3
          dd_coordinate1: ../n_phi
          dd_coordinate2: ../n_pol
          dd_coordinate3: ../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../n_phi,../n_pol,../time
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes of this probe located at this level of the IDS structure
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
