          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      material:
        range: WallDescriptionGgdMaterial
        multivalued: true
        description: Material of each grid_ggd object, given for each slice of the grid_ggd time base
          (the material is not supposed to change, but grid_ggd may evolve with time)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      component:
        range: WallDescriptionGgdComponent
        multivalued: true
