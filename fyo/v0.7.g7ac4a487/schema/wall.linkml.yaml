    is_a: InformationContentEntity
    description: Total current density, given on various grid subsets
    annotations:
      dd_type_name: generic_grid_vector_components_rphiz
      dd_path: wall/description_ggd/ggd/j_total
    attributes:
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: 'Index of the grid subset the data is provided on. Corresponds to the index used
          in the grid subset definition: grid_subset(:)/identifier/index'
        annotations:
          dd_type: dynamic
      r:
        range: float
        multivalued: true
        description: Component along the major radius axis, one scalar value is provided per element in
          the grid subset.
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      r_coefficients:
        range: float
        multivalued: true
        description: Interpolation coefficients for the component along the major radius axis, to be used
          for a high precision evaluation of the physical quantity with finite elements, provided per
          element in the grid subset (first dimension).
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      phi:
        range: float
        multivalued: true
        description: Toroidal component, one scalar value is provided per element in the grid subset.
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../r
      phi_coefficients:
        range: float
        multivalued: true
        description: Interpolation coefficients for the toroidal component, to be used for a high precision
          evaluation of the physical quantity with finite elements, provided per element in the grid subset
          (first dimension).
