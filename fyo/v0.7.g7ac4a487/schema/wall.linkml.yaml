          a thin wall description'
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Wall geometry described using the Generic Grid Description, for various time slices
          (in case of mobile wall elements). The timebase of this array of structure must be a subset
          of the timebase on which physical quantities are described (../ggd structure). Grid_subsets
          are used to describe various  wall components in a modular way.
