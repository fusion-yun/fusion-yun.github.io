          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      thickness:
        range: WallDescriptionGgdThickness
        multivalued: true
        description: In the case of a thin wall description, effective thickness of each surface element
          of grid_ggd, given for each slice of the grid_ggd time base (the thickness is not supposed to
          change, but grid_ggd may evolve with time)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      brdf:
        range: WallDescriptionGgdBrdf
        multivalued: true
        description: Bidirectional Reflectance Distribution Function, given for each slice of the grid_ggd
          time base (the component description is not supposed to change, but grid_ggd may evolve with
          time)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: WallDescriptionGgdGgd
        multivalued: true
        description: Wall physics quantities represented using the general grid description, for various
          time slices.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  WallDescriptionGgdMaterial:
