  WallDescriptionGgdGgd:
    is_a: TimeSlice
    description: Wall physics quantities represented using the general grid description, for various time
      slices.
    annotations:
      dd_type_name: wall_description_ggd_ggd
      dd_path: wall/description_ggd/ggd
      fyo_lift: time_slice
    attributes:
      power_density:
        range: GenericGridScalar
        multivalued: true
        description: Net power density arriving on the wall surface, for various wall components (grid
          subsets)
        annotations:
          dd_units: W.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      temperature:
        range: GenericGridScalar
        multivalued: true
        description: Temperature of the wall, for various wall components (grid subsets)
        annotations:
          dd_units: K
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      v_biasing:
        range: GenericGridScalar
        multivalued: true
        description: Electric potential applied to the wall element by outside means, for various wall
          components (grid subsets). Different from the plasma electric potential or the sheath potential
          drop.
        annotations:
          dd_units: V
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      recycling:
        range: WallDescriptionGgdRecycling
        description: Fraction of incoming particles that is reflected back to the vacuum chamber
      particle_fluxes:
        range: WallDescriptionGgdParticle
        description: Particle fluxes. The incident and emitted components are distinguished. The net flux
          received by the wall is equal to incident - emitted
      energy_fluxes:
        range: WallDescriptionGgdEnergy
        description: Energy fluxes. The incident and emitted components are distinguished. The net flux
          received by the wall is equal to incident - emitted
      j_total:
        range: GenericGridVectorComponentsRphiz
        multivalued: true
        description: Total current density, given on various grid subsets
        annotations:
          dd_units: A.m^-2
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      b_field:
        range: GenericGridVectorComponentsRphiz
        multivalued: true
        description: Magnetic field, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      em_force_density:
        range: GenericGridVectorComponentsRphiz
        multivalued: true
        description: Electromagnetic force density computed by the cross-product of j_total x b_field
          and given on various grid subsets
        annotations:
          dd_units: N.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      e_field:
        range: GenericGridVectorComponentsRphiz
        multivalued: true
        description: Electric field, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      a_field:
        range: GenericGridVectorComponentsRphiz
        multivalued: true
        description: Magnetic vector potential, given on various grid subsets
        annotations:
          dd_units: T.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      psi:
        range: GenericGridScalar
        multivalued: true
        description: Poloidal flux, given on various grid subsets
        annotations:
          dd_units: Wb
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      phi_potential:
        range: GenericGridScalar
        multivalued: true
        description: Electric potential, given on various grid subsets
        annotations:
          dd_units: V
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      resistivity:
        range: GenericGridScalar
        multivalued: true
        description: Resistivity, given on various grid subsets
        annotations:
          dd_units: ohm.m
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
