id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/wall
name: fyo-wall
title: fyo IDS `wall` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `wall` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/wall/dd_wall.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: Wall
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Wall:
    is_a: IDS
    description: Description of the torus wall and its interaction with the plasma
    annotations:
      dd_path: wall
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      temperature_reference:
        range: TemperatureReference
        description: Reference temperature for which the machine description data is given in this IDS
      first_wall_surface_area:
        range: float
        description: First wall surface area
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      first_wall_power_flux_peak:
        range: SignalFlt1d
        description: Peak power flux on the first wall (including divertors)
        annotations:
          dd_units: W.m^-2
      first_wall_power_flux_peak_outside_divertors:
        range: SignalFlt1d
        description: Peak power flux on the first wall (excluding the divertors surface)
        annotations:
          dd_units: W.m^-2
      first_wall_enclosed_volume:
        range: float
        description: Volume available to gas or plasma enclosed by the first wall contour
        annotations:
          dd_type: static
          dd_units: m^3
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      global_quantities:
        range: WallGlobalQuantitites
        description: Simple 0D description of plasma-wall interaction
      description_2d:
        range: Wall2d
        multivalued: true
        description: Set of 2D wall descriptions, for each type of possible physics or engineering configurations
          necessary (gas tight vs wall with ports and holes, coarse vs fine representation, single contour
          limiter, disjoint gapped plasma facing components, ...). A simplified description of the toroidal
          extension of the 2D contours is also provided by using the phi_extensions nodes.
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      description_ggd:
        range: WallDescriptionGgd
        multivalued: true
        description: Set of 3D wall descriptions, described using the GGD, for each type of possible physics
          or engineering configurations necessary (gas tight vs wall with ports and holes, coarse vs fine
          representation, ...).
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  TemperatureReference:
    is_a: InformationContentEntity
    description: Reference temperature for which the machine description data is given in this IDS
    annotations:
      dd_type_name: temperature_reference
      dd_path: wall/temperature_reference
    attributes:
      description:
        range: string
        description: 'Description of how the reference temperature is defined : for which object, at which
          location, ...'
        annotations:
          dd_type: static
      data:
        range: float
        description: Reference temperature
        annotations:
          dd_type: static
          dd_units: K
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  WallGlobalQuantitites:
    is_a: InformationContentEntity
    description: Simple 0D description of plasma-wall interaction
    annotations:
      dd_type_name: wall_global_quantitites
      dd_path: wall/global_quantities
    attributes:
      electrons:
        range: WallGlobalQuantititesElectrons
        description: Quantities related to electrons
      neutral:
        range: WallGlobalQuantititesNeutral
        multivalued: true
        description: Quantities related to the various neutral species
        annotations:
          dd_max_occurs: '12'
          dd_coordinate1: 1...N
      temperature:
        range: float
        multivalued: true
        description: Wall temperature
        annotations:
          dd_type: dynamic
          dd_units: K
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_incident:
        range: float
        multivalued: true
        description: Total power incident on the wall. This power is split in the various physical categories
          listed below
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_conducted:
        range: float
        multivalued: true
        description: Power conducted by the plasma onto the wall
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_convected:
        range: float
        multivalued: true
        description: Power convected by the plasma onto the wall
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_radiated:
        range: float
        multivalued: true
        description: Net radiated power from plasma onto the wall (incident-reflected)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_black_body:
        range: float
        multivalued: true
        description: Black body radiated power emitted from the wall (emissivity is included)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_neutrals:
        range: float
        multivalued: true
        description: Net power from neutrals on the wall  (positive means power is deposited on the wall)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_recombination_plasma:
        range: float
        multivalued: true
        description: Power deposited on the wall due to recombination of plasma ions
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_recombination_neutrals:
        range: float
        multivalued: true
        description: Power deposited on the wall due to recombination of neutrals into a ground state
          (e.g. molecules)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_currents:
        range: float
        multivalued: true
        description: Power deposited on the wall due to electric currents (positive means power is deposited
          on the target)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_to_cooling:
        range: float
        multivalued: true
        description: Power to cooling systems
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_inner_target_ion_total:
        range: float
        multivalued: true
        description: Total ion (summed over ion species) power on the inner target
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_density_inner_target_max:
        range: float
        multivalued: true
        description: Maximum power density on the inner target
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_density_outer_target_max:
        range: float
        multivalued: true
        description: Maximum power density on the outer target
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      current_phi:
        range: float
        multivalued: true
        description: Toroidal current flowing in the vacuum vessel
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  WallGlobalQuantititesElectrons:
    is_a: InformationContentEntity
    description: Quantities related to electrons
    annotations:
      dd_type_name: wall_global_quantitites_electrons
      dd_path: wall/global_quantities/electrons
    attributes:
      pumping_speed:
        range: float
        multivalued: true
        description: Pumped particle flux (in equivalent electrons)
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../time
          spo_class: spo:Signal
          fyo_lift: signal
      particle_flux_from_plasma:
        range: float
        multivalued: true
        description: Particle flux from the plasma (in equivalent electrons)
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../time
          spo_class: spo:Signal
          fyo_lift: signal
      particle_flux_from_wall:
        range: float
        multivalued: true
        description: 'Particle flux from the wall corresponding to the conversion into various neutral
          types (first dimension: 1: cold; 2: thermal; 3: fast), in equivalent electrons'
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: ../../../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,../../../time
      gas_puff:
        range: float
        multivalued: true
        description: Gas puff rate (in equivalent electrons)
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_inner_target:
        range: float
        multivalued: true
        description: Electron power on the inner target
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_outer_target:
        range: float
        multivalued: true
        description: Electron power on the inner target
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../../time
          spo_class: spo:Signal
          fyo_lift: signal
  WallGlobalQuantititesNeutral:
    is_a: InformationContentEntity
    description: Quantities related to the various neutral species
    annotations:
      dd_type_name: wall_global_quantitites_neutral
      dd_path: wall/global_quantities/neutral
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying the species (e.g. H, D, CD4, ...)
        annotations:
          dd_type: constant
      pumping_speed:
        range: float
        multivalued: true
        description: Pumped particle flux for that species
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      particle_flux_from_plasma:
        range: float
        multivalued: true
        description: Particle flux from the plasma for that species
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      particle_flux_from_wall:
        range: float
        multivalued: true
        description: 'Particle flux from the wall corresponding to the conversion into various neutral
          types (first dimension: 1: cold; 2: thermal; 3: fast)'
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,/time
      gas_puff:
        range: float
        multivalued: true
        description: Gas puff rate for that species
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      wall_inventory:
        range: float
        multivalued: true
        description: Wall inventory, i.e. cumulated exchange of neutral species between plasma and wall
          from t = 0, positive if a species has gone to the wall, for that species
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      recycling_particles_coefficient:
        range: float
        multivalued: true
        description: 'Particle recycling coefficient corresponding to the conversion into various neutral
          types (first dimension: 1: cold; 2: thermal; 3: fast)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,/time
      recycling_energy_coefficient:
        range: float
        multivalued: true
        description: 'Energy recycling coefficient corresponding to the conversion into various neutral
          types (first dimension: 1: cold; 2: thermal; 3: fast)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,/time
      incident_species:
        range: WallGlobalQuantititesNeutralOrigin
        multivalued: true
        description: Sputtering coefficients due to a set of incident species
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
  WallGlobalQuantititesNeutralOrigin:
    is_a: InformationContentEntity
    description: Sputtering coefficients due to a set of incident species
    annotations:
      dd_type_name: wall_global_quantitites_neutral_origin
      dd_path: wall/global_quantities/neutral/incident_species
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the atom or molecule of the incident species
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying the incident species (e.g. H, D, CD4, ...)
        annotations:
          dd_type: constant
      angles:
        range: float
        multivalued: true
        description: Array of incident angles of this incident species, on which the physical sputtering
          coefficient is tabulated
        annotations:
          dd_type: constant
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      energies:
        range: float
        multivalued: true
        description: Array of energies of this incident species, on which the physical sputtering coefficient
          is tabulated
        annotations:
          dd_type: constant
          dd_units: eV
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      sputtering_physical:
        range: float
        multivalued: true
        description: Effective coefficient of physical sputtering due to this incident species. It is
          assumed that all sputtered neutrals from the wall have the wall temperature (cold neutrals)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 3
          dd_coordinate1: ../angles
          dd_coordinate2: ../energies
          dd_coordinate3: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../angles,../energies,/time
      sputtering_chemical:
        range: float
        multivalued: true
        description: Effective coefficient of chemical sputtering due to this incident species. It is
          assumed that all sputtered neutrals from the wall have the wall temperature (cold neutrals)
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: /time
          spo_class: spo:Signal
          fyo_lift: signal
      sputtering_physical_coefficient:
        range: float
        multivalued: true
        description: 'Effective coefficient of physical sputtering for various neutral types (first dimension:
          1: cold; 2: thermal; 3: fast), due to this incident species and for various energies (second
          dimension)'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 3
          dd_coordinate1: 1...3
          dd_coordinate2: ../energies
          dd_coordinate3: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,../energies,/time
      sputtering_chemical_coefficient:
        range: float
        multivalued: true
        description: 'Effective coefficient of chemical sputtering for various neutral types (first dimension:
          1: cold; 2: thermal; 3: fast), due to this incident species'
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: /time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,/time
  Wall2d:
    is_a: InformationContentEntity
    description: Set of 2D wall descriptions, for each type of possible physics or engineering configurations
      necessary (gas tight vs wall with ports and holes, coarse vs fine representation, single contour
      limiter, disjoint gapped plasma facing components, ...). A simplified description of the toroidal
      extension of the 2D contours is also provided by using the phi_extensions nodes.
    annotations:
      dd_type_name: wall_2d
      dd_path: wall/description_2d
    attributes:
      type:
        range: Identifier
        description: Type of the description
      limiter:
        range: Wall2dLimiter
        description: Description of the immobile limiting surface(s) or plasma facing components for defining
          the Last Closed Flux Surface.
      mobile:
        range: Wall2dMobile
        description: In case of mobile plasma facing components, use the time-dependent description below
          this node to provide the full outline of the closest PFC surfaces to the plasma. Even in such
          a case, the 'limiter' structure is still used to provide the outermost limiting surface (can
          be used e.g. to define the boundary of the mesh of equilibrium reconstruction codes)
      vessel:
        range: Vessel2d
        description: 'Mechanical structure of the vacuum vessel. The vessel is described as a set of nested
          layers with given physics properties; Two representations are admitted for each vessel unit
          : annular (two contours) or block elements.'
  Wall2dLimiter:
    is_a: InformationContentEntity
    description: Description of the immobile limiting surface(s) or plasma facing components for defining
      the Last Closed Flux Surface.
    annotations:
      dd_type_name: wall_2d_limiter
      dd_path: wall/description_2d/limiter
    attributes:
      type:
        range: Identifier
        description: Type of the limiter description. index = 0 for the official single contour limiter
          and 1 for the official disjoint PFC structure like first wall. Additional representations needed
          on a code-by-code basis follow same incremental pair tagging starting on index =2
      unit:
        range: Wall2dLimiterUnit
        multivalued: true
        description: Set of limiter units. Whenever relevant, multiple units should be ordered so that
          they define contiguous sections, clockwise in the poloidal direction.
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: 1...N
  Wall2dLimiterUnit:
    is_a: InformationContentEntity
    description: Set of limiter units. Whenever relevant, multiple units should be ordered so that they
      define contiguous sections, clockwise in the poloidal direction.
    annotations:
      dd_type_name: wall_2d_limiter_unit
      dd_path: wall/description_2d/limiter/unit
    attributes:
      name:
        range: string
        description: 'Short string identifier (unique for a given device). Although the details may be
          machine-specific, a tree-like syntax must be followed, listing first top level components, then
          going down to finer element description. The tree levels are separated by a /, using a number
          of levels relevant to the granularity of the description. Example : ic_antenna/a1/bumpers refers
          to the bumpers of the a1 IC antenna'
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      component_type:
        range: Identifier
        description: Type of component of this unit
      outline:
        range: Rz1dStatic
        description: Irregular outline of the limiting surface. Repeat the first point in case of a closed
          contour
      phi_extensions:
        range: float
        multivalued: true
        description: Simplified description of toroidal angle extensions of the unit, by a list of zones
          defined by their centre and full width (in toroidal angle).  In each of these zones, the unit
          outline remains the same. Leave this node empty for an axisymmetric unit. The first dimension
          gives the centre and full width toroidal angle values for the unit. The second dimension represents
          the toroidal occurrences of the unit countour (i.e. the number of toroidal zones).
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,1...N
      resistivity:
        range: float
        description: Resistivity of the limiter unit
        annotations:
          dd_type: static
          dd_units: ohm.m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      midplane_thickness:
        range: float
        description: Thickness of this unit evaluated at the midplane (whenever relevant)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      midplane_power_density_nuclear:
        range: SignalFlt1d
        description: Nuclear power density heating this unit evaluated at the midplane (whenever relevant)
        annotations:
          dd_units: W.m^-3
      power_nuclear:
        range: SignalFlt1d
        description: Nuclear power heating this unit
        annotations:
          dd_units: W
  Wall2dMobile:
    is_a: InformationContentEntity
    description: In case of mobile plasma facing components, use the time-dependent description below
      this node to provide the full outline of the closest PFC surfaces to the plasma. Even in such a
      case, the 'limiter' structure is still used to provide the outermost limiting surface (can be used
      e.g. to define the boundary of the mesh of equilibrium reconstruction codes)
    annotations:
      dd_type_name: wall_2d_mobile
      dd_path: wall/description_2d/mobile
    attributes:
      type:
        range: Identifier
        description: Type of the description
      unit:
        range: Wall2dMobileUnit
        multivalued: true
        description: Set of mobile units
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
  Wall2dMobileUnit:
    is_a: InformationContentEntity
    description: Set of mobile units
    annotations:
      dd_type_name: wall_2d_mobile_unit
      dd_path: wall/description_2d/mobile/unit
    attributes:
      name:
        range: string
        description: Name of the mobile unit
        annotations:
          dd_type: static
      outline:
        range: Rz1dDynamicAosTime
        multivalued: true
        description: Irregular outline of the mobile unit, for a set of time slices. Repeat the first
          point in case of a closed contour
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      phi_extensions:
        range: float
        multivalued: true
        description: Simplified description of toroidal angle extensions of the unit, by a list of zones
          defined by their centre and full width (in toroidal angle).  In each of these zones, the unit
          outline remains the same. Leave this node empty for an axisymmetric unit. The first dimension
          gives the centre and full width toroidal angle values for the unit. The second dimension represents
          the toroidal occurrences of the unit countour (i.e. the number of toroidal zones).
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,1...N
      resistivity:
