# SPDX-License-Identifier: Apache-2.0
# Scenario S-10 — discharge operation design (放电运行设计).
# Source: FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-10; R109 axes: control / engineering.
id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/scenario/discharge_design
name: fyo-scenario-discharge-design
title: "Fyo Scenario S-10 — Discharge Operation Design (放电运行设计)"
description: >-
  Ontology of the S-10 application-task scenario: FEEDFORWARD discharge operation design —
  pre-shot trajectory and pulse design over the full discharge sequence (breakdown → ramp-up →
  flat-top → ramp-down → termination) by control-vector-parameterization (CVP) optimization,
  verified against per-channel engineering limits (FYTOK-ADR-119 D4). Its principal product is
  a pulse schedule: a DIRECTIVE information artifact prescribing a future Discharge.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-scenario
annotations:
  fyo_module: scenario/discharge_design
  conops_scenario: S-10
  r109_axis: control, engineering
  conops_ref: "FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-10; FYTOK-ADR-119 D4 (engineering-limit layer); needs FYTOK-SRS-01 FR-ENG-001 + FYTOK-SRS-12 S10-FR-LIM-*"
  maturity: "◐/— — ramp-up segment working; pulse design stubbed, coverage ends at ramp-up–flat-top; limit layer as-built is one scalar cap, per-channel limit set open (gap G-B4), informative"

slots:

  checked_against:
    description: >-
      The engineering-limit set this design run verifies its candidate trajectories against —
      limit verification is part of the task's FUNCTION, not an afterthought (a design that
      the coil set and power supplies cannot realize without exceeding limits is not a
      design).
    range: EngineeringLimitSet

classes:

  DischargeOperationDesignTask:
    is_a: ApplicationTask
    description: >-
      A discharge-operation design run (S-10). FUNCTION: before the experiment, optimize the
      feedforward actuator trajectory over the WHOLE discharge time sequence — breakdown,
      ramp-up, flat-top, ramp-down, termination — as a control-vector-parameterization (CVP)
      problem over the shared forward kernel, while verifying that every candidate stays
      within the per-channel engineering limits (per-coil current / voltage / stored energy /
      temperature rise / forces / wall heat load). Direction: feedforward / pre-shot;
      free variables are the actuator waveforms u(t) over the full pulse. Distinct from S-9
      by the absence of feedback: nothing reacts, everything is planned. The pulse-schedule
      OUTPUT is directive — it PRESCRIBES a future Discharge (the discharge realizes it),
      unlike the descriptive outputs of S-7/S-8.
    slots:
      - has_part               # parts: ScenarioLoop forward evaluations per candidate
      - checked_against
      - port_runs              # wall / thermal engineering quantities via ports where single-direction
    attributes:
      design_targets:
        range: InformationContentEntity
        description: >-
          INPUT — the discharge design goals (target plasma current / shape / density /
          stored-energy waypoints, flat-top duration, …) the trajectory must reach.
        annotations:
          io: input
      machine_description:
        range: MachineDescription
        description: INPUT — static machine description (coil set, circuits, power supplies, wall) the design must be realizable on.
        annotations:
          io: input
      initial_guess:
        range: IDS
        description: INPUT (optional) — an initial pulse-schedule guess (e.g. a scaled reference shot) seeding the optimization.
        annotations:
          io: input
          fyo_ids: pulse_schedule
      designed_pulse_schedule:
        range: IDS
        description: >-
          OUTPUT (principal) — the designed feedforward pulse schedule: reference waveforms /
          setpoints for all actuators over the full discharge. A directive ICE
          (spo PlanSpecification nature): the future Discharge realizes it.
        annotations:
          io: output
          fyo_ids: pulse_schedule
          directive: "true"
      predicted_trajectory:
        range: IDS
        multivalued: true
        description: >-
          OUTPUT — the predicted plasma trajectory under the designed schedule (equilibrium +
          profiles over the pulse); modality simulated; the evidence the design decision rests
          on.
        annotations:
          io: output
          fyo_ids: equilibrium, core_profiles, summary
      limit_verification_report:
        range: InformationContentEntity
        description: >-
          OUTPUT — the engineering-limit verification report: per-channel margins of the
          designed trajectory against the EngineeringLimitSet (which limit, where in the
          pulse, how close).
        annotations:
          io: output
    annotations:
      conops_scenario: S-10
      free_variables_note: "free = actuator waveforms u(t) over the full pulse (feedforward); fixed = machine, targets, limits"

  EngineeringLimitSet:
    is_a: InformationContentEntity
    description: >-
      The per-channel engineering operating-limit set of a Machine — per-coil current /
      voltage / stored energy / temperature rise / force limits, wall heat-load limits — the
      in-scope engineering face of the in/port/out boundary (limits are IN; whole-machine
      design is via ports; cost and buildings are OUT — FYTOK-ADR-119 D3/D4). About the
      machine (is_about); consumed by S-10 verification and S-11 feasibility screening.
    annotations:
      adr_ref: "FYTOK-ADR-119 D4"
