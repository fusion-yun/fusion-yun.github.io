# Scenario S-11 — device parameter optimization (装置参数优化).
# Source: FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-11; R109 axes: engineering / framework.
id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/scenario/device_optimization
name: fyo-scenario-device-optimization
title: "Fyo Scenario S-11 — Device Parameter Optimization (装置参数优化)"
description: >-
  Ontology of the S-11 application-task scenario: steady-state DESIGN-SPACE SEARCH over static
  device / configuration parameters θ_dev (coil currents, geometry, heating mix) — the design
  phase of the device lifecycle, where the machine itself is what is free. Whole-machine
  engineering quantities (system-code design point / CAD / neutronics) participate through
  engineering ports (FYTOK-ADR-119 D3/D6; contract per FYTOK-ADR-126, first landed port =
  neutronics), never in-repo. Its principal product is a candidate design — a DIRECTIVE
  DesignSpecification prescribing a Machine that may not yet exist.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-scenario
annotations:
  fyo_module: scenario/device_optimization
  conops_scenario: S-11
  r109_axis: engineering, framework
  conops_ref: "FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-11; FYTOK-ADR-119 D3/D6 + FYTOK-ADR-126 (port contract); needs FYTOK-SRS-01 FR-ENG-002 + FYTOK-SRS-12 S11-FR-ENG-1"
  maturity: "◐ — static coil inverse solve (Tikhonov) working; no outer optimizer / batch-scan executor (gaps G-B5 / G-C1); port contract fixed by ADR-126, implementation prospective, informative"

classes:

  DeviceParameterOptimizationTask:
    is_a: ApplicationTask
    description: >-
      A device-parameter optimization run (S-11). FUNCTION: search a declared design space of
      static device / configuration parameters θ_dev — coil currents and positions, geometry,
      heating mix — under steady-state or parameter-scan evaluation of the shared forward
      kernel, screening candidates for physics performance (target operating point reached)
      and engineering feasibility (limits, port-evaluated whole-machine quantities), and
      ranking them against declared objectives. Direction: outer search over designs; each
      candidate evaluation is a forward run (S-7-shaped) at fixed θ_dev. What is free here is
      the MACHINE ITSELF (design-phase lifecycle: the physical counterpart may not yet exist —
      design work counts as twin work from the start). Whole-machine engineering quantities
      enter ONLY via EngineeringPortRun (in/port/out boundary); the candidate-design OUTPUT is
      directive — a DesignSpecification prescribing a Machine, the as-designed stance, not a
      description of any existing device.
    slots:
      - has_part               # parts: per-candidate forward evaluations (ScenarioLoop runs)
      - port_runs              # neutronics first; later tritium / heat-and-net-electric / system-code
    attributes:
      design_space:
        range: DesignSpaceSpecification
        description: INPUT — the declared design space (which parameters are free, their bounds and couplings).
        annotations:
          io: input
      objectives:
        range: InformationContentEntity
        description: >-
          INPUT — the optimization objectives / figures of merit (target operating point,
          performance measures, margins) candidates are ranked by.
        annotations:
          io: input
      reference_design:
        range: MachineDescription
        description: >-
          INPUT (optional) — a reference machine description the search starts from or is
          constrained around (retrofit / variation studies on an existing device).
        annotations:
          io: input
      engineering_limits:
        range: InformationContentEntity
        description: >-
          INPUT — the engineering-limit set used for feasibility screening (shared with S-10;
          see EngineeringLimitSet in the discharge_design module).
        annotations:
          io: input
      candidate_design:
        range: DesignSpecification
        description: >-
          OUTPUT (principal) — the selected / optimized device parameter set as a DIRECTIVE
          design specification (as-designed stance: it prescribes a Machine — which may not
          yet exist — and is truth-evaluated by nothing; the later as-built description may
          disagree with it).
        annotations:
          io: output
          directive: "true"
      operating_point_evaluations:
        range: IDS
        multivalued: true
        description: >-
          OUTPUT — the evaluated operating points of surviving candidates (equilibrium +
          profiles + global performance summary per candidate); modality simulated; the
          evidence base of the ranking.
        annotations:
          io: output
          fyo_ids: equilibrium, core_profiles, summary
      engineering_evaluations:
        range: IDS
        multivalued: true
        description: >-
          OUTPUT — port-evaluated whole-machine engineering quantities of candidates
          (first port: neutronics — source from fusion source terms, geometry from wall / coil
          carriers), landed in existing DD carriers per the ADR-126 contract.
        annotations:
          io: output
          fyo_ids: wall, breeding_blanket, balance_of_plant
    annotations:
      conops_scenario: S-11
      free_variables_note: "free = static device / configuration parameters θ_dev (+ per-candidate operating point); the machine itself is the unknown"

  DesignSpaceSpecification:
    is_a: InformationContentEntity
    description: >-
      The declared design space of an S-11 search: which device / configuration parameters are
      free, their bounds, discretization and couplings — a declared modeling decision (like
      convergence criteria), not an optimizer internal.
    attributes:
      parameters:
        multivalued: true
        description: The free design parameter names (e.g. coil currents, major radius, elongation, heating mix).
