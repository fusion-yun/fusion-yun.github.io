id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/disruption
name: fyo-disruption
title: fyo IDS `disruption` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `disruption` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/disruption/dd_disruption.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Disruption
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Disruption:
    is_a: IDS
    description: Description of physics quantities of specific interest during a disruption, in particular
      halo currents, etc ...
    annotations:
      dd_path: disruption
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      global_quantities:
        range: DisruptionGlobalQuantities
        description: Global quantities
      halo_currents:
        range: DisruptionHaloCurrents
        multivalued: true
        description: Halo currents geometry and values for a set of time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_1d:
        range: DisruptionProfiles1d
        multivalued: true
        description: Radial profiles for a set of time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  DisruptionGlobalQuantities:
    is_a: InformationContentEntity
    description: Global quantities
    annotations:
      dd_type_name: disruption_global_quantities
      dd_path: disruption/global_quantities
    attributes:
      current_halo_pol:
        range: float
        multivalued: true
        description: Poloidal halo current
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      current_halo_phi:
        range: float
        multivalued: true
        description: Toroidal halo current
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_ohm:
        range: float
        multivalued: true
        description: Total ohmic power
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_ohm_halo:
        range: float
        multivalued: true
        description: Ohmic power in the halo region
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_parallel_halo:
        range: float
        multivalued: true
        description: Power of the parallel heat flux in the halo region
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_radiated_electrons_impurities:
        range: float
        multivalued: true
        description: Total power radiated by electrons on impurities
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      power_radiated_electrons_impurities_halo:
        range: float
        multivalued: true
        description: Power radiated by electrons on impurities in the halo region
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_ohm:
        range: float
        multivalued: true
        description: Total ohmic cumulated energy (integral of the power over the disruption duration)
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_ohm_halo:
        range: float
        multivalued: true
        description: Ohmic cumulated energy (integral of the power over the disruption duration) in the
          halo region
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_parallel_halo:
        range: float
        multivalued: true
        description: Cumulated parallel energy (integral of the heat flux parallel power over the disruption
          duration) in the halo region
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_radiated_electrons_impurities:
        range: float
        multivalued: true
        description: Total cumulated energy (integral of the power over the disruption duration) radiated
          by electrons on impurities
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      energy_radiated_electrons_impurities_halo:
        range: float
        multivalued: true
        description: Cumulated energy (integral of the power over the disruption duration) radiated by
          electrons on impurities in the halo region
        annotations:
          dd_type: dynamic
          dd_units: J
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      psi_halo_boundary:
        range: float
        multivalued: true
        description: Poloidal flux at halo region boundary
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      phi_halo_boundary:
        range: float
        multivalued: true
        description: Toroidal flux at halo region boundary
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      phi_halo_boundary_poloidal_current:
        range: float
        multivalued: true
        description: Toroidal flux at halo region boundary generated by the plasma poloidal current
        annotations:
          dd_type: dynamic
          dd_units: Wb
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  DisruptionHaloCurrents:
    is_a: TimeSlice
    description: Halo currents geometry and values for a set of time slices
    annotations:
      dd_type_name: disruption_halo_currents
      dd_path: disruption/halo_currents
      fyo_lift: time_slice
    attributes:
      area:
        range: DisruptionHaloCurrentsArea
        multivalued: true
        description: Set of wall areas through which there are halo currents
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      active_wall_point:
        range: Rz0dDynamicAos
        description: R,Z position of the point of the plasma boundary in contact with the wall
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DisruptionHaloCurrentsArea:
    is_a: InformationContentEntity
    description: Set of wall areas through which there are halo currents
    annotations:
      dd_type_name: disruption_halo_currents_area
      dd_path: disruption/halo_currents/area
    attributes:
      start_point:
        range: Rz0dDynamicAos
        description: Position of the start point of this area
      end_point:
        range: Rz0dDynamicAos
        description: Position of the end point of this area
      current_halo_pol:
        range: float
        description: Poloidal halo current crossing through this area
        annotations:
          dd_type: dynamic
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  DisruptionProfiles1d:
    is_a: TimeSlice
    description: Radial profiles for a set of time slices
    annotations:
      dd_type_name: disruption_profiles_1d
      dd_path: disruption/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      j_runaways:
        range: float
        multivalued: true
        description: Runaways parallel current density = average(j.B) / B0, where B0 = Disruption/Vacuum_Toroidal_Field/
          B0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      power_density_conductive_losses:
        range: float
        multivalued: true
        description: Power density of conductive losses to the wall (positive sign for losses)
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      power_density_radiative_losses:
        range: float
        multivalued: true
        description: Power density of radiative losses (positive sign for losses)
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
