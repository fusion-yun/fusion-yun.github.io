id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/spectrometer_uv
name: fyo-spectrometer_uv
title: fyo IDS `spectrometer_uv` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `spectrometer_uv` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/spectrometer_uv/dd_spectrometer_uv.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: SpectrometerUv
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  SpectrometerUv:
    is_a: IDS
    description: Spectrometer in uv light range diagnostic
    annotations:
      dd_path: spectrometer_uv
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      etendue:
        range: float
        description: Etendue (geometric extent) of the optical system
        annotations:
          dd_type: static
          dd_units: m^2.sr
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      etendue_method:
        range: Identifier
        description: 'Method used to calculate the etendue. Index = 0 : exact calculation with a 4D integral;
          1 : approximation with first order formula (detector surface times solid angle subtended by
          the apertures); 2 : other methods'
      channel:
        range: SpectroUvChannel
        multivalued: true
        description: Set of channels (detector or pixel of a camera)
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpectroUvChannel:
    is_a: InformationContentEntity
    description: Set of channels (detector or pixel of a camera)
    annotations:
      dd_type_name: spectro_uv_channel
      dd_path: spectrometer_uv/channel
    attributes:
      name:
        range: string
        description: Name of the channel
        annotations:
          dd_type: static
      detector_layout:
        range: SpectroUvDetector
        description: Dimensions of pixels and detector
      detector:
        range: DetectorAperture
        description: Description of the front face of the micro channel plate
      detector_position_parameter:
        range: SignalFlt1d
        description: In case of detector moving during a pulse, position parameter allowing to record
          and compute the detector position as a function of time
        annotations:
          dd_units: mixed
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      line_of_sight:
        range: LineOfSight2pointsDynamicAos1
        description: Description of the line of sight of the channel, given by 2 points. The 2nd point
          is allowed to evolve in case of dynamic line of sight.
      supply_high_voltage:
        range: SpectroUvSupply
        multivalued: true
        description: Set of high voltage power supplies applied to various parts of the diagnostic
        annotations:
          dd_max_occurs: '2'
          dd_coordinate1: 1...N
      grating:
        range: SpectroUvChannelGrating
        description: Description of the grating
      wavelengths:
        range: float
        multivalued: true
        description: Measured wavelengths
        annotations:
          dd_type: constant
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      radiance_spectral:
        range: SignalFlt2d
        description: Calibrated spectral radiance (radiance per unit wavelength)
        annotations:
          dd_units: m^-2.s^-1.sr^-1.m^-1
          dd_coordinate1: ../wavelengths
          dd_coordinate2: time
      intensity_spectrum:
        range: SignalFlt2d
        description: Intensity spectrum (not calibrated), i.e. number of photoelectrons detected by unit
          time by a wavelength pixel of the channel, taking into account electronic gain compensation
          and channels relative calibration
        annotations:
          dd_units: s^-1
          dd_coordinate1: ../wavelengths
          dd_coordinate2: time
      exposure_time:
        range: float
        description: Exposure time
        annotations:
          dd_type: constant
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      processed_line:
        range: SpectroUvChannelProcessedLine
        multivalued: true
        description: Set of processed spectral lines
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      radiance_calibration:
        range: float
        multivalued: true
        description: Radiance calibration
        annotations:
          dd_type: static
          dd_units: m^-3.sr^-1
          dd_ndim: 1
          dd_coordinate1: ../wavelengths
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../wavelengths
      radiance_calibration_date:
        range: string
        description: Date of the radiance calibration (yyyy_mm_dd)
        annotations:
          dd_type: static
      wavelength_calibration:
        range: SpectroUvChannelWavelengthCalibration
        description: 'Wavelength calibration data. The wavelength is obtained from the pixel index k by:
          wavelength =  k * gain + offset. k is starting from 1.'
      wavelength_calibration_date:
        range: string
        description: Date of the wavelength calibration (yyyy_mm_dd)
        annotations:
          dd_type: static
      validity_timed:
        range: SignalInt2d
        description: 'Indicator of the validity of the data for each wavelength and each time slice. 0:
          valid from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem
          identified in the data processing (request verification by the diagnostic RO), -2: invalid data,
          should not be used (values lower than -2 have a code-specific meaning detailing the origin of
          their invalidity)'
        annotations:
          dd_coordinate1: ../wavelengths
      validity:
        range: integer
        description: 'Indicator of the validity of the data for the whole acquisition period. 0: valid
          from automated processing, 1: valid and certified by the diagnostic RO; - 1 means problem identified
          in the data processing (request verification by the diagnostic RO), -2: invalid data, should
          not be used (values lower than -2 have a code-specific meaning detailing the origin of their
          invalidity)'
        annotations:
          dd_type: static
  SpectroUvDetector:
    is_a: InformationContentEntity
    description: Dimensions of pixels and detector
    annotations:
      dd_type_name: spectro_uv_detector
      dd_path: spectrometer_uv/channel/detector_layout
    attributes:
      pixel_dimensions:
        range: float
        multivalued: true
        description: Pixel dimension in each direction (horizontal, vertical)
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      pixel_n:
        range: integer
        multivalued: true
        description: Number of pixels in each direction (horizontal, vertical)
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      detector_dimensions:
        range: float
        multivalued: true
        description: Total detector dimension in each direction (horizontal, vertical)
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
  LineOfSight2pointsDynamicAos1:
    is_a: InformationContentEntity
    description: Description of the line of sight of the channel, given by 2 points. The 2nd point is
      allowed to evolve in case of dynamic line of sight.
    annotations:
      dd_type_name: line_of_sight_2points_dynamic_aos1
      dd_path: spectrometer_uv/channel/line_of_sight
    attributes:
      first_point:
        range: Rphiz0dStatic
        description: Position of the first point
      second_point:
        range: Rphiz1dDynamicAos1CommonTime
        description: Position of the second point (possibly dynamic)
      moving_mode:
        range: Identifier
        description: 'Moving mode of the line of sight. Index = 0 : no movement, fixed position. Index
          = 1 : oscillating'
      position_parameter:
        range: SignalFlt1d
        description: In case of line of sight moving during a pulse, position parameter allowing to record
          and compute the line of sight position as a function of time
        annotations:
          dd_units: mixed
      amplitude_parameter:
        range: float
        description: Amplitude of the line of sight position parameter oscillation (in case moving_mode/index
          = 1)
        annotations:
          dd_type: static
          dd_units: mixed
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      period:
        range: float
        description: Period of the line of sight oscillation (in case moving_mode/index = 1)
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  SpectroUvSupply:
    is_a: InformationContentEntity
    description: Set of high voltage power supplies applied to various parts of the diagnostic
    annotations:
      dd_type_name: spectro_uv_supply
      dd_path: spectrometer_uv/channel/supply_high_voltage
    attributes:
      object:
        range: string
        description: Name of the object connected to the power supply
        annotations:
          dd_type: static
      voltage_set:
        range: SignalFlt1d
        description: Voltage set at the power supply
        annotations:
          dd_units: V
  SpectroUvChannelGrating:
    is_a: InformationContentEntity
    description: Description of the grating
    annotations:
      dd_type_name: spectro_uv_channel_grating
      dd_path: spectrometer_uv/channel/grating
    attributes:
      type:
        range: Identifier
        description: 'Grating type. Index = 1 : ruled. Index = 2 : holographic'
      groove_density:
        range: float
        description: Number of grooves per unit length
        annotations:
          dd_type: static
          dd_units: m^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      geometry_type:
        range: Identifier
        description: 'Grating geometry. Index = 1 : spherical. Index = 2 : toric'
      centre:
        range: Rphiz0dStatic
        description: Centre of the grating sphere (if grating is spherical) or torus (if grating is toric)
      curvature_radius:
        range: float
        description: Curvature radius of the spherical grating
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      summit:
        range: Rphiz0dStatic
        description: Position of the grating summit (defined as the point of contact of its concave side
          if the grating were put on a table). Used as the origin of the x1, x2, x3 vectors defined below
      x1_unit_vector:
        range: Xyz0dStatic
        description: Components of the X1 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X1 vector is horizontal and oriented in the positive phi direction (counter-clockwise
          when viewing from above).
      x2_unit_vector:
        range: Xyz0dStatic
        description: Components of the X2 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X2 axis is orthonormal so that uX2 = uX3 x uX1.
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the grating at its summit and oriented towards the
          plasma.
      outline:
        range: X1x21dStatic
        description: List of the 4 extreme points of the spherical grating in the (X1, X2) coordinate
          system, using the summit as the origin. Repeat the first point since this is a closed contour
      image_field:
        range: SpectroUvChannelGratingImage
        description: Surface on which the grating image is focused
  SpectroUvChannelGratingImage:
    is_a: InformationContentEntity
    description: Surface on which the grating image is focused
    annotations:
      dd_type_name: spectro_uv_channel_grating_image
      dd_path: spectrometer_uv/channel/grating/image_field
    attributes:
      geometry_type:
        range: Identifier
        description: 'Surface geometry. Index = 1 : spherical. Index = 2 : plane'
      centre:
        range: Rphiz0dStatic
        description: Centre of the image surface in case it is spherical, or position of a point on the
          surface in case it is a plane
      curvature_radius:
        range: float
        description: Curvature radius of the image surface
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      x3_unit_vector:
        range: Xyz0dStatic
        description: Components of the X3 direction unit vector in the (X,Y,Z) coordinate system, where
          X is the major radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z is
          the height axis. The X3 axis is normal to the surface ( in case it is plane) and oriented towards
          the plasma.
  SpectroUvChannelProcessedLine:
    is_a: InformationContentEntity
    description: Set of processed spectral lines
    annotations:
      dd_type_name: spectro_uv_channel_processed_line
      dd_path: spectrometer_uv/channel/processed_line
    attributes:
      name:
        range: string
        description: 'String identifying the processed line. To avoid ambiguities, the following syntax
          is used : element with ionization state_wavelength in Angstrom (e.g. WI_4000)'
        annotations:
          dd_type: constant
      wavelength_central:
        range: float
        description: Central wavelength of the processed line
        annotations:
          dd_type: constant
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      radiance:
        range: SignalFlt1d
        description: Calibrated, background subtracted radiance (integrated over the spectrum for this
          line)
        annotations:
          dd_units: m^-2.s^-1.sr^-1
      intensity:
        range: SignalFlt1d
        description: Non-calibrated intensity (integrated over the spectrum for this line)
        annotations:
          dd_units: s^-1
  SpectroUvChannelWavelengthCalibration:
    is_a: InformationContentEntity
    description: 'Wavelength calibration data. The wavelength is obtained from the pixel index k by: wavelength
      =  k * gain + offset. k is starting from 1.'
    annotations:
      dd_type_name: spectro_uv_channel_wavelength_calibration
      dd_path: spectrometer_uv/channel/wavelength_calibration
    attributes:
      offset:
        range: float
        description: Offset
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      gain:
        range: float
        description: Gain
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
