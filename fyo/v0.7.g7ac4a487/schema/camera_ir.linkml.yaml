id: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/camera_ir
name: fyo-camera_ir
title: fyo IDS `camera_ir` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `camera_ir` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g7ac4a487/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/camera_ir/dd_camera_ir.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: CameraIr
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  CameraIr:
    is_a: IDS
    description: Infrared camera for monitoring of Plasma Facing Components
    annotations:
      dd_path: camera_ir
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: CameraIrChannel
        multivalued: true
        description: Set of channels (line of sight, viewing the plasma recorded by one or more cameras
          e.g. for different wavelength ranges)
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      midplane:
        range: Identifier
        description: Choice of midplane definition for the mapping of measurements on an equilibrium
      frame_analysis:
        range: CameraIrFrameAnalysis
        multivalued: true
        description: Quantities deduced from frame analysis for a set of time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      optical_element:
        range: OpticalElement
        multivalued: true
        description: Set of optical elements
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      fibre_bundle:
        range: FibreBundle
        description: Description of the fibre bundle
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CameraIrChannel:
    is_a: InformationContentEntity
    description: Set of channels (line of sight, viewing the plasma recorded by one or more cameras e.g.
      for different wavelength ranges)
    annotations:
      dd_type_name: camera_ir_channel
      dd_path: camera_ir/channel
    attributes:
      name:
        range: string
        description: Name of the channel
        annotations:
          dd_type: static
      camera:
        range: CameraIrCamera
        multivalued: true
        description: Set of cameras
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      target_surface_center:
        range: Xyz0dStatic
        description: Position of the center of the targeted surface
  CameraIrCamera:
    is_a: InformationContentEntity
    description: Set of cameras
    annotations:
      dd_type_name: camera_ir_camera
      dd_path: camera_ir/channel/camera
    attributes:
      name:
        range: string
        description: Name of the detector
        annotations:
          dd_type: static
      calibration:
        range: CameraIrCalibration
        description: Calibration data
      frame:
        range: CameraIrFrame
        multivalued: true
        description: Set of frames
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      pinhole:
        range: Xyz0dStatic
        description: Pinhole position in the (X,Y,Z) coordinate system
      direction:
        range: Xyz0dStatic
        description: Line of sight direction unit vector
      up:
        range: Xyz0dStatic
        description: Detector orientation unit vector
      pixel_size:
        range: float
        description: Sensor pixel size (square pixel assumed)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      field_of_view_horizontal:
        range: float
        description: Field of view in the horizontal detector plane
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      field_of_view_vertical:
        range: float
        description: Field of view in the vertical detector plane
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      pixels_n_horizontal:
        range: integer
        description: Number of pixels in the horizontal direction (of the detector)
        annotations:
          dd_type: static
      pixels_n_vertical:
        range: integer
        description: Number of pixels in the vertical direction (of the detector)
        annotations:
          dd_type: static
  CameraIrCalibration:
    is_a: InformationContentEntity
    description: Calibration data
    annotations:
      dd_type_name: camera_ir_calibration
      dd_path: camera_ir/channel/camera/calibration
    attributes:
      luminance_to_temperature:
        range: integer
        multivalued: true
        description: Luminance to temperature conversion table
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...2
      transmission_barrel:
        range: integer
        multivalued: true
        description: Transmission of the optical barrel
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      transmission_mirror:
        range: integer
        multivalued: true
        description: Transmission of the mirror
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      transmission_window:
        range: integer
        multivalued: true
        description: Transmission of the window
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      optical_temperature:
        range: integer
        multivalued: true
        description: Temperature of the optical components (digital levels)
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
  CameraIrFrame:
    is_a: TimeSlice
    description: Set of frames
    annotations:
      dd_type_name: camera_ir_frame
      dd_path: camera_ir/channel/camera/frame
      fyo_lift: time_slice
    attributes:
      apparent_temperature:
        range: float
        multivalued: true
        description: 'Processed image in apparent temperature. First dimension : row index (horizontal
          orientation). Second dimension: column index (vertical orientation). The size of this matrix
          is assumed to be constant over time'
        annotations:
          dd_type: dynamic
          dd_units: K
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      integration_time:
        range: float
        multivalued: true
        description: 'Integration time per pixel. First dimension : row index (horizontal orientation).
          Second dimension: column index (vertical orientation). The size of this matrix is assumed to
          be constant over time. Allocate dimensions to 1 in case of uniform exposure time.'
        annotations:
          dd_type: dynamic
          dd_units: K
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      filter:
        range: FilterSimpleDynamic
        multivalued: true
        description: Set of filters
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      region_of_interest:
        range: CameraIrFrameRoi
        multivalued: true
        description: Set of regions of interest for the real-time monitoring of machine protection. Regions
          of interest are defined by a combination of polygons for each image
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  FilterSimpleDynamic:
    is_a: InformationContentEntity
    description: Set of filters
    annotations:
      dd_type_name: filter_simple_dynamic
      dd_path: camera_ir/channel/camera/frame/filter
    attributes:
      wavelength_central:
        range: float
        description: Central wavelength of the filter
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_width:
        range: float
        description: Filter transmission function width (at 90% level)
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CameraIrFrameRoi:
    is_a: InformationContentEntity
    description: Set of regions of interest for the real-time monitoring of machine protection. Regions
      of interest are defined by a combination of polygons for each image
    annotations:
      dd_type_name: camera_ir_frame_roi
      dd_path: camera_ir/channel/camera/frame/region_of_interest
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: dynamic
      emissivity:
        range: float
        description: Emissivity of the region of interest
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      surface_area:
        range: float
        description: Area of the region of interest
        annotations:
          dd_type: dynamic
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      type:
        range: string
        description: Type of the region of interest usage, physical or operational. When operational,
          it means machine protection is active on this region of interest
        annotations:
          dd_type: dynamic
      mask:
        range: integer
        multivalued: true
        description: 'Mask of the region of interest on the frame (0 = point outside the ROI, 1 = point
          inside the ROI). First dimension : row index (horizontal orientation). Second dimension: column
          index (vertical orientation)'
        annotations:
          dd_type: dynamic
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      temperature_limit_max:
        range: float
        description: Maximum allowed apparent temperature in the region of interest. A machine protection
          message is triggered if this limit is exceeded
        annotations:
          dd_type: dynamic
          dd_units: K
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      temperature_max:
        range: float
        description: Maximum apparent temperature measured in the region of interest
        annotations:
          dd_type: dynamic
          dd_units: K
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      row_index_temperature_max:
        range: integer
        description: Row index with maximum apparent temperature
        annotations:
          dd_type: dynamic
      column_index_temperature_max:
        range: integer
        description: Column index with maximum apparent temperature
        annotations:
          dd_type: dynamic
  CameraIrFrameAnalysis:
    is_a: TimeSlice
    description: Quantities deduced from frame analysis for a set of time slices
    annotations:
      dd_type_name: camera_ir_frame_analysis
      dd_path: camera_ir/frame_analysis
      fyo_lift: time_slice
    attributes:
      sol_heat_decay_length:
        range: float
        description: Heat flux decay length in SOL at divertor entrance, mapped to the mid-plane, this
          is the lambda_q parameter defined in reference T. Eich et al, Nucl. Fusion 53 (2013) 093031
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      distance_separatrix_midplane:
        range: float
        multivalued: true
        description: Distance between the measurement position and the separatrix, mapped along flux surfaces
          to the outboard midplane, in the major radius direction. Positive value means the measurement
          is outside of the separatrix.
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      power_flux_parallel:
        range: float
        multivalued: true
        description: Parallel heat flux received by the element monitored by the camera, along the distance_separatrix_midplane
          coordinate
        annotations:
          dd_type: dynamic
          dd_units: W.m^-2
          dd_ndim: 1
          dd_coordinate1: ../distance_separatrix_midplane
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../distance_separatrix_midplane
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
