id: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/edge_transport
name: fyo-edge_transport
title: fyo IDS `edge_transport` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `edge_transport` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/edge_transport/dd_edge_transport.xsd via dd2linkml (mechanical layer — transient
    build artifact, not in-tree)
  fyo_category: physics-state
  fyo_root_class: EdgeTransport
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  EdgeTransport:
    is_a: IDS
    description: Edge plasma transport. Energy terms correspond to the full kinetic energy equation (i.e.
      the energy flux takes into account the energy transported by the particle flux)
    annotations:
      dd_path: edge_transport
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebases
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      model:
        range: EdgeTransportModel
        multivalued: true
        description: Transport is described by a combination of various transport models
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EdgeTransportModel:
    is_a: InformationContentEntity
    description: Transport is described by a combination of various transport models
    annotations:
      dd_type_name: edge_transport_model
      dd_path: edge_transport/model
    attributes:
      identifier:
        range: Identifier
        description: Transport model identifier
      flux_multiplier:
        range: float
        description: 'Multiplier applied to the particule flux when adding its contribution in the expression
          of the heat flux : can be 0, 3/2 or 5/2'
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      ggd:
        range: PlasmaTransportModelGgd
        multivalued: true
        description: Transport coefficients represented using the general grid description, for various
          time slices. Fluxes are given in the direction perpendicular to the edges or faces of the grid
          (flow crossing that surface divided by its actual area). Radial fluxes are positive when they
          are directed away from the magnetic axis. Poloidal fluxes are positive when they are directed
          in such a way that they travel clockwise around the magnetic axis (poloidal plane viewed such
          that the centerline of the tokamak is on the left). Parallel fluxes are positive when they are
          co-directed with the magnetic field. Toroidal fluxes are positive if travelling counter-clockwise
          when looking at the plasma from above
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd_fast:
        range: PlasmaTransportModelGgdFast
        multivalued: true
        description: Quantities provided at a faster sampling rate than the full ggd quantities. These
          are either integrated quantities or local quantities provided on a reduced set of positions.
          Positions and integration domains are described by a set of grid_subsets (of size 1 for a position).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: CodeWithTimebase
        description: Code-specific parameters used for this model
