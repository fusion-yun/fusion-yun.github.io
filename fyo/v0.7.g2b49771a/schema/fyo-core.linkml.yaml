# SPDX-License-Identifier: CC-BY-ND-4.0
# fyo-core — the fytok (fusion) hand-curated core ontology (durable, NOT generated).
#
# Two strata (FYTOK-ADR-102, revising the FYTOK-ADR-101 boundary):
#   1. Apparatus (SPM-ADR-104): Machine (Tokamak), CoilSystem + subtypes, Coil, Plasma,
#      Diagnostic — MaterialEntity subtree, realized from the spmodel SP-ONT-APP-* prose.
#   2. Fusion semantic anchors for the LIFTED IMAS DD (the per-IDS schemas in this
#      schema/ directory, generated by ../scripts/dd2fyo.py, which imports this): the IDS root class (an ICE with orthogonal
#      provenance), Discharge (the experiment process a shot is), MachineDescription (the
#      description-of-reality counterpart of Machine), FluxCoordinateSystem + COCOS (the
#      fusion-specific chart conventions spo delegates per SPM-ADR-104 D2).
#
# `imports: [spo]`; binds to spo's BFO upper with precise BFO class_uri IRIs — spo stays
# domain-neutral. BFO IRIs per BFO 2020 / OBO Foundry (version-sensitive). T-Box only.
#
# Source prose (informative): the spo repo's apparatus/*.md (SP-ONT-APP-*).
id: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/core
name: fyo-core
title: Fyo Core — Fusion Core Ontology (hand-curated)
description: >-
  Hand-curated fusion T-Box for fyo: the apparatus layer (Machine/Tokamak, CoilSystem +
  subtypes, Coil, Plasma, Diagnostic) plus the semantic anchors of the lifted IMAS DD (IDS,
  Discharge, MachineDescription, FluxCoordinateSystem/COCOS) — bound to spo's BFO upper.
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  obi: http://purl.obolibrary.org/obo/OBI_
  ro: http://purl.obolibrary.org/obo/RO_
  prov: http://www.w3.org/ns/prov#
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
annotations:
  fyo_module: core
  fyo_version: 0.6.0
  source_prose: "spmodel SP-ONT-APP-{machine,plasma,coil-system,diagnostic} (realized here per SPM-ADR-104 / FYTOK-ADR-101); lifted-DD anchors per FYTOK-ADR-102"
  bfo_release_note: "class_uri IRIs per BFO 2020 / OBO Foundry; version-sensitive."

slots:

  has_subsystem:
    description: A Machine bears first-class material sub-systems (BFO has_part).
    slot_uri: bfo:0000051
    range: MachineSubsystem
    multivalued: true
    inlined_as_list: true
  has_coil:
    description: A CoilSystem is composed of atomic Coil instances (BFO has_part).
    slot_uri: bfo:0000051
    range: Coil
    multivalued: true
    inlined_as_list: true
  hosts:
    description: A Machine holds a Plasma within its vacuum-vessel fiat boundary during a Shot.
    slot_uri: fyo:hosts
    range: Plasma
    multivalued: true
    inlined_as_list: true
  is_hosted_by:
    description: Inverse of hosts — the Machine a Plasma is confined in.
    slot_uri: fyo:isHostedBy
    range: Machine
  produces:
    description: A Diagnostic produces information artifacts (⊑ inverse prov:wasGeneratedBy).
    slot_uri: fyo:produces
    range: InformationContentEntity   # from spo-core (bfo GDC / iao ICE)
    multivalued: true
  performed_on:
    description: The Machine this discharge is performed on.
    range: Machine
  describes_machine:
    description: The Machine this description is about (iao:is_about specialization).
    range: Machine
  cocos:
    description: >-
      COCOS index (Sauter tokamak coordinate-convention identifier) fixing the signs and
      orientation of the flux chart.
    range: integer

classes:

  # -- Apparatus (independent continuants) ---------------------------------------- #
  MachineSubsystem:
    abstract: true
    is_a: MaterialEntity                     # spo-core (bfo:0000040)
    description: >-
      Abstract parent of a Machine's first-class material sub-systems (coil systems, vacuum
      vessel, cryostat, ports, …). SP-ONT-APP-MACHINE.

  Machine:
    is_a: MaterialEntity
    class_uri: bfo:0000030                    # BFO object
    description: >-
      The integrated material entity of a scientific apparatus (e.g. a tokamak), composed of
      first-class sub-systems and bearing the dispositions to participate in experimental
      processes. SP-ONT-APP-MACHINE.
    slots:
      - has_subsystem
      - hosts

  Tokamak:
    is_a: Machine
    description: A toroidal magnetic-confinement fusion Machine (fusion specialization of Machine).

  Coil:
    is_a: MaterialEntity
    class_uri: bfo:0000030                    # BFO object
    description: An atomic electromagnetic coil (BFO object); part of a CoilSystem.

  CoilSystem:
    is_a: MachineSubsystem
    class_uri: bfo:0000027                    # BFO object aggregate
    description: >-
      A coordinated group of electromagnetic coils bearing a single shaping/confinement
      disposition. SP-ONT-APP-COIL. `sp:CoilSystem ⊑ bfo:object_aggregate ⊓ ∃has_part.Coil`.
    slots:
      - has_coil

  PoloidalFieldCoilSystem:
    is_a: CoilSystem
    description: Poloidal-field coil group — plasma shape control (PF).
  ToroidalFieldCoilSystem:
    is_a: CoilSystem
    description: Toroidal-field coil group — main confinement field (TF).
  CentralSolenoidSystem:
    is_a: CoilSystem
    description: Central solenoid — plasma current drive + flux swing (CS).
  CorrectionFieldCoilSystem:
    is_a: CoilSystem
    description: Error-field correction coils — RMP / ELM mitigation.

  Diagnostic:
    is_a: MaterialEntity
    class_uri: bfo:0000030                    # BFO object
    description: >-
      A measurement apparatus designed to measure physical quantities of the Machine or the
      Plasma it hosts, bearing a disposition to produce information artifacts (W3C SOSA Sensor
      aligned). SP-ONT-APP-DIAG. `sp:Diagnostic ⊑ bfo:object ⊓ ∃produces.InformationContentEntity`.
    slots:
      - produces

  MagneticDiagnostic:
    is_a: Diagnostic
    description: Diagnostic measuring magnetic field / flux / plasma current.

  # -- Plasma (fiat object part — exists only within a Shot) ---------------------- #
  Plasma:
    is_a: MaterialEntity
    class_uri: bfo:0000024                    # BFO fiat object part
    description: >-
      The ionized matter held inside the vacuum-vessel fiat boundary of a Machine during a
      Shot, bearer of physical qualities (temperature, density, current, flux topology). NOT a
      bfo:object (no bona-fide boundary; discontinuous across shots). One Plasma instance per
      Shot. SP-ONT-APP-PLASMA. `sp:Plasma ⊑ bfo:fiat_object_part ⊓ ∃isHostedBy.Machine`.
    slots:
      - is_hosted_by

  # -- Experiment process (occurrent side) ----------------------------------------- #
  Discharge:
    is_a: PlannedProcess
    description: >-
      A tokamak discharge (shot / pulse) — the planned experimental process realizing a
      pulse-schedule PlanSpecification on a Machine, during which one Plasma exists and
      MeasurementProcesses run. An unrepeatable spatiotemporal particular: what a data system
      keeps of it is its record (spo ProcessRecord; the populated IDS set of a pulse), never
      the discharge itself.
    slots:
      - performed_on

  # -- The lifted-DD information layer ---------------------------------------------- #
  IDS:
    abstract: true
    is_a: InformationContentEntity
    mixins:
      - ProvenanceMixin
    description: >-
      An IMAS Interface Data Structure occurrence as a whole — the root ICE every lifted
      per-IDS schema (this schema/ directory, dd2fyo) subclasses. An IDS is ABOUT the Machine /
      Plasma / Discharge it describes (spo is_about) and carries orthogonal provenance + data
      modality (measured / reconstructed / simulated / static-device) via ProvenanceMixin —
      the DD schema itself is modality-blind. Its time mode (homogeneous_time) is a layout
      choice (AoS TimeSliceSeries vs SoA signals), orthogonal to what the IDS is about.

  MachineDescription:
    is_a: InformationContentEntity
    description: >-
      A static description of a Machine as built — geometry, coil positions, probe positions
      (the machine-description IDS subset; EngineeringDetermination output). The
      DESCRIPTION-side counterpart of the MaterialEntity Machine: a survey dataset is_about
      the machine, while the drawing that PRESCRIBES it is a spo DesignSpecification.
      as-designed ≠ as-built ≠ the machine itself.
    slots:
      - describes_machine

  # -- Fusion coordinate charts (COCOS) ---------------------------------------------- #
  FluxCoordinateSystem:
    is_a: CoordinateSystem
    description: >-
      A flux-surface coordinate chart (psi / rho_tor / theta / phi families) with its COCOS
      convention — the fusion-specific chart layer spo-geometry delegates to fyo (SPM-ADR-104
      D2). Two Fields on charts with different COCOS are equivalent_representation peers only
      after the sign / orientation transform.
    slots:
      - cocos
