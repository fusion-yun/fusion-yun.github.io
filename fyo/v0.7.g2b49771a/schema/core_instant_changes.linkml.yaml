id: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/core_instant_changes
name: fyo-core_instant_changes
title: fyo IDS `core_instant_changes` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `core_instant_changes` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g2b49771a/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/core_instant_changes/dd_core_instant_changes.xsd via dd2linkml (mechanical
    layer — transient build artifact, not in-tree)
  fyo_category: physics-state
  fyo_root_class: CoreInstantChanges
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  CoreInstantChanges:
    is_a: IDS
    description: Instant changes of the radial core plasma profiles due to pellet, MHD, ...
    annotations:
      dd_path: core_instant_changes
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in Rho_Tor definition and in the
          normalization of current densities)
      change:
        range: CoreInstantChangesChange
        multivalued: true
        description: Set of instant change terms (each being due to a different phenomenon)
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CoreInstantChangesChange:
    is_a: InformationContentEntity
    description: Set of instant change terms (each being due to a different phenomenon)
    annotations:
      dd_type_name: core_instant_changes_change
      dd_path: core_instant_changes/change
    attributes:
      identifier:
        range: Identifier
        description: Instant change term identifier
      profiles_1d:
        range: CoreProfilesProfiles1d
        multivalued: true
        description: Changes in 1D core profiles for various time slices. This structure mirrors core_profiles/profiles_1d
          and describes instant changes to each of these physical quantities (i.e. a signed difference
          quantity after change - quantity before change)
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
