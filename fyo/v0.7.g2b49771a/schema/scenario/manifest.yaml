# manifest.yaml — module registry of the hand-curated application-scenario stratum of fyo.
#
# HAND-CURATED (durable, authored — unlike the generated per-IDS schemas in the parent schema/ directory, this directory is NOT generated).
# One base module (fyo-scenario: what the five tasks share) + one module per FYTOK-CONOPS-00
# application-task scenario S-7..S-11. All modules `imports: [spo, fyo-core, fyo-scenario]`;
# per-attribute `fyo_ids:` annotations name the intended lifted IDS modules, resolved against
# ../ids-manifest.yaml (scenario modules do not import the per-IDS schemas).
name: fyo-scenario-set
description: 'fyo application-scenario stratum — the five FYTOK-CONOPS-00 application-task
  scenarios (S-7..S-11) as spo/BFO-grounded process ontologies, over the shared fyo-scenario
  base (ApplicationTask / ScenarioSpecification / ForwardOperator / ScenarioLoop /
  EngineeringPortRun). Hand-curated — edit freely, keep in sync with FYTOK-CONOPS-00.'
conops_ref: FYTOK-CONOPS-00 v0.6 §conops-fytok-scenarios-app
imports:
- spo
- fyo-core
modules:
  fyo-scenario: fyo-scenario.linkml.yaml            # shared base (task family + kernel + ports)
  physics_modeling: physics_modeling.linkml.yaml    # S-7 物理建模 / 预测 (primary)
  experiment_analysis: experiment_analysis.linkml.yaml  # S-8 实验分析 / 反演 (primary)
  control_simulation: control_simulation.linkml.yaml    # S-9 控制仿真
  discharge_design: discharge_design.linkml.yaml    # S-10 放电运行设计
  device_optimization: device_optimization.linkml.yaml  # S-11 装置参数优化
