id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/soft_x_rays
name: fyo-soft_x_rays
title: fyo IDS `soft_x_rays` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `soft_x_rays` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/soft_x_rays/dd_soft_x_rays.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: SoftXRays
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  SoftXRays:
    is_a: IDS
    description: Soft X-rays tomography diagnostic
    annotations:
      dd_path: soft_x_rays
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      channel:
        range: SxrChannel
        multivalued: true
        description: Set of channels (detector or pixel of a camera)
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SxrChannel:
    is_a: InformationContentEntity
    description: Set of channels (detector or pixel of a camera)
    annotations:
      dd_type_name: sxr_channel
      dd_path: soft_x_rays/channel
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      detector:
        range: DetectorAperture
        description: Detector description
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of a set of collimating apertures
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      etendue:
        range: float
        description: Etendue (geometric extent) of the channel's optical system
        annotations:
          dd_type: static
          dd_units: m^2.sr
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      etendue_method:
        range: Identifier
        description: 'Method used to calculate the etendue. Index = 0 : exact calculation with a 4D integral;
          1 : approximation with first order formula (detector surface times solid angle subtended by
          the apertures); 2 : other methods'
      line_of_sight:
        range: LineOfSight2points
        description: Description of the line of sight of the channel, given by 2 points
      filter_window:
        range: FilterWindow
        multivalued: true
        description: Set of filter windows
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      energy_band:
        range: DetectorEnergyBand
        multivalued: true
        description: Set of energy bands in which photons are counted by the detector
        annotations:
          dd_max_occurs: '8'
          dd_coordinate1: 1...N
      brightness:
        range: SignalFlt2d
        description: Power flux received by the detector, per unit solid angle and per unit area (i.e.
          power divided by the etendue), in multiple energy bands if available from the detector
        annotations:
          dd_units: W.m^-2.sr^-1
          dd_coordinate1: ../energy_band
          dd_coordinate2: time
      power:
        range: SignalFlt2d
        description: Power received on the detector, in multiple energy bands if available from the detector
        annotations:
          dd_units: W
          dd_coordinate1: ../energy_band
          dd_coordinate2: time
      validity_timed:
        range: SignalInt1d
        description: Indicator of the validity of the channel as a function of time (0 means valid, negative
          values mean non-valid)
      validity:
        range: integer
        description: Indicator of the validity of the channel for the whole acquisition period (0 means
          valid, negative values mean non-valid)
        annotations:
          dd_type: static
