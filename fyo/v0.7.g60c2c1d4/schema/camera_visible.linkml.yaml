id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/camera_visible
name: fyo-camera_visible
title: fyo IDS `camera_visible` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `camera_visible` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/camera_visible/dd_camera_visible.xsd (import ancestry)
  fyo_category: diagnostic
  fyo_root_class: CameraVisible
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  CameraVisible:
    is_a: IDS
    description: Camera in the visible light range
    annotations:
      dd_path: camera_visible
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      name:
        range: string
        description: Name of the camera
        annotations:
          dd_type: static
      channel:
        range: CameraVisibleChannel
        multivalued: true
        description: Set of channels (a front aperture, possibly followed by others, viewing the plasma
          recorded by one or more detectors e.g. for different wavelength ranges)
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  CameraVisibleChannel:
    is_a: InformationContentEntity
    description: Set of channels (a front aperture, possibly followed by others, viewing the plasma recorded
      by one or more detectors e.g. for different wavelength ranges)
    annotations:
      dd_type_name: camera_visible_channel
      dd_path: camera_visible/channel
    attributes:
      name:
        range: string
        description: Name of the channel
        annotations:
          dd_type: static
      aperture:
        range: DetectorAperture
        multivalued: true
        description: Description of apertures between plasma and the detectors (position, outline shape
          and orientation)
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
      viewing_angle_alpha_bounds:
        range: float
        multivalued: true
        description: Minimum and maximum values of alpha angle of the field of view, where alpha is the
          agle between the axis X3 and projection of the chord of view  on the plane X1X3 counted clockwise
          from the top view of X2 axis. X1, X2, X3 are the ones of the first aperture (i.e. the closest
          to the plasma).
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      viewing_angle_beta_bounds:
        range: float
        multivalued: true
        description: Minimum and maximum values of beta angle of the field of view, where beta is the
          angle between the axis X3 and projection of the chord of view on the plane X2X3 counted clockwise
          from the top view of X1 axis. X1, X2, X3 are the ones of the first aperture (i.e. the closest
          to the plasma).
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      detector:
        range: CameraVisibleDetector
        multivalued: true
        description: Set of detectors
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      optical_element:
        range: OpticalElement
        multivalued: true
        description: Set of optical elements
        annotations:
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      fibre_bundle:
        range: FibreBundle
        description: Description of the fibre bundle
  CameraVisibleDetector:
    is_a: InformationContentEntity
    description: Set of detectors
    annotations:
      dd_type_name: camera_visible_detector
      dd_path: camera_visible/channel/detector
    attributes:
      pixel_to_alpha:
        range: float
        multivalued: true
        description: Alpha angle of each pixel in the horizontal axis
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      pixel_to_beta:
        range: float
        multivalued: true
        description: Beta angle of each pixel in the vertical axis
        annotations:
          dd_type: static
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      wavelength_lower:
        range: float
        description: Lower bound of the detector wavelength range
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      wavelength_upper:
        range: float
        description: Upper bound of the detector wavelength range
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      counts_to_radiance:
        range: float
        multivalued: true
        description: Counts to radiance factor, for each pixel of the detector. Includes both the transmission
          losses in the relay optics and the quantum efficiency of the camera itself, integrated over
          the wavelength range
        annotations:
          dd_type: static
          dd_units: m^-2.s^-1.sr^-1
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      exposure_time:
        range: float
        description: Exposure time
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      noise:
        range: float
        description: Detector noise (e.g. read-out noise) (rms counts per second exposure time)
        annotations:
          dd_type: static
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      columns_n:
        range: integer
        description: Number of pixel columns in the horizontal direction
        annotations:
          dd_type: static
      lines_n:
        range: integer
        description: Number of pixel lines in the vertical direction
        annotations:
          dd_type: static
      frame:
        range: CameraVisibleFrame
        multivalued: true
        description: Set of frames
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      geometry_matrix:
        range: CameraVisibleGeometryMatrix
        description: Description of geometry matrix (ray transfer matrix)
  CameraVisibleFrame:
    is_a: TimeSlice
    description: Set of frames
    annotations:
      dd_type_name: camera_visible_frame
      dd_path: camera_visible/channel/detector/frame
      fyo_lift: time_slice
    attributes:
      image_raw:
        range: integer
        multivalued: true
        description: 'Raw image (unprocessed) (digital levels). First dimension : line index (horizontal
          axis). Second dimension: column index (vertical axis).'
        annotations:
          dd_type: dynamic
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      radiance:
        range: float
        multivalued: true
        description: 'Radiance image. First dimension : line index (horizontal axis). Second dimension:
          column index (vertical axis).'
        annotations:
          dd_type: dynamic
          dd_units: m^-2.s^-1.sr^-1
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  CameraVisibleGeometryMatrix:
    is_a: InformationContentEntity
    description: Description of geometry matrix (ray transfer matrix)
    annotations:
      dd_type_name: camera_visible_geometry_matrix
      dd_path: camera_visible/channel/detector/geometry_matrix
    attributes:
      with_reflections:
        range: CameraVisibleGeometryMatrixStep2
        description: Geometry matrix with reflections
      without_reflections:
        range: CameraVisibleGeometryMatrixStep2
        description: Geometry matrix without reflections
      interpolated:
        range: CameraVisibleGeometryMatrixInterpolated
        description: Interpolated geometry matrix for reflected light
      voxel_map:
        range: integer
        multivalued: true
        description: Voxel map for geometry matrix. The cells with same number are merged in the computation
          into a single emission source meta-cell (the voxel). Cells with number -1 are excluded. Voxel
          count starts from 0.
        annotations:
          dd_type: static
          dd_ndim: 3
          dd_coordinate1: ../emission_grid/dim1
          dd_coordinate2: ../emission_grid/dim2
          dd_coordinate3: ../emission_grid/dim3
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../emission_grid/dim1,../emission_grid/dim2,../emission_grid/dim3
      voxels_n:
        range: integer
        description: Number of voxels defined in the voxel_map.
        annotations:
          dd_type: static
      emission_grid:
        range: GeometryMatrixEmission
        description: Grid defining the light emission cells
  CameraVisibleGeometryMatrixStep2:
    is_a: InformationContentEntity
    description: Geometry matrix with reflections
    annotations:
      dd_type_name: camera_visible_geometry_matrix_step2
      dd_path: camera_visible/channel/detector/geometry_matrix/with_reflections
    attributes:
      data:
        range: float
        multivalued: true
        description: The Ray Transfer Matrix (RTM, or geometry matrix) here provides transformation of
          the signal from each individual unit light source (voxel) to each pixel of the receiver (detector).
          The emission profile has [photons.m^-3.s^-1.sr^-1] units and radiance signal has [photons.m^-2.s^-1.sr^-1]
          units. So the RTM has [m] units. This data is stored in a sparse form, i.e. the array contains
          only the non-zero element of the Ray transfer matrix. The voxel index corresponding to an element
          of this array can be found in voxel_indices. The pixel indices corresponding to an element of
          this array can be found in pixel_indices
        annotations:
          dd_type: static
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      voxel_indices:
        range: integer
        multivalued: true
        description: List of voxel indices (defined in the voxel map) used in the sparse data array
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: ../data
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../data
      pixel_indices:
        range: integer
        multivalued: true
        description: List of pixel indices used in the sparse data array. The first dimension refers to
          the data array index. The second dimension lists the line index (horizontal axis) in first position,
          then the column index (vertical axis).
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: ../data
          dd_coordinate2: 1...2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../data,1...2
  CameraVisibleGeometryMatrixInterpolated:
    is_a: InformationContentEntity
    description: Interpolated geometry matrix for reflected light
    annotations:
      dd_type_name: camera_visible_geometry_matrix_interpolated
      dd_path: camera_visible/channel/detector/geometry_matrix/interpolated
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius of interpolation knots
        annotations:
          dd_type: constant
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      z:
        range: float
        multivalued: true
        description: Height of interpolation knots
        annotations:
          dd_type: constant
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../r
      phi:
        range: float
        multivalued: true
        description: Toroidal angle (oriented counter-clockwise when viewing from above) of interpolation
          knots
        annotations:
          dd_type: constant
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../r
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../r
      data:
        range: float
        multivalued: true
        description: 'Interpolated Ray Transfer Matrix (RTM, or geometry matrix), which provides transformation
          of the reflected light from each interpolation knot to the receiver (detector pixel). When convolving
          with an emission profile, the values must be interpolated to the emission grid and multiplied
          by the volume of the grid cells. The interpolated matrix is given on an array of interpolation
          knots of coordinates r, z and phi (third dimension of this array). The first two dimension correspond
          to the detector pixels : first dimension : line index (horizontal axis); second dimension: column
          index (vertical axis).'
        annotations:
          dd_type: constant
          dd_units: m^-2
          dd_ndim: 3
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          dd_coordinate3: ../r
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N,../r
