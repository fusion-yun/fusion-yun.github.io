        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying ion (e.g. H+, D+, T+, He+2, C+, ...)
        annotations:
          dd_type: dynamic
      ion_index:
        range: integer
        description: Index of the corresponding ion species in the ../../ion array
        annotations:
          dd_type: dynamic
      particles:
        range: PlasmaTransportModel2Density
        description: Transport related to the neutral density equation
      energy:
        range: PlasmaTransportModel2Energy
        description: Transport coefficients related to the neutral energy equation
      multiple_states_flag:
        range: integer
        description: 'Multiple states calculation flag : 0-Only one state is considered; 1-Multiple states
          are considered and are described in the state structure'
        annotations:
          dd_type: dynamic
      state:
        range: PlasmaTransportModelNeutralState
        multivalued: true
        description: Transport coefficients related to the different states of the species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  PlasmaTransportModelNeutralState:
    is_a: InformationContentEntity
    description: Transport coefficients related to the different states of the species
    annotations:
      dd_type_name: plasma_transport_model_neutral_state
      dd_path: plasma_transport/model/profiles_1d/neutral/state
    attributes:
      name:
        range: string
        description: String identifying state
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
