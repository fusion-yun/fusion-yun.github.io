id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/plasma_transport
name: fyo-plasma_transport
title: fyo IDS `plasma_transport` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `plasma_transport` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/plasma_transport/dd_plasma_transport.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: PlasmaTransport
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  PlasmaTransport:
    is_a: IDS
    description: Plasma transport. This IDS is a prototype based on the merge of core_transport and edge_transport.
      Energy terms correspond to the full kinetic energy equation (i.e. the energy flux takes into account
      the energy transported by the particle flux)
    annotations:
      dd_path: plasma_transport
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in Rho_Tor definition and in the
          normalization of current densities)
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebases
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      model:
        range: PlasmaTransportModel
        multivalued: true
        description: Transport is described by a combination of various transport models
        annotations:
          dd_max_occurs: '18'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PlasmaTransportModel:
    is_a: InformationContentEntity
    description: Transport is described by a combination of various transport models
    annotations:
      dd_type_name: plasma_transport_model
      dd_path: plasma_transport/model
    attributes:
      comment:
        range: string
        description: Any comment describing the model
        annotations:
          dd_type: constant
      identifier:
        range: Identifier
        description: Transport model identifier
      flux_multiplier:
        range: float
        description: 'Multiplier applied to the particule flux when adding its contribution in the expression
          of the heat flux : can be 0, 3/2 or 5/2'
        annotations:
          dd_type: constant
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      profiles_1d:
        range: PlasmaTransportModelProfiles1d
        multivalued: true
        description: 'Transport coefficient profiles for various time slices. The transport of particles,
          energy and momentum is described by diffusion coefficients, D, and convection velocities, v.
          In 1D (radial) equations, these are defined by the total fluxes of particles, energy and momentum,
          across a flux surface given by : V'' [-D Y'' <|grad(rho_tor_norm)|^2> + v Y <|grad(rho_tor_norm)|>],
          where Y represents the particles, energy and momentum density, respectively, while V is the
          volume inside a flux surface, the primes denote derivatives with respect to rho_tor_norm and
          < X > is the flux surface average of a quantity X. This formulation remains valid when changing
          simultaneously rho_tor_norm into rho_tor in the gradient terms and in the derivatives denoted
          by the prime. The average flux stored in the IDS as sibling of D and v is the total flux described
          above divided by the flux surface area V'' <|grad(rho_tor_norm)|>. Note that the energy flux
          includes the energy transported by the particle flux, in this form: Q =  V'' [- n D (T)'' <|grad(rho_tor_norm)|^2>
          + v (nT) <|grad(rho_tor_norm)|>] + flux_multiplier * T * particle_flux. Fluxes and convection
          are positive (resp. negative) when outwards i.e. towards the LCFS (resp. inwards i.e.  towards
          the magnetic axes).'
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: PlasmaTransportModelGgd
        multivalued: true
        description: Transport coefficients represented using the general grid description, for various
          time slices. Fluxes are given in the direction perpendicular to the edges or faces of the grid
          (flow crossing that surface divided by its actual area). Radial fluxes are positive when they
          are directed away from the magnetic axis. Poloidal fluxes are positive when they are directed
          in such a way that they travel clockwise around the magnetic axis (poloidal plane viewed such
          that the centerline of the tokamak is on the left). Parallel fluxes are positive when they are
          co-directed with the magnetic field. Toroidal fluxes are positive if travelling counter-clockwise
          when looking at the plasma from above
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd_fast:
        range: PlasmaTransportModelGgdFast
        multivalued: true
        description: Quantities provided at a faster sampling rate than the full ggd quantities. These
          are either integrated quantities or local quantities provided on a reduced set of positions.
          Positions and integration domains are described by a set of grid_subsets (of size 1 for a position).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: CodeWithTimebase
        description: Code-specific parameters used for this model
  PlasmaTransportModelProfiles1d:
    is_a: TimeSlice
    description: 'Transport coefficient profiles for various time slices. The transport of particles,
      energy and momentum is described by diffusion coefficients, D, and convection velocities, v. In
      1D (radial) equations, these are defined by the total fluxes of particles, energy and momentum,
      across a flux surface given by : V'' [-D Y'' <|grad(rho_tor_norm)|^2> + v Y <|grad(rho_tor_norm)|>],
      where Y represents the particles, energy and momentum density, respectively, while V is the volume
      inside a flux surface, the'
    annotations:
      dd_type_name: plasma_transport_model_profiles_1d
      dd_path: plasma_transport/model/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid_d:
        range: PlasmaRadialGrid
        description: Grid for effective diffusivities and parallel conductivity. Note that some of the
          radial coordinates listed above are undefined outside the last closed flux surface, thus they
          must be filled with EMPTY_FLOAT values in such locations
      grid_v:
        range: PlasmaRadialGrid
        description: Grid for effective convections. Note that some of the radial coordinates listed above
          are undefined outside the last closed flux surface, thus they must be filled with EMPTY_FLOAT
          values in such locations
      grid_flux:
        range: PlasmaRadialGrid
        description: Grid for fluxes. Note that some of the radial coordinates listed above are undefined
          outside the last closed flux surface, thus they must be filled with EMPTY_FLOAT values in such
          locations
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid_d/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid_d/rho_tor_norm
      electrons:
        range: PlasmaTransportModelElectrons
        description: Transport quantities related to the electrons
      total_ion_energy:
        range: PlasmaTransportModel1Energy
        description: Transport coefficients for the total (summed over ion  species) energy equation
      momentum_phi:
        range: PlasmaTransportModel1Momentum
        description: Transport coefficients for total toroidal momentum equation
      e_field_radial:
        range: float
        multivalued: true
        description: Radial component of the electric field (calculated e.g. by a neoclassical model)
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid_flux/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid_flux/rho_tor_norm
      ion:
        range: PlasmaTransportModelIons
        multivalued: true
        description: Transport coefficients related to the various ion species, in the sense of isonuclear
          or isomolecular sequences. ionization states (and other types of states) must be differentiated
          at the state level below
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: PlasmaTransportModelNeutral
        multivalued: true
        description: Transport coefficients related to the various neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
