id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/ec_launchers
name: fyo-ec_launchers
title: fyo IDS `ec_launchers` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `ec_launchers` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/ec_launchers/dd_ec_launchers.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: EcLaunchers
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  EcLaunchers:
    is_a: IDS
    description: Launchers for heating and current drive in the electron cyclotron (EC) frequencies.
    annotations:
      dd_path: ec_launchers
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      mirror:
        range: EcLaunchersMirror
        multivalued: true
        description: Set of mirrors associated with the launcher
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      beam:
        range: EcLaunchersBeam
        multivalued: true
        description: Set of Electron Cyclotron beam segments, including between mirrors
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between input command received from the RT network and actuator
          starting to react. Applies globally to the system described by this IDS unless specific latencies
          (e.g. channel-specific or antenna-specific) are provided at a deeper level in the IDS structure.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EcLaunchersMirror:
    is_a: InformationContentEntity
    description: Set of mirrors associated with the launcher
    annotations:
      dd_type_name: ec_launchers_mirror
      dd_path: ec_launchers/mirror
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “Mirror in upper port 12”
        annotations:
          dd_type: static
      geometry:
        range: CurvedObject
        description: Description of the geometry of the mirror, in its reference position
        annotations:
          dd_coordinate1: 1...N
      movement:
        range: EcLaunchersMovement
        multivalued: true
        description: Set of degrees of freedom for this mirror, allowing the mirror to move around its
          reference position indicated in ../geometry. Can be cascaded for composite movements.
        annotations:
          dd_max_occurs: '3'
          dd_coordinate1: 1...N
  EcLaunchersMovement:
    is_a: InformationContentEntity
    description: Set of degrees of freedom for this mirror, allowing the mirror to move around its reference
      position indicated in ../geometry. Can be cascaded for composite movements.
    annotations:
      dd_type_name: ec_launchers_movement
      dd_path: ec_launchers/mirror/movement
    attributes:
      description:
        range: string
        description: Description, e.g. “Core mirror steering”
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: Type of movement
      direction:
        range: Xyz0dStatic
        description: Unit vector indicating the direction of the translation or the rotation axis at "home"
          position (i.e. ../../geometry/centre)
      translation_max:
        range: float
        description: Maximum displacement with respect to reference position, along the direction vector
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      translation_min:
        range: float
        description: Minimum displacement with respect to reference position, along the direction vector
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rotation_angle_max:
        range: float
        description: Maximum angular displacement with respect to the reference position, counter-clockwise
          around the direction vector
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rotation_angle_min:
        range: float
        description: Minimum angular displacement with respect to the reference position, counter-clockwise
          around the direction vector
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      translation:
        range: float
        multivalued: true
        description: Linear displacement from reference position, along the direction vector
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      rotation_angle:
        range: float
        multivalued: true
        description: Angular displacement with respect to the reference position, counter-clockwise around
          the direction vector
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Time base used for the dynamic quantities at this level
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EcLaunchersBeam:
    is_a: InformationContentEntity
    description: Set of Electron Cyclotron beam segments, including between mirrors
    annotations:
      dd_type_name: ec_launchers_beam
      dd_path: ec_launchers/beam
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      frequency:
        range: SignalFlt1d
        description: Frequency
        annotations:
          dd_units: Hz
      power_launched:
        range: SignalFlt1d
        description: Beam power launched into the vacuum vessel
        annotations:
          dd_units: W
      mirror_index:
        range: integer
        description: Index of the mirror (in the mirror array of structure) on which this beam has been
          reflected
        annotations:
          dd_type: constant
      launching_position:
        range: EcLaunchersLaunchingPosition
        description: Launching position of the beam
      direction:
        range: EcLaunchersBeamWavevector
        description: Wavevector at launch point
      polarization:
        range: EcLaunchersBeamPolarization
        description: Wave polarization
      steering_angle_pol:
        range: float
        multivalued: true
        description: Steering angle of the EC beam in the R,Z plane (from the -R axis towards the -Z axis),
          angle_pol=atan2(-k_Z,-k_R), where k_Z and k_R are the Z and R components of the mean wave vector
          in the EC beam
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      steering_angle_tor:
        range: float
        multivalued: true
        description: Steering angle of the EC beam away from the poloidal plane that is increasing towards
          the positive phi axis, angle_tor=arcsin(k_phi/k), where k_phi is the component of the wave vector
          in the phi direction and k is the length of the wave vector. Here the term wave vector refers
          to the mean wave vector in the EC beam
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      spot:
        range: EcLaunchersBeamSpot
        description: Spot ellipse characteristics at launch
      phase:
        range: EcLaunchersBeamPhase
        description: Phase ellipse characteristics at launch
      time:
        range: float
        multivalued: true
        description: Time base used for launching_position, angle, spot and phase quantities
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EcLaunchersLaunchingPosition:
    is_a: InformationContentEntity
    description: Launching position of the beam
    annotations:
      dd_type_name: ec_launchers_launching_position
      dd_path: ec_launchers/beam/launching_position
    attributes:
      r:
        range: float
        multivalued: true
        description: Major radius
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      r_limit_min:
        range: float
        description: Major radius lower limit for the system
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      r_limit_max:
        range: float
        description: Major radius upper limit for the system
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z:
        range: float
        multivalued: true
        description: Height
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      phi:
        range: float
        multivalued: true
        description: Toroidal angle
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  EcLaunchersBeamWavevector:
    is_a: InformationContentEntity
    description: Wavevector at launch point
    annotations:
      dd_type_name: ec_launchers_beam_wavevector
      dd_path: ec_launchers/beam/direction
    attributes:
      kr:
        range: float
        multivalued: true
        description: Component along the major radius
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      kz:
        range: float
        multivalued: true
        description: Component along the vertical direction
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
      kphi:
        range: float
        multivalued: true
        description: Component along the toroidal direction
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  EcLaunchersBeamPolarization:
    is_a: InformationContentEntity
    description: Wave polarization
    annotations:
      dd_type_name: ec_launchers_beam_polarization
      dd_path: ec_launchers/beam/polarization
    attributes:
      o_mode_fraction:
        range: float
        multivalued: true
        description: Fraction of EC beam power launched in ordinary (O) mode. If all power is launched
          in ordinary mode (O-mode), o_mode_fraction = 1.0. If all  power is launched in extraordinary
          mode (X-mode), o_mode_fraction = 0.0
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      azimuthal_angle:
        range: float
        multivalued: true
        description: Poincare sphere angle psi for mixed mode
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      ellipticity_angle:
        range: float
        multivalued: true
        description: Poincare sphere angle chi for mixed mode
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Time base used for polarization quantities
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  EcLaunchersBeamSpot:
    is_a: InformationContentEntity
    description: Spot ellipse characteristics at launch
    annotations:
      dd_type_name: ec_launchers_beam_spot
      dd_path: ec_launchers/beam/spot
    attributes:
      size:
        range: float
        multivalued: true
        description: 'Size of the spot ellipse: distance between the central ray and the peripheral rays
          in the horizontal (first index of the first coordinate) and vertical direction (second index
          of the first coordinate)'
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: ../../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,../../time
      angle:
        range: float
        multivalued: true
        description: Rotation angle for the spot ellipse
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
  EcLaunchersBeamPhase:
    is_a: InformationContentEntity
    description: Phase ellipse characteristics at launch
    annotations:
      dd_type_name: ec_launchers_beam_phase
      dd_path: ec_launchers/beam/phase
    attributes:
      curvature:
        range: float
        multivalued: true
        description: Inverse curvature radii for the phase ellipse, positive/negative for divergent/convergent
          beams, in the horizontal direction (first index of the first coordinate) and in the vertical
          direction (second index of the first coordinate)
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 2
          dd_coordinate1: 1...2
          dd_coordinate2: ../../time
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...2,../../time
      angle:
        range: float
        multivalued: true
        description: Rotation angle for the phase ellipse
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../../time
          spo_class: spo:Signal
          fyo_lift: signal
