id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/mhd_linear
name: fyo-mhd_linear
title: fyo IDS `mhd_linear` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `mhd_linear` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/mhd_linear/dd_mhd_linear.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: MhdLinear
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  MhdLinear:
    is_a: IDS
    description: Magnetohydronamic linear stability
    annotations:
      dd_path: mhd_linear
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      model_type:
        range: Identifier
        description: Type of model used to populate this IDS
      equations:
        range: Identifier
        description: Type of MHD equations used to populate this IDS
      fluids_n:
        range: integer
        description: Number of fluids considered in the model
        annotations:
          dd_type: constant
      ideal_flag:
        range: integer
        description: 1 if ideal MHD is used to populate this IDS, 0 for non-ideal MHD
        annotations:
          dd_type: constant
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      time_slice:
        range: MhdLinearTimeSlice
        multivalued: true
        description: Core plasma radial profiles for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  MhdLinearTimeSlice:
    is_a: TimeSlice
    description: Core plasma radial profiles for various time slices
    annotations:
      dd_type_name: mhd_linear_time_slice
      dd_path: mhd_linear/time_slice
      fyo_lift: time_slice
    attributes:
      toroidal_mode:
        range: MhdLinearTimeSliceToroidalModes
        multivalued: true
        description: Vector of toroidal modes. Each mode is described as exp(i(n_tor.phi - m_pol.theta
          - 2.pi.frequency.t - phase))
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  MhdLinearTimeSliceToroidalModes:
    is_a: InformationContentEntity
    description: Vector of toroidal modes. Each mode is described as exp(i(n_tor.phi - m_pol.theta - 2.pi.frequency.t
      - phase))
    annotations:
      dd_type_name: mhd_linear_time_slice_toroidal_modes
      dd_path: mhd_linear/time_slice/toroidal_mode
    attributes:
      perturbation_type:
        range: Identifier
        description: Type of the perturbation
      n_phi:
        range: integer
        description: Toroidal mode number of the MHD mode
        annotations:
          dd_type: dynamic
      m_pol_dominant:
        range: float
        description: Dominant poloidal mode number defining the mode rational surface; for TAEs the lower
          of the two main m's has to be specified
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      ballooning_type:
        range: Identifier
        description: 'Ballooning type of the mode : ballooning 0; anti-ballooning:1; flute-like:2'
      radial_mode_number:
        range: float
        description: Radial mode number
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      growthrate:
        range: float
        description: Linear growthrate of the mode
        annotations:
          dd_type: dynamic
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      frequency:
        range: float
        description: Frequency of the mode
        annotations:
          dd_type: dynamic
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phase:
        range: float
        description: Additional phase offset of mode
        annotations:
          dd_type: dynamic
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      energy_perturbed:
        range: float
        description: Perturbed energy associated to the mode
        annotations:
          dd_type: dynamic
          dd_units: J
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      amplitude_multiplier:
        range: float
        description: Multiplier that is needed to convert the linear mode structures to the amplitude
          of a non-linearly saturated mode in physical units. If empty, it means that the structures contains
          no information about non-linearly saturated mode
        annotations:
          dd_type: dynamic
          dd_units: mixed
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      plasma:
        range: MhdLinearTimeSliceToroidalModePlasma
        description: MHD modes in the confined plasma
      vacuum:
        range: MhdLinearTimeSliceToroidalModeVacuum
        description: MHD modes in the vacuum
  MhdLinearTimeSliceToroidalModePlasma:
    is_a: InformationContentEntity
    description: MHD modes in the confined plasma
    annotations:
      dd_type_name: mhd_linear_time_slice_toroidal_mode_plasma
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      coordinate_system:
        range: MhdCoordinateSystem
        description: Flux surface coordinate system of the equilibrium used for the MHD calculation on
          a square grid of flux and poloidal angle
      displacement_perpendicular:
        range: Complex2dDynamicAosMhdScalar
        description: Perpendicular displacement of the modes
        annotations:
          dd_units: m
      displacement_parallel:
        range: Complex2dDynamicAosMhdScalar
        description: Parallel displacement of the modes
        annotations:
          dd_units: m
      tau_alfven:
        range: float
        multivalued: true
        description: Alven time=R/vA=R0 sqrt(mi ni(rho))/B0
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../grid/dim1
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/dim1
      tau_resistive:
        range: float
        multivalued: true
        description: Resistive time = mu_0 rho*rho/1.22/eta_neo
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: ../grid/dim1
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/dim1
      a_field_perturbed:
        range: MhdLinearVector
        description: Pertubed vector potential for given toroidal mode number
        annotations:
          dd_units: T.m
      b_field_perturbed:
        range: MhdLinearVector
        description: Pertubed magnetic field for given toroidal mode number
        annotations:
          dd_units: T
      velocity_perturbed:
        range: MhdLinearVector
        description: Pertubed velocity for given toroidal mode number
        annotations:
          dd_units: m.s^-1
      pressure_perturbed:
        range: Complex2dDynamicAosMhdScalar
        description: Perturbed pressure for given toroidal mode number
        annotations:
          dd_units: Pa
      mass_density_perturbed:
        range: Complex2dDynamicAosMhdScalar
        description: Perturbed mass density for given toroidal mode number
        annotations:
          dd_units: kg.m^-3
      temperature_perturbed:
        range: Complex2dDynamicAosMhdScalar
        description: Perturbed temperature for given toroidal mode number
        annotations:
          dd_units: eV
      phi_potential_perturbed:
        range: Complex2dDynamicAosMhdScalar
        description: Perturbed electrostatic potential for given toroidal mode number
        annotations:
          dd_units: V
      psi_potential_perturbed:
        range: Complex2dDynamicAosMhdScalar
        description: Perturbed electromagnetic super-potential for given toroidal mode number, see ref
          [Antonsen/Lane Phys Fluids 23(6) 1980, formula 34], so that A_field_parallel=1/(i*2pi*frequency)
          (grad psi_potential)_parallel
        annotations:
          dd_units: V
      alfven_frequency_spectrum:
        range: Complex1dMhdAlfvenSpectrum
        multivalued: true
        description: Local shear Alfven spectrum as a function of radius (only in case grid/dim1 is a
          radial coordinate)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: ../grid/dim1
      stress_maxwell:
        range: Complex3dMhdStressTensor
        description: Maxwell stress tensor
      stress_reynolds:
        range: Complex3dMhdStressTensor
        description: Reynolds stress tensor
      ntv:
        range: Complex3dMhdStressTensor
        description: Neoclassical toroidal viscosity tensor
  MhdCoordinateSystem:
    is_a: InformationContentEntity
    description: Flux surface coordinate system of the equilibrium used for the MHD calculation on a square
      grid of flux and poloidal angle
    annotations:
      dd_type_name: mhd_coordinate_system
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/coordinate_system
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid
      r:
        range: float
        multivalued: true
        description: Values of the major radius on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      z:
        range: float
        multivalued: true
        description: Values of the Height on the grid
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      jacobian:
        range: float
        multivalued: true
        description: Absolute value of the jacobian of the coordinate system
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2
      tensor_covariant:
        range: float
        multivalued: true
        description: Covariant metric tensor on every point of the grid described by grid_type
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 4
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          dd_coordinate3: 1...3
          dd_coordinate4: 1...3
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2,1...3,1...3
      tensor_contravariant:
        range: float
        multivalued: true
        description: Contravariant metric tensor on every point of the grid described by grid_type
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 4
          dd_coordinate1: ../grid/dim1
          dd_coordinate2: ../grid/dim2
          dd_coordinate3: 1...3
          dd_coordinate4: 1...3
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/dim1,../grid/dim2,1...3,1...3
  Complex2dDynamicAosMhdScalar:
    is_a: InformationContentEntity
    description: Perpendicular displacement of the modes
    annotations:
      dd_type_name: complex_2d_dynamic_aos_mhd_scalar
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/displacement_perpendicular
    attributes:
      real:
        range: float
        multivalued: true
        description: Real part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      imaginary:
        range: float
        multivalued: true
        description: Imaginary part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2
      coefficients_real:
        range: float
        multivalued: true
        description: Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity (real part) with finite elements, provided on the 2D grid
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 3
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2,1...N
      coefficients_imaginary:
        range: float
        multivalued: true
        description: Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity (imaginary part) with finite elements, provided on the 2D grid
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 3
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: ../../grid/dim2
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,../../grid/dim2,1...N
  MhdLinearVector:
    is_a: InformationContentEntity
    description: Pertubed vector potential for given toroidal mode number
    annotations:
      dd_type_name: mhd_linear_vector
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/a_field_perturbed
    attributes:
      coordinate1:
        range: Complex2dDynamicAosMhdLinearVector
        description: First coordinate (radial)
        annotations:
          dd_units: as_parent
      coordinate2:
        range: Complex2dDynamicAosMhdLinearVector
        description: Second coordinate (poloidal)
        annotations:
          dd_units: as_parent
      coordinate3:
        range: Complex2dDynamicAosMhdLinearVector
        description: Third coordinate (toroidal)
        annotations:
          dd_units: as_parent
  Complex2dDynamicAosMhdLinearVector:
    is_a: InformationContentEntity
    description: First coordinate (radial)
    annotations:
      dd_type_name: complex_2d_dynamic_aos_mhd_linear_vector
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/a_field_perturbed/coordinate1
    attributes:
      real:
        range: float
        multivalued: true
        description: Real part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      imaginary:
        range: float
        multivalued: true
        description: Imaginary part
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2
      coefficients_real:
        range: float
        multivalued: true
        description: Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity (real part) with finite elements, provided on the 2D grid
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 3
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2,1...N
      coefficients_imaginary:
        range: float
        multivalued: true
        description: Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity (imaginary part) with finite elements, provided on the 2D grid
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 3
          dd_coordinate1: ../../../grid/dim1
          dd_coordinate2: ../../../grid/dim2
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid/dim1,../../../grid/dim2,1...N
  Complex1dMhdAlfvenSpectrum:
    is_a: InformationContentEntity
    description: Local shear Alfven spectrum as a function of radius (only in case grid/dim1 is a radial
      coordinate)
    annotations:
      dd_type_name: complex_1d_mhd_alfven_spectrum
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/alfven_frequency_spectrum
    attributes:
      real:
        range: float
        multivalued: true
        description: Real part of the frequency, for a given radial position and every root found at this
          position
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      imaginary:
        range: float
        multivalued: true
        description: Imaginary part of the frequency, for a given radial position and every root found
          at this position
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../real
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../real
  Complex3dMhdStressTensor:
    is_a: InformationContentEntity
    description: Maxwell stress tensor
    annotations:
      dd_type_name: complex_3d_mhd_stress_tensor
      dd_path: mhd_linear/time_slice/toroidal_mode/plasma/stress_maxwell
    attributes:
      real:
        range: float
        multivalued: true
        description: Real part of the stress tensor, for various radial positions
        annotations:
          dd_type: dynamic
          dd_units: N.m^-2
          dd_ndim: 3
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,1...N,1...N
      imaginary:
        range: float
        multivalued: true
        description: Imaginary part of the stress tensor, for various radial positions
        annotations:
          dd_type: dynamic
          dd_units: N.m^-2
          dd_ndim: 3
          dd_coordinate1: ../../grid/dim1
          dd_coordinate2: 1...N
          dd_coordinate3: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/dim1,1...N,1...N
  MhdLinearTimeSliceToroidalModeVacuum:
    is_a: InformationContentEntity
    description: MHD modes in the vacuum
    annotations:
      dd_type_name: mhd_linear_time_slice_toroidal_mode_vacuum
      dd_path: mhd_linear/time_slice/toroidal_mode/vacuum
    attributes:
      grid_type:
        range: Identifier
        description: Selection of one of a set of grid types
      grid:
        range: EquilibriumProfiles2dGrid
        description: Definition of the 2D grid (the content of dim1 and dim2 is defined by the selected
          grid_type)
      coordinate_system:
        range: MhdCoordinateSystem
        description: Flux surface coordinate system of the equilibrium used for the MHD calculation on
          a square grid of flux and poloidal angle
      a_field_perturbed:
        range: MhdLinearVector
        description: Pertubed vector potential for given toroidal mode number
        annotations:
          dd_units: T.m
      b_field_perturbed:
        range: MhdLinearVector
        description: Pertubed magnetic field for given toroidal mode number
        annotations:
          dd_units: T
