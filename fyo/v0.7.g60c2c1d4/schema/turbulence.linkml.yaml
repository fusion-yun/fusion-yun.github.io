id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/turbulence
name: fyo-turbulence
title: fyo IDS `turbulence` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `turbulence` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/turbulence/dd_turbulence.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: Turbulence
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Turbulence:
    is_a: IDS
    description: Description of plasma turbulence
    annotations:
      dd_path: turbulence
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      grid_2d_type:
        range: Identifier
        description: Selection of one of a set of grid types for grid_2d
      grid_2d:
        range: TurbulenceProfiles2dGrid
        multivalued: true
        description: Values for the 2D grid, for various time slices. The timebase of this array of structure
          must be a subset of the profiles_2d timebase
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_2d:
        range: TurbulenceProfiles2d
        multivalued: true
        description: Fluctuating physical quantities for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  TurbulenceProfiles2dGrid:
    is_a: TimeSlice
    description: Values for the 2D grid, for various time slices. The timebase of this array of structure
      must be a subset of the profiles_2d timebase
    annotations:
      dd_type_name: turbulence_profiles_2d_grid
      dd_path: turbulence/grid_2d
      fyo_lift: time_slice
    attributes:
      dim1:
        range: float
        multivalued: true
        description: First dimension values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      dim2:
        range: float
        multivalued: true
        description: Second dimension values
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  TurbulenceProfiles2d:
    is_a: TimeSlice
    description: Fluctuating physical quantities for various time slices
    annotations:
      dd_type_name: turbulence_profiles_2d
      dd_path: turbulence/profiles_2d
      fyo_lift: time_slice
    attributes:
      electrons:
        range: TurbulenceProfiles2dElectrons
        description: Quantities related to electrons
      ion:
        range: TurbulenceProfiles2dIons
        multivalued: true
        description: Quantities related to the various ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: TurbulenceProfiles2dNeutral
        multivalued: true
        description: Quantities related to the various neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  TurbulenceProfiles2dElectrons:
    is_a: InformationContentEntity
    description: Quantities related to electrons
    annotations:
      dd_type_name: turbulence_profiles_2d_electrons
      dd_path: turbulence/profiles_2d/electrons
    attributes:
      temperature:
        range: float
        multivalued: true
        description: Temperature
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density_thermal:
        range: float
        multivalued: true
        description: Density of thermal particles
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
  TurbulenceProfiles2dIons:
    is_a: InformationContentEntity
    description: Quantities related to the various ion species
    annotations:
      dd_type_name: turbulence_profiles_2d_ions
      dd_path: turbulence/profiles_2d/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed), volume averaged
          over plasma radius
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H+, D+, T+, He+2, C+, ...)
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: dynamic
      temperature:
        range: float
        multivalued: true
        description: Temperature (average over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density_thermal:
        range: float
        multivalued: true
        description: Density (thermal) (sum over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
  TurbulenceProfiles2dNeutral:
    is_a: InformationContentEntity
    description: Quantities related to the various neutral species
    annotations:
      dd_type_name: turbulence_profiles_2d_neutral
      dd_path: turbulence/profiles_2d/neutral
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      name:
        range: string
        description: String identifying ion (e.g. H+, D+, T+, He+2, C+, ...)
        annotations:
          dd_type: dynamic
      ion_index:
        range: integer
        description: Index of the corresponding ion species in the ../../ion array
        annotations:
          dd_type: dynamic
      temperature:
        range: float
        multivalued: true
        description: Temperature (average over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: eV
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density:
        range: float
        multivalued: true
        description: Density (thermal+non-thermal) (sum over charge states when multiple charge states
          are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
      density_thermal:
        range: float
        multivalued: true
        description: Density (thermal) (sum over charge states when multiple charge states are considered)
        annotations:
          dd_type: dynamic
          dd_units: m^-3
          dd_ndim: 2
          dd_coordinate1: ../../../grid_2d(itime)/dim1
          dd_coordinate2: ../../../grid_2d(itime)/dim2
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../../grid_2d(itime)/dim1,../../../grid_2d(itime)/dim2
