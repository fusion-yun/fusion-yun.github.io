id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/plasma_sources
name: fyo-plasma_sources
title: fyo IDS `plasma_sources` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `plasma_sources` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/plasma_sources/dd_plasma_sources.xsd (import ancestry)
  fyo_category: physics-state
  fyo_root_class: PlasmaSources
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  PlasmaSources:
    is_a: IDS
    description: Plasma sources. This IDS is a prototype based on the merge of core_sources and edge_sources.
      Energy terms correspond to the full kinetic energy equation (i.e. the energy flux takes into account
      the energy transported by the particle flux)
    annotations:
      dd_path: plasma_sources
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      midplane:
        range: Identifier
        description: Choice of midplane definition (use the lowest index number if more than one value
          is relevant)
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_Tor definition and in the
          normalization of current densities)
      grid_ggd:
        range: GenericGridAos3Root
        multivalued: true
        description: Grid (using the Generic Grid Description), for various time slices. The timebase
          of this array of structure must be a subset of the ggd timebases
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      source:
        range: PlasmaSourcesSource
        multivalued: true
        description: Set of source terms
        annotations:
          dd_max_occurs: '80'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  PlasmaSourcesSource:
    is_a: InformationContentEntity
    description: Set of source terms
    annotations:
      dd_type_name: plasma_sources_source
      dd_path: plasma_sources/source
    attributes:
      identifier:
        range: Identifier
        description: Source term identifier (process causing this source term)
      species:
        range: DistributionSpecies
        description: Species causing this source term (if relevant, e.g. a particular ion or neutral state
          in case of line radiation)
      global_quantities:
        range: PlasmaSourcesSourceGlobal
        multivalued: true
        description: Total source quantities integrated over the plasma volume or surface
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_1d:
        range: PlasmaSourcesSourceProfiles1d
        multivalued: true
        description: Source profiles for various time slices. Source terms are positive (resp. negative)
          when there is a gain (resp. a loss) to the considered channel.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd:
        range: PlasmaSourcesSourceGgd
        multivalued: true
        description: Source terms represented using the general grid description, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      ggd_fast:
        range: PlasmaSourcesSourceGgdFast
        multivalued: true
        description: Quantities provided at a faster sampling rate than the full ggd quantities. These
          are either integrated quantities or local quantities provided on a reduced set of positions.
          Positions and integration domains are described by a set of grid_subsets (of size 1 for a position).
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: CodeWithTimebase
        description: Code-specific parameters used for this source
  PlasmaSourcesSourceGlobal:
    is_a: TimeSlice
    description: Total source quantities integrated over the plasma volume or surface
    annotations:
      dd_type_name: plasma_sources_source_global
      dd_path: plasma_sources/source/global_quantities
      fyo_lift: time_slice
    attributes:
      power:
        range: float
        description: Total power coupled to the plasma
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      total_ion_particles:
        range: float
        description: Total ion particle source (summed over ion  species)
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      total_ion_power:
        range: float
        description: Total power coupled to ion species (summed over ion  species)
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      electrons:
        range: PlasmaSourcesSourceGlobalElectrons
        description: Sources for electrons
      torque_phi:
        range: float
        description: Toroidal torque
        annotations:
          dd_type: dynamic
          dd_units: kg.m^2.s^-2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current_parallel:
        range: float
        description: Parallel current driven
        annotations:
          dd_type: dynamic
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaSourcesSourceGlobalElectrons:
    is_a: InformationContentEntity
    description: Sources for electrons
    annotations:
      dd_type_name: plasma_sources_source_global_electrons
      dd_path: plasma_sources/source/global_quantities/electrons
    attributes:
      particles:
        range: float
        description: Electron particle source
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power:
        range: float
        description: Power coupled to electrons
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaSourcesSourceProfiles1d:
    is_a: TimeSlice
    description: Source profiles for various time slices. Source terms are positive (resp. negative) when
      there is a gain (resp. a loss) to the considered channel.
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d
      dd_path: plasma_sources/source/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: PlasmaRadialGrid
        description: Radial grid. Note that some of the radial coordinates listed above are undefined
          outside the last closed flux surface, thus they must be filled with EMPTY_FLOAT values in such
          locations
      electrons:
        range: PlasmaSourcesSourceProfiles1dElectrons
        description: Sources for electrons
      total_ion_energy:
        range: float
        multivalued: true
        description: Source term for the total (summed over ion  species) energy equation
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      total_ion_energy_decomposed:
        range: PlasmaSourcesSourceProfiles1dEnergyDecomposed2
        description: Decomposition of the source term for total ion energy equation into implicit and
          explicit parts
      total_ion_power_inside:
        range: float
        multivalued: true
        description: Total power coupled to ion species (summed over ion  species) inside the flux surface.
          Cumulative volume integral of the source term for the total ion energy equation
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      total_ion_particles:
        range: float
        multivalued: true
        description: Source term for the total (summed over ion  species) density equation
        annotations:
          dd_type: dynamic
          dd_units: m^-3.s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      total_ion_particles_decomposed:
        range: PlasmaSourcesSourceProfiles1dParticlesDecomposed2
        description: Decomposition of the source term for total ion density equation into implicit and
          explicit parts
      total_ion_particles_inside:
        range: float
        multivalued: true
        description: Total ion particle source (summed over ion  species) inside the flux surface. Cumulative
          volume integral of the source term for the total ion density equation
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      momentum_phi:
        range: float
        multivalued: true
        description: Source term for total toroidal momentum equation
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      torque_phi_inside:
        range: float
        multivalued: true
        description: Toroidal torque inside the flux surface. Cumulative volume integral of the source
          term for the total toroidal momentum equation
        annotations:
          dd_type: dynamic
          dd_units: kg.m^2.s^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      momentum_phi_j_cross_b_field:
        range: float
        multivalued: true
        description: Contribution to the toroidal momentum source term (already included in the momentum_tor
          node) corresponding to the toroidal torques onto the thermal plasma due to Lorentz force associated
          with radial currents. These currents appear as return-currents (enforcing quasi-neutrality,
          div(J)=0) balancing radial currents of non-thermal particles, e.g. radial currents of fast and
          trapped neutral-beam-ions.
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      j_parallel:
        range: float
        multivalued: true
        description: Parallel current density source, average(J.B) / B0, where B0 = plasma_sources/vacuum_toroidal_field/b0
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      current_parallel_inside:
        range: float
        multivalued: true
        description: Parallel current driven inside the flux surface. Cumulative surface integral of j_parallel
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      conductivity_parallel:
        range: float
        multivalued: true
        description: Parallel conductivity due to this source
        annotations:
          dd_type: dynamic
          dd_units: ohm^-1.m^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      ion:
        range: PlasmaSourcesSourceProfiles1dIons
        multivalued: true
        description: Source terms related to the different ions species, in the sense of isonuclear or
          isomolecular sequences. ionization states (and other types of states) must be differentiated
          at the state level below
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      neutral:
        range: PlasmaSourcesSourceProfiles1dNeutral
        multivalued: true
        description: Source terms related to the different neutral species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  PlasmaSourcesSourceProfiles1dElectrons:
    is_a: InformationContentEntity
    description: Sources for electrons
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_electrons
      dd_path: plasma_sources/source/profiles_1d/electrons
    attributes:
      particles:
        range: float
        multivalued: true
        description: Source term for electron density equation
        annotations:
          dd_type: dynamic
          dd_units: m^-3.s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      particles_decomposed:
        range: PlasmaSourcesSourceProfiles1dParticlesDecomposed3
        description: Decomposition of the source term for electron density equation into implicit and
          explicit parts
      particles_inside:
        range: float
        multivalued: true
        description: Electron source inside the flux surface. Cumulative volume integral of the source
          term for the electron density equation.
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      energy:
        range: float
        multivalued: true
        description: Source term for the electron energy equation
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      energy_decomposed:
        range: PlasmaSourcesSourceProfiles1dEnergyDecomposed3
        description: Decomposition of the source term for electron energy equation into implicit and explicit
          parts
      power_inside:
        range: float
        multivalued: true
        description: Power coupled to electrons inside the flux surface. Cumulative volume integral of
          the source term for the electron energy equation
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
  PlasmaSourcesSourceProfiles1dParticlesDecomposed3:
    is_a: InformationContentEntity
    description: Decomposition of the source term for electron density equation into implicit and explicit
      parts
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_particles_decomposed_3
      dd_path: plasma_sources/source/profiles_1d/electrons/particles_decomposed
    attributes:
      implicit_part:
        range: float
        multivalued: true
        description: Implicit part of the source term, i.e. to be multiplied by the equation's primary
          quantity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      explicit_part:
        range: float
        multivalued: true
        description: Explicit part of the source term
        annotations:
          dd_type: dynamic
          dd_units: m^-3.s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
  PlasmaSourcesSourceProfiles1dEnergyDecomposed3:
    is_a: InformationContentEntity
    description: Decomposition of the source term for electron energy equation into implicit and explicit
      parts
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_energy_decomposed_3
      dd_path: plasma_sources/source/profiles_1d/electrons/energy_decomposed
    attributes:
      implicit_part:
        range: float
        multivalued: true
        description: Implicit part of the source term, i.e. to be multiplied by the equation's primary
          quantity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      explicit_part:
        range: float
        multivalued: true
        description: Explicit part of the source term
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
  PlasmaSourcesSourceProfiles1dEnergyDecomposed2:
    is_a: InformationContentEntity
    description: Decomposition of the source term for total ion energy equation into implicit and explicit
      parts
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_energy_decomposed_2
      dd_path: plasma_sources/source/profiles_1d/total_ion_energy_decomposed
    attributes:
      implicit_part:
        range: float
        multivalued: true
        description: Implicit part of the source term, i.e. to be multiplied by the equation's primary
          quantity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      explicit_part:
        range: float
        multivalued: true
        description: Explicit part of the source term
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
  PlasmaSourcesSourceProfiles1dParticlesDecomposed2:
    is_a: InformationContentEntity
    description: Decomposition of the source term for total ion density equation into implicit and explicit
      parts
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_particles_decomposed_2
      dd_path: plasma_sources/source/profiles_1d/total_ion_particles_decomposed
    attributes:
      implicit_part:
        range: float
        multivalued: true
        description: Implicit part of the source term, i.e. to be multiplied by the equation's primary
          quantity
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      explicit_part:
        range: float
        multivalued: true
        description: Explicit part of the source term
        annotations:
          dd_type: dynamic
          dd_units: m^-3.s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
  PlasmaSourcesSourceProfiles1dIons:
    is_a: InformationContentEntity
    description: Source terms related to the different ions species, in the sense of isonuclear or isomolecular
      sequences. ionization states (and other types of states) must be differentiated at the state level
      below
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_ions
      dd_path: plasma_sources/source/profiles_1d/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H, D, T, He, C, D2, ...)
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: Index of the corresponding neutral species in the ../../neutral array
        annotations:
          dd_type: dynamic
      particles:
        range: float
        multivalued: true
        description: Source term for ion density equation
        annotations:
          dd_type: dynamic
          dd_units: s^-1.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      particles_inside:
        range: float
        multivalued: true
        description: Ion source inside the flux surface. Cumulative volume integral of the source term
          for the electron density equation.
        annotations:
          dd_type: dynamic
          dd_units: s^-1
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      particles_decomposed:
        range: PlasmaSourcesSourceProfiles1dParticlesDecomposed3
        description: Decomposition of the source term for ion density equation into implicit and explicit
          parts
      energy:
        range: float
        multivalued: true
        description: Source term for the ion energy transport equation.
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      power_inside:
        range: float
        multivalued: true
        description: Power coupled to the ion species inside the flux surface. Cumulative volume integral
          of the source term for the electron energy equation
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      energy_decomposed:
        range: PlasmaSourcesSourceProfiles1dEnergyDecomposed3
        description: Decomposition of the source term for ion energy equation into implicit and explicit
          parts
      momentum:
        range: PlasmaSourcesSourceProfiles1dComponents2
        description: Source term for the ion momentum transport equations along various components (directions)
      multiple_states_flag:
        range: integer
        description: 'Multiple states calculation flag : 0-Only the ''ion'' level is considered and the
          ''state'' array of structure is empty; 1-Ion states are considered and are described in the
          ''state'' array of structure'
        annotations:
          dd_type: dynamic
      state:
        range: PlasmaSourcesSourceProfiles1dIonsChargeStates
        multivalued: true
        description: Source terms related to the different charge states of the species (ionization, energy,
          excitation, ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  PlasmaSourcesSourceProfiles1dComponents2:
    is_a: InformationContentEntity
    description: Source term for the ion momentum transport equations along various components (directions)
    annotations:
      dd_type_name: plasma_sources_source_profiles_1d_components_2
      dd_path: plasma_sources/source/profiles_1d/ion/momentum
    attributes:
      radial:
        range: float
        multivalued: true
        description: Radial component
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-2
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      diamagnetic:
        range: float
        multivalued: true
        description: Diamagnetic component
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-2
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      parallel:
        range: float
        multivalued: true
        description: Parallel component
        annotations:
          dd_type: dynamic
          dd_units: kg.m^-1.s^-2
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      poloidal:
        range: float
        multivalued: true
