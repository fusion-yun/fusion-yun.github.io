# SPDX-License-Identifier: Apache-2.0
# Scenario S-9 — control simulation (控制仿真).
# Source: FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-9; R109 axis: control.
id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/scenario/control_simulation
name: fyo-scenario-control-simulation
title: "Fyo Scenario S-9 — Control Simulation (控制仿真)"
description: >-
  Ontology of the S-9 application-task scenario: closed-loop CONTROL SIMULATION ("flight
  simulator" semantics) — a feedback control law plus a state estimator drive the simulated
  device state forward in a quasi-real-time closed loop over the shared forward kernel.
  Feedback (reactive) is what distinguishes it from the feedforward S-10 design task.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-scenario
annotations:
  fyo_module: scenario/control_simulation
  conops_scenario: S-9
  r109_axis: control
  conops_ref: "FYTOK-CONOPS-00 §conops-fytok-scenarios-app S-9"
  maturity: "◐ partial — PD position control executable; controller interface / EKF / MPC pending (gaps G-B4 / G-C1), informative"

classes:

  ControlSimulationTask:
    is_a: ApplicationTask
    description: >-
      A closed-loop control-simulation run (S-9). FUNCTION: at each control cycle, a
      StateEstimation process infers the plasma state from (synthetic) diagnostic signals, the
      feedback control law compares it against the reference waveforms and issues actuator
      commands, and the forward kernel advances the device state under those commands —
      closing the loop in quasi-real time (a flight simulator for the real plant's control
      system). Direction: closed-loop / reactive; free variables are the real-time actuator
      commands. Outputs are the simulated closed-loop state trajectory and the command
      history; modality simulated.
    slots:
      - has_part               # parts: StateEstimation + solver invocations per control cycle
    attributes:
      control_laws:
        range: IDS
        description: >-
          INPUT — the feedback controller set (structure, gains, wiring) to be exercised
          against the simulated plant.
        annotations:
          io: input
          fyo_ids: controllers
      reference_waveforms:
        range: IDS
        description: >-
          INPUT — the reference / setpoint waveforms the controllers track (a directive
          PlanSpecification-natured IDS; typically the product of an S-10 design run).
        annotations:
          io: input
          fyo_ids: pulse_schedule
      initial_state:
        range: IDS
        multivalued: true
        description: INPUT — the initial plasma state (equilibrium + profiles) the closed loop starts from.
        annotations:
          io: input
          fyo_ids: equilibrium, core_profiles
      machine_description:
        range: MachineDescription
        description: INPUT — static machine description (coil / circuit / sensor geometry seen by estimator and actuators).
        annotations:
          io: input
      actuator_commands:
        range: IDS
        multivalued: true
        description: >-
          OUTPUT — the actuator command history issued by the control laws over the simulated
          pulse (coil circuit voltages / currents, gas / heating commands).
        annotations:
          io: output
          fyo_ids: pf_active, gas_injection, nbi, ec_launchers
      closed_loop_trajectory:
        range: IDS
        multivalued: true
        description: OUTPUT — the closed-loop simulated state trajectory (equilibrium + profiles over time); modality simulated.
        annotations:
          io: output
          fyo_ids: equilibrium, core_profiles, summary
    annotations:
      conops_scenario: S-9
      free_variables_note: "free = actuator commands (real-time / quasi-real-time); fixed = machine, control-law structure, references"

  StateEstimation:
    is_a: ComputationalProcess
    description: >-
      One state-estimation step of the closed loop — inferring the current plasma state from
      available (synthetic) diagnostic signals and the device linear model (EKF-family), the
      quasi-real-time counterpart of S-8's offline inference: same forward spine, hard latency
      budget. GAP (informative): estimator and device linear model are pending (as-built:
      direct PD on reconstructed position).
    slots:
      - consumes_ids
      - produces_ids
    annotations:
      conops_ref: "FYTOK-CONOPS-00 S-9"
