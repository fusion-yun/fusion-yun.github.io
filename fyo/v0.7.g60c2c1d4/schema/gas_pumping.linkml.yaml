id: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/gas_pumping
name: fyo-gas_pumping
title: fyo IDS `gas_pumping` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `gas_pumping` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.7.g60c2c1d4/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/gas_pumping/dd_gas_pumping.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: GasPumping
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  GasPumping:
    is_a: IDS
    description: Gas pumping by a set of ducts
    annotations:
      dd_path: gas_pumping
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      duct:
        range: GasPumpingDuct
        multivalued: true
        description: Set of gas pumping ducts
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  GasPumpingDuct:
    is_a: InformationContentEntity
    description: Set of gas pumping ducts
    annotations:
      dd_type_name: gas_pumping_duct
      dd_path: gas_pumping/duct
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      species:
        range: GasPumpingSpecies
        multivalued: true
        description: Molecular species pumped via this duct
        annotations:
          dd_max_occurs: '30'
          dd_coordinate1: 1...N
      flow_rate:
        range: SignalFlt1d
        description: Total pumping flow rate via this duct
        annotations:
          dd_units: Pa.m^3.s^-1
  GasPumpingSpecies:
    is_a: InformationContentEntity
    description: Molecular species pumped via this duct
    annotations:
      dd_type_name: gas_pumping_species
      dd_path: gas_pumping/duct/species
    attributes:
      element:
        range: PlasmaCompositionNeutralElementConstant
        multivalued: true
        description: List of elements forming the gas molecule
        annotations:
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      label:
        range: string
        description: String identifying the neutral molecule (e.g. H2, D2, T2, N2, ...)
        annotations:
          dd_type: constant
      flow_rate:
        range: SignalFlt1d
        description: Pumping flow rate of that species
        annotations:
          dd_units: Pa.m^3.s^-1
