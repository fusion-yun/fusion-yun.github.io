id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/iron_core
name: fyo-iron_core
title: fyo IDS `iron_core` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `iron_core` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/iron_core/dd_iron_core.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: IronCore
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  IronCore:
    is_a: Dataset
    description: Iron core description
    annotations:
      dd_path: iron_core
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      segment:
        range: IronCoreSegment
        multivalued: true
        description: The iron core is describred as a set of segments
        annotations:
          dd_max_occurs: '33'
          dd_coordinate1: 1...N
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  IronCoreSegment:
    is_a: InformationContentEntity
    description: The iron core is describred as a set of segments
    annotations:
      dd_type_name: iron_core_segment
      dd_path: iron_core/segment
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      b_field:
        range: float
        multivalued: true
        description: Array of magnetic field values, for each of which the relative permeability is given
        annotations:
          dd_type: static
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      permeability_relative:
        range: float
        multivalued: true
        description: Relative permeability of the iron segment
        annotations:
          dd_type: static
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../b_field
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../b_field
      geometry:
        range: Outline2dGeometryStatic
        description: Cross-sectional shape of the segment
      magnetization_r:
        range: SignalFlt1d
        description: 'Magnetization M of the iron segment along the major radius axis, assumed to be constant
          inside a given iron segment. Reminder : H = 1/mu0 * B - mur * M;'
        annotations:
          dd_units: T
      magnetization_z:
        range: SignalFlt1d
        description: 'Magnetization M of the iron segment along the vertical axis, assumed to be constant
          inside a given iron segment. Reminder : H = 1/mu0 * B - mur * M;'
        annotations:
          dd_units: T
