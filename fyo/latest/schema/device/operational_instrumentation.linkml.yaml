id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/operational_instrumentation
name: fyo-operational_instrumentation
title: fyo IDS `operational_instrumentation` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `operational_instrumentation` onto SpO/BFO (FYTOK-ADR-102):
  structures grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo
  carrier classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_*
  annotations (reverse map ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/operational_instrumentation/dd_operational_instrumentation.xsd (import ancestry)
  fyo_category: device
  fyo_root_class: OperationalInstrumentation
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  OperationalInstrumentation:
    is_a: Dataset
    description: Diagnostics measuring mechanical displacement, acceleration or strains on various parts
      of the device
    annotations:
      dd_path: operational_instrumentation
      fyo_category: device
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      sensor:
        range: OperationalSensor
        multivalued: true
        description: Set of sensors
        annotations:
          dd_max_occurs: '150'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  OperationalSensor:
    is_a: InformationContentEntity
    description: Set of sensors
    annotations:
      dd_type_name: operational_sensor
      dd_path: operational_instrumentation/sensor
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “Sensor at the top of the machine”
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: Type of sensor
      attachement_uris:
        range: string
        multivalued: true
        description: IMAS URI of the system(s) to which this sensor is attached. Two for displacement
          sensors, one for the other types of sensors
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      attachement_points:
        range: Xyz0dStatic
        multivalued: true
        description: Attachement point(s) of the sensor. Two for displacement sensors, one for the other
          types of sensors
        annotations:
          dd_max_occurs: '2'
          dd_coordinate1: 1...N
      gauge_length:
        range: float
        description: Length of the strain gauge
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      direction:
        range: Xyz0dStatic
        description: Direction of the measurement (unit vector)
      direction_second:
        range: Xyz0dStatic
        description: Second direction of measurement, in case of a rosette straing gauge
      length:
        range: SignalFlt1d
        description: Length measured by a displacement sensor
        annotations:
          dd_units: m
      acceleration:
        range: SignalFlt1d
        description: Acceleration measured by an accelerometer sensor
        annotations:
          dd_units: m.s^-2
      strain:
        range: SignalFlt1d
        description: Strain measured by a strain gauge
        annotations:
          dd_units: '1'
      strain_rosette:
        range: SignalFlt2d
        description: 'Strain measured by a rosette strain gauge. The first dimension lists the components
          of the strain tensor : Sx1x1, Sx1x2, Sx2x2, where x1 is the main direction and x2 is the second
          direction of measurement.'
        annotations:
          dd_units: '1'
          dd_coordinate1: 1...3
      temperature:
        range: SignalFlt1d
        description: Temperature measured by a thermocouple
        annotations:
          dd_units: K
