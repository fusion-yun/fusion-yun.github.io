id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/waves
name: fyo-waves
title: fyo IDS `waves` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `waves` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/waves/dd_waves.xsd (import ancestry)
  fyo_category: plasma_state
  fyo_root_class: Waves
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Waves:
    is_a: Dataset
    description: RF wave propagation and deposition. Note that current estimates in this IDS are a priori
      not taking into account synergies between multiple sources (a convergence loop with Fokker-Planck
      calculations is required to account for such synergies)
    annotations:
      dd_path: waves
      fyo_category: plasma_state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      coherent_wave:
        range: WavesCoherentWave
        multivalued: true
        description: Wave description for each frequency
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition)
      magnetic_axis:
        range: Rz1dDynamic1
        description: Magnetic axis position (used to define a poloidal angle for the 2D profiles)
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  WavesCoherentWave:
    is_a: InformationContentEntity
    description: Wave description for each frequency
    annotations:
      dd_type_name: waves_coherent_wave
      dd_path: waves/coherent_wave
    attributes:
      identifier:
        range: WavesCoherentWaveIdentifier
        description: Identifier of the coherent wave, in terms of the type and name of the antenna driving
          the wave and an index separating waves driven by the same antenna.
      wave_solver_type:
        range: Identifier
        description: Type of wave deposition solver used for this wave. Index = 1 for beam/ray tracing;
          index = 2 for full wave
      global_quantities:
        range: WavesCoherentWaveGlobalQuantities
        multivalued: true
        description: Global quantities for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_1d:
        range: WavesCoherentWaveProfiles1d
        multivalued: true
        description: Source radial profiles (flux surface averaged quantities) for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      profiles_2d:
        range: WavesCoherentWaveProfiles2d
        multivalued: true
        description: 2D profiles in poloidal cross-section, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      beam_tracing:
        range: WavesCoherentWaveBeamTracing
        multivalued: true
        description: Beam tracing calculations, for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      full_wave:
        range: WavesCoherentWaveFullWave
        multivalued: true
        description: Solution by a full wave code, given on a generic grid description, for various time
          slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  WavesCoherentWaveGlobalQuantities:
    is_a: TimeSlice
    description: Global quantities for various time slices
    annotations:
      dd_type_name: waves_coherent_wave_global_quantities
      dd_path: waves/coherent_wave/global_quantities
      fyo_lift: time_slice
    attributes:
      frequency:
        range: float
        description: Wave frequency
        annotations:
          dd_type: dynamic
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      n_phi:
        range: integer
        multivalued: true
        description: Toroidal mode numbers, the wave vector toroidal component being defined as k_tor
          = n_tor grad phi where phi is the toroidal angle so that a positive n_tor means a wave propagating
          in the positive phi direction
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      power:
        range: float
        description: Total absorbed wave power
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_n_phi:
        range: float
        multivalued: true
        description: Absorbed wave power per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../n_phi
      current_phi:
        range: float
        description: Wave driven toroidal current from a stand alone calculation (not consistent with
          other sources)
        annotations:
          dd_type: dynamic
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current_phi_n_phi:
        range: float
        multivalued: true
        description: Wave driven toroidal current from a stand alone calculation (not consistent with
          other sources) per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../n_phi
      electrons:
        range: WavesCoherentWaveGlobalQuantitiesElectrons
        description: Quantities related to the electrons
      ion:
        range: WavesCoherentWaveGlobalQuantitiesIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  WavesCoherentWaveGlobalQuantitiesElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: waves_coherent_wave_global_quantities_electrons
      dd_path: waves/coherent_wave/global_quantities/electrons
    attributes:
      power_thermal:
        range: float
        description: Wave power absorbed by the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_thermal_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the thermal particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../n_phi
      power_fast:
        range: float
        description: Wave power absorbed by the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the fast particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../n_phi
      distribution_assumption:
        range: integer
        description: 'Assumption on the distribution function used by the wave solver to calculate the
          power deposition on this species: 0 = Maxwellian (linear absorption); 1 = quasi-linear (F given
          by a distributions IDS).'
        annotations:
          dd_type: dynamic
  WavesCoherentWaveGlobalQuantitiesIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species
    annotations:
      dd_type_name: waves_coherent_wave_global_quantities_ion
      dd_path: waves/coherent_wave/global_quantities/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionisation state; lumped ions are allowed).
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H+, D+, T+, He+2, C+, D2, DT, CD4, ...)
        annotations:
          dd_type: dynamic
      power_thermal:
        range: float
        description: Wave power absorbed by the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_thermal_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the thermal particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../n_phi
      power_fast:
        range: float
        description: Wave power absorbed by the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the fast particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../n_phi
      multiple_states_flag:
        range: integer
        description: 'Multiple state calculation flag : 0-Only one state is considered; 1-Multiple states
          are considered and are described in the state structure'
        annotations:
          dd_type: dynamic
      distribution_assumption:
        range: integer
        description: 'Assumption on the distribution function used by the wave solver to calculate the
          power deposition on this species: 0 = Maxwellian (linear absorption); 1 = quasi-linear (F given
          by a distributions IDS).'
        annotations:
          dd_type: dynamic
      state:
        range: WavesCoherentWaveGlobalQuantitiesIonState
        multivalued: true
        description: Collisional exchange with the various states of the ion species (ionisation, energy,
          excitation, ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  WavesCoherentWaveGlobalQuantitiesIonState:
    is_a: InformationContentEntity
    description: Collisional exchange with the various states of the ion species (ionisation, energy,
      excitation, ...)
    annotations:
      dd_type_name: waves_coherent_wave_global_quantities_ion_state
      dd_path: waves/coherent_wave/global_quantities/ion/state
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle (z_min = z_max = 0 for a neutral)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying charge state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      power_thermal:
        range: float
        description: Wave power absorbed by the thermal particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_thermal_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the thermal particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../n_phi
      power_fast:
        range: float
        description: Wave power absorbed by the fast particle population
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      power_fast_n_phi:
        range: float
        multivalued: true
        description: Wave power absorbed by the fast particle population per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../../n_phi
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../n_phi
  WavesCoherentWaveProfiles1d:
    is_a: TimeSlice
    description: Source radial profiles (flux surface averaged quantities) for various time slices
    annotations:
      dd_type_name: waves_coherent_wave_profiles_1d
      dd_path: waves/coherent_wave/profiles_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      n_phi:
        range: integer
        multivalued: true
        description: Toroidal mode numbers, the wave vector toroidal component being defined as k_phi
          = n_phi grad phi where phi is the toroidal angle so that a positive n_phi means a wave propagating
          in the positive phi direction
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      power_density:
        range: float
        multivalued: true
        description: Flux surface averaged total absorbed wave power density (electrons + ion + fast populations)
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      power_density_n_phi:
        range: float
        multivalued: true
        description: Flux surface averaged absorbed wave power density per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 2
          dd_coordinate1: ../grid/rho_tor_norm
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm,../n_phi
      power_inside:
        range: float
        multivalued: true
        description: Total absorbed wave power (electrons + ion + fast populations) inside a flux surface
          (cumulative volume integral of the absorbed power density)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      power_inside_n_phi:
        range: float
        multivalued: true
        description: Total absorbed wave power (electrons + ion + fast populations) inside a flux surface
          (cumulative volume integral of the absorbed power density), per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 2
          dd_coordinate1: ../grid/rho_tor_norm
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm,../n_phi
      current_phi_inside:
        range: float
        multivalued: true
        description: Wave driven toroidal current, inside a flux surface
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      current_phi_inside_n_phi:
        range: float
        multivalued: true
        description: Wave driven toroidal current, inside a flux surface, per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 2
          dd_coordinate1: ../grid/rho_tor_norm
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm,../n_phi
      current_parallel_density:
        range: float
        multivalued: true
        description: Flux surface averaged wave driven parallel current density = average(j.B) / B0, where
          B0 = vacuum_toroidal_field/b0.
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      current_parallel_density_n_phi:
        range: float
        multivalued: true
        description: Flux surface averaged wave driven parallel current density, per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: A.m^-2
          dd_ndim: 2
          dd_coordinate1: ../grid/rho_tor_norm
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm,../n_phi
      e_field_n_phi:
        range: WavesProfiles1dEFieldNPhi
        multivalued: true
        description: Components of the electric field per toroidal mode number, averaged over the flux
          surface, where the averaged is weighted with the power deposition density, such that e_field
          = ave(e_field.power_density) / ave(power_density)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: ../n_phi
      k_perpendicular:
        range: float
        multivalued: true
        description: Perpendicular wave vector,  averaged over the flux surface, where the averaged is
          weighted with the power deposition density, such that k_perpendicular = ave(k_perpendicular.power_density)
          / ave(power_density), for every flux surface and every toroidal number
        annotations:
          dd_type: dynamic
          dd_units: V.m^-1
          dd_ndim: 2
          dd_coordinate1: ../grid/rho_tor_norm
          dd_coordinate2: ../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm,../n_phi
      electrons:
        range: WavesCoherentWaveProfiles1dElectrons
        description: Quantities related to the electrons
      ion:
        range: WavesCoherentWaveProfiles1dIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  WavesProfiles1dEFieldNPhi:
    is_a: InformationContentEntity
    description: Components of the electric field per toroidal mode number, averaged over the flux surface,
      where the averaged is weighted with the power deposition density, such that e_field = ave(e_field.power_density)
      / ave(power_density)
    annotations:
      dd_type_name: waves_profiles_1d_e_field_n_phi
      dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi
    attributes:
      plus:
        range: WavesCPXAmpPhase1D
        description: Left hand polarized electric field component for every flux surface
        annotations:
          dd_units: V.m^-1
      minus:
        range: WavesCPXAmpPhase1D
        description: Right hand polarized electric field component for every flux surface
        annotations:
          dd_units: V.m^-1
      parallel:
        range: WavesCPXAmpPhase1D
        description: Parallel electric field component for every flux surface
        annotations:
          dd_units: V.m^-1
  WavesCPXAmpPhase1D:
    is_a: InformationContentEntity
    description: Left hand polarized electric field component for every flux surface
    annotations:
      dd_type_name: waves_CPX_amp_phase_1D
      dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/plus
    attributes:
      amplitude:
        range: float
        multivalued: true
        description: Amplitude
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      phase:
        range: float
        multivalued: true
        description: Phase
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
  WavesCoherentWaveProfiles1dElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: waves_coherent_wave_profiles_1d_electrons
      dd_path: waves/coherent_wave/profiles_1d/electrons
    attributes:
      power_density_thermal:
        range: float
        multivalued: true
        description: Flux surface averaged absorbed wave power density on the thermal species
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      power_density_thermal_n_phi:
        range: float
        multivalued: true
        description: Flux surface averaged absorbed wave power density on the thermal species, per toroidal
          mode number
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 2
          dd_coordinate1: ../../grid/rho_tor_norm
          dd_coordinate2: ../../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm,../../n_phi
      power_density_fast:
        range: float
        multivalued: true
        description: Flux surface averaged absorbed wave power density on the fast species
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      power_density_fast_n_phi:
        range: float
        multivalued: true
        description: Flux surface averaged absorbed wave power density on the fast species, per toroidal
          mode number
        annotations:
          dd_type: dynamic
          dd_units: W.m^-3
          dd_ndim: 2
          dd_coordinate1: ../../grid/rho_tor_norm
          dd_coordinate2: ../../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm,../../n_phi
      power_inside_thermal:
        range: float
        multivalued: true
        description: Absorbed wave power on thermal species inside a flux surface (cumulative volume integral
          of the absorbed power density)
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm
      power_inside_thermal_n_phi:
        range: float
        multivalued: true
        description: Absorbed wave power on thermal species inside a flux surface (cumulative volume integral
          of the absorbed power density), per toroidal mode number
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 2
          dd_coordinate1: ../../grid/rho_tor_norm
          dd_coordinate2: ../../n_phi
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../../grid/rho_tor_norm,../../n_phi
      power_inside_fast:
        range: float
        multivalued: true
        description: Absorbed wave power on thermal species inside a flux surface (cumulative volume integral
          of the absorbed power density)
