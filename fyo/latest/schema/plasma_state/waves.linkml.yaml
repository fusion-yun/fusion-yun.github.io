  WavesCoherentWaveBeamTracing:
    is_a: TimeSlice
    description: Beam tracing calculations, for various time slices
    annotations:
      dd_type_name: waves_coherent_wave_beam_tracing
      dd_path: waves/coherent_wave/beam_tracing
      fyo_lift: time_slice
    attributes:
      beam:
        range: WavesCoherentWaveBeamTracingBeam
        multivalued: true
        description: Set of rays/beams describing the wave propagation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  WavesCoherentWaveBeamTracingBeam:
    is_a: InformationContentEntity
    description: Set of rays/beams describing the wave propagation
    annotations:
      dd_type_name: waves_coherent_wave_beam_tracing_beam
      dd_path: waves/coherent_wave/beam_tracing/beam
    attributes:
      power_initial:
        range: float
        description: Initial power in the ray/beam
        annotations:
          dd_type: dynamic
          dd_units: W
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length:
        range: float
        multivalued: true
        description: Ray/beam curvilinear length
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      position:
        range: WavesRphizpsitheta1dDynamicAos3
        description: Position of the ray/beam along its path
      wave_vector:
        range: WavesBeamTracingBeamK
        description: Wave vector of the ray/beam along its path
      e_field:
        range: WavesBeamTracingBeamEField
        description: Electric field polarization of the ray/beam along its path
      power_flow_norm:
        range: WavesBeamTracingPowerFlow
        description: Normalized power flow
      electrons:
        range: WavesBeamTracingElectrons
        description: Quantities related to the electrons
      ion:
        range: WavesCoherentWaveBeamTracingIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      spot:
        range: WavesBeamSpot
        description: Spot ellipse characteristics
      phase:
        range: WavesBeamPhase
        description: Phase ellipse characteristics
  WavesCoherentWaveBeamTracingIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species
    annotations:
      dd_type_name: waves_coherent_wave_beam_tracing_ion
      dd_path: waves/coherent_wave/beam_tracing/beam/ion
    attributes:
      element:
        range: PlasmaCompositionNeutralElement
        multivalued: true
        description: List of elements forming the atom or molecule
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      z_ion:
        range: float
        description: Ion charge (of the dominant ionisation state; lumped ions are allowed).
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying the species (e.g. H+, D+, T+, He+2, C+, D2, DT, CD4, ...)
        annotations:
          dd_type: dynamic
      power:
        range: float
        multivalued: true
        description: Power absorbed along the beam by the species
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../length
      multiple_states_flag:
        range: integer
        description: 'Multiple state calculation flag : 0-Only one state is considered; 1-Multiple states
          are considered and are described in the state structure'
        annotations:
          dd_type: dynamic
      state:
        range: WavesCoherentWaveBeamTracingIonState
        multivalued: true
        description: Collisional exchange with the various states of the ion species (ionisation, energy,
          excitation, ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
