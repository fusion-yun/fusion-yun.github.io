    is_a: InformationContentEntity
    description: Collisional exchange with the various states of the ion species (ionisation, energy,
      excitation, ...)
    annotations:
      dd_type_name: waves_coherent_wave_beam_tracing_ion_state
      dd_path: waves/coherent_wave/beam_tracing/beam/ion/state
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle (z_min = z_max = 0 for a neutral)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle (equal to z_min if no bundle)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying charge state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      power:
        range: float
        multivalued: true
        description: Power absorbed along the beam by the species
        annotations:
          dd_type: dynamic
          dd_units: W
          dd_ndim: 1
          dd_coordinate1: ../../../length
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../length
  WavesCoherentWaveFullWave:
    is_a: TimeSlice
    description: Solution by a full wave code, given on a generic grid description, for various time slices
    annotations:
      dd_type_name: waves_coherent_wave_full_wave
      dd_path: waves/coherent_wave/full_wave
      fyo_lift: time_slice
    attributes:
      grid:
        range: GenericGridDynamic
        description: Grid description
      e_field:
        range: WavesCoherentWaveFullWaveEField
        description: Components of the wave electric field, represented as Fourier coefficients E(n_tor,frequency)
          such that the electric is equal to real(E(n_tor,frequency).exp(i(n_tor.phi - 2.pi.frequency.t)))
      b_field:
        range: WavesCoherentWaveFullWaveBField
        description: Components of the wave magnetic field, , represented as Fourier coefficients B(n_tor,frequency)
          such that the electric is equal to real(B(n_tor,frequency).exp(i(n_tor.phi - 2.pi.frequency.t)))
      k_perpendicular:
        range: GenericGridScalar
        multivalued: true
        description: Perpendicular wave vector, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  WavesCoherentWaveFullWaveEField:
    is_a: InformationContentEntity
    description: Components of the wave electric field, represented as Fourier coefficients E(n_tor,frequency)
      such that the electric is equal to real(E(n_tor,frequency).exp(i(n_tor.phi - 2.pi.frequency.t)))
    annotations:
      dd_type_name: waves_coherent_wave_full_wave_e_field
      dd_path: waves/coherent_wave/full_wave/e_field
    attributes:
      plus:
        range: GenericGridScalarComplex
        multivalued: true
        description: Left hand circularly polarized component of the perpendicular (to the static magnetic
          field) electric field, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      minus:
        range: GenericGridScalarComplex
        multivalued: true
        description: Right hand circularly polarized component of the perpendicular (to the static magnetic
          field) electric field, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      parallel:
        range: GenericGridScalarComplex
        multivalued: true
        description: Parallel (to the static magnetic field) component of electric field, given on various
          grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      normal:
        range: GenericGridScalarComplex
        multivalued: true
        description: Magnitude of wave electric field normal to a flux surface, given on various grid
          subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      bi_normal:
        range: GenericGridScalarComplex
        multivalued: true
        description: Magnitude of perpendicular (to the static magnetic field) wave electric field tangent
          to a flux surface, given on various grid subsets
        annotations:
          dd_units: V.m^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  GenericGridScalarComplex:
    is_a: InformationContentEntity
    description: Left hand circularly polarized component of the perpendicular (to the static magnetic
      field) electric field, given on various grid subsets
    annotations:
      dd_type_name: generic_grid_scalar_complex
      dd_path: waves/coherent_wave/full_wave/e_field/plus
    attributes:
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: Index of the grid subset the data is provided on
        annotations:
          dd_type: dynamic
      values:
        range: complex
        multivalued: true
        description: One scalar value is provided per element in the grid subset.
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      coefficients:
        range: complex
        multivalued: true
        description: Interpolation coefficients, to be used for a high precision evaluation of the physical
          quantity with finite elements, provided per element in the grid subset (first dimension).
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 2
          dd_coordinate1: ../values
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: ../values,1...N
  WavesCoherentWaveFullWaveBField:
    is_a: InformationContentEntity
    description: Components of the wave magnetic field, , represented as Fourier coefficients B(n_tor,frequency)
      such that the electric is equal to real(B(n_tor,frequency).exp(i(n_tor.phi - 2.pi.frequency.t)))
    annotations:
      dd_type_name: waves_coherent_wave_full_wave_b_field
      dd_path: waves/coherent_wave/full_wave/b_field
    attributes:
      parallel:
        range: GenericGridScalarComplex
        multivalued: true
        description: Parallel (to the static magnetic field) component of the wave magnetic field, given
          on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      normal:
        range: GenericGridScalarComplex
        multivalued: true
        description: Magnitude of wave magnetic field normal to a flux surface, given on various grid
          subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      bi_normal:
        range: GenericGridScalarComplex
        multivalued: true
        description: Magnitude of perpendicular (to the static magnetic field) wave magnetic field tangent
          to a flux surface, given on various grid subsets
        annotations:
          dd_units: T
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
