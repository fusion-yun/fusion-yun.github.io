          is outside of the separatrix.
        annotations:
          dd_units: m
      distance_x_point_z:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Distance in the z direction of the measurement position to the closest X-point (Zmeasurement-Zx_point)
        annotations:
          dd_units: m
      mach_number_parallel:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Parallel Mach number
        annotations:
          dd_units: '1'
      time_within_plunge:
        range: float
        multivalued: true
        description: Time vector for describing the dynamics within the plunge
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      time:
        range: float
        description: Time of maximum penetration of the probe during a given plunge
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
