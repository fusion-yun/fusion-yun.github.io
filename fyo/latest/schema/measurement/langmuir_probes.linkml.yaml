          fyo_domain: ../plunge(itime)/collector
      plunge:
        range: LangmuirProbesPlunge
        multivalued: true
        description: Set of plunges of this probe during the pulse, each plunge being recorded as a time
          slice from the Access Layer point of view. The time child node corresponds to the time of maximum
          penetration of the probe during a given plunge. The dynamics of physical quantities within the
          plunge are described via the time_within_plunge vector.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
  LangmuirProbesPlunge:
    is_a: TimeSlice
    description: Set of plunges of this probe during the pulse, each plunge being recorded as a time slice
      from the Access Layer point of view. The time child node corresponds to the time of maximum penetration
      of the probe during a given plunge. The dynamics of physical quantities within the plunge are described
      via the time_within_plunge vector.
    annotations:
      dd_type_name: langmuir_probes_plunge
      dd_path: langmuir_probes/reciprocating/plunge
      fyo_lift: time_slice
    attributes:
      position_average:
        range: LangmuirProbesPositionReciprocating
        description: Average position of the measurements derived from multiple collectors
