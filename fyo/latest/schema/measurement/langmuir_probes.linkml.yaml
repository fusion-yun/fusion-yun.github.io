          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      v_plasma:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Plasma potential
        annotations:
          dd_units: V
      t_e_average:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Electron temperature (upstream to downstream average)
        annotations:
          dd_units: eV
      t_i_average:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Ion temperature (upstream to downstream average)
        annotations:
          dd_units: eV
      n_e:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Electron density
        annotations:
          dd_units: m^-3
      b_field_angle:
        range: LangmuirProbesPlungePhysicalQuantity
        description: Incident angle of the magnetic field with respect to PFC surface
