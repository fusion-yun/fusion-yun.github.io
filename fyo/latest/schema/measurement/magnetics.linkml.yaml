id: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/magnetics
name: fyo-magnetics
title: fyo IDS `magnetics` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `magnetics` onto SpO/BFO (FYTOK-ADR-102): structures grounded
  as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.9.g5b9d6bbb/
  spo: https://fusion-yun.github.io/spo/latest/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/magnetics/dd_magnetics.xsd (import ancestry)
  fyo_category: measurement
  fyo_root_class: Magnetics
  provenance: Imported from IMAS DD 4.1.1 via dd2fyo; fyo evolves independently — hand
    edits are legitimate, dd_* annotations record DD ancestry.
classes:
  Magnetics:
    is_a: Dataset
    description: Magnetic diagnostics for equilibrium identification and plasma shape control.
    annotations:
      dd_path: magnetics
      fyo_category: measurement
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      flux_loop:
        range: MagneticsFluxLoop
        multivalued: true
        description: Flux loops; partial flux loops can be described. In case of differential loops, the
          geometry of differential flux loops is stored in the flux_loop indices of the primitive loops.
          Signals may be stored on the primitive loop indices but this is optional if the index of the
          primitive loop is referenced by a differential loop index
        annotations:
          dd_max_occurs: '200'
          dd_coordinate1: 1...N
      b_field_pol_probe:
        range: MagneticsBpolProbe
        multivalued: true
        description: Poloidal field probes
        annotations:
          dd_max_occurs: '200'
          dd_coordinate1: 1...N
      b_field_pol_probe_equivalent:
        range: integer
        multivalued: true
        description: Indices of equivalent poloidal field probes (from the b_field_pol_probe array) that
          differ only by their toroidal position and have the same (R,Z) position and the same coil orientation
          (poloidal and toroidal angles). Sets of equivalent probes (i.e. sets of (R, Z, poloidal_angle
          and toroidal_angle) values) are grouped by the first coordinate and the coils belonging to a
          given set are listed along the second coordinate. As an example, if there are N probes in a
          poloidal cross section that are replicated at the same poloidal positions and with the same
          orientation at 8 toroidal positions, the matrix will be of size Nx8.
        annotations:
          dd_type: static
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
      b_field_phi_probe:
        range: MagneticsBpolProbe
        multivalued: true
        description: Toroidal field probes
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      rogowski_coil:
        range: MagneticsRogowski
        multivalued: true
        description: Set of Rogowski coils. If some of the coils form a compound Rogowski sensor, they
          must be entered in contiguous order
        annotations:
          dd_max_occurs: '20'
          dd_coordinate1: 1...N
      shunt:
        range: MagneticsShunt
        multivalued: true
        description: Set of shunt resistances through which currents in the divertor structure are measured.
          Shunts are modelled as piecewise straight line segments in the poloidal plane.
        annotations:
          dd_max_occurs: '50'
          dd_coordinate1: 1...N
      ip:
        range: MagneticsMethodDistinct
        multivalued: true
        description: Plasma current. Positive sign means anti-clockwise when viewed from above. The array
          of structure corresponds to a set of calculation methods (starting with the generally recommended
          method).
        annotations:
          dd_units: A
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      diamagnetic_flux:
        range: MagneticsMethodDistinct
        multivalued: true
        description: Diamagnetic flux. The array of structure corresponds to a set of calculation methods
          (starting with the generally recommended method).
        annotations:
          dd_units: Wb
          dd_max_occurs: '5'
          dd_coordinate1: 1...N
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  MagneticsFluxLoop:
    is_a: InformationContentEntity
    description: Flux loops; partial flux loops can be described. In case of differential loops, the geometry
      of differential flux loops is stored in the flux_loop indices of the primitive loops. Signals may
      be stored on the primitive loop indices but this is optional if the index of the primitive loop
      is referenced by a differential loop index
    annotations:
      dd_type_name: magnetics_flux_loop
      dd_path: magnetics/flux_loop
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: Flux loop type
      position:
        range: Rphiz0dStatic
        multivalued: true
        description: List of (R,Z,phi) points defining the position of the loop (see data structure documentation
          FLUXLOOPposition.pdf). Leave empty if ../type/index = 6 (differential loop)
        annotations:
          dd_type: static
          dd_max_occurs: '10'
          dd_coordinate1: 1...N
      indices_differential:
        range: integer
        multivalued: true
        description: 'Indices (from the flux_loop array of structures) of the two loops used to build
          a differential measurement: loop(second index) - loop(first index). Use only if ../type/index
          = 6, leave empty otherwise.'
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      area:
        range: float
        description: Effective area (ratio between flux and average magnetic field over the loop). Leave
          empty if ../type/index = 6 (differential loop)
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      gm9:
        range: float
        description: Integral of 1/R over the loop area (ratio between flux and magnetic rigidity R0.B0).
          Use only if ../type/index = 3 to 5, leave empty otherwise.
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      flux:
        range: SignalFlt1dValidity
        description: Measured magnetic flux through loop with normal to enclosed surface determined by
          order of points
        annotations:
          dd_units: Wb
      voltage:
        range: SignalFlt1dValidity
        description: Measured voltage between the loop terminals
        annotations:
          dd_units: V
  MagneticsBpolProbe:
    is_a: InformationContentEntity
    description: Poloidal field probes
    annotations:
      dd_type_name: magnetics_bpol_probe
      dd_path: magnetics/b_field_pol_probe
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      type:
        range: Identifier
        description: Probe type
      position:
        range: Rphiz0dStatic
        description: R, Z, Phi position of the coil centre
      poloidal_angle:
        range: float
        description: Angle of the sensor normal vector (vector parallel to the the axis of the coil, n
          on the diagram) with respect to horizontal plane (clockwise theta-like angle). Zero if sensor
          normal vector fully in the horizontal plane and oriented towards increasing major radius. Values
          in [0 , 2Pi]
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      toroidal_angle:
        range: float
        description: Angle of the projection of the sensor normal vector (n) in the horizontal plane with
          the increasing R direction (i.e. grad(R)) (angle is counter-clockwise from above). Values should
          be taken modulo pi with values within (-pi/2,pi/2]. Zero if projected sensor normal is parallel
          to grad(R), pi/2 if it is parallel to grad(phi).
        annotations:
          dd_type: static
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      indices_differential:
        range: integer
        multivalued: true
        description: Indices (from the b_field_pol_probe array of structure) of the two probes used to
          build the field difference field(second index) - field(first index). Use only if ../type/index
          = 6, leave empty otherwise
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      bandwidth_3db:
        range: float
        multivalued: true
        description: '3dB bandwith (first index : lower frequency bound, second index : upper frequency
          bound)'
        annotations:
          dd_type: static
          dd_units: Hz
          dd_ndim: 1
          dd_coordinate1: 1...2
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...2
      area:
        range: float
        description: Area of each turn of the sensor; becomes effective area when multiplied by the turns
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      length:
        range: float
        description: Length of the sensor along it's normal vector (n)
        annotations:
          dd_type: static
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      turns:
        range: integer
        description: Turns in the coil, including sign
        annotations:
          dd_type: static
      field:
        range: SignalFlt1dValidity
        description: Magnetic field component in direction of sensor normal axis (n) averaged over sensor
          volume defined by area and length, where n = cos(poloidal_angle)*cos(toroidal_angle)*grad(R)
          - sin(poloidal_angle)*grad(Z) + cos(poloidal_angle)*sin(toroidal_angle)*grad(Phi)/norm(grad(Phi))
        annotations:
          dd_units: T
      voltage:
        range: SignalFlt1dValidity
        description: Voltage on the coil terminals
        annotations:
          dd_units: V
      non_linear_response:
        range: MagneticsBpolProbeNonLinear
        description: Non-linear response of the probe (typically in case of a Hall probe)
  MagneticsBpolProbeNonLinear:
    is_a: InformationContentEntity
    description: Non-linear response of the probe (typically in case of a Hall probe)
    annotations:
      dd_type_name: magnetics_bpol_probe_non_linear
      dd_path: magnetics/b_field_pol_probe/non_linear_response
    attributes:
      b_field_linear:
        range: float
        multivalued: true
        description: Array of magnetic field values (corresponding to the assumption of a linear relation
          between magnetic field and probe coil current), for each of which the probe non-linear response
          is given in ../b_field_non_linear
        annotations:
          dd_type: static
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      b_field_non_linear:
        range: float
        multivalued: true
        description: Magnetic field value taking into account the non-linear response of the probe
        annotations:
          dd_type: static
          dd_units: T
          dd_ndim: 1
          dd_coordinate1: ../b_field_linear
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../b_field_linear
  MagneticsRogowski:
    is_a: InformationContentEntity
    description: Set of Rogowski coils. If some of the coils form a compound Rogowski sensor, they must
      be entered in contiguous order
    annotations:
      dd_type_name: magnetics_rogowski
      dd_path: magnetics/rogowski_coil
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      measured_quantity:
        range: Identifier
        description: Quantity measured by the sensor
      position:
        range: Rphiz0dStatic
        multivalued: true
        description: List of (R,Z,phi) points defining the position of the coil guiding centre. Values
          defining a single segment must be entered in contiguous order
        annotations:
          dd_type: static
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      indices_compound:
        range: integer
        multivalued: true
        description: Indices (from the rogowski_coil array of structure) of the partial Rogowskis used
          to build the coumpound signal (sum of the partial Rogowski signals). Can be set to any unique
          integer value for each section of a compound Rogowski coil. Use only if ../measure_quantity/index
          = 5, leave empty otherwise
        annotations:
          dd_type: static
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      area:
        range: float
        description: Effective area of the loop wrapped around the guiding centre. In case of multiple
          layers, sum of the areas of each layer
        annotations:
          dd_type: static
          dd_units: m^2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      turns_per_metre:
        range: float
        description: Number of turns per unit length. In case of multiple layers, turns are counted for
          a single layer
        annotations:
          dd_type: static
          dd_units: m^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current:
        range: SignalFlt1dValidity
        description: Measured current inside the Rogowski coil contour. The normal direction to the Rogowski
          coil is defined by the order of points in the list of guiding centre positions. The current
          is positive when oriented in the same direction as the normal.
        annotations:
          dd_units: A
  MagneticsShunt:
    is_a: InformationContentEntity
    description: Set of shunt resistances through which currents in the divertor structure are measured.
      Shunts are modelled as piecewise straight line segments in the poloidal plane.
    annotations:
      dd_type_name: magnetics_shunt
      dd_path: magnetics/shunt
    attributes:
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      position:
        range: LineOfSight2pointsRz
        description: Position of shunt terminals
      resistance:
        range: float
        description: Shunt resistance
        annotations:
          dd_type: static
          dd_units: ohm
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      voltage:
        range: SignalFlt1dValidity
        description: Voltage on the shunt terminals (Vfirst_point-Vsecond_point)
        annotations:
          dd_units: V
      divertor_index:
        range: integer
        description: If the shunt is located on a given divertor, index of that divertor in the divertors
          IDS
        annotations:
          dd_type: static
      target_index:
        range: integer
        description: If the shunt is located on a divertor target, index of that target in the divertors
          IDS
        annotations:
          dd_type: static
      tile_index:
        range: integer
        description: If the shunt is located on a divertor tile, index of that tile in the divertors IDS
        annotations:
          dd_type: static
  LineOfSight2pointsRz:
    is_a: InformationContentEntity
    description: Position of shunt terminals
    annotations:
      dd_type_name: line_of_sight_2points_rz
      dd_path: magnetics/shunt/position
    attributes:
      first_point:
        range: Rz0dStatic
        description: Position of the first point
      second_point:
        range: Rz0dStatic
        description: Position of the second point
  MagneticsMethodDistinct:
    is_a: InformationContentEntity
    description: Plasma current. Positive sign means anti-clockwise when viewed from above. The array
      of structure corresponds to a set of calculation methods (starting with the generally recommended
      method).
    annotations:
      dd_type_name: magnetics_method_distinct
      dd_path: magnetics/ip
    attributes:
      method_name:
        range: string
        description: Name of the calculation method
        annotations:
          dd_type: static
      data:
        range: float
        multivalued: true
        description: Data
        annotations:
          dd_type: dynamic
          dd_units: as_parent
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
