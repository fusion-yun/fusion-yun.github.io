id: https://fusion-yun.github.io/fyo/v0.draft/transport_solver_numerics
name: fyo-imas-transport_solver_numerics
title: fyo IDS `transport_solver_numerics` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `transport_solver_numerics` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/transport_solver_numerics/dd_transport_solver_numerics.xsd via dd2linkml
    (mechanical layer — transient build artifact, not in-tree)
  fyo_category: simulation-workflow
  fyo_root_class: TransportSolverNumerics
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  TransportSolverNumerics:
    is_a: IDS
    description: Numerical quantities used by transport solvers and convergence details
    annotations:
      dd_path: transport_solver_numerics
      fyo_category: simulation-workflow
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      time_step:
        range: SignalFlt1d
        description: Internal time step used by the transport solver (assuming all transport equations
          are solved with the same time step)
        annotations:
          dd_units: s
      time_step_average:
        range: SignalFlt1d
        description: Average internal time step used by the transport solver between the previous and
          the current time stored for this quantity (assuming all transport equations are solved with
          the same time step)
        annotations:
          dd_units: s
      time_step_min:
        range: SignalFlt1d
        description: Minimum internal time step used by the transport solver between the previous and
          the current time stored for this quantity (assuming all transport equations are solved with
          the same time step)
        annotations:
          dd_units: s
      solver:
        range: Identifier
        description: Solver identifier
      primary_coordinate:
        range: Identifier
        description: 'Primary coordinate system with which the transport equations are solved. For a 1D
          transport solver: index = 1 means rho_tor_norm; 2 = rho_tor.'
      solver_1d:
        range: NumericsSolver1d
        multivalued: true
        description: Numerics related to 1D radial solver, for various time slices.
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      boundary_conditions_ggd:
        range: NumericsBcGgd
        multivalued: true
        description: Boundary conditions of the transport equations, provided on the GGD, for various
          time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition and in the
          normalization of current densities)
      restart_files:
        range: NumericsRestart
        multivalued: true
        description: Set of code-specific restart files for a given time slice. These files are managed
          by a physical application to ensure its restart during long simulations
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  NumericsSolver1d:
    is_a: TimeSlice
    description: Numerics related to 1D radial solver, for various time slices.
    annotations:
      dd_type_name: numerics_solver_1d
      dd_path: transport_solver_numerics/solver_1d
      fyo_lift: time_slice
    attributes:
      grid:
        range: CoreRadialGrid
        description: Radial grid
      equation:
        range: NumericsSolver1dEquation
        multivalued: true
        description: Set of transport equations
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      control_parameters:
        range: NumericsSolver1dEquationControlParameters
        description: Solver-specific input or output quantities
      drho_tor_dt:
        range: float
        multivalued: true
        description: Partial derivative of the toroidal flux coordinate profile with respect to time
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      d_dvolume_drho_tor_dt:
        range: float
        multivalued: true
        description: Partial derivative with respect to time of the derivative of the volume with respect
          to the toroidal flux coordinate
        annotations:
          dd_type: dynamic
          dd_units: m^2.s^-1
          dd_ndim: 1
          dd_coordinate1: ../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../grid/rho_tor_norm
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NumericsSolver1dEquation:
    is_a: InformationContentEntity
    description: Set of transport equations
    annotations:
      dd_type_name: numerics_solver_1d_equation
      dd_path: transport_solver_numerics/solver_1d/equation
    attributes:
      primary_quantity:
        range: NumericsSolver1dEquationPrimary
        description: Profile and derivatives of the primary quantity of the transport equation
      computation_mode:
        range: Identifier
        description: Computation mode for this equation
      boundary_condition:
        range: NumericsSolver1dEquationBc
        multivalued: true
        description: Set of boundary conditions of the transport equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      coefficient:
        range: NumericsSolver1dEquationCoefficient
        multivalued: true
        description: Set of numerical coefficients involved in the transport equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      convergence:
        range: NumericsConvergenceEquationsSingle
        description: Convergence details
  NumericsSolver1dEquationPrimary:
    is_a: InformationContentEntity
    description: Profile and derivatives of the primary quantity of the transport equation
    annotations:
      dd_type_name: numerics_solver_1d_equation_primary
      dd_path: transport_solver_numerics/solver_1d/equation/primary_quantity
    attributes:
      identifier:
        range: Identifier
        description: 'Identifier of the primary quantity of the transport equation. The description node
          contains the path to the quantity in the physics IDS (example: core_profiles/profiles_1d/ion(1)/density)'
      ion_index:
        range: integer
        description: If the primary quantity is related to a ion species, index of the corresponding species
          in the core_profiles/profiles_1d/ion array
        annotations:
          dd_type: dynamic
      neutral_index:
        range: integer
        description: If the primary quantity is related to a neutral species, index of the corresponding
          species in the core_profiles/profiles_1d/neutral array
        annotations:
          dd_type: dynamic
      state_index:
        range: integer
        description: If the primary quantity is related to a particular state (of an ion or a neutral
          species), index of the corresponding state in the core_profiles/profiles_1d/ion (or neutral)/state
          array
        annotations:
          dd_type: dynamic
      profile:
        range: float
        multivalued: true
        description: Profile of the primary quantity
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      d_dr:
        range: float
        multivalued: true
        description: Radial derivative with respect to the primary coordinate
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      d2_dr2:
        range: float
        multivalued: true
        description: Second order radial derivative with respect to the primary coordinate
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      d_dt:
        range: float
        multivalued: true
        description: Time derivative
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      d_dt_cphi:
        range: float
        multivalued: true
        description: Derivative with respect to time, at constant toroidal flux (for current diffusion
          equation)
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
      d_dt_cr:
        range: float
        multivalued: true
        description: Derivative with respect to time, at constant primary coordinate coordinate (for current
          diffusion equation)
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
  NumericsSolver1dEquationBc:
    is_a: InformationContentEntity
    description: Set of boundary conditions of the transport equation
    annotations:
      dd_type_name: numerics_solver_1d_equation_bc
      dd_path: transport_solver_numerics/solver_1d/equation/boundary_condition
    attributes:
      type:
        range: Identifier
        description: Boundary condition type
      value:
        range: float
        multivalued: true
        description: Value of the boundary condition. For type/index = 1 to 3, only the first position
          in the vector is used. For type/index = 5, all three positions are used, meaning respectively
          a1, a2, a3.
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: 1...3
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...3
      position:
        range: float
        description: Position, in terms of the primary coordinate, at which the boundary condition is
          imposed. Outside this position, the value of the data are considered to be prescribed (in case
          of a single boundary condition).
        annotations:
          dd_type: dynamic
          dd_units: mixed
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NumericsSolver1dEquationCoefficient:
    is_a: InformationContentEntity
    description: Set of numerical coefficients involved in the transport equation
    annotations:
      dd_type_name: numerics_solver_1d_equation_coefficient
      dd_path: transport_solver_numerics/solver_1d/equation/coefficient
    attributes:
      profile:
        range: float
        multivalued: true
        description: Radial profile of the numerical coefficient
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 1
          dd_coordinate1: ../../../grid/rho_tor_norm
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../../grid/rho_tor_norm
  NumericsConvergenceEquationsSingle:
    is_a: InformationContentEntity
    description: Convergence details
    annotations:
      dd_type_name: numerics_convergence_equations_single
      dd_path: transport_solver_numerics/solver_1d/equation/convergence
    attributes:
      iterations_n:
        range: integer
        description: Number of iterations carried out in the convergence loop
        annotations:
          dd_type: dynamic
      delta_relative:
        range: NumericsConvergenceEquationsSingleDelta
        description: Relative deviation on the primary quantity of the transport equation between the
          present and the  previous iteration of the solver
  NumericsConvergenceEquationsSingleDelta:
    is_a: InformationContentEntity
    description: Relative deviation on the primary quantity of the transport equation between the present
      and the  previous iteration of the solver
    annotations:
      dd_type_name: numerics_convergence_equations_single_delta
      dd_path: transport_solver_numerics/solver_1d/equation/convergence/delta_relative
    attributes:
      value:
        range: float
        description: Value of the relative deviation
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      expression:
        range: string
        description: Expression used by the solver to calculate the relative deviation
        annotations:
          dd_type: dynamic
  NumericsSolver1dEquationControlParameters:
    is_a: InformationContentEntity
    description: Solver-specific input or output quantities
    annotations:
      dd_type_name: numerics_solver_1d_equation_control_parameters
      dd_path: transport_solver_numerics/solver_1d/control_parameters
    attributes:
      integer0d:
        range: NumericsSolver1dEquationControlInt
        multivalued: true
        description: Set of integer type scalar control parameters
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      real0d:
        range: NumericsSolver1dEquationControlFloat
        multivalued: true
        description: Set of real type scalar control parameters
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  NumericsSolver1dEquationControlInt:
    is_a: InformationContentEntity
    description: Set of integer type scalar control parameters
    annotations:
      dd_type_name: numerics_solver_1d_equation_control_int
      dd_path: transport_solver_numerics/solver_1d/control_parameters/integer0d
    attributes:
      name:
        range: string
        description: Name of the control parameter
        annotations:
          dd_type: dynamic
      value:
        range: integer
        description: Value of the control parameter
        annotations:
          dd_type: dynamic
  NumericsSolver1dEquationControlFloat:
    is_a: InformationContentEntity
    description: Set of real type scalar control parameters
    annotations:
      dd_type_name: numerics_solver_1d_equation_control_float
      dd_path: transport_solver_numerics/solver_1d/control_parameters/real0d
    attributes:
      name:
        range: string
        description: Name of the control parameter
        annotations:
          dd_type: dynamic
      value:
        range: float
        description: Value of the control parameter
        annotations:
          dd_type: dynamic
          dd_units: mixed
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NumericsBcGgd:
    is_a: TimeSlice
    description: Boundary conditions of the transport equations, provided on the GGD, for various time
      slices
    annotations:
      dd_type_name: numerics_bc_ggd
      dd_path: transport_solver_numerics/boundary_conditions_ggd
      fyo_lift: time_slice
    attributes:
      grid:
        range: GenericGridDynamic
        description: Grid description
      current:
        range: NumericsBcGgdCurrent
        multivalued: true
        description: Boundary condition for the current diffusion equation, on various grid subsets
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      electrons:
        range: NumericsBcGgdElectrons
        description: Quantities related to the electrons
      ion:
        range: NumericsBcGgdIon
        multivalued: true
        description: Quantities related to the different ion species
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NumericsBcGgdCurrent:
    is_a: InformationContentEntity
    description: Boundary condition for the current diffusion equation, on various grid subsets
    annotations:
      dd_type_name: numerics_bc_ggd_current
      dd_path: transport_solver_numerics/boundary_conditions_ggd/current
    attributes:
      identifier:
        range: Identifier
        description: Identifier of the boundary condition type. List of options TBD.
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: Index of the grid subset the data is provided on
        annotations:
          dd_type: dynamic
      values:
        range: float
        multivalued: true
        description: 'List of vector components, one list per element in the grid subset. First dimenstion:
          element index. Second dimension: vector component index (for ID = 1 to 3, only the first position
          in the vector is used. For ID = 5, all three positions are used, meaning respectively a1, a2,
          a3)'
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
  NumericsBcGgdElectrons:
    is_a: InformationContentEntity
    description: Quantities related to the electrons
    annotations:
      dd_type_name: numerics_bc_ggd_electrons
      dd_path: transport_solver_numerics/boundary_conditions_ggd/electrons
    attributes:
      particles:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the electron density equation (density if ID = 1), on various
          grid subsets
        annotations:
          dd_units: m^-3.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      energy:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the electron energy equation (temperature if ID = 1), on various
          grid subsets
        annotations:
          dd_units: W.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  NumericsBcGgdBc:
    is_a: InformationContentEntity
    description: Boundary condition for the electron density equation (density if ID = 1), on various
      grid subsets
    annotations:
      dd_type_name: numerics_bc_ggd_bc
      dd_path: transport_solver_numerics/boundary_conditions_ggd/electrons/particles
    attributes:
      identifier:
        range: Identifier
        description: Identifier of the boundary condition type. List of options TBD.
        annotations:
          dd_units: eV
      grid_index:
        range: integer
        description: Index of the grid used to represent this quantity
        annotations:
          dd_type: dynamic
      grid_subset_index:
        range: integer
        description: Index of the grid subset the data is provided on
        annotations:
          dd_type: dynamic
      values:
        range: float
        multivalued: true
        description: 'List of vector components, one list per element in the grid subset. First dimenstion:
          element index. Second dimension: vector component index (for ID = 1 to 3, only the first position
          in the vector is used. For ID = 5, all three positions are used, meaning respectively a1, a2,
          a3)'
        annotations:
          dd_type: dynamic
          dd_units: mixed
          dd_ndim: 2
          dd_coordinate1: 1...N
          dd_coordinate2: 1...N
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...N,1...N
  NumericsBcGgdIon:
    is_a: InformationContentEntity
    description: Quantities related to the different ion species
    annotations:
      dd_type_name: numerics_bc_ggd_ion
      dd_path: transport_solver_numerics/boundary_conditions_ggd/ion
    attributes:
      a:
        range: float
        description: Mass of atom
        annotations:
          dd_type: dynamic
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_ion:
        range: float
        description: Ion charge (of the dominant ionization state; lumped ions are allowed)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_n:
        range: float
        description: Nuclear charge
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying ion (e.g. H+, D+, T+, He+2, C+, ...)
        annotations:
          dd_type: dynamic
      particles:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the ion density equation (density if ID = 1), on various grid
          subsets
        annotations:
          dd_units: m^-3.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      energy:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the ion energy equation (temperature if ID = 1), on various
          grid subsets
        annotations:
          dd_units: W.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      multiple_states_flag:
        range: integer
        description: 'Multiple states calculation flag : 0-Only one state is considered; 1-Multiple states
          are considered and are described in the state structure'
        annotations:
          dd_type: dynamic
      state:
        range: NumericsBcGgdIonChargeState
        multivalued: true
        description: Quantities related to the different states of the species (ionization, energy, excitation,
          ...)
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  NumericsBcGgdIonChargeState:
    is_a: InformationContentEntity
    description: Quantities related to the different states of the species (ionization, energy, excitation,
      ...)
    annotations:
      dd_type_name: numerics_bc_ggd_ion_charge_state
      dd_path: transport_solver_numerics/boundary_conditions_ggd/ion/state
    attributes:
      z_min:
        range: float
        description: Minimum Z of the charge state bundle
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      z_max:
        range: float
        description: Maximum Z of the charge state bundle
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: String identifying charge state (e.g. C+, C+2 , C+3, C+4, C+5, C+6, ...)
        annotations:
          dd_type: dynamic
      vibrational_level:
        range: float
        description: Vibrational level (can be bundled)
        annotations:
          dd_type: dynamic
          dd_units: e
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      vibrational_mode:
        range: string
        description: Vibrational mode of this state, e.g. "A_g". Need to define, or adopt a standard nomenclature.
        annotations:
          dd_type: dynamic
      is_neutral:
        range: integer
        description: Flag specifying if this state corresponds to a neutral (1) or not (0)
        annotations:
          dd_type: dynamic
      neutral_type:
        range: Identifier
        description: 'Neutral type (if the considered state is a neutral), in terms of energy. ID =1:
          cold; 2: thermal; 3: fast; 4: NBI'
      electron_configuration:
        range: string
        description: Configuration of atomic orbitals of this state, e.g. 1s2-2s1
        annotations:
          dd_type: dynamic
      particles:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the charge state density equation (density if ID = 1), on
          various grid subsets
        annotations:
          dd_units: m^-3.s^-1
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      energy:
        range: NumericsBcGgdBc
        multivalued: true
        description: Boundary condition for the charge state energy equation (temperature if ID = 1),
          on various grid subsets
        annotations:
          dd_units: W.m^-3
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
  NumericsRestart:
    is_a: TimeSlice
    description: Set of code-specific restart files for a given time slice. These files are managed by
      a physical application to ensure its restart during long simulations
    annotations:
      dd_type_name: numerics_restart
      dd_path: transport_solver_numerics/restart_files
      fyo_lift: time_slice
    attributes:
      names:
        range: string
        multivalued: true
        description: Names of the restart files
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      descriptions:
        range: string
        multivalued: true
        description: Descriptions of the restart files
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../names
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../names
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
