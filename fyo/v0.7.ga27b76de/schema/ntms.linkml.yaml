id: https://fusion-yun.github.io/fyo/v0.draft/ntms
name: fyo-imas-ntms
title: fyo IDS `ntms` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `ntms` onto SpO/BFO (FYTOK-ADR-102): structures grounded as
  ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier classes (Signal
  / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations (reverse map
  ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/ntms/dd_ntms.xsd via dd2linkml (mechanical layer — transient build artifact,
    not in-tree)
  fyo_category: physics-state
  fyo_root_class: Ntms
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  Ntms:
    is_a: IDS
    description: Description of neoclassical tearing modes
    annotations:
      dd_path: ntms
      fyo_category: physics-state
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      vacuum_toroidal_field:
        range: BTorVacuum1
        description: Characteristics of the vacuum toroidal field (used in rho_tor definition)
      time_slice:
        range: NtmTimeSlice
        multivalued: true
        description: Description of neoclassical tearing modes for various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  NtmTimeSlice:
    is_a: TimeSlice
    description: Description of neoclassical tearing modes for various time slices
    annotations:
      dd_type_name: ntm_time_slice
      dd_path: ntms/time_slice
      fyo_lift: time_slice
    attributes:
      mode:
        range: NtmTimeSliceMode
        multivalued: true
        description: List of the various NTM modes appearing during the simulation. If a mode appears
          several times, use several indices in this array of structure with the same m,n values.
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
  NtmTimeSliceMode:
    is_a: InformationContentEntity
    description: List of the various NTM modes appearing during the simulation. If a mode appears several
      times, use several indices in this array of structure with the same m,n values.
    annotations:
      dd_type_name: ntm_time_slice_mode
      dd_path: ntms/time_slice/mode
    attributes:
      onset:
        range: NtmTimeSliceModeOnset
        description: NTM onset characteristics
      width:
        range: float
        description: Full width of the mode
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      dwidth_dt:
        range: float
        description: Time derivative of the full width of the mode
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phase:
        range: float
        description: Phase of the mode
        annotations:
          dd_type: dynamic
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      dphase_dt:
        range: float
        description: Time derivative of the phase of the mode
        annotations:
          dd_type: dynamic
          dd_units: rad.s^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      frequency:
        range: float
        description: Frequency of the mode
        annotations:
          dd_type: dynamic
          dd_units: Hz
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      dfrequency_dt:
        range: float
        description: Time derivative of the frequency of the mode
        annotations:
          dd_type: dynamic
          dd_units: s^-2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      n_phi:
        range: integer
        description: Toroidal mode number
        annotations:
          dd_type: dynamic
      m_pol:
        range: integer
        description: Poloidal mode number
        annotations:
          dd_type: dynamic
      deltaw:
        range: NtmTimeSliceModeEvolutionDeltaw
        multivalued: true
        description: deltaw contributions to the Rutherford equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      torque:
        range: NtmTimeSliceModeEvolutionTorque
        multivalued: true
        description: torque contributions to the Rutherford equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      calculation_method:
        range: string
        description: Description of how the mode evolution is calculated
        annotations:
          dd_type: dynamic
      delta_diff:
        range: float
        multivalued: true
        description: Extra diffusion coefficient for the transport equations of Te, ne, Ti
        annotations:
          dd_type: dynamic
          dd_units: m^2.s^-1
          dd_ndim: 1
          dd_coordinate1: 1...3
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...3
      rho_tor_norm:
        range: float
        description: Normalized flux coordinate on which the mode is centred
        annotations:
          dd_type: dynamic
          dd_units: '1'
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      rho_tor:
        range: float
        description: Flux coordinate on which the mode is centred
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      detailed_evolution:
        range: NtmTimeSliceModeDetailedEvolution
        description: Detailed NTM evolution on a finer timebase than the time_slice array of structure
  NtmTimeSliceModeOnset:
    is_a: InformationContentEntity
    description: NTM onset characteristics
    annotations:
      dd_type_name: ntm_time_slice_mode_onset
      dd_path: ntms/time_slice/mode/onset
    attributes:
      width:
        range: float
        description: Seed island full width at onset time
        annotations:
          dd_type: dynamic
          dd_units: m
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time_onset:
        range: float
        description: Onset time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      time_offset:
        range: float
        description: Offset time (when a mode disappears). If the mode reappears later in the simulation,
          use another index of the mode array of structure
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      phase:
        range: float
        description: Phase of the mode at onset
        annotations:
          dd_type: dynamic
          dd_units: rad
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      n_phi:
        range: integer
        description: Toroidal mode number
        annotations:
          dd_type: dynamic
      m_pol:
        range: integer
        description: Poloidal mode number
        annotations:
          dd_type: dynamic
      cause:
        range: string
        description: Cause of the mode onset
        annotations:
          dd_type: dynamic
  NtmTimeSliceModeEvolutionDeltaw:
    is_a: InformationContentEntity
    description: deltaw contributions to the Rutherford equation
    annotations:
      dd_type_name: ntm_time_slice_mode_evolution_deltaw
      dd_path: ntms/time_slice/mode/deltaw
    attributes:
      value:
        range: float
        description: Value of the contribution
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: Name of the contribution
        annotations:
          dd_type: dynamic
  NtmTimeSliceModeEvolutionTorque:
    is_a: InformationContentEntity
    description: torque contributions to the Rutherford equation
    annotations:
      dd_type_name: ntm_time_slice_mode_evolution_torque
      dd_path: ntms/time_slice/mode/torque
    attributes:
      value:
        range: float
        description: Value of the contribution
        annotations:
          dd_type: dynamic
          dd_units: kg.m^2.s^-2
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      name:
        range: string
        description: Name of the contribution
        annotations:
          dd_type: dynamic
  NtmTimeSliceModeDetailedEvolution:
    is_a: InformationContentEntity
    description: Detailed NTM evolution on a finer timebase than the time_slice array of structure
    annotations:
      dd_type_name: ntm_time_slice_mode_detailed_evolution
      dd_path: ntms/time_slice/mode/detailed_evolution
    attributes:
      time_detailed:
        range: float
        multivalued: true
        description: Time array used to describe the detailed evolution of the NTM
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      width:
        range: float
        multivalued: true
        description: Full width of the mode
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      dwidth_dt:
        range: float
        multivalued: true
        description: Time derivative of the full width of the mode
        annotations:
          dd_type: dynamic
          dd_units: m.s^-1
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      phase:
        range: float
        multivalued: true
        description: Phase of the mode
        annotations:
          dd_type: dynamic
          dd_units: rad
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      dphase_dt:
        range: float
        multivalued: true
        description: Time derivative of the phase of the mode
        annotations:
          dd_type: dynamic
          dd_units: rad.s^-1
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      frequency:
        range: float
        multivalued: true
        description: Frequency of the mode
        annotations:
          dd_type: dynamic
          dd_units: Hz
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      dfrequency_dt:
        range: float
        multivalued: true
        description: Time derivative of the frequency of the mode
        annotations:
          dd_type: dynamic
          dd_units: s^-2
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      n_phi:
        range: integer
        description: Toroidal mode number
        annotations:
          dd_type: dynamic
      m_pol:
        range: integer
        description: Poloidal mode number
        annotations:
          dd_type: dynamic
      deltaw:
        range: NtmTimeSliceModeDetailedEvolutionDeltaw
        multivalued: true
        description: deltaw contributions to the Rutherford equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      torque:
        range: NtmTimeSliceModeDetailedEvolutionTorque
        multivalued: true
        description: torque contributions to the Rutherford equation
        annotations:
          dd_max_occurs: unbounded
          dd_coordinate1: 1...N
      calculation_method:
        range: string
        description: Description of how the mode evolution is calculated
        annotations:
          dd_type: dynamic
      delta_diff:
        range: float
        multivalued: true
        description: Extra diffusion coefficient for the transport equations of Te, ne, Ti
        annotations:
          dd_type: dynamic
          dd_units: m^2.s^-1
          dd_ndim: 2
          dd_coordinate1: 1...3
          dd_coordinate2: ../time_detailed
          spo_class: spo:Field
          fyo_lift: field
          fyo_domain: 1...3,../time_detailed
      rho_tor_norm:
        range: float
        multivalued: true
        description: Normalized flux coordinate on which the mode is centred
        annotations:
          dd_type: dynamic
          dd_units: '1'
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
      rho_tor:
        range: float
        multivalued: true
        description: Flux coordinate on which the mode is centred
        annotations:
          dd_type: dynamic
          dd_units: m
          dd_ndim: 1
          dd_coordinate1: ../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../time_detailed
  NtmTimeSliceModeDetailedEvolutionDeltaw:
    is_a: InformationContentEntity
    description: deltaw contributions to the Rutherford equation
    annotations:
      dd_type_name: ntm_time_slice_mode_detailed_evolution_deltaw
      dd_path: ntms/time_slice/mode/detailed_evolution/deltaw
    attributes:
      value:
        range: float
        multivalued: true
        description: Value of the contribution
        annotations:
          dd_type: dynamic
          dd_units: m^-1
          dd_ndim: 1
          dd_coordinate1: ../../time_detailed
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../../time_detailed
      name:
        range: string
        description: Name of the contribution
        annotations:
          dd_type: dynamic
  NtmTimeSliceModeDetailedEvolutionTorque:
    is_a: InformationContentEntity
    description: torque contributions to the Rutherford equation
    annotations:
      dd_type_name: ntm_time_slice_mode_detailed_evolution_torque
      dd_path: ntms/time_slice/mode/detailed_evolution/torque
    attributes:
      value:
        range: float
        multivalued: true
        description: Value of the contribution
        annotations:
          dd_type: dynamic
          dd_units: kg.m^2.s^-2
          dd_ndim: 1
          dd_coordinate1: ../../time_detailed
          spo_class: spo:Function
