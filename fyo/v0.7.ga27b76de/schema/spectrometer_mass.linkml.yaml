id: https://fusion-yun.github.io/fyo/v0.draft/spectrometer_mass
name: fyo-imas-spectrometer_mass
title: fyo IDS `spectrometer_mass` (lifted, DD 4.1.1)
description: 'Semantic lift of IMAS DD IDS `spectrometer_mass` onto SpO/BFO (FYTOK-ADR-102): structures
  grounded as ICEs, time-slice AoS elements as spo:TimeSlice, leaves annotated with their spo carrier
  classes (Signal / Field / Function / QuantityValue / TimeAxis). Layout is preserved in dd_* annotations
  (reverse map ω).'
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  fyo: https://fusion-yun.github.io/fyo/v0.draft/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  imas: https://imas.iter.org/dd/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: fyo
default_range: string
imports:
- linkml:types
- spo
- fyo-core
- fyo-common
annotations:
  generated_by: dd2fyo 0.1.0
  dd_version: 4.1.1
  dd_source: IMAS DD schemas/spectrometer_mass/dd_spectrometer_mass.xsd via dd2linkml (mechanical layer
    — transient build artifact, not in-tree)
  fyo_category: diagnostic
  fyo_root_class: SpectrometerMass
  provenance: DO NOT EDIT — regenerate via scripts/dd2fyo.py.
classes:
  SpectrometerMass:
    is_a: IDS
    description: Mass spectrometer diagnostic
    annotations:
      dd_path: spectrometer_mass
      fyo_category: diagnostic
    attributes:
      ids_properties:
        range: IdsProperties
        description: Interface Data Structure properties. This element identifies the node above as an
          IDS
      name:
        range: string
        description: Short string identifier (unique for a given device)
        annotations:
          dd_type: static
      description:
        range: string
        description: Description, e.g. “channel viewing the upper divertor”
        annotations:
          dd_type: static
      channel:
        range: SpectrometerMassChannel
        multivalued: true
        description: Set of mass channels, each corresponding to a given atomic mass measured continuously
          by the spectrometer
        annotations:
          dd_max_occurs: '100'
          dd_coordinate1: 1...N
      residual_spectrum:
        range: SpectrometerMassResidual
        multivalued: true
        description: Set of entire mass spectra recorded at various time slices
        annotations:
          dd_type: dynamic
          dd_max_occurs: unbounded
          dd_coordinate1: time
          fyo_layout: aos
      emission_current:
        range: float
        description: Emission current in the spectrometer filament
        annotations:
          dd_type: static
          dd_units: A
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      detector_voltage:
        range: float
        description: Voltage applied on the microchannel plate detector
        annotations:
          dd_type: static
          dd_units: V
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      latency:
        range: float
        description: Upper bound of the delay between physical information received by the detector and
          data available on the real-time (RT) network.
        annotations:
          dd_type: static
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      code:
        range: IdsCode
        description: Generic decription of the code-specific parameters for the code that has produced
          this IDS
      time:
        range: float
        multivalued: true
        description: Generic time
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpectrometerMassChannel:
    is_a: InformationContentEntity
    description: Set of mass channels, each corresponding to a given atomic mass measured continuously
      by the spectrometer
    annotations:
      dd_type_name: spectrometer_mass_channel
      dd_path: spectrometer_mass/channel
    attributes:
      a:
        range: float
        description: Atomic mass measured by this channel
        annotations:
          dd_type: constant
          dd_units: u
          spo_class: spo:QuantityValue
          fyo_lift: quantity
      current:
        range: float
        multivalued: true
        description: Collected current
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      pressure_partial:
        range: float
        multivalued: true
        description: Partial pressure (calibrated data)
        annotations:
          dd_type: dynamic
          dd_units: Pa
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      photomultiplier_voltage:
        range: float
        multivalued: true
        description: Voltage applied to the photomultiplier
        annotations:
          dd_type: dynamic
          dd_units: V
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      validity:
        range: integer
        description: 'Indicator of the validity of the data. 0: Valid from automated processing; 1: Valid
          and certified by the diagnostic RO; -1: Problem identified in the data processing (request verification
          by the diagnostic RO); -2: Invalid data, should not be used. (Values less than -2 have a code-specific
          meaning)'
        annotations:
          dd_type: constant
      validity_timed:
        range: integer
        multivalued: true
        description: 'Indicator of the validity of the data for each time slice. 0: Valid from automated
          processing; 1: Valid and certified by the diagnostic RO; -1: Means problem identified in the
          data processing (request verification by the diagnostic RO); -2: Invalid data, should not be
          used. (Values less than -2 have a code-specific meaning.)'
        annotations:
          dd_type: dynamic
          dd_ndim: 1
          dd_coordinate1: ../time
          spo_class: spo:Signal
          fyo_lift: signal
      time:
        range: float
        multivalued: true
        description: Timebase for the dynamic nodes of this channel
        annotations:
          dd_type: dynamic
          dd_units: s
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:TimeAxis
          fyo_lift: time_axis
          fyo_domain: 1...N
  SpectrometerMassResidual:
    is_a: TimeSlice
    description: Set of entire mass spectra recorded at various time slices
    annotations:
      dd_type_name: spectrometer_mass_residual
      dd_path: spectrometer_mass/residual_spectrum
      fyo_lift: time_slice
    attributes:
      a:
        range: float
        multivalued: true
        description: Array of atomic masses
        annotations:
          dd_type: dynamic
          dd_units: u
          dd_ndim: 1
          dd_coordinate1: 1...N
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: 1...N
      current:
        range: float
        multivalued: true
        description: Collected current
        annotations:
          dd_type: dynamic
          dd_units: A
          dd_ndim: 1
          dd_coordinate1: ../a
          spo_class: spo:Function
          fyo_lift: field
          fyo_domain: ../a
      time:
        range: float
        description: Time
        annotations:
          dd_type: dynamic
          dd_units: s
          spo_class: spo:QuantityValue
          fyo_lift: quantity
