# SPDX-License-Identifier: CC-BY-ND-4.0
# spo-provenance — orthogonal provenance mixin (L7 / C-12). DD ids_properties / code / library lift
# to PROV-O / IAO, orthogonal to the domain ontology (a mixin, not in the physical class hierarchy).
# Provenance time ≠ physical time. FYTOK-REPORT-05 §rpt05-provenance.
id: https://fusion-yun.github.io/spo/v0.draft/provenance
name: spo-provenance
title: Spo Provenance — PROV-O / IAO Orthogonal Mixin
description: ids_properties / code / library as provenance information artifacts, mixed into domain classes.
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.draft/
  iao: http://purl.obolibrary.org/obo/IAO_
  prov: http://www.w3.org/ns/prov#
default_prefix: spo
default_range: string
imports:
- linkml:types
- spo-core.linkml
annotations:
  spo_module: provenance
  spo_version: 0.2.0

classes:
  ProvenanceMixin:
    mixin: true
    description: >-
      Orthogonal provenance carried by any domain ICE (L7). Provenance time (creation_date / version
      order) is distinct from physical time (manifold coordinate). Also carries the data **modality**
      (static-device / measured / reconstructed / simulated) — derived from the generating process,
      orthogonal to the domain category (FYTOK-REPORT-05 §rpt05-modality).
    attributes:
      provider:
        range: string
        slot_uri: prov:wasAttributedTo
        description: The agent that provided the data (DD ids_properties/provider → prov:Agent).
      creation_date:
        range: string
        slot_uri: prov:generatedAtTime
        description: Provenance time of generation (≠ physical time).
      version_put:
        range: string
        description: DD / Access-Layer version the data was written with (prov:Entity).
    slots:
    - produced_by
    - modality
    - generated_by_process
    - reproducible

  Code:
    is_a: InformationContentEntity
    description: The code that produced an IDS (DD code = name / commit / version / repository) — a prov:SoftwareAgent + prov:Activity.
    attributes:
      name: {range: string}
      commit: {range: string}
      version: {range: string}
      repository: {range: string}
    slots:
    - uses_library

  Library:
    is_a: InformationContentEntity
    description: A dependency library used by a Code (DD code/library[]) — a prov:SoftwareAgent.
    attributes:
      name: {range: string}
      commit: {range: string}
      version: {range: string}
      repository: {range: string}

  ProcessRecord:
    is_a: InformationContentEntity
    description: >-
      The RECORD of a process — an ICE generated by and about an Occurrent (prov:Entity
      wasGeneratedBy the Activity). The experiment / record split: a Shot (PlannedProcess) is
      unrepeatable and unstorable; what a data system holds is its ProcessRecord (the shot
      file, the populated IDS set, the logbook entry). The record is mutable/versionable and
      may be partial or wrong about the process; the process itself is neither.
    slots:
    - is_record_of

  ComputationRecord:
    is_a: ProcessRecord
    description: >-
      The record of a ComputationalProcess — a run manifest: which Code (program, GDC) was
      executed, with which inputs, producing which outputs (workflow-run document, solver
      log). Completes the program / computation / result triangle: Code (plan, GDC) —
      ComputationalProcess (occurrent, realizes the Code) — output ICEs (results) — this
      record (information about the run, distinct from the results themselves).
    slots:
    - executed_code

slots:
  is_record_of:
    description: The process this record is about and generated by (iao:is_about + prov:wasGeneratedBy).
    range: Process
  executed_code:
    description: The Code (program) whose execution this record documents (prov:used the plan).
    range: Code
  produced_by:
    description: The Code (activity / agent) that produced this artifact.
    range: Code
    slot_uri: prov:wasGeneratedBy
  uses_library:
    description: A library this code depends on.
    range: Library
    multivalued: true
  modality:
    description: >-
      The provenance modality of the data — how it was generated, orthogonal to its domain category.
      Derived from the generating process (and DD code/source), NOT from DD `type` (§rpt05-modality).
    range: DataModality
  generated_by_process:
    description: >-
      The process that generated the data — MeasurementProcess / ComputationalProcess /
      EngineeringDetermination (spo-core). The truthmaker of `modality`.
    range: Process
  reproducible:
    description: >-
      Whether the data can be regenerated identically — true for simulated / reconstructed / static
      device, false for measured (a unique, unrepeatable discharge event).
    range: boolean

enums:
  DataModality:
    description: >-
      The provenance modality of a datum (FYTOK-REPORT-05 §rpt05-modality). Orthogonal to the domain
      category; derived from the generating process, not from DD `type` (which only gives static/dynamic).
    permissible_values:
      static_device:
        description: A static, invariant fact about the physical device (e.g. probe position); engineering-determined, constant.
      measured:
        description: Acquired by a real measurement process during a specific discharge; read-only, NOT reproducible, per-shot distinct.
      reconstructed:
        description: Computed from measured inputs (e.g. EFIT equilibrium over real magnetics) — measured-derived, reproducible given the inputs.
      simulated:
        description: Computed from a model independent of any real discharge; reproducible from (code, inputs, version).
