# spo-manifest.yaml — language-neutral manifest for the Sp ecosystem ontology (spo).
#
# This file is the SINGLE, LANGUAGE-NEUTRAL source of truth for the ontology package:
# its identity (IRI), version, module set, prefixes, and compiled-target locations.
# It REPLACES the Python-side ``MODULES`` / ``PREFIXES`` dicts — the Python loader
# (``sp.model.ontology``) now derives them from here, and any other-language binding
# reads this same file. No Python is required to enumerate or locate the ontology.
#
# LANGUAGE-NEUTRALITY BOUNDARY — what is neutral vs Python-bound: everything here is
# neutral; the spo-class -> Python-carrier map is a LANGUAGE BINDING and lives with the
# Python adapter (../src/sp/model/ontology/carrier-map.python.yaml), NOT in this
# neutral core.
id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/spo
name: spo
version: 0.5.1
license: Apache-2.0
description: >-
  Sp ecosystem ontology (LinkML T-Box): BFO-3D core + 4D spacetime extension,
  quantity-over-domain family, domains/regions, geometry, time (AoS/SoA duality,
  spacetime mesh), quantity kinds/units, controlled vocab, provenance +
  data-modality + process records. Domain-neutral upstream (downstream domain ontologies import it).

# The single-import aggregator module (downstream schemas do ``imports: [spo]``).
aggregator: spo

# Logical module name -> schema file (relative to this manifest's directory) + module IRI.
# Order = load order (leaves before the aggregator).
modules:
  - name: spo-core
    file: spo-core.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/core
  - name: spo-types
    file: spo-types.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/types
  - name: spo-quantity
    file: spo-quantity.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/quantity
  - name: spo-domain
    file: spo-domain.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/domain
  - name: spo-geometry
    file: spo-geometry.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/geometry
  - name: spo-signal
    file: spo-signal.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/signal
  - name: spo-time
    file: spo-time.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/time
  - name: spo-vocab
    file: spo-vocab.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/vocab
  - name: spo-provenance
    file: spo-provenance.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/provenance
  - name: spo
    file: spo.linkml.yaml
    id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/spo

# Shared prefix map (kept in sync with the schema headers; the neutral source of PREFIXES).
prefixes:
  linkml: https://w3id.org/linkml/
  spo: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/
  sp: https://w3id.org/spdata/v1/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  obi: http://purl.obolibrary.org/obo/OBI_
  ro: http://purl.obolibrary.org/obo/RO_
  prov: http://www.w3.org/ns/prov#
  qudt: http://qudt.org/schema/qudt/

# Compiled, language-neutral serializations produced by ../scripts/gen_targets.py from the
# LinkML single source (`schema/*.linkml.yaml`, the L0 normative source; `dist/` is a derived
# L1 projection and is never hand-edited). Consumers may take these and never touch LinkML/Python.
# Paths relative to this manifest's directory. Absence = not yet generated (needs linkml in env).
targets:
  owl: ../dist/spo.owl.ttl
  shacl: ../dist/spo.shacl.ttl
  jsonld_context: ../dist/spo.context.jsonld
