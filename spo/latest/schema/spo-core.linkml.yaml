# SPDX-License-Identifier: Apache-2.0
# spo-core — BFO-3D upper anchors + 4D spacetime extension (hand-written, durable).
# Axis-1 common ontology root (FYTOK-REPORT-05 §转换体系). Per-IDS generated Spo
# schemas import this (via the `spo` aggregator) instead of redefining BFO classes.
#
# IRIs follow BFO 2020 / OBO Foundry / W3C PROV (version-sensitive — verify against the
# pinned ontology release). T-Box only (SI-1); no runtime dependency.
id: https://fusion-yun.github.io/spo/v0.5.g74ec1be1/core
name: spo-core
title: Spo Core — BFO-3D Upper Anchors + 4D Spacetime Extension
description: >-
  Hand-written upper ontology for Spo: the BFO 3D normative core (Continuant / Occurrent /
  Quality / MaterialEntity / GDC / ICE / regions) plus the conservative 4D spacetime extension
  (SpacetimeRegion / SpacetimeWorm, bridged to the 3D core by slice ⊣ stack). FYTOK-REPORT-05
  §rpt05-4d. Domain-specific classes live in sibling modules (spo-domain / -geometry / -signal /
  -vocab / -provenance / -types).
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.5.g74ec1be1/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  obi: http://purl.obolibrary.org/obo/OBI_
  ro: http://purl.obolibrary.org/obo/RO_
  prov: http://www.w3.org/ns/prov#
default_prefix: spo
default_range: string
imports:
- linkml:types
annotations:
  spo_module: core
  spo_version: 0.4.3
  bfo_release_note: "class_uri IRIs per BFO 2020 / OBO Foundry; version-sensitive."
  mirror_layer_note: "Classes carrying a bfo: class_uri are MIRROR content — they restate a BFO term (not a specialization); bfo_label records that term's label in the pinned BFO 2020 release and bfo_label_rename flags a deliberate rename. Standard R-6, gate C8."

classes:

  # -- BFO root -------------------------------------------------------------------- #
  Entity:
    abstract: true
    class_uri: bfo:0000001
    children_are_mutually_disjoint: true   # Continuant ⊥ Occurrent (mirrors BFO 2020 owl:disjointWith)
    description: >-
      Anything that exists (BFO entity) — the common root of Continuant and Occurrent. Added
      as the range of cross-quadrant relations (is_about can target matter, qualities, or
      processes alike). Its immediate children are mutually disjoint — BFO 2020 asserts
      continuant/occurrent disjointness; spo carries the axiom natively so the compiled OWL
      is axiom-bearing without the BFO merge (SP-ONT-SPEC-01 conformance, D.5.1 machine check).
    annotations:
      bfo_label: "entity"
      spo_term_role: referential

  # -- BFO continuant side (3D normative core) ------------------------------------ #
  Continuant:
    abstract: true
    is_a: Entity
    class_uri: bfo:0000002
    children_are_mutually_disjoint: true   # IC ⊥ SDC ⊥ GDC (mirrors BFO 2020 owl:AllDisjointClasses)
    description: >-
      An entity that persists through time keeping its identity, with no temporal parts (BFO
      continuant). Its immediate children (independent / specifically dependent / generically
      dependent continuant) are mutually disjoint, mirroring BFO 2020's AllDisjointClasses
      axiom — this is the structural carrier of the four-strata partition (matter / quality /
      occurrent / ICE): no class may inherit across strata (SP-ONT-SPEC-01 partition).
    annotations:
      bfo_label: "continuant"
      spo_term_role: referential

  IndependentContinuant:
    abstract: true
    is_a: Continuant
    class_uri: bfo:0000004
    description: A continuant that is the bearer of qualities and does not depend on other entities (BFO independent continuant).
    annotations:
      bfo_label: "independent continuant"
      spo_term_role: referential

  MaterialEntity:
    is_a: IndependentContinuant
    class_uri: bfo:0000040
    description: >-
      A continuant that occupies a spatial region and can be identified as a whole (BFO
      material entity). Devices / equipment / plasma referent.
      SCOPE (the standard's axis-scope ruling): this class exists in spo as an ANCHOR and
      DELIBERATELY HAS NO SUBCLASSES. spo carries the magnitude and model axes (the information side);
      the system-entity axis — the material things themselves — is carried by DOWNSTREAM
      DOMAIN ARTIFACTS, whose vocabulary would breach spo's domain-neutrality discipline
      if minted here (SP-ONT-SPEC-01 §4.4.7.1). The blank is a design position, NOT a gap
      to be filled: adding a MaterialEntity subclass to spo requires overturning the
      axis-scope ruling first. Downstream artifacts needing role / disposition / function
      anchor BFO directly (bfo:0000023 / 0000016 / 0000034) — no mid-level dependency is
      needed for them (the standard's downstream guidance, §4.4.3 (c)).
    slots:
    - occupies
    - has_part
    annotations:
      bfo_label: "material entity"
      spo_term_role: referential

  ImmaterialEntity:
    abstract: true
    is_a: IndependentContinuant
    class_uri: bfo:0000141
    description: An independent continuant with no material parts (BFO immaterial entity). Base of regions / sites.
    annotations:
      bfo_label: "immaterial entity"
      spo_term_role: referential
  ContinuantFiatBoundary:
    is_a: ImmaterialEntity
    class_uri: bfo:0000140
    description: >-
      A zero-, one- or two-dimensional immaterial entity whose location is fixed relative to some material
      entity, and which never has a spatial region as continuant part (BFO 2020 elucidation). Carrier of a
      demarcation drawn on a thing rather than found in it — a region's fiat boundary, a nominal surface.
      Added when the conformance gate found `sp.mathx.region.FiatBoundary` anchored to a BFO term the
      T-Box did not carry: the ontology is authoritative, so the gap was the ontology's (SPM-REPORT-104).
    annotations:
      bfo_label: "continuant fiat boundary"
      spo_term_role: referential

  SpecificallyDependentContinuant:
    abstract: true
    is_a: Continuant
    class_uri: bfo:0000020
    description: A continuant that depends on one specific bearer (BFO SDC).
    annotations:
      bfo_label: "specifically dependent continuant"
      spo_term_role: referential

  Quality:
    is_a: SpecificallyDependentContinuant
    class_uri: bfo:0000019
    description: A specifically dependent continuant that inheres in its bearer (BFO quality). A measurable physical attribute.
    slots:
    - inheres_in
    annotations:
      bfo_label: "quality"
      spo_term_role: referential

  GenericallyDependentContinuant:
    abstract: true
    is_a: Continuant
    class_uri: bfo:0000031
    description: A continuant that can be copied across bearers (BFO GDC). Base of information artifacts and scenarios.
    annotations:
      bfo_label: "generically dependent continuant"
      spo_term_role: referential

  DirectiveInformationEntity:
    is_a: InformationContentEntity
    class_uri: iao:0000033
    description: >-
      An information content entity whose concretizations prescribe — the directive branch of
      IAO (plan specifications, design specifications, program code). Added as the structural
      range of `realizes` (R-1 / C4b — a cross-category object slot carries a class range,
      never a literal escape): the things a planned process realizes-by-shortcut are
      directive ICEs, not descriptive ones.
    annotations:
      spo_term_role: referential

  InformationContentEntity:
    is_a: GenericallyDependentContinuant
    class_uri: iao:0000030
    description: >-
      A generically dependent continuant that is about something (IAO information content
      entity). An IDS as a whole is an ICE. The is_about slot is the REALITY / DESCRIPTION
      bridge: the EAST tokamak is a MaterialEntity; a drawing of its vacuum vessel, a
      machine-description IDS, or a reconstructed equilibrium are ICEs ABOUT it — never the
      thing itself.
    slots:
    - has_provenance
    - is_about
    annotations:
      spo_term_role: referential

  # -- BFO occurrent side --------------------------------------------------------- #
  Occurrent:
    abstract: true
    is_a: Entity
    class_uri: bfo:0000003
    description: An entity that unfolds in time and has temporal parts (BFO occurrent).
    annotations:
      bfo_label: "occurrent"
      spo_term_role: referential

  Process:
    is_a: Occurrent
    class_uri: bfo:0000015
    description: An occurrent that depends on material participants (BFO process). Unifies physical evolution / computation / measurement (FYTOK-REPORT-05 §rpt05-cat-process).
    slots:
    - has_participant
    - has_input
    - has_output
    - has_spacetime_extent
    annotations:
      bfo_label: "process"
      spo_term_role: referential

  ProcessBoundary:
    is_a: Occurrent
    class_uri: bfo:0000035
    description: >-
      The instantaneous temporal boundary of a process (BFO 2020). Parented on Occurrent, following BFO's own
      hierarchy — a process boundary is not itself a process. Added with ContinuantFiatBoundary, for the same
      reason (SPM-REPORT-104).
    annotations:
      bfo_label: "process boundary"
      spo_term_role: referential
  PlannedProcess:
    is_a: Process
    class_uri: obi:0000011
    description: A process that realizes a plan specification (OBI planned process). An experiment / planned discharge.
    slots:
    - realizes
    annotations:
      spo_term_role: referential

  # -- process modality subtypes (truthmaker of data modality, §rpt05-modality) ---- #
  MeasurementProcess:
    is_a: Process
    description: >-
      A real-world measurement / observation process producing measured data; part of a discharge
      (a PlannedProcess instance = shot). Unrepeatable — its output is about a unique spatiotemporal
      particular (this shot at this time), hence read-only / not reproducible / per-shot distinct.
    annotations:
      spo_term_role: referential
      reproducible: "false"
      modality: measured

  ComputationalProcess:
    is_a: PlannedProcess
    description: >-
      A computational process (a code run) producing simulated / reconstructed data. Reproducible
      given (code, inputs, version). When it consumes measured inputs (e.g. an equilibrium
      reconstruction over real magnetics) its output is reconstructed (measured-derived).
      A planned process: every run realizes the directive ICE it executes (its Code) — the
      program/run split is carried structurally by the inherited `realizes` (P-3).
    annotations:
      spo_term_role: referential
      reproducible: "true"
      modality: simulated

  EngineeringDetermination:
    is_a: Process
    description: >-
      An engineering survey / calibration / design determination establishing a static device fact
      (e.g. a probe position). Invariant on the discharge timescale.
    annotations:
      spo_term_role: referential
      reproducible: "true"
      modality: static_device

  # -- BFO regions ------------------------------------------------------------------ #
  # Category re-seating (C4c mapped-subsumption fidelity): in BFO 2020 only SPATIAL
  # regions are continuants (immaterial entities); temporal and spatiotemporal regions are OCCURRENTS.
  # The former unified Region umbrella asserted bfo:0000008/0000011 under Continuant,
  # contradicting the very disjointness axiom this module carries — falsifying the
  # 21838-1 D.5.2(3) mapping-fidelity claim. Region is now the SPATIAL-side base only.
  Region:
    abstract: true
    is_a: ImmaterialEntity
    description: >-
      Base of SPATIAL regions only. Temporal and spatiotemporal regions are occurrents in
      BFO 2020 and are seated on the occurrent side; this class no longer spans the
      categories.
    annotations:
      spo_term_role: referential

  SpatialRegion:
    is_a: Region
    class_uri: bfo:0000006
    description: >-
      A region of space (BFO spatial region — a continuant immaterial entity). The base
      manifold a field rides; bound to the shared math layer's geometry carriers.
    annotations:
      bfo_label: "spatial region"
      spo_term_role: referential

  TemporalRegion:
    is_a: Occurrent
    class_uri: bfo:0000008
    description: >-
      A region of time (BFO temporal region — an OCCURRENT in BFO 2020, re-seated here from
      the continuant side — a temporal region seated under Continuant is the false mapping
      C4c rejects). A dynamic quantity is a Quality over a TemporalRegion; an AoS
      time_slice[] array dissolves to a TemporalRegion domain.
    annotations:
      bfo_label: "temporal region"
      spo_term_role: referential

  # -- 4D spacetime extension (conservative; bridged to 3D core via slice/stack) -- #
  SpacetimeRegion:
    is_a: Occurrent
    class_uri: bfo:0000011
    description: >-
      A region of spacetime (BFO spatiotemporal region — an OCCURRENT in BFO 2020, re-seated
      onto the occurrent side; C4c). 4D extension stratum: the four-dimensional intension
      whose 3D+Time foliation is the canonical view.
    annotations:
      bfo_label: "spatiotemporal region"
      bfo_label_rename: "spo shortens the BFO label; same term"
      spo_term_role: referential
      spo_stratum: 4d_extension

  SpacetimeWorm:
    abstract: true
    is_a: Occurrent
    description: >-
      A four-dimensionally extended individual (its temporal parts are time slices). A DD
      `time_slice[]` array is the discretized worm; the 3D continuant view is its foliated slice.
      Identity rests in the 4D intension artifact (SPM-CONOPS-01). Conservative extension —
      does not alter the 3D core axioms.
    annotations:
      spo_term_role: both
      spo_stratum: 4d_extension
    slots:
    - occupies_spacetime
    - foliates_to

slots:
  inheres_in:
    slot_uri: ro:0000052
    description: This quality inheres in its material bearer (BFO/RO inheres_in).
    range: MaterialEntity
  occupies:
    slot_uri: bfo:0000210
    description: >-
      This material entity occupies a spatial region (BFO 2020 "occupies spatial region",
      BFO_0000210; verified against 21838-2 bfo-core — domain: independent continuant that is
      not a spatial region; range: spatial region). Range made structural (C4b):
      SpatialRegion lives in this module, closing the former string-range escape.
    range: SpatialRegion
  has_part:
    slot_uri: bfo:0000178
    description: >-
      Parthood among continuants (BFO 2020 "has continuant part", BFO_0000178). Device
      assembly chains (coil → turn → conductor). Anchor corrected from the OBO/RO-era
      has_part BFO_0000051, which is not a term of ISO/IEC 21838-2 (BFO 2020); the RO
      lineage is noted here for interop with OBO ontologies still using it. Range made
      structural per the anchor's own signature (C4b).
    range: Continuant
    multivalued: true
  has_provenance:
    description: Orthogonal provenance information (FYTOK-REPORT-05 §rpt05-provenance, L7).
    range: string   # ranges to spo-provenance:ProvenanceMixin
  has_participant:
    slot_uri: bfo:0000057
    description: >-
      A continuant that participates in this process (BFO 2020 "has participant") — the
      apparatus a measurement is implemented by, the subject it probes, the computing system
      a run executes on. Structural carrier of the process family's participation face
      (P-3 structural grounding).
    range: Continuant
    multivalued: true
  has_input:
    description: An information / material input consumed by this process.
    multivalued: true
  has_output:
    description: An information content entity produced by this process (e.g. an IDS).
    multivalued: true
  is_about:
    slot_uri: iao:0000136
    description: >-
      The entity this information is about (IAO is_about) — matter (a device), a quality (a
      temperature), or an occurrent (a shot). The generic reality → description arrow every
      descriptive ICE carries.
    range: Entity
  realizes:
    description: >-
      NATIVE relation (R-1 — declared native in place of an external anchor): this planned
      process realizes a directive information entity — a plan specification for a planned
      run, or a Code (the program
      text) for a ComputationalProcess (program = directive ICE, run = Process, result =
      descriptive ICE output). Deliberate concretization SHORTCUT relative to BFO 2020: the
      strict bfo:0000055 realizes targets a REALIZABLE ENTITY (the plan concretizing the
      specification), never an ICE — so this slot carries no bfo anchor (skos:closeMatch
      bfo:0000055 in intent; the former exactMatch was a false mapping).
    range: DirectiveInformationEntity
  has_spacetime_extent:
    description: The 4D spacetime region over which this process unfolds (4D extension bridge).
    range: SpacetimeRegion
    annotations:
      spo_stratum: 4d_extension
  occupies_spacetime:
    description: The spacetime region this worm occupies.
    range: SpacetimeRegion
    annotations:
      spo_stratum: 4d_extension
  foliates_to:
    description: >-
      The 3D+Time foliated view of this worm (slice ⊣ stack; SPM-CONOPS-01). Read-time derivation,
      not a persisted distinct datum.
    annotations:
      spo_stratum: 4d_extension
