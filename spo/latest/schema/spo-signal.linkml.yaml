# SPDX-License-Identifier: Apache-2.0
# spo-signal — time-series signals (C-2). DD signal_flt_Nd (data + embedded timebase) lifts to a
# Signal: an information content entity / quality over a time Domain. Unifies the IDS-homogeneous
# timebase and the per-signal embedded timebase (recording the source). FYTOK-REPORT-05 §rpt05-cat-process.
id: https://fusion-yun.github.io/spo/v0.5.g03cc95f6/signal
name: spo-signal
title: Spo Signal — Time-Series Signals over a Time Domain
description: A measured / computed time series — a quantity over a TemporalRegion, with its (time, data) samples as A-Box.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.5.g03cc95f6/
default_prefix: spo
default_range: string
imports:
- linkml:types
- spo-core.linkml
- spo-domain.linkml
annotations:
  spo_module: signal
  spo_version: 0.1.1

classes:
  Signal:
    is_a: ContinuousQuantity
    description: >-
      A continuous quantity over the **time domain** (a TemporalRegion) — scalar or tensor (DD
      signal_flt_Nd, C-2). Sibling of Field (space / general domain) under ContinuousQuantity, not a
      subtype of it. Corresponds to the engineering carrier sp.mathx.signal.Signal — a Function over a
      time domain (the temporal analogue of Field, a Function over a Mesh), converged from sp_phys to
      sp_mathx (L1) as the domain-agnostic quantity-over-time. Bound via class_type (engineering-dispatch
      FQCN, distinct from the semantic class_uri; SPM-REPORT-15 C-3).
    annotations:
      spo_term_role: both
      class_type: sp.mathx.signal.Signal
      spo_carrier: sp.mathx.signal.Signal
      over_domain: time
    attributes:
      time:
        range: float
        description: Signal time base — the DD/A-Box serialization column of the time axis (alias ".../time").
        annotations:
          array: true
          unit: s
          dd_alias: ".../time"
          represented_as: spdata:data_handle
      data:
        range: float
        description: Signal samples over the time base — the DD/A-Box serialization column (runtime carrier is a Function).
        annotations:
          array: true
          represented_as: spdata:data_handle
    slots:
    - timebase_source

slots:
  timebase_source:
    description: Where the time axis came from — IDS-homogeneous timebase vs per-signal embedded timebase (for reverse mapping).
    range: TimebaseSource

enums:
  TimebaseSource:
    permissible_values:
      homogeneous: {description: Shared IDS-level timebase (ids_properties/homogeneous_time = 1)}
      embedded: {description: Per-signal embedded timebase (signal_*/time)}
      heterogeneous: {description: Per-node timebase (homogeneous_time = 0)}
