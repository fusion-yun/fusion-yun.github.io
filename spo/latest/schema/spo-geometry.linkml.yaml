# SPDX-License-Identifier: Apache-2.0
# spo-geometry — geometry as information describing spatial regions (C-5) + grids (C-7).
# DD rz*/outline/contour/generic_grid lift here; mesh / DEC topology is owned by sp_mathx
# (OI-2) — Spo holds the binding, not a re-implemented mesh ontology. FYTOK-REPORT-05.
id: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/geometry
name: spo-geometry
title: Spo Geometry — Geometric Description of Spatial Regions
description: >-
  Geometry roles (outline / contour / point / curve / surface / solid) as information content
  entities describing a SpatialRegion (C-5); GGD grids bind to sp_mathx Mesh (C-7). Coordinate
  values are A-Box; roles are T-Box.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.5.g7a8e5b70/
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: spo
default_range: string
imports:
- linkml:types
- spo-core.linkml
annotations:
  spo_module: geometry
  spo_version: 0.2.3

classes:
  Geometry:
    is_a: InformationContentEntity
    description: An information content entity describing the geometry of a SpatialRegion (C-5). Bound to a sp_mathx GeoObject.
    slots:
    - describes_region
    - geometry_role
    - has_coordinate_system
    annotations:
      spo_term_role: both

  GeoObject:
    is_a: Geometry
    abstract: true
    description: >-
      Base of geometric primitives; the concrete carrier is sp_mathx
      (``geom.base.GeoObject`` — control-point ``points`` array, pluggable
      ``GeometryKernel`` engine). Manifold dimension distinguishes the four
      concrete children below (SPM-SDD-06 DE-MATHX-05).
    slots:
    - manifold_dim
    annotations:
      spo_term_role: both

  Point:
    is_a: GeoObject
    description: A 0-D geometric object / manifold_dim 0 (e.g. magnetic axis, X-point). Carrier sp_mathx geom.point.Point.
    annotations:
      spo_term_role: both
  Curve:
    is_a: GeoObject
    description: >-
      A 1-D geometric object / manifold_dim 1 (e.g. flux-surface outline, limiter contour).
      Analytic children (Line / Ray / Segment / Circle / Ellipse) are sp_mathx plugin
      specializations dispatched by ``sp:plugin_name``; all lift here as spo:Curve.
    annotations:
      spo_term_role: both
  Surface:
    is_a: GeoObject
    description: >-
      A 2-D geometric object / manifold_dim 2 (Plane / Disc / Polygon / Sphere shell / ToroidalSurface).
    annotations:
      spo_term_role: both
  Solid:
    is_a: GeoObject
    description: A 3-D geometric object / manifold_dim 3 (Box / Ball / Cylinder / Toroidal / swept solids).
    annotations:
      spo_term_role: both

  Mesh:
    is_a: Geometry
    description: >-
      A discretized domain (DD GGD generic_grid). Binds to sp_mathx Mesh / DEC: space = Domain,
      grid_subset = named subdomain / boundary, objects_per_dimension = topology chain (C-7). Not
      mirrored verbatim from DD.
    annotations:
      spo_term_role: methodological

  CoordinateSystem:
    is_a: InformationContentEntity
    description: >-
      A coordinate chart — an ordered tuple of coordinate axes plus the metric that measures
      lengths / areas / volumes on it (IMAS ``coordinate_system`` / ``grid_type``). Cartesian
      (x,y,z), polar (r,θ), cylindrical (r,z,φ), spherical (r,φ,θ) and toroidal charts are the
      built-in kinds; the metric is Euclidean-identity unless the chart is curvilinear. COCOS
      orientation of flux charts is a domain concern owned by the downstream domain artifact
      (domain neutrality, §4.4.7.1 / SI-8: a domain-specific orientation convention sinks
      to the domain artifact and never enters spo's signature).
    slots:
    - coordinate_axis
    - chart_kind
    - has_metric
    annotations:
      spo_term_role: methodological

  Metric:
    is_a: InformationContentEntity
    description: >-
      The metric tensor g_ij of a CoordinateSystem — the first fundamental form giving the line
      element ds² = g_ij dx^i dx^j, the volume element √det g, and (via its inverse g^ij) the
      Hodge star used by sp_mathx DEC. Identity for Cartesian charts; diagonal for the standard
      curvilinear charts. Carrier sp_mathx metric.Metric.
    slots:
    - metric_kind
    - of_coordinate_system
    annotations:
      spo_term_role: both

slots:
  describes_region:
    description: The SpatialRegion this geometry describes.
    range: SpatialRegion
  geometry_role:
    description: The role this geometry plays (boundary / axis / limiter / outline …) — a controlled vocabulary value.
    range: string
  manifold_dim:
    description: Topological (manifold) dimension of the primitive — 0 point / 1 curve / 2 surface / 3 solid.
    range: integer
  has_coordinate_system:
    description: The CoordinateSystem this geometry's control points are expressed in (default Cartesian).
    range: CoordinateSystem
  coordinate_axis:
    description: >-
      An ordered coordinate axis of the chart. Values draw on the ContinuousCoordinate vocabulary
      (x / y / z / r / z / phi / theta / psi …). Each axis carries a physical unit.
    range: string
    multivalued: true
  coordinate_unit:
    description: Physical unit of a coordinate axis (UCUM / QUDT string; authority external — SpData sp:phys). Dimensionless "-" for normalized axes.
    range: string
    multivalued: true
  chart_kind:
    description: Named chart family — cartesian / polar / cylindrical / spherical / toroidal (selects the built-in metric).
    range: string
  has_metric:
    description: The metric tensor of this coordinate system.
    range: Metric
  metric_kind:
    description: Structural form of the metric — euclidean (identity) / diagonal / general.
    range: string
  of_coordinate_system:
    description: The CoordinateSystem this metric measures.
    range: CoordinateSystem
