# SPDX-License-Identifier: Apache-2.0
# spo-types — primitive / dimensional type vocabulary (axis-1).
# DD data_type groups (FLT_0D..7D / INT_* / CPX_* / STR_*) map here: scalar ranges are LinkML
# builtins; `complex` is added; rank-≥1 arrays are externalized (`data_handle`) and carried
# by annotation, not inlined as a list — bulk numeric payload is not ontology content.
# FYTOK-REPORT-05 §rpt05-cs-common.
id: https://fusion-yun.github.io/spo/v0.5.g94a1bf89/types
name: spo-types
title: Spo Types — Primitive & Dimensional Type Vocabulary
description: Scalar primitives + complex + array-externalization convention shared by all Spo schemas.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.5.g94a1bf89/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: spo
default_range: string
imports:
- linkml:types
annotations:
  spo_module: types
  spo_version: 0.1.1

types:
  complex:
    uri: xsd:string
    base: str
    description: >-
      A complex scalar (DD CPX_0D). Serialized as a {re, im} pair; carried as a string scalar at the
      LinkML metamodel level (LinkML has no native complex). DD CPX_nD (rank ≥ 1) externalizes as an array.

settings:
  # Convention (documentation, not enforced here): a leaf whose DD data_type is rank ≥ 1
  # (FLT_1D..7D / INT_1D..3D / CPX_1D..6D / STR_1D..2D) is an externalized array — its range is the
  # scalar element type with `annotations: {array: true, ndim: N, represented_as: spdata:data_handle}`
  # rather than `multivalued` inlining. Scalars (… _0D) map to: FLT→float, INT→integer, STR→string,
  # CPX→complex.
  dd_dtype_map: "FLT->float INT->integer STR->string CPX->complex"
