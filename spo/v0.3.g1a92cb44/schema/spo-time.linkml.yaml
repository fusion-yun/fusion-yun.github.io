# SPDX-License-Identifier: CC-BY-ND-4.0
# spo-time — the general TIME ontology: time regions refined to instants/intervals, the
# discretized TimeAxis, and the AoS/SoA duality made first-class (TimeSlice vs TimeSeries as
# two REPRESENTATIONS of one temporally extended referent), plus the 4D SpacetimeMesh.
#
# Design intent (orthogonal decoupling of time from the domain structure):
#   * The REFERENT of time-varying data is a single 4D entity (spo-core SpacetimeWorm /
#     a Process). Time is a coordinate of its extent, NOT a structural axis of the ontology.
#   * AoS (`time_slice[]`, one struct per instant) and SoA (per-quantity time columns,
#     signals) are two INFORMATION LAYOUTS of the same referent — modeled here as the two
#     concrete subclasses of TemporalAggregate, connected by `dual_view_of` (the slice ⊣
#     stack adjunction: slicing a stack and stacking slices are mutually inverse up to
#     sampling/interpolation; the transform is read-time, not a distinct persisted datum).
#   * A 4D spacetime grid is a Mesh whose discretized region is a SpacetimeRegion:
#     SpacetimeMesh = spatial base mesh × TimeAxis (product form) or an unstructured 4D GGD.
# BFO IRIs per BFO 2020 / OBO Foundry (version-sensitive). T-Box only; no runtime dependency.
id: https://fusion-yun.github.io/spo/v0.3.g1a92cb44/time
name: spo-time
title: Spo Time — Instants, Time Axis, AoS/SoA Duality, Spacetime Mesh
description: >-
  General time ontology: TimeInstant/TimeInterval refine TemporalRegion; TimeAxis is the
  discretized time coordinate (an ICE); TemporalAggregate with its two concrete layouts —
  TimeSliceSeries (AoS, array of TimeSlice) and TimeSeries (SoA, channels of Signal) — makes
  the AoS/SoA duality explicit (dual_view_of, slice ⊣ stack); SpacetimeMesh discretizes a
  SpacetimeRegion (4D grid adaptation).
license: CC-BY-ND-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.3.g1a92cb44/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: spo
default_range: string
imports:
- linkml:types
- spo-core.linkml
- spo-domain.linkml
- spo-geometry.linkml
- spo-signal.linkml
annotations:
  spo_module: time
  spo_version: 0.1.0

classes:

  # -- time regions refined ------------------------------------------------------- #
  TimeInstant:
    is_a: TemporalRegion
    class_uri: bfo:0000148
    description: >-
      A zero-dimensional temporal region (BFO temporal instant) — the referent of one
      time-slice timestamp. A `time_slice[i]/time` value denotes a TimeInstant on the
      shot/simulation timeline.

  TimeInterval:
    is_a: TemporalRegion
    class_uri: bfo:0000038
    description: >-
      A one-dimensional temporal region (BFO temporal interval) — the extent a Signal or a
      discharge phase covers (e.g. flat-top). A TimeAxis discretizes a TimeInterval.

  # -- discretized time coordinate ------------------------------------------------ #
  TimeAxis:
    is_a: InformationContentEntity
    description: >-
      The discretized time coordinate — an ordered sequence of sample instants over a
      TimeInterval (an ICE; the information-level counterpart of the region it discretizes).
      Unifies the DD timebases: the IDS-homogeneous root `time[]`, a per-signal embedded
      `.../time`, and an AoS `time_slice[]/time` column are all TimeAxis instances; which one
      a datum rides is recorded by spo-signal `timebase_source`.
    attributes:
      samples:
        range: float
        description: The sample instants (seconds); externalized array (A-Box column).
        annotations:
          array: true
          unit: s
          represented_as: spdata:data_handle
    slots:
    - discretizes_time

  # -- AoS / SoA duality ------------------------------------------------------------ #
  TemporalAggregate:
    abstract: true
    is_a: InformationContentEntity
    description: >-
      A temporally indexed information aggregate — the information content of a temporally
      extended referent (a SpacetimeWorm / Process) sampled on a TimeAxis. Abstract parent of
      the two LAYOUTS of the same content: TimeSliceSeries (AoS) and TimeSeries (SoA). The
      layout choice is representational, orthogonal to the referent's identity.
    slots:
    - has_time_axis
    - about_occurrent
    - dual_view_of

  TimeSlice:
    is_a: InformationContentEntity
    description: >-
      One AoS element — the complete state description of a system at one TimeInstant (the
      foliated 3D view of the 4D referent at fixed t; DD `time_slice[]` element, e.g. one
      equilibrium reconstruction). Identity note: a TimeSlice is a VIEW indexed by (referent,
      instant), not an independent individual — the individual is the 4D referent.
    slots:
    - at_time
    - at_instant
    - slice_of

  TimeSliceSeries:
    is_a: TemporalAggregate
    description: >-
      The AoS layout — an ordered array of TimeSlice structs (DD `time_slice[]`): the
      discretized SpacetimeWorm, foliated per instant. Convenient for whole-state-at-t access
      (equilibrium at t); dual to the SoA TimeSeries via dual_view_of (stack the slices).
    annotations:
      layout: aos
    slots:
    - has_slice

  TimeSeries:
    is_a: TemporalAggregate
    description: >-
      The SoA layout — per-quantity channels over a shared or embedded TimeAxis (DD signal
      pattern; a control-room trend plot). Each channel is a spo-signal Signal (a quantity
      over the time domain). Convenient for single-quantity-over-time access; dual to the AoS
      TimeSliceSeries via dual_view_of (slice the stack).
    annotations:
      layout: soa
    slots:
    - has_channel

  # -- 4D spacetime grid ------------------------------------------------------------ #
  SpacetimeMesh:
    is_a: Mesh
    description: >-
      A discretized 4D domain — a Mesh whose discretized region is a SpacetimeRegion (4D
      extension stratum). Two constructions: (a) product form, a spatial base Mesh extruded
      along a TimeAxis (the common shot-data case: same spatial grid, many instants); (b) a
      genuinely unstructured 4D GGD (moving/adaptive grids: the spatial grid itself is
      time-dependent, e.g. per-time-slice equilibrium grids — then the product decomposition
      is per-interval, not global). Fields over a SpacetimeMesh subsume both AoS and SoA:
      layout becomes a storage detail of the same 4D Field.
    annotations:
      spo_stratum: 4d_extension
    slots:
    - has_time_axis
    - has_spatial_base
    - discretizes_spacetime

slots:
  at_time:
    description: The timestamp of this slice (seconds on the shot/simulation timeline; A-Box scalar).
    range: float
    annotations:
      unit: s
  at_instant:
    description: The TimeInstant this slice is the state description of.
    range: TimeInstant
  slice_of:
    description: The TimeSliceSeries this slice is an element of (view → aggregate).
    range: TimeSliceSeries
  has_slice:
    description: The ordered TimeSlice elements (AoS axis; order = TimeAxis order).
    range: TimeSlice
    multivalued: true
    inlined_as_list: true
  has_channel:
    description: The per-quantity Signal channels of this SoA aggregate.
    range: Signal
    multivalued: true
    inlined_as_list: true
  has_time_axis:
    description: The TimeAxis this aggregate/mesh is sampled on.
    range: TimeAxis
  discretizes_time:
    description: The TimeInterval this axis discretizes.
    range: TimeInterval
  about_occurrent:
    description: >-
      The temporally extended referent (SpacetimeWorm / Process) this aggregate is the
      information content of (iao:is_about specialization). Two aggregates about the same
      referent with different layouts are dual views, not distinct claims about the world.
    range: Occurrent
  dual_view_of:
    description: >-
      The other-layout aggregate carrying the same content about the same referent (AoS ↔ SoA;
      the slice ⊣ stack adjunction). Symmetric; a read-time transform (sampling one way,
      regrouping the other), not a persisted distinct datum.
    range: TemporalAggregate
    annotations:
      symmetric: "true"
  has_spatial_base:
    description: The spatial base Mesh of a product-form SpacetimeMesh (absent for unstructured 4D grids).
    range: Mesh
  discretizes_spacetime:
    description: The SpacetimeRegion this 4D mesh discretizes.
    range: SpacetimeRegion
    annotations:
      spo_stratum: 4d_extension
