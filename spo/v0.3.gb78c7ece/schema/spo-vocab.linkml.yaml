# SPDX-License-Identifier: Apache-2.0
# spo-vocab — controlled vocabularies (C-8) + plan specifications (experiment范畴, C-10).
# DD identifier triples (name / index / description + *_identifier.xml) lift to: the vocabulary
# itself = T-Box enum/class; a specific value = A-Box. FYTOK-REPORT-05 §rpt05-cat-attribute / §rpt05-cat-experiment.
id: https://fusion-yun.github.io/spo/v0.3.gb78c7ece/vocab
name: spo-vocab
title: Spo Vocabulary — Identifiers, Controlled Vocabularies, Plan Specifications
description: >-
  The identifier-triple pattern as a controlled-vocabulary carrier (C-8); the determinable/determinate
  distinction for attributes (C-attribute); and PlanSpecification for experiments (C-10).
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sp: https://w3id.org/spdata/v1/
  spo: https://fusion-yun.github.io/spo/v0.3.gb78c7ece/
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: spo
default_range: string
imports:
- linkml:types
- spo-core.linkml
annotations:
  spo_module: vocab
  spo_version: 0.2.0

classes:
  Identifier:
    is_a: InformationContentEntity
    description: >-
      The DD identifier triple (name / index / description). The triple is a controlled-vocabulary
      value; the vocabulary it draws from is a T-Box enum / class (C-8).
    attributes:
      name:
        range: string
        description: Short string key.
      index:
        range: integer
        description: Integer index into the vocabulary.
      description:
        range: string
        description: Human-readable description.
    slots:
    - draws_from

  ControlledVocabulary:
    is_a: InformationContentEntity
    abstract: true
    description: A controlled vocabulary (the determinable). Its permissible values are the determinates (DD *_identifier.xml entries).

  PlanSpecification:
    is_a: InformationContentEntity
    class_uri: iao:0000104
    description: >-
      A directive information content entity that prescribes a planned process (IAO plan specification).
      A pulse_schedule (reference waveforms / setpoints) is a PlanSpecification prescribing a discharge
      (C-10). class_uri version-sensitive — verify.

  DesignSpecification:
    is_a: InformationContentEntity
    description: >-
      A DIRECTIVE information content entity that prescribes a material artifact to be realized —
      an engineering drawing of the EAST vacuum vessel, a coil winding spec. Distinguish three
      stances toward one MaterialEntity: (1) the thing itself (MaterialEntity); (2) the
      prescription of it (this class — exists before/independent of the thing; the as-designed
      view); (3) the description of it as built (a plain descriptive ICE with is_about — an
      as-measured machine-description dataset). Design and as-built descriptions may disagree;
      only (3) is truth-evaluable against reality. IAO alignment IRI [TBD].
    slots:
    - prescribes

slots:
  draws_from:
    description: The controlled vocabulary this identifier value draws from (value → vocabulary, A-Box → T-Box).
    range: ControlledVocabulary
  prescribes:
    description: The material entity (kind) this design specification prescribes.
    range: MaterialEntity
